<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<title>只读分享 · 沙漏</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="shortcut icon" href="favicon.ico" />
<script src="config.js"></script>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/gantt.css" />
<link rel="stylesheet" href="css/share.css" />
<link rel="stylesheet" href="css/delivery.css" />
<script>
(function(){try{var t=localStorage.getItem("ds.theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();
</script>
</head>
<body data-view="gantt">
<div class="app">
  <div class="main">
    <section class="view on" id="view-gantt" aria-label="甘特图只读分享">
      <div class="view-page wide gantt-page">
        <div class="share-top">
          <div class="share-title">
            <h1 id="shareWsName">甘特图</h1>
            <p id="shareMeta">只读分享</p>
          </div>
          <div class="share-tools">
            <label class="row row-gap" style="gap:6px">
              <span class="toolbar-meta is-strong">显示已完成</span>
              <input type="checkbox" class="cbx" id="shareShowDone" checked />
            </label>
            <label class="row row-gap" style="gap:6px">
              <span class="toolbar-meta is-strong">刻度</span>
              <select id="shareScale" class="mini-select">
                <option value="day">日</option>
                <option value="week">周</option>
                <option value="month">月</option>
              </select>
            </label>
            <button class="btn sm" type="button" id="shareToday">今天</button>
          </div>
        </div>
        <div class="gantt-scroll" id="shareScroll"></div>
        <div class="gantt-legend">
          <span class="gl-item"><i style="background:var(--p2)"></i>进行中</span>
          <span class="gl-item"><i style="background:var(--danger)"></i>逾期</span>
          <span class="gl-item"><i class="dashed"></i>阻塞</span>
          <span class="gl-item"><i style="background:var(--success)"></i>已完成</span>
          <span class="gl-item"><i class="ms"></i>里程碑</span>
          <span class="gl-item"><i class="dep"></i>依赖</span>
          <span class="gantt-legend-hint">只读链接 · 数据由分享者实时生成</span>
        </div>
        <p class="share-foot" id="shareFoot"></p>
      </div>
    </section>
    <section class="view" id="view-doc" aria-label="文档只读分享">
      <div class="view-page doc-share-page">
        <div class="share-top">
          <div class="share-title">
            <h1 id="docShareTitle">文档</h1>
            <p id="docShareMeta">只读分享</p>
          </div>
          <div class="doc-share-tools">
            <button class="btn sm ghost" type="button" id="docShareTocBtn" aria-pressed="false" hidden>目录</button>
            <button class="btn sm ghost" type="button" id="docShareFindBtn" title="在文档内查找（Ctrl+F）" hidden>查找</button>
          </div>
        </div>
        <div class="share-find" id="docShareFindBar" hidden>
          <input type="search" id="docShareFindInput" placeholder="在文档内查找" aria-label="在文档内查找" autocomplete="off" />
          <span class="share-find-cnt" id="docShareFindCount" aria-live="polite"></span>
          <button class="btn sm" type="button" data-share-find="prev" aria-label="上一处" title="上一处（Shift+Enter）">↑</button>
          <button class="btn sm" type="button" data-share-find="next" aria-label="下一处" title="下一处（Enter）">↓</button>
          <button class="btn sm ghost" type="button" data-share-find="close" aria-label="关闭查找" title="关闭（Esc）">×</button>
        </div>
        <div class="doc-share-layout">
          <aside class="share-toc" id="docShareToc" aria-label="文档大纲" hidden>
            <div class="share-toc-head">目录</div>
            <nav class="share-toc-body" id="docShareTocBody"></nav>
          </aside>
          <article class="share-doc markdown-body" id="docShareBody"></article>
        </div>
        <p class="share-foot" id="docShareFoot"></p>
      </div>
    </section>
    <section class="view" id="view-delivery-share" aria-label="交付报告只读分享">
      <div class="view-page dl-share-root" id="deliveryShareBody"></div>
    </section>
    <section class="view" id="view-plan-share" aria-label="发布计划只读分享">
      <div class="view-page plan-share-page">
        <header class="ps-head">
          <p class="ps-kicker">发布计划 · 只读分享</p>
          <h1 id="planShareTitle">发布计划</h1>
          <p class="ps-meta" id="planShareMeta"></p>
          <div class="ps-stats" id="planShareStats"></div>
        </header>
        <section class="ps-card">
          <div class="ps-card-h"><h2>覆盖版本</h2><span class="ps-count" id="planShareVersionCount"></span></div>
          <div class="ps-table-wrap"><table class="ps-table" id="planShareVersions"></table></div>
        </section>
        <section class="ps-card">
          <div class="ps-card-h"><h2>预计发布内容</h2><span class="ps-count" id="planShareTaskCount"></span></div>
          <div class="ps-table-wrap"><table class="ps-table" id="planShareTasks"></table></div>
        </section>
        <p class="ps-foot" id="planShareFoot"></p>
      </div>
    </section>
  </div>
</div>
<!-- 链接缺失 / 失效 / 过期：独立错误页，不展示甘特工具栏、画布与图例 -->
<section class="share-error-page" id="shareErrorPage" hidden aria-live="polite">
  <div class="share-error-card">
    <div class="share-error-brand">
      <img src="icons/favicon-32.png" alt="" width="28" height="28" />
      <span>沙漏 · 只读分享</span>
    </div>
    <h1 id="shareErrorTitle">无法打开分享</h1>
    <p class="share-error-detail" id="shareErrorDetail">链接缺少访问凭证。</p>
    <p class="share-error-hint" id="shareErrorHint">请向分享者重新获取完整链接。</p>
    <div class="share-error-actions">
      <button class="btn" type="button" id="shareErrorRetry" hidden>重试</button>
      <a class="btn primary" href="./">返回沙漏</a>
    </div>
  </div>
</section>
<script type="module" src="js/share.js"></script>
</body>
</html>
