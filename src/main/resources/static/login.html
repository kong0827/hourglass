<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · 登录</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
<div class="auth-card">
  <form id="loginForm" autocomplete="on" novalidate>
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <rect x="2.2" y="2.6" width="5" height="9.4" rx="1.8" fill="#fff" opacity=".95"/>
          <rect x="2.2" y="13.4" width="5" height="4" rx="1.4" fill="#fff" opacity=".62"/>
          <rect x="8.6" y="2.6" width="4.4" height="6" rx="1.7" fill="#fff" opacity=".78"/>
          <rect x="8.6" y="10" width="4.4" height="7.4" rx="1.7" fill="#fff" opacity=".95"/>
          <rect x="14.4" y="2.6" width="3.4" height="11.2" rx="1.6" fill="#fff" opacity=".5"/>
          <rect x="14.4" y="15.2" width="3.4" height="2.2" rx="1.1" fill="#fff" opacity=".85"/>
        </svg>
      </span>
      <div>
        <h1>工作台</h1>
        <p class="sub">登录后即可管理你的任务</p>
      </div>
    </div>

    <div class="stack" style="gap:16px">
      <div class="field" id="fUser">
        <label for="uName">用户名</label>
        <input id="uName" type="text" autocomplete="username" placeholder="登录名" />
      </div>
      <div class="field" id="fPass">
        <label for="uPass">密码</label>
        <input id="uPass" type="password" autocomplete="current-password" placeholder="密码" />
      </div>
      <div class="auth-err" id="loginErr" hidden>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7.6"/><path d="M10 6.2v4.2"/><path d="M10 13.6h.01"/></svg>
        <span id="loginErrMsg"></span>
      </div>
      <button class="btn primary lg" type="submit" id="btnLogin">登 录</button>
    </div>
    <p class="auth-tip">登录状态保持 30 天，浏览器无需反复登录。账号由管理员创建下发。</p>
  </form>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  "use strict";
  var card = document.querySelector(".auth-card");
  var form = document.getElementById("loginForm");
  var err = document.getElementById("loginErr");
  var errMsg = document.getElementById("loginErrMsg");
  var btn = document.getElementById("btnLogin");
  var fUser = document.getElementById("fUser");
  var fPass = document.getElementById("fPass");

  function showError(msg) {
    errMsg.textContent = msg;
    err.hidden = false;
    card.classList.remove("shake");
    void card.offsetWidth;              // 强制重排以重启抖动动画
    card.classList.add("shake");
  }
  function clearError() {
    err.hidden = true;
    fUser.classList.remove("invalid");
    fPass.classList.remove("invalid");
  }
  ["uName", "uPass"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", clearError);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    clearError();
    var u = document.getElementById("uName").value.trim();
    var p = document.getElementById("uPass").value;
    if (!u || !p) {
      if (!u) fUser.classList.add("invalid");
      if (!p) fPass.classList.add("invalid");
      showError("请输入用户名和密码");
      return;
    }
    btn.disabled = true;
    btn.classList.add("loading");
    btn.textContent = "登录中…";
    API.postForm("/api/auth/login",
        "username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p))
      .then(function () {
        var next = null;
        try { next = new URLSearchParams(window.location.search).get("next"); } catch (e2) { /* 忽略 */ }
        // 仅允许站内相对路径回跳，防开放重定向
        if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") {
          window.location.href = next;
          return;
        }
        window.location.href = "/";
      })
      .catch(function (ex) {
        showError(ex.message || "登录失败");
        btn.disabled = false;
        btn.classList.remove("loading");
        btn.textContent = "登 录";
      });
  });
})();
</script>
</body>
</html>
