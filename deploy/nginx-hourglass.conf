# 登录与邀请接口限速：单 IP 每分钟 10 次，突发允许 5
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# 公开分享按 IP 限流：避免 token 被扫或链接被反复拉取
limit_req_zone $binary_remote_addr zone=share_zone:1m rate=2r/s;

# 沙漏生产配置（放到 /etc/nginx/conf.d/hourglass.conf）
# 前端静态资源由 Nginx 直接读取 /opt/hourglass/frontend/hourglass/；
# 只有 /hourglass/api/ 走反向代理到 Spring Boot（127.0.0.1:8080）。
# 同源部署，Cookie / CSRF / SSE 行为与前后端未分离时完全一致。
server {
    listen 80;
    server_name your-domain-or-ip;

    root /opt/hourglass/frontend;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 根路径重定向到应用上下文
    location = / {
        return 301 /hourglass/;
    }

    # 浏览器默认 favicon 请求：转到应用内的小图标，避免控制台 404
    location = /favicon.ico {
        return 302 /hourglass/favicon.ico;
    }

    # 附件上传最大 10MB，留些余量
    client_max_body_size 12m;

    # 文本资源压缩（SSE 除外，见下方 location）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # 登录 / 邀请注册接口限速
    location = /hourglass/api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/hourglass/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/hourglass/api/invite/ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 实时同步：单独 location，关闭缓冲与压缩，保证事件即时下发
    location = /hourglass/api/events {
        proxy_pass http://127.0.0.1:8080/hourglass/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # 公开只读分享：限流 + 短缓存，重放同一 token 不打穿应用
    location /hourglass/api/share/ {
        limit_req zone=share_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080/hourglass/api/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=60";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 备份导入：v6 含需求文档正文（可能带内嵌图片），放宽请求体上限
    location = /hourglass/api/import {
        client_max_body_size 128m;
        proxy_pass http://127.0.0.1:8080/hourglass/api/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI 生成可能跑几十秒：单独放宽读超时，避免前端先拿到 504 而后端还在算
    location /hourglass/api/ai/ {
        proxy_pass http://127.0.0.1:8080/hourglass/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # 其余 API：统一反代到后端
    location /hourglass/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上下文根 → 带斜杠的前端入口
    location = /hourglass {
        return 301 /hourglass/;
    }

    # 第三方编辑器等大文件：长期缓存（路径带版本号更佳）
    location ~* ^/hourglass/vendor/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 前端静态资源：no-cache + ETag，浏览器每次协商、命中即 304
    location /hourglass/ {
        try_files $uri $uri/ /hourglass/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# HTTPS：拿到域名后执行
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
# certbot 会自动改写本文件为 443 证书站点并添加 http→https 跳转
