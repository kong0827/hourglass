# 登录与邀请接口限速（可选加固）：取消注释启用——单 IP 每分钟 10 次，突发允许 5
# limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# 工作台反代配置（放到 /etc/nginx/conf.d/devstudio.conf）
# 应用只监听 127.0.0.1:8080，对外统一走 nginx
server {
    listen 80;
    server_name your-domain-or-ip;

    # 附件上传最大 10MB，留些余量
    client_max_body_size 12m;

    # 登录 / 邀请注册接口限速（可选，需先启用上面的 limit_req_zone）
    # location = /api/auth/login {
    #     limit_req zone=login_zone burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    # }
    # location ~ ^/api/invite/ {
    #     limit_req zone=login_zone burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    # }

    # SSE 实时同步：单独 location，关闭缓冲保证事件即时下发
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS：拿到域名后执行
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
# certbot 会自动改写本文件为 443 证书站点并添加 http→https 跳转
