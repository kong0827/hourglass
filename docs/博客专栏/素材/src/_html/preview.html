  <div class="inner">
    <h1>功能越多的项目管理工具，为什么团队越用越累？</h1>
    <div class="meta">系列一 · 行业思考篇 ｜ 第 1 篇</div>
    <div class="rule"></div>
    <p>先看一个虚构的选型场景。</p>
    <p>横轴列需求、审批、工时、文档、自动化和仪表盘，纵轴列候选产品。勾选数量只能表示功能覆盖，不代表实际使用效率；主流工具也有同类能力。</p>
    <p class="lead">功能扩展可能带来学习、配置与重复整理成本，也可能支撑必要的流程。应结合真实项目核对，而不是把复杂归因于整个行业。</p>
    <h2>复杂度可能从哪里来</h2>
    <p>以下是三个排查方向，不是对所有平台的判断。</p>
    <figure>
      <img src="../../infographics/01-complexity.png" alt="复杂度的三个可能成因">
      <figcaption>图：选型目标、模块扩展与组织流程，可能影响工具复杂度。</figcaption>
    </figure>
    <p>拿一条真实流程试运行，区分必要控制与冗余动作，再决定如何减少重复整理。</p>
    <div class="next"><b>下一篇：</b>项目管理，是不是该做减法了？</div>
