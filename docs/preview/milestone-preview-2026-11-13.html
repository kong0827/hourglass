<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙漏 · 里程碑方案原型</title>
<style>
/* ===== 设计令牌（对齐 frontend/css/tokens.css） ===== */
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7;
  --surface-hover:#F2F4F7; --surface-active:#E9ECF1;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text:#101828; --text-2:#475467; --text-3:#667085; --text-inverse:#FFFFFF;
  --scrim:rgba(16,24,40,.32);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EFF4FF;
  --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-border:#A6F4C5; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-border:#FEDF89; --warning-fg:#B54708;
  --danger:#F04438; --danger-soft:#FEF3F2; --danger-border:#FDA29B; --danger-fg:#B42318;
  --info:#2E90FA; --info-soft:#EFF8FF; --info-border:#B2DDFF; --info-fg:#175CD3;
  --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-border:#D9D6FE; --plum-fg:#5B3FD1;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,Menlo,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 2px 4px -2px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --shadow-xl:0 24px 48px -12px rgba(16,24,40,.18);
  --ring-focus:0 0 0 3px rgba(37,99,235,.16);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --sidebar-w:240px; --topbar-h:68px; --drawer-w:496px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg-app:#0D1219; --surface:#151B24; --surface-sunken:#1A222D;
  --surface-hover:#1F2937; --surface-active:#26313F;
  --border:#25303D; --border-strong:#334153;
  --text:#E7ECF3; --text-2:#A9B4C2; --text-3:#7B8798; --text-inverse:#0D1219;
  --scrim:rgba(0,0,0,.55);
  --primary:#4C8DFF; --primary-hover:#6BA1FF; --primary-soft:#16243C;
  --primary-border:#2B4772; --primary-fg:#8FB4FF;
  --success:#32D583; --success-soft:#0E2A1D; --success-border:#1F5C3E; --success-fg:#75E0A7;
  --warning:#FDB022; --warning-soft:#2A2110; --warning-border:#5C4A1E; --warning-fg:#FEC84B;
  --danger:#F97066; --danger-soft:#2B1615; --danger-border:#5C2A26; --danger-fg:#FDA29B;
  --info:#53B1FD; --info-soft:#10202F; --info-border:#1F4468; --info-fg:#84CAFF;
  --plum:#9B8AFB; --plum-soft:#1D1933; --plum-border:#3B3266; --plum-fg:#B9ACFC;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 2px 4px -2px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 10px -2px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.35);
  --shadow-lg:0 12px 24px -6px rgba(0,0,0,.55),0 4px 8px -4px rgba(0,0,0,.35);
  --shadow-xl:0 24px 48px -12px rgba(0,0,0,.6);
  --ring-focus:0 0 0 3px rgba(76,141,255,.28);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg-app);color:var(--text);font:13px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
a{color:var(--primary);text-decoration:none}
::selection{background:rgba(37,99,235,.18)}
:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.mono{font-family:var(--font-mono);font-size:12px}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ===== 侧边栏 ===== */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);
  padding:0 12px 10px;
}
.brand{display:flex;align-items:center;gap:9px;height:var(--topbar-h);padding:0 8px;flex:0 0 auto}
.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.2px}
.brand-chip{margin-left:auto;font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 7px}
.ws{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);text-align:left;transition:background .15s var(--ease-out)}
.ws:hover{background:var(--surface-sunken)}
.ws-av{width:26px;height:26px;border-radius:8px;background:var(--avatar-1,#1D4ED8);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 auto}
.ws-meta{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.ws-meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-meta i{font-style:normal;font-size:11px;color:var(--text-3)}
.ws>svg{margin-left:auto;color:var(--text-3);flex:0 0 auto}
.nav{flex:1 1 auto;overflow:auto;margin-top:14px;padding-bottom:8px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.nav-sec{font-size:11px;color:var(--text-3);padding:14px 10px 6px;letter-spacing:.4px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13px;text-align:left;transition:background .13s,color .13s}
.nav-item svg{flex:0 0 auto;opacity:.85}
.nav-item:hover{background:var(--surface-sunken);color:var(--text)}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:600}
.nav-item.on svg{opacity:1}
.side-foot{flex:0 0 auto;border-top:1px solid var(--border);padding:12px 10px 2px;font-size:11px;color:var(--text-3);line-height:1.6}
.side-foot span{color:var(--text-3);opacity:.8}

/* ===== 顶栏 ===== */
.topbar{
  height:var(--topbar-h);flex:0 0 auto;position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:16px;padding:0 28px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.crumbs b{color:var(--text);font-weight:600;font-size:13px}
.crumbs .sep{opacity:.5}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid transparent;transition:background .13s,color .13s,border-color .13s}
.icon-btn:hover{background:var(--surface-sunken);color:var(--text);border-color:var(--border)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--avatar-5,#5B3FD1);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;border:1px solid transparent;transition:background .14s,border-color .14s,color .14s,box-shadow .14s;white-space:nowrap}
.btn svg{flex:0 0 auto}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-sunken);color:var(--text);border-color:var(--border-strong)}
.btn.soft{background:var(--primary-soft);color:var(--primary-fg);border-color:var(--primary-border)}
.btn.soft:hover{background:var(--primary-soft);border-color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.95)}
.btn.danger-text{color:var(--danger-fg);background:var(--surface);border-color:var(--border)}
.btn.danger-text:hover{background:var(--danger-soft);border-color:var(--danger-border)}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ===== 页面 ===== */
.content{flex:1 1 auto;padding:24px 28px 72px;width:100%;max-width:1340px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph-left{display:flex;align-items:center;gap:14px;min-width:0}
.proj-mark{width:44px;height:44px;border-radius:13px;background:var(--primary-soft);color:var(--primary-fg);display:grid;place-items:center;font-size:17px;font-weight:650;flex:0 0 auto;border:1px solid var(--primary-border)}
.ph-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-title h1{font-size:21px;font-weight:650;letter-spacing:-.2px}
.ph-sub{font-size:12px;color:var(--text-3);margin-top:4px;max-width:720px}
.ph-actions{margin-left:auto;display:flex;align-items:center;gap:8px;padding-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;background:var(--surface-sunken);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.pill-on{background:var(--success-soft);color:var(--success-fg);border-color:var(--success-border)}
.pill-blue{background:var(--primary-soft);color:var(--primary-fg);border-color:var(--primary-border)}
.pill-plum{background:var(--plum-soft);color:var(--plum-fg);border-color:var(--plum-border)}
.pill-warn{background:var(--warning-soft);color:var(--warning-fg);border-color:var(--warning-border)}

.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:20px 0 20px}
.ptab{position:relative;padding:9px 13px 10px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .14s}
.ptab:hover{color:var(--text)}
.ptab.on{color:var(--primary-fg);border-bottom-color:var(--primary);font-weight:600}

/* ===== 目标条 ===== */
.goal{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--surface),var(--surface));box-shadow:var(--shadow-xs);margin-bottom:14px;flex-wrap:wrap}
.goal-ico{width:28px;height:28px;border-radius:8px;background:var(--plum-soft);color:var(--plum-fg);display:grid;place-items:center;flex:0 0 auto}
.goal-main{min-width:0;flex:1 1 220px}
.goal-k{font-size:11px;color:var(--text-3)}
.goal-v{font-size:13px;color:var(--text);margin-top:1px;text-wrap:pretty}
.goal-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gm{display:flex;flex-direction:column;line-height:1.35}
.gm i{font-style:normal;font-size:11px;color:var(--text-3)}
.gm b{font-size:12px;font-weight:600;color:var(--text-2)}

/* ===== 指标 ===== */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 13px;box-shadow:var(--shadow-xs)}
.metric .k{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.metric .v{font-size:23px;font-weight:650;letter-spacing:-.4px;line-height:1.25;margin-top:3px}
.metric .h{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v.warn{color:var(--warning-fg)}
.metric .v.ok{color:var(--success-fg)}

/* ===== 卡片 ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);min-height:52px}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--text-3)}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:6px 8px 8px}
.card-b.pad{padding:16px 18px}

/* ===== 关注条 ===== */
.attn{display:flex;align-items:center;gap:8px;margin:8px;padding:9px 11px;border:1px solid var(--warning-border);background:var(--warning-soft);border-radius:var(--r-md);font-size:12px;color:var(--warning-fg);flex-wrap:wrap}
.attn svg{flex:0 0 auto}
.attn b{font-weight:600}
.attn span{min-width:0;max-width:100%;overflow-wrap:anywhere}
.attn .sep{opacity:.45}
.attn button{margin-left:auto;color:var(--warning-fg);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ===== 里程碑列表 ===== */
.ms-list{padding:0 8px 8px}
.ms-row{display: flex;align-items:stretch;gap:0;width:100%;text-align:left;padding:11px 10px 11px 6px;border-radius:var(--r-md);position:relative;transition:background .14s;cursor:pointer}
.ms-row:hover{background:var(--surface-sunken)}
.ms-row+.ms-row::before{content:"";position:absolute;left:6px;right:10px;top:0;height:1px;background:var(--border)}
.ms-gutter{width:38px;flex:0 0 38px;display:flex;justify-content:center;padding-top:5px;position:relative}
.ms-gutter::before{content:"";position:absolute;top:0;bottom:-22px;left:50%;width:1px;background:var(--border);transform:translateX(-.5px)}
.ms-row:first-child .ms-gutter::before{top:12px}
.ms-row:last-child .ms-gutter::before{bottom:auto;height:14px}
.dia{width:11px;height:11px;transform:rotate(45deg);border-radius:2.5px;border:2px solid var(--primary);background:var(--surface);display:inline-block;position:relative;z-index:1}
.dia.achieved{border-color:var(--success);background:var(--success)}
.dia.overdue{border-color:var(--warning);background:var(--warning)}
.dia.cancelled{border-color:var(--border-strong);background:var(--surface-sunken)}
.dia.key{box-shadow:0 0 0 3px var(--plum-soft)}
.ms-main{flex:1 1 auto;min-width:0;padding-right:12px;display:block}
.ms-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ms-name{font-size:13px;font-weight:600;color:var(--text)}
.ms-row.achieved .ms-name{color:var(--text-2)}
.ms-row.cancelled .ms-name{color:var(--text-3);text-decoration:line-through}
.type-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--surface-sunken);color:var(--text-3);border:1px solid var(--border);white-space:nowrap}
.key-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--plum-soft);color:var(--plum-fg);border:1px solid var(--plum-border);white-space:nowrap}
.state{font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--r-pill);white-space:nowrap}
.state.pending{background:var(--primary-soft);color:var(--primary-fg)}
.state.achieved{background:var(--success-soft);color:var(--success-fg)}
.state.overdue{background:var(--warning-soft);color:var(--warning-fg)}
.state.cancelled{background:var(--surface-sunken);color:var(--text-3)}
.ms-cond{display:block;font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.5}
.ms-cond .strong{color:var(--text-2)}
.ms-bar{display:block;height:4px;border-radius:2px;background:var(--surface-sunken);margin-top:7px;max-width:300px;overflow:hidden}
.ms-bar i{display:block;height:100%;border-radius:2px;background:var(--primary);transition:width .3s var(--ease-out)}
.ms-row.achieved .ms-bar i{background:var(--success)}
.ms-side{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-right:2px}
.ms-date{font-size:12.5px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.ms-left{font-size:11px;color:var(--text-3);white-space:nowrap}
.ms-left.warn{color:var(--warning-fg);font-weight:500}
.ms-left.ok{color:var(--success-fg)}
.ms-arrow{width:18px;display:grid;place-items:center;color:var(--text-3);font-size:16px;opacity:.55}
.ms-row:hover .ms-arrow{opacity:1;color:var(--primary)}

/* ===== 动态 ===== */
.act-list{padding:4px 10px 10px}
.act-row{display:flex;gap:10px;padding:9px 8px;border-radius:var(--r-sm);font-size:12px}
.act-row:hover{background:var(--surface-sunken)}
.act-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--border-strong)}
.act-dot.ms{background:var(--plum)}
.act-dot.release{background:var(--success)}
.act-dot.task{background:var(--info)}
.act-main{min-width:0;flex:1}
.act-main b{font-weight:500;color:var(--text-2)}
.act-time{font-size:11px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ===== 甘特 ===== */
.gantt-card{overflow:hidden}
.g-toolbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.g-toolbar h3{font-size:14px;font-weight:600}
.g-toolbar .sub{font-size:12px;color:var(--text-3)}
.legend{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
.lg{display:flex;align-items:center;gap:5px}
.lg i{display:block;border-radius:3px}
.lg .b-done{width:14px;height:7px;background:var(--success-soft);border:1px solid var(--success)}
.lg .b-doing{width:14px;height:7px;background:var(--primary-soft);border:1px solid var(--primary)}
.lg .b-todo{width:14px;height:7px;background:var(--surface-sunken);border:1px solid var(--border-strong)}
.lg .b-ms{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;border:2px solid var(--primary);background:var(--primary)}
.gantt{--name-w:252px;overflow-x:auto}
.g-head{display:grid;grid-template-columns:var(--name-w) 1fr;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:4}
.g-corner{padding:0 14px;display:flex;align-items:flex-end;font-size:11px;color:var(--text-3);border-right:1px solid var(--border);height:56px;padding-bottom:7px}
.g-scale{min-width:540px;padding-top:4px}
.g-months{display:flex;height:22px;font-size:11px;color:var(--text-3);align-items:center}
.g-month{display:flex;align-items:center;padding-left:6px;border-left:1px solid var(--border);height:100%}
.g-month:first-child{border-left:0}
.g-days{display:flex;height:30px}
.g-day{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;border-left:1px solid transparent}
.g-day.we{background:var(--surface-sunken)}
.g-day.mon{border-left-color:var(--border)}
.g-day.mstart{border-left-color:var(--border-strong)}
.g-day.today{color:var(--primary-fg);font-weight:700;background:var(--primary-soft);border-radius:4px}
.g-body{position:relative;min-width:calc(var(--name-w) + 540px)}
.g-bg{position:absolute;inset:0;display:grid;grid-template-columns:var(--name-w) 1fr;pointer-events:none;z-index:0}
.g-bg-days{display:flex;min-width:540px}
.g-bg-days .g-day{border-left:1px solid transparent}
.g-bg-days .g-day.mon{border-left-color:var(--border)}
.g-bg-days .g-day.we{background:var(--surface-sunken);opacity:.65}
.g-today{position:absolute;inset:0;display:grid;grid-template-columns:var(--name-w) 1fr;pointer-events:none;z-index:3}
.g-today-track{position:relative;min-width:540px}
.g-today-track::before{content:"";position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--danger);opacity:.5;left:var(--today-pct)}
.g-today-track span{position:absolute;top:2px;left:var(--today-pct);transform:translateX(-50%);font-size:10px;color:var(--danger-fg);background:var(--danger-soft);border:1px solid var(--danger-border);border-radius:var(--r-pill);padding:0 6px;line-height:16px;white-space:nowrap;opacity:.95}
.g-group{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;background:var(--surface-sunken);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
.g-group span{font-weight:400;opacity:.75}
.g-row{position:relative;z-index:1;display:grid;grid-template-columns:var(--name-w) 1fr;height:36px;border-bottom:1px solid var(--border);background:transparent;transition:background .12s;cursor:pointer}
.g-row:hover{background:color-mix(in srgb,var(--primary-soft) 55%,transparent)}
.g-row.ms{cursor:pointer}
.g-name{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--border);min-width:0}
.g-nm{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-nm.strong{font-weight:500;color:var(--text)}
.g-nd{font-size:10.5px;color:var(--text-3);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-track{position:relative;min-width:540px}
.bar{position:absolute;top:9px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow-xs)}
.bar.done{background:var(--success-soft);border:1px solid var(--success);color:var(--success-fg)}
.bar.doing{background:var(--primary-soft);border:1px solid var(--primary);color:var(--primary-fg)}
.bar.todo{background:var(--surface-sunken);border:1px solid var(--border-strong);color:var(--text-3)}
.bar em{font-style:normal;font-size:9px;opacity:.9;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.g-ms{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;z-index:2}
.g-ms i{display:block;width:12px;height:12px;transform:rotate(45deg);border-radius:2.5px;border:2px solid var(--primary);background:var(--surface)}
.g-ms.achieved i{border-color:var(--success);background:var(--success)}
.g-ms.overdue i{border-color:var(--warning);background:var(--warning)}
.g-ms.cancelled i{border-color:var(--border-strong);background:var(--surface-sunken)}
.g-ms.key i{box-shadow:0 0 0 3px var(--plum-soft)}
.g-ms.overdue::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px dashed var(--warning-border)}
.gantt-note{display:flex;align-items:center;gap:7px;padding:11px 18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);background:var(--surface)}
.gantt-note svg{flex:0 0 auto;opacity:.7}

/* ===== 版本与发布 ===== */
.rel-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:16px}
.rel-stat{background:var(--surface);padding:13px 18px}
.rel-stat .k{font-size:11px;color:var(--text-3)}
.rel-stat .v{font-size:18px;font-weight:650;letter-spacing:-.2px;margin-top:2px}
.rel-stat .h{font-size:11px;color:var(--text-3);margin-top:1px}
.rel-body{padding:16px 18px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0}
.chk+.chk{border-top:1px dashed var(--border)}
.chk-ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.chk-ico.ok{background:var(--success-soft);color:var(--success-fg)}
.chk-ico.warn{background:var(--warning-soft);color:var(--warning-fg)}
.chk-ico.mute{background:var(--surface-sunken);color:var(--text-3)}
.chk-main{min-width:0;flex:1}
.chk-t{font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk-d{font-size:11.5px;color:var(--text-3);margin-top:1px}
.chk-side{font-size:11.5px;color:var(--text-3);white-space:nowrap;padding-top:1px}
.rel-note{display:flex;gap:8px;padding:10px 12px;background:var(--surface-sunken);border-radius:var(--r-sm);font-size:11.5px;color:var(--text-3);margin-top:12px;line-height:1.6}
.rel-note b{color:var(--text-2);font-weight:600}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;font-weight:500;color:var(--text-3);padding:9px 14px;background:var(--surface-sunken);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.t{color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.note{color:var(--text-3)}
.res{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap}
.res.success{background:var(--success-soft);color:var(--success-fg)}
.res.partial{background:var(--warning-soft);color:var(--warning-fg)}
.res.failed{background:var(--danger-soft);color:var(--danger-fg)}
.res.rollback{background:var(--surface-sunken);color:var(--text-2)}
.env-tag{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--border);color:var(--text-2);background:var(--surface)}
.env-tag.prod{border-color:var(--success-border);background:var(--success-soft);color:var(--success-fg)}
.tbl .muted{color:var(--text-3)}
.empty{padding:28px 16px;text-align:center;color:var(--text-3);font-size:12px}
.empty b{display:block;color:var(--text-2);font-weight:500;margin-bottom:3px}

.mini-ms{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:var(--r-sm);cursor:pointer;text-align:left;width:100%}
.mini-ms:hover{background:var(--surface-sunken)}
.mini-ms+.mini-ms{border-top:1px solid var(--border)}
.mini-ms .nm{font-size:12.5px;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ms .dt{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.mini-ms .st{font-size:11px;font-weight:500}
.st.achieved{color:var(--success-fg)}
.st.pending{color:var(--text-3)}
.st.overdue{color:var(--warning-fg)}
.st.cancelled{color:var(--text-3);text-decoration:line-through}

/* ===== 遮罩 / 抽屉 / 弹层 ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer-w);max-width:94vw;background:var(--surface);z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow-xl);border-left:1px solid var(--border)}
.dw-head{position:relative;padding:20px 22px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.dw-head .tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.dw-head h2{font-size:19px;font-weight:650;letter-spacing:-.2px;line-height:1.35;padding-right:24px}
.dw-head .meta{font-size:12px;color:var(--text-3);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.dw-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-3);font-size:18px;line-height:1}
.dw-x:hover{background:var(--surface-sunken);color:var(--text)}
.dw-body{flex:1 1 auto;overflow:auto;padding:18px 22px 26px}
.dw-foot{flex:0 0 auto;border-top:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:8px;background:var(--surface);flex-wrap:wrap}
.dw-foot .hint{font-size:11px;color:var(--text-3);margin-right:auto;line-height:1.4}
.dw-foot .spacer{flex:1 1 auto}
.dw-sec{margin-top:20px}
.dw-sec:first-child{margin-top:0}
.dw-sec h4{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dw-sec h4 .cnt{font-weight:400;color:var(--text-3);font-size:11px}

.fld{margin-bottom:16px}
.fld>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:6px}
.fld .req{color:var(--danger)}
.input,.select,textarea.input{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;background:var(--surface);font-size:13px;transition:border-color .14s,box-shadow .14s}
textarea.input{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.6}
.input:hover,.select:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring-focus)}
.input::placeholder,textarea::placeholder{color:var(--text-3);opacity:.8}
.fld .help{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.select-like{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;background:var(--surface);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);text-align:left}
.select-like:disabled{background:var(--surface-sunken);color:var(--text-3)}

.type-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type-card{border:1px solid var(--border);border-radius:var(--r-md);padding:10px;text-align:left;background:var(--surface);transition:border-color .14s,background .14s,box-shadow .14s;position:relative}
.type-card:hover{border-color:var(--border-strong);background:var(--surface-sunken)}
.type-card.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.tc-ico{width:26px;height:26px;border-radius:7px;background:var(--surface-sunken);color:var(--text-2);display:grid;place-items:center;margin-bottom:8px}
.type-card.on .tc-ico{background:var(--surface);color:var(--primary)}
.tc-t{display:block;font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35}
.tc-d{display:block;font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.45}
.type-card .tc-check{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;color:transparent}
.type-card.on .tc-check{background:var(--primary);border-color:var(--primary);color:#fff}

.check-line{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;margin:2px 0 4px}
.check-line input{margin:3px 0 0;accent-color:var(--primary);width:14px;height:14px;flex:0 0 auto}
.check-line span{font-size:11px;color:var(--text-3);display:block;line-height:1.5}
.more-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:6px 0;margin-top:6px}
.more-toggle:hover{color:var(--primary-fg)}
.more-toggle svg{transition:transform .16s}
.more-toggle.open svg{transform:rotate(180deg)}
.more-box{border-top:1px dashed var(--border);margin-top:8px;padding-top:14px}

.pick-list{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;max-height:238px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;text-align:left;background:var(--surface);border-bottom:1px solid var(--border)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surface-sunken)}
.pick .ck{width:15px;height:15px;border-radius:4px;border:1px solid var(--border-strong);display:grid;place-items:center;color:transparent;flex:0 0 auto;background:var(--surface)}
.pick.on .ck{background:var(--primary);border-color:var(--primary);color:#fff}
.pick .pn{font-size:12.5px;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pm{font-size:11px;color:var(--text-3);white-space:nowrap}
.pick .pd{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.pick.done .pn{color:var(--text-2)}

.cond-card{border:1px solid var(--primary-border);background:linear-gradient(180deg,var(--primary-soft),var(--surface) 130%);border-radius:var(--r-lg);padding:14px 15px}
.cond-k{font-size:11px;color:var(--primary-fg);font-weight:600;display:flex;align-items:center;gap:6px}
.cond-v{font-size:14px;font-weight:600;margin-top:5px;line-height:1.45}
.cond-s{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.55}
.cond-prog{display:flex;align-items:center;gap:9px;margin-top:10px}
.cond-prog .track{flex:1;height:5px;border-radius:3px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.cond-prog .track i{display:block;height:100%;background:var(--primary)}
.cond-prog b{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.task-list{margin-top:10px;border-top:1px dashed var(--primary-border);padding-top:6px}
.task-li{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;color:var(--text-2)}
.task-li .ok{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--success-soft);color:var(--success-fg)}
.task-li .no{width:14px;height:14px;border-radius:50%;border:1px solid var(--border-strong);flex:0 0 auto}
.task-li .d{margin-left:auto;font-size:10.5px;color:var(--text-3);white-space:nowrap}
.task-li.miss{color:var(--text-3)}

.ev{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;background:var(--surface)}
.ev-row{display:flex;gap:12px;font-size:12px;padding:3px 0}
.ev-row .k{color:var(--text-3);width:68px;flex:0 0 auto}
.ev-row .v{color:var(--text-2);min-width:0}
.ev-empty{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:14px;font-size:12px;color:var(--text-3);line-height:1.6;background:var(--surface-sunken)}

.log{position:relative;padding-left:16px}
.log::before{content:"";position:absolute;left:4px;top:7px;bottom:9px;width:1px;background:var(--border)}
.log-item{position:relative;padding:0 0 13px}
.log-item::before{content:"";position:absolute;left:-15px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.log-item:first-child::before{border-color:var(--primary);background:var(--primary-soft)}
.log-t{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.log-x{font-size:12px;color:var(--text-2);margin-top:1px;line-height:1.5}

/* ===== 弹层 ===== */
.modal{position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;max-width:calc(100vw - 32px);max-height:86vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);overflow:hidden}
.md-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.md-head h3{font-size:16px;font-weight:650}
.md-head p{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.md-x{margin-left:auto;width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-3);font-size:18px;flex:0 0 auto}
.md-x:hover{background:var(--surface-sunken);color:var(--text)}
.md-body{padding:18px 20px;overflow:auto}
.md-foot{display:flex;align-items:center;gap:8px;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface)}
.md-foot .spacer{flex:1}
.notice{display:flex;gap:9px;padding:10px 12px;border-radius:var(--r-sm);background:var(--primary-soft);border:1px solid var(--primary-border);font-size:12px;color:var(--primary-fg);line-height:1.55;margin-bottom:16px}
.notice.warn{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning-fg)}
.notice.danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-fg)}
.notice svg{flex:0 0 auto;margin-top:1px}
.seg{display:flex;gap:4px;padding:3px;background:var(--surface-sunken);border-radius:var(--r-sm);border:1px solid var(--border)}
.seg-btn{flex:1;height:30px;border-radius:5px;font-size:12.5px;color:var(--text-2);transition:background .13s,color .13s,box-shadow .13s}
.seg-btn:hover{color:var(--text)}
.seg-btn.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-xs)}
.seg-btn.on[data-result="success"]{color:var(--success-fg)}
.seg-btn.on[data-result="partial"]{color:var(--warning-fg)}
.seg-btn.on[data-result="failed"]{color:var(--danger-fg)}
.ro{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12px;border-top:1px dashed var(--border)}
.ro .k{color:var(--text-3);width:76px;flex:0 0 auto}
.ro .v{color:var(--text-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:27px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text-2);transition:all .13s}
.chip:hover{border-color:var(--border-strong);background:var(--surface-sunken)}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-fg);font-weight:500}
.chip.danger.on{border-color:var(--danger);background:var(--danger-soft);color:var(--danger-fg)}

/* ===== 演示浮层 / toast ===== */
.demo-pop{position:fixed;top:calc(var(--topbar-h) - 6px);right:26px;width:296px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:45;padding:6px;overflow:hidden}
.dp-head{display:flex;flex-direction:column;gap:1px;padding:9px 10px 8px}
.dp-head b{font-size:12.5px;font-weight:600}
.dp-head span{font-size:10.5px;color:var(--text-3)}
.dp-item{display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-sm);text-align:left;transition:background .12s}
.dp-item:hover{background:var(--surface-sunken)}
.dp-item .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--text-3)}
.dp-item .dot.g{background:var(--success)}
.dp-item .dot.b{background:var(--primary)}
.dp-item .dot.w{background:var(--warning)}
.dp-item .dot.r{background:var(--danger)}
.dp-item .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.dp-item .txt b{font-size:12px;font-weight:500;color:var(--text)}
.dp-item .txt em{font-style:normal;font-size:10.5px;color:var(--text-3);line-height:1.4}
.dp-sep{height:1px;background:var(--border);margin:5px 8px}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:80;max-width:520px;padding:9px 15px;border-radius:var(--r-pill);background:#101828;color:#fff;font-size:12.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s var(--ease-out),transform .18s var(--ease-out);display:flex;align-items:center;gap:7px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ti{width:6px;height:6px;border-radius:50%;background:var(--success);flex:0 0 auto}
.toast.warn .ti{background:var(--warning)}
.toast.err .ti{background:var(--danger)}
html[data-theme="dark"] .toast{background:#E7ECF3;color:#101828}

/* ===== 响应式（移动端仅保证可看） ===== */
@media (max-width:1180px){
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rel-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .sidebar{display:none}
  .topbar{padding:0 16px;gap:8px}
  .crumbs{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .top-actions{flex:0 0 auto}
  .content{padding:16px 16px 60px}
  .ph-actions{margin-left:0;width:100%}
  .drawer{width:100%;max-width:100%}
  .type-cards{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .gantt{--name-w:180px}
  .legend{display:none}
}
@media (max-width:640px){
  .metrics{grid-template-columns:1fr 1fr;gap:8px}
  .goal-meta{gap:12px}
  .ph-title h1{font-size:18px}
  .ptabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ms-side{display:none}
  .ms-arrow{display:none}
}

    });

          ]

        {

          key:true, achievedAt:null, achievedBy:null, achievedNote:'',

        { t:'2026-11-13 09:20', text:'压测执行 开始', by:'李明', kind:'task' },

      ]
    };
  }

  var state = blankState();

  /* ================= 时间 ================= */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function nowText(){
    var d = new Date(state.clock);
    return '2026-11-13 ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }
  function tick(){ state.clock += 60000; }
  function stamp(){ var s = nowText(); tick(); return s; }

  /* ================= 派生 ================= */
  function taskById(id){ return state.tasks.filter(function(t){ return t.id === id; })[0]; }
  function releaseMs(){ return state.milestones.filter(function(m){ return m.type === 'release'; })[0]; }

  function progressOf(m){
    if (m.type !== 'tasks') return null;
    var ts = m.taskIds.map(taskById).filter(Boolean);
    var done = ts.filter(function(t){ return t.done; }).length;
    return { done: done, total: ts.length, tasks: ts };
  }

  function statusOf(m){
    if (m.cancelled) return 'cancelled';
    if (m.achievedAt) return 'achieved';
    if (diff(TODAY, m.target) > 0) return 'overdue';
    return 'pending';
  }
  function statusLabel(m){
    var st = statusOf(m);
    if (st === 'achieved') return m.rollback ? '已达成（后回滚）' : '已达成';
    if (st === 'overdue') return '已延期 ' + diff(TODAY, m.target) + ' 天';
    if (st === 'cancelled') return '已取消';
    return '未达成';
  }
  function typeLabel(t){
    return t === 'release' ? '版本发布后' : t === 'tasks' ? '工作项完成后' : '人工确认';
  }
  function dateHint(m){
    var st = statusOf(m);
    if (st === 'achieved') return { text:'达成 ' + mmdd(m.achievedAt), cls:'ok' };
    if (st === 'overdue') return { text:'超期 ' + diff(TODAY, m.target) + ' 天', cls:'warn' };
    if (st === 'cancelled') return { text:'不计入统计', cls:'' };
    var n = diff(m.target, TODAY);
    return { text: n === 0 ? '今天到期' : '剩 ' + n + ' 天', cls: n <= 3 ? 'warn' : '' };
  }
  function sortedMs(){
    return state.milestones.slice().sort(function(a, b){
      if (!!a.cancelled !== !!b.cancelled) return a.cancelled ? 1 : -1;
      return pd(a.target) - pd(b.target);
    });
  }

  /* ================= 同步（自动判定） ================= */
  function sync(){
    /* 工作项型：全部完成即达成；全部达成后若被重开则回退 */
    state.milestones.forEach(function(m){
      if (m.type !== 'tasks' || m.cancelled) return;
      var p = progressOf(m);
      if (!p || !p.total) return;
      var all = p.done === p.total;
      if (all && !m.achievedAt){
        m.achievedAt = TODAY;
        m.achievedBy = '条件自动判定';
        m.auto = true;
        m.log.push({ t: stamp(), text: p.done + '/' + p.total + ' 项工作项完成，条件达成' });
        pushActivity(m.name + ' 自动达成', '系统', 'ms');
      }
      if (!all && m.achievedAt && m.auto){
        m.achievedAt = null;
        m.achievedBy = null;
        m.auto = false;
        m.log.push({ t: stamp(), text: '关联工作项被重开，回到未达成' });
        pushActivity(m.name + ' 回到未达成', '系统', 'ms');
      }
    });

    /* 发布型：生产成功即达成 */
    var rm = releaseMs();
    if (rm && !rm.cancelled){
      var ok = state.releases.filter(function(r){
        return r.env === 'production' && r.result === 'success';
      })[0];
      if (ok && !rm.achievedAt){
        rm.achievedAt = TODAY;
        rm.achievedBy = '发布记录';
        rm.log.push({ t: stamp(), text:'生产发布成功，由发布记录自动达成' });
        pushActivity(rm.name + ' 自动达成', '系统', 'ms');
      }
    }
  }

  function pushActivity(text, by, kind){
    state.activity.unshift({ t: nowText(), text: text, by: by, kind: kind || 'ms' });
    if (state.activity.length > 8) state.activity.pop();
  }

  /* ================= 动作 ================= */
  function toast(msg, kind){
    var el = $('#toast');
    $('#toastText').textContent = msg;
    el.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function(){ el.className = 'toast'; }, 2800);
  }

  function openCreate(){
    state.draft = {
      type: 'release',
      name: 'V1.0 上线',
      target: state.version.end,
      owner: state.project.owner,
      key: true,
      taskIds: [],
      note: '',
      remind: true,
      more: false
    };
    state.openDrawer = 'create';
    state.modal = null;
    state.demo = false;
  }

  function defaultTasks(){
    return state.tasks.filter(function(t){ return !t.done; }).map(function(t){ return t.id; });
  }
  function maxEnd(ids){
    var ends = ids.map(taskById).filter(Boolean).map(function(t){ return t.end; });
    return ends.length ? ends.sort().slice(-1)[0] : addDays(TODAY, 14);
  }

    var rec = {
      id: 'r' + Date.now(),
      time: nowText(),
      env: 'production',
      result: result,
      by: state.project.owner,
      note: note || '',
      sha: '9f2c…a71d'
    };
    tick();
    state.releases.unshift(rec);
    var m = releaseMs();
    if (m){
      if (result === 'success'){
        m.rollback = false;
        m.log.push({ t: stamp(), text:'生产发布成功' + (note ? ' · ' + note : '') });
      } else if (result === 'partial'){
        m.log.push({ t: stamp(), text:'生产发布部分成功，不计达成' });
      } else if (result === 'failed'){
        m.log.push({ t: stamp(), text:'生产发布失败，不计达成' });
      } else if (result === 'rollback'){
        m.rollback = true;
        m.log.push({ t: stamp(), text:'执行回滚；达成记录保留，历史不撤销' });
      }
    }
    sync();
    pushActivity(
      result === 'success' ? 'V1.0 生产发布成功' :
      result === 'partial' ? 'V1.0 生产发布部分成功' :
      result === 'failed' ? 'V1.0 生产发布失败' : 'V1.0 回滚到上一版本',
      state.project.owner, 'release'

  }

          '<button class="btn ghost" data-act="stub">项目设置</button>' +
          '<button class="btn primary" data-act="create-open">' + ICON.plus + '新建里程碑</button>' +
        '</div>' +
      '</div>' +
      '<div class="ptabs">' + tabs.map(function(t){
        return '<button class="ptab' + (state.view === t[0] ? ' on' : '') + '" data-act="view" data-view="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
  }

  function goalHTML(){
    return '' +
      '<div class="goal">' +
        '<div class="goal-ico">' + ICON.flag + '</div>' +
        '<div class="goal-main">' +
          '<div class="goal-k">项目目标</div>' +
          '<div class="goal-v">' + esc(state.project.objective) + '</div>' +
        '</div>' +
        '<div class="goal-meta">' +
          '<div class="gm"><i>负责人</i><b>' + esc(state.project.owner) + '</b></div>' +
          '<div class="gm"><i>计划</i><b>' + mmdd(state.project.start) + ' – ' + mmdd(state.project.end) + '</b></div>' +
          '<div class="gm"><i>当前版本</i><b>V1.0 · 进行中</b></div>' +
        '</div>' +
      '</div>';
  }

  function metricsHTML(){
    var active = state.milestones.filter(function(m){ return !m.cancelled; });
    var achieved = active.filter(function(m){ return !!m.achievedAt; });
    var pending = active.filter(function(m){ return !m.achievedAt && diff(TODAY, m.target) <= 0; });
    var overdue = active.filter(function(m){ return !m.achievedAt && diff(TODAY, m.target) > 0; });
    var next = active.filter(function(m){
      return !m.achievedAt && diff(m.target, TODAY) >= 0;
    }).sort(function(a, b){ return pd(a.target) - pd(b.target); })[0];
    return '' +
      '<div class="metrics">' +
        '<div class="metric"><div class="k">已达成</div><div class="v">' + achieved.length + '/' + active.length + '</div><div class="h">含人工确认与自动判定</div></div>' +
        '<div class="metric"><div class="k">进行中</div><div class="v">' + pending.length + '</div><div class="h">条件尚未满足</div></div>' +
        '<div class="metric"><div class="k">已延期</div><div class="v' + (overdue.length ? ' warn' : '') + '">' + overdue.length + '</div><div class="h">' + (overdue.length ? '超过目标日期未达成' : '没有超期节点') + '</div></div>' +
        '<div class="metric"><div class="k">距下个节点</div><div class="v">' + (next ? diff(next.target, TODAY) + ' 天' : '—') + '</div><div class="h">' + (next ? esc(next.name) + ' · ' + mmdd(next.target) : '暂无排期节点') + '</div></div>' +
      '</div>';
  }

  function conditionText(m){
    if (m.type === 'release'){
      var ok = state.releases.filter(function(r){ return r.env === 'production' && r.result === 'success'; })[0];
      var base = '版本 V1.0 生产发布成功';
      if (m.rollback) return base + ' · 已回滚（达成保留）';
      return ok ? base + ' · 已有成功记录' : base + ' · 尚无记录';
    }
    if (m.type === 'tasks'){
      var p = progressOf(m);
      var miss = p.tasks.filter(function(t){ return !t.done; });
      var s = p.total + ' 项工作项全部完成 · ' + p.done + '/' + p.total;
      if (miss.length === 1) s += '，还差「' + miss[0].name + '」';
      else if (miss.length > 1) s += '，还差 ' + miss.length + ' 项';
      return s;
    }
    if (m.achievedAt) return '负责人确认达成 · ' + m.achievedBy.replace('条件自动判定','系统') + ' 于 ' + mmdd(m.achievedAt) + ' 确认';
    return '由负责人人工确认达成';
  }

  function attentionHTML(){
    var items = [];
    state.milestones.forEach(function(m){
      if (m.cancelled || m.achievedAt) return;
      if (diff(TODAY, m.target) > 0){
        items.push({ text: m.name + ' 已延期 ' + diff(TODAY, m.target) + ' 天', id: m.id });
      }
    });
    var rm = releaseMs();
    if (rm && !rm.achievedAt && !rm.cancelled){
      items.push({ text: rm.name + ' 尚无生产发布记录', id: rm.id, cta: '去确认发布' });
    }
    if (!items.length) return '';
    return '' +
      '<div class="attn">' + ICON.alert + '<b>需要关注</b>' +
        items.map(function(it, i){
          return (i ? '<span class="sep">·</span>' : '') + '<span>' + esc(it.text) + '</span>';
        }).join('') +
        '<button data-act="ms-open" data-id="' + items[0].id + '">查看</button>' +
      '</div>';
  }

  function msRow(m){
    var st = statusOf(m);
    var hint = dateHint(m);
    var p = progressOf(m);
    return '' +
      '<button class="ms-row ' + st + '" data-act="ms-open" data-id="' + m.id + '">' +
        '<span class="ms-gutter"><span class="dia ' + st + (m.key ? ' key' : '') + '"></span></span>' +
        '<span class="ms-main">' +
          '<span class="ms-top">' +
            '<span class="ms-name">' + esc(m.name) + '</span>' +
            '<span class="type-tag">' + typeLabel(m.type) + '</span>' +
            (m.key ? '<span class="key-tag">★ 关键</span>' : '') +
            '<span class="state ' + st + '">' + statusLabel(m) + '</span>' +
          '</span>' +
          '<span class="ms-cond">' + esc(conditionText(m)) + '</span>' +
          (p ? '<span class="ms-bar"><i style="width:' + (p.total ? Math.round(p.done / p.total * 100) : 0) + '%"></i></span>' : '') +
        '</span>' +
        '<span class="ms-side">' +
          '<span class="ms-date">' + mmdd(m.target) + '</span>' +
          '<span class="ms-left ' + hint.cls + '">' + hint.text + ' · ' + esc(m.owner) + '</span>' +
        '</span>' +
        '<span class="ms-arrow">›</span>' +
      '</button>';
  }

  function activityHTML(){
    return state.activity.slice(0, 6).map(function(a){
      return '' +
        '<div class="act-row">' +
          '<span class="act-dot ' + a.kind + '"></span>' +
          '<span class="act-main"><b>' + esc(a.text) + '</b> · ' + esc(a.by) + '</span>' +
          '<span class="act-time">' + a.t.slice(5) + '</span>' +
        '</div>';
    }).join('');
  }

  function viewOverview(){
    var active = state.milestones.filter(function(m){ return !m.cancelled; });
    var achieved = active.filter(function(m){ return !!m.achievedAt; }).length;
    var overdue = active.filter(function(m){ return !m.achievedAt && diff(TODAY, m.target) > 0; }).length;
    return headHTML() +
      '<div class="goal">' +
        '<div class="goal-ico">' + ICON.flag + '</div>' +
        '<div class="goal-main"><div class="goal-k">项目目标</div><div class="goal-v">' + esc(state.project.objective) + '</div></div>' +
        '<div class="goal-meta">' +
          '<div class="gm"><i>负责人</i><b>' + esc(state.project.owner) + '</b></div>' +
          '<div class="gm"><i>计划</i><b>' + mmdd(state.project.start) + ' – ' + mmdd(state.project.end) + '</b></div>' +
          '<div class="gm"><i>当前版本</i><b>V1.0 · 进行中</b></div>' +
        '</div>' +
      '</div>' +
      metricsHTML() +
      '<section class="card">' +
        '<div class="card-h">' +
          '<h3>里程碑</h3>' +
          '<span class="sub">达成 ' + achieved + '/' + active.length + ' · 延期 ' + overdue + '</span>' +
          '<div class="right"><button class="btn ghost small" data-act="view" data-view="gantt">在甘特中查看</button></div>' +
        '</div>' +
        attentionHTML() +
        '<div class="ms-list">' + sortedMs().map(msRow).join('') + '</div>' +
      '</section>' +
      '<section class="card" style="margin-top:14px">' +
        '<div class="card-h"><h3>最近动态</h3><span class="sub">来自工作项、发布记录与里程碑判定</span></div>' +
        '<div class="act-list">' + activityHTML() + '</div>' +
      '</section>';
  }

  /* ---------- 甘特 ---------- */
  function dayCells(){
    var out = '';
    for (var i = 0; i < G_DAYS; i++){
      var d = addDays(G_START, i);
      var w = wd(d);
      var cls = 'g-day';
      if (w === 0 || w === 6) cls += ' we';
      if (w === 1) cls += ' mon';
      if (d.slice(8) === '01') cls += ' mstart';
      if (d === TODAY) cls += ' today';
      out += '<div class="' + cls + '">' + dnum(d) + '</div>';
    }
    return out;
  }

  function viewGantt(){
    var tasks = state.tasks;
    var ms = sortedMs();
    var rows = ms.map(function(m){
      var st = statusOf(m);
      return '' +
        '<div class="g-row ms" data-act="ms-open" data-id="' + m.id + '" title="' + esc(m.name + ' · ' + m.target) + '">' +
          '<div class="g-name">' +
            '<span class="dia ' + st + (m.key ? ' key' : '') + '" style="width:9px;height:9px;border-width:1.5px"></span>' +
            '<span class="g-nm strong">' + esc(m.name) + '</span>' +
            '<span class="g-nd">' + mmdd(m.target) + '</span>' +
          '</div>' +
          '<div class="g-track">' +
            '<span class="g-ms ' + st + (m.key ? ' key' : '') + '" style="left:' + pct(m.target) + '%"><i></i></span>' +
          '</div>' +
        '</div>';
    }).join('');

    var taskRows = tasks.map(function(t){
      var s = statusOfTask(t);
      return '' +
        '<div class="g-row" title="' + esc(t.name + ' · ' + t.start + ' → ' + t.end + ' · ' + t.owner) + '">' +
          '<div class="g-name">' +
            '<span class="g-nm">' + esc(t.name) + '</span>' +
            '<span class="g-nd">' + mmdd(t.start) + '–' + mmdd(t.end) + '</span>' +
          '</div>' +
          '<div class="g-track">' +
            '<span class="bar ' + s + '" style="left:' + pct(t.start) + '%;width:' + pctW(t.start, t.end) + '%"><em>' + esc(t.owner.charAt(0)) + '</em></span>' +
          '</div>' +
        '</div>';
    }).join('');

    return headHTML() +
      '<section class="card gantt-card">' +
        '<div class="g-toolbar">' +
          '<h3>项目甘特</h3>' +
          '<span class="sub">2026 年 11 月 – 12 月 · 今天 ' + mmdd(TODAY) + '</span>' +
          '<div class="legend">' +
            '<span class="lg"><i class="b-ms"></i>里程碑</span>' +
            '<span class="lg"><i class="b-done"></i>已完成</span>' +
            '<span class="lg"><i class="b-doing"></i>进行中</span>' +
            '<span class="lg"><i class="b-todo"></i>未开始</span>' +
          '</div>' +
        '</div>' +
        '<div class="gantt">' +
          '<div class="g-head">' +
            '<div class="g-corner">阶段 / 工作项</div>' +
            '<div class="g-scale">' +
              '<div class="g-months">' +
                '<div class="g-month" style="width:83.33%">2026 年 11 月</div>' +
                '<div class="g-month" style="width:16.67%">12 月</div>' +
              '</div>' +
              '<div class="g-days">' + dayCells() + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="g-body">' +
            '<div class="g-bg" aria-hidden="true"><div></div><div class="g-bg-days">' + dayCells() + '</div></div>' +
            '<div class="g-today" aria-hidden="true"><div></div><div class="g-today-track" style="--today-pct:' + (diff(TODAY, G_START) / G_DAYS * 100) + '%"><span>今天</span></div></div>' +
            '<div class="g-group">里程碑 <span>' + ms.length + ' 个 · 独立成轨</span></div>' +
            rows +
            '<div class="g-group">工作项 <span>' + tasks.length + ' 项</span></div>' +
            taskRows +
          '</div>' +
        '</div>' +
        '<div class="gantt-note">' + ICON.info +
          '<span>里程碑独立成轨，不进入工作项计数、预估与燃尽；菱形位置为目标日期，达成状态由条件或确认证据判定。</span>' +
        '</div>' +
      '</section>';
  }

  function statusOfTask(t){
    if (t.done) return 'done';
    if (diff(TODAY, t.start) >= 0) return 'doing';
    return 'todo';
  }

  /* ---------- 版本与发布 ---------- */
  function resultLabel(r){
    return { success:'成功', partial:'部分成功', failed:'失败', rollback:'回滚' }[r] || r;
  }
  function versionStats(){
    var total = state.tasks.length;
    var done = state.tasks.filter(function(t){ return t.done; }).length;
    var active = state.milestones.filter(function(m){ return !m.cancelled; });
    var okMs = active.filter(function(m){ return !!m.achievedAt; }).length;
    var prod = state.releases.filter(function(r){ return r.env === 'production'; });
    var prodOk = prod.filter(function(r){ return r.result === 'success'; }).length;
    return { total: total, done: done, msTotal: active.length, msOk: okMs, prod: prod.length, prodOk: prodOk };
  }

  function releaseChecks(){
    var s = versionStats();
    var dev = state.milestones.filter(function(m){ return m.name === '开发完成'; })[0];
    var rm = releaseMs();
    var checks = [];
    checks.push({
      tone: s.done === s.total ? 'ok' : 'warn',
      t: '关联工作项',
      d: s.done === s.total ? '全部完成' : '还有 ' + (s.total - s.done) + ' 项未完成',
      side: s.done + '/' + s.total
    });
    if (dev){
      var p = progressOf(dev);
      checks.push({
        tone: p && p.done === p.total ? 'ok' : 'warn',
        t: '关键里程碑 · 开发完成',
        d: p && p.done === p.total ? '已达成' : '未达成',
        side: p ? p.done + '/' + p.total : '—'
      });
    }
    checks.push({
      tone: s.prodOk ? 'ok' : 'mute',
      t: '生产发布记录',
      d: s.prodOk ? '已有成功记录' : '这是第一次生产发布',
      side: s.prodOk + ' 次成功'
    });
    return checks;
  }

  function viewRelease(){
    var s = versionStats();
    var rm = releaseMs();
    var checks = releaseChecks();
    var linked = state.milestones.filter(function(m){ return m.type === 'release' || m.name === '开发完成'; });
    var rows = state.releases.map(function(r){
      return '' +
        '<tr>' +
          '<td class="t">' + r.time.slice(5) + '</td>' +
          '<td><span class="env-tag ' + (r.env === 'production' ? 'prod' : '') + '">' + (r.env === 'production' ? '生产' : '测试') + '</span></td>' +
          '<td><span class="res ' + r.result + '">' + resultLabel(r.result) + '</span>' + (r.env === 'test' ? ' <span class="muted">不计达成</span>' : '') + '</td>' +
          '<td>V1.0</td>' +
          '<td>' + esc(r.by) + '</td>' +
          '<td class="note">' + (r.note ? esc(r.note) : '—') + '</td>' +
        '</tr>';
    }).join('');

    return headHTML() +
      '<section class="card">' +
        '<div class="card-h">' +
          '<h3>版本 V1.0</h3>' +
          '<span class="pill pill-on">进行中</span>' +
          '<div class="right"><button class="btn primary" data-act="release-open">确认生产发布</button></div>' +
        '</div>' +
        '<div class="card-b pad" style="padding-bottom:4px">' +
          '<div style="font-size:12px;color:var(--text-3)">计划 ' + mmdd(state.version.start) + ' – ' + mmdd(state.version.end) + ' · 负责人 ' + esc(state.version.owner) + ' · 当前任务版本集合，不代表实际发布</div>' +
        '</div>' +
        '<div class="rel-stats">' +
          '<div class="rel-stat"><div class="k">工作项完成</div><div class="v">' + s.done + '/' + s.total + '</div><div class="h">按当前版本关联</div></div>' +
          '<div class="rel-stat"><div class="k">里程碑达成</div><div class="v">' + s.msOk + '/' + s.msTotal + '</div><div class="h">' + (rm && rm.rollback ? '上线已达成，后回滚' : '含自动与人工判定') + '</div></div>' +
          '<div class="rel-stat"><div class="k">生产发布</div><div class="v">' + s.prodOk + ' 次成功</div><div class="h">共 ' + s.prod + ' 次生产尝试</div></div>' +
          '<div class="rel-stat"><div class="k">最近记录</div><div class="v" style="font-size:14px;padding-top:4px">' + (state.releases[0] ? state.releases[0].time.slice(5) + ' · ' + (state.releases[0].env === 'production' ? '生产' : '测试') : '—') + '</div><div class="h">' + resultLabel(state.releases[0] ? state.releases[0].result : '') + '</div></div>' +
        '</div>' +
        '<div class="rel-body">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><b style="font-size:12px;color:var(--text-2)">发布前检查</b><span style="font-size:11px;color:var(--text-3)">只提示，不阻断</span></div>' +
          checks.map(function(c){
            return '' +
              '<div class="chk">' +
                '<span class="chk-ico ' + c.tone + '">' + (c.tone === 'ok' ? ICON.check : c.tone === 'warn' ? ICON.alert : ICON.info) + '</span>' +
                '<span class="chk-main"><span class="chk-t">' + esc(c.t) + '</span><span class="chk-d">' + esc(c.d) + '</span></span>' +
                '<span class="chk-side">' + esc(c.side) + '</span>' +
              '</div>';
          }).join('') +
          '<div class="rel-note">' + ICON.info +
            '<span><b>完成不等于发布。</b>发布结果由有权限的人在提交时确认；成功后写入不可变记录，并自动达成关联里程碑。测试环境成功、失败与回滚都不计为已发布。</span>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<section class="card" style="margin-top:14px">' +
        '<div class="card-h"><h3>发布记录</h3><span class="sub">只追加，不修改</span></div>' +
        '<div class="tbl-wrap">' +
          '<table class="tbl">' +
            '<thead><tr><th>时间</th><th>环境</th><th>结果</th><th>版本</th><th>执行人</th><th>说明</th></tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="6"><div class="empty"><b>尚无发布记录</b>确认首次生产发布后会出现在这里</div></td></tr>') + '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>' +

      '<section class="card" style="margin-top:14px">' +
        '<div class="card-h"><h3>关联里程碑</h3><span class="sub">由发布与任务条件判定</span></div>' +
        '<div class="card-b">' +
          linked.map(function(m){
            var st = statusOf(m);
            return '' +
              '<button class="mini-ms" data-act="ms-open" data-id="' + m.id + '">' +
                '<span class="dia ' + st + (m.key ? ' key' : '') + '" style="width:9px;height:9px;border-width:1.5px"></span>' +
                '<span class="nm">' + esc(m.name) + '</span>' +
                '<span class="dt">' + mmdd(m.target) + '</span>' +
                '<span class="st ' + st + '">' + statusLabel(m) + '</span>' +
              '</button>';
          }).join('') +
        '</div>' +
      '</section>';
  }

  function renderView(){
    var root = $('#viewRoot');
    if (!root) return;
    if (state.view === 'gantt') root.innerHTML = viewGantt();
    else if (state.view === 'release') root.innerHTML = viewRelease();
    else root.innerHTML = viewOverview();
    var labels = { overview:'概览', gantt:'甘特', release:'版本与发布' };
    $('#crumbView').textContent = labels[state.view] || '概览';
  }

  /* ================= 新建抽屉 ================= */
  function createDrawer(){
    var d = state.draft;
    var types = [
      { k:'release', t:'版本发布后', d:'生产发布成功时自动达成', icon:'<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 6.9 10 3.5l6.4 3.4v6.2L10 16.5 3.6 13.1Z"/><path d="M3.6 6.9 10 10.3l6.4-3.4M10 10.3v6.2"/></svg>' },
      { k:'tasks', t:'工作项完成后', d:'关联工作项全部完成时自动达成', icon:'<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="3.4" width="13.2" height="13.2" rx="2.4"/><path d="M6.6 10.2 8.8 12.4l4.6-4.8"/></svg>' },

    ];

    var objectBlock = '';
    if (d.type === 'release'){
      objectBlock = '' +
        '<div class="select-like" style="cursor:default"><span class="pill pill-on" style="height:20px">V1.0</span><span>进行中 · 11/02 – 11/30</span><span style="margin-left:auto;color:var(--text-3)">当前版本</span></div>' +

        '<div class="pick-list">' + state.tasks.map(function(t){
          var on = d.taskIds.indexOf(t.id) >= 0;
          return '' +
            '<button class="pick' + (on ? ' on' : '') + (t.done ? ' done' : '') + '" data-act="pick-task" data-id="' + t.id + '">' +

        '<div class="help">已选 ' + d.taskIds.length + ' 项；全部完成时自动达成，被重开会回到未达成。</div>';

        '<div class="help">适合评审、验收、对外承诺等没有系统内完成信号的节点。</div>';

    return '' +
      '<aside class="drawer" role="dialog" aria-label="新建里程碑">' +
        '<div class="dw-head">' +
          '<div class="tags"><span class="pill pill-blue">新建</span></div>' +

          '<div class="meta"><span>一条条件记录一个阶段结果</span><span>状态自动判定</span></div>' +
          '<button class="dw-x" data-act="close-drawer" aria-label="关闭">×</button>' +
        '</div>' +
        '<div class="dw-body">' +
          '<div class="fld">' +
            '<label>达成方式</label>' +
            '<div class="type-cards">' + types.map(function(t){
              return '' +
                '<button class="type-card' + (d.type === t.k ? ' on' : '') + '" data-act="type" data-type="' + t.k + '">' +
                  '<span class="tc-check">' + ICON.check + '</span>' +
                  '<span class="tc-ico">' + t.icon + '</span>' +
                  '<span class="tc-t">' + t.t + '</span>' +
                  '<span class="tc-d">' + t.d + '</span>' +
                '</button>';

          '</div>' +

          '<div class="fld">' +
            '<label>名称 <span class="req">*</span></label>' +
            '<input class="input" data-bind="name" value="' + esc(d.name) + '" placeholder="例如：V1.0 上线">' +
          '</div>' +

          '<div class="row2">' +
            '<div class="fld"><label>目标日期 <span class="req">*</span></label><input class="input" type="date" data-bind="target" value="' + d.target + '"></div>' +
            '<div class="fld"><label>负责人</label><div class="select-like" style="cursor:default"><span class="avatar" style="width:20px;height:20px;font-size:10px;background:var(--avatar-5)">孔</span>孔祥劲<span style="margin-left:auto;color:var(--text-3)">默认</span></div></div>' +
          '</div>' +

          '<div class="fld">' +
            '<label>关联对象</label>' +

          '<button class="more-toggle' + (d.more ? ' open' : '') + '" data-act="toggle-more">更多设置' +

          '</button>' +
          (d.more ? '<div class="more-box">' +
            '<div class="fld"><label>说明</label><textarea class="input" data-bind="note" placeholder="选填：这个节点代表什么结果">' + esc(d.note) + '</textarea></div>' +
            '<label class="check-line"><input type="checkbox" data-bind="remind"' + (d.remind ? ' checked' : '') + '>到期前 3 天提醒<span>按站内通知投递，不额外发邮件</span></label>' +
          '</div>' : '') +
