  /* ================= 详情抽屉 ================= */
  function conditionCore(m){
    if (m.type === 'release') return '版本 V1.0 生产发布成功';
    if (m.type === 'tasks'){
      var p = progressOf(m);
      return p.total + ' 项工作项全部完成';
    }
    return '负责人确认达成';
  }

  function conditionDetail(m){
    if (m.type === 'release'){
      var ok = state.releases.filter(function(r){ return r.env === 'production' && r.result === 'success'; })[0];
      var s = m.rollback
        ? '已于 ' + m.achievedAt + ' 达成；后续执行回滚，达成历史保留。'
        : ok
          ? '已由 ' + ok.time + ' 的生产成功记录达成。'
          : '当前：尚无生产发布记录。测试环境、部分成功与回滚都不计达成。';
      return { v: conditionCore(m), s: s };
    }
    if (m.type === 'tasks'){
      var p = progressOf(m);
      var miss = p.tasks.filter(function(t){ return !t.done; });
      var s2 = '当前 ' + p.done + '/' + p.total + ' 完成';
      if (miss.length === 1) s2 += '，还差「' + miss[0].name + '」';
      else if (miss.length > 1) s2 += '，还差 ' + miss.length + ' 项';
      s2 += '。全部完成后自动达成，被重开会回到未达成。';
      return { v: conditionCore(m), s: s2 };
    }
    return { v: conditionCore(m), s: '人工确认节点：达成时由负责人确认，可附一句说明。' };
  }

  function linkedObjectHTML(m){
    if (m.type !== 'release') return '';
    var s = versionStats();
    return '' +
      '<div class="dw-sec">' +
        '<h4>关联对象</h4>' +
        '<div class="ev">' +
          '<div class="ev-row"><span class="k">版本</span><span class="v">V1.0 · 进行中</span></div>' +
          '<div class="ev-row"><span class="k">计划</span><span class="v">' + mmdd(state.version.start) + ' – ' + mmdd(state.version.end) + '</span></div>' +
          '<div class="ev-row"><span class="k">工作项</span><span class="v">' + s.done + '/' + s.total + ' 完成</span></div>' +
        '</div>' +
      '</div>';
  }


  function evidenceHTML(m){
    var st = statusOf(m);
    if (st !== 'achieved'){
      return '<div class="ev-empty">尚无达成证据。' +
        (m.type === 'manual' ? '达成时由负责人确认并记录。' : '条件满足时会自动写入判定时间与来源，不需要手工补。') +
      '</div>';
    }
    if (m.type === 'release'){
      var rec = state.releases.filter(function(r){ return r.env === 'production' && r.result === 'success'; })[0];
      if (!rec) return '<div class="ev-empty">达成来源缺失，请核对发布记录。</div>';
      return '' +
        '<div class="ev">' +
          '<div class="ev-row"><span class="k">来源</span><span class="v">生产发布记录 · 不可变事实</span></div>' +
          '<div class="ev-row"><span class="k">时间</span><span class="v">' + rec.time + '</span></div>' +
          '<div class="ev-row"><span class="k">执行人</span><span class="v">' + esc(rec.by) + '</span></div>' +
          '<div class="ev-row"><span class="k">版本 / 环境</span><span class="v">V1.0 · production</span></div>' +
          '<div class="ev-row"><span class="k">制品</span><span class="v mono">sha256:' + rec.sha + '</span></div>' +
          (m.rollback ? '<div class="ev-row"><span class="k">后续</span><span class="v" style="color:var(--warning-fg)">已执行回滚；达成历史保留，不回撤</span></div>' : '') +
        '</div>';
    }
    if (m.type === 'tasks'){
      var p = progressOf(m);
      return '' +
        '<div class="ev">' +
          '<div class="ev-row"><span class="k">来源</span><span class="v">工作项完成状态 · 自动判定</span></div>' +
          '<div class="ev-row"><span class="k">完成</span><span class="v">' + p.done + ' / ' + p.total + ' 项</span></div>' +
          '<div class="ev-row"><span class="k">判定时间</span><span class="v">' + m.achievedAt + '</span></div>' +
        '</div>';
    }
    return '' +
      '<div class="ev">' +
        '<div class="ev-row"><span class="k">来源</span><span class="v">负责人确认</span></div>' +
        '<div class="ev-row"><span class="k">确认人</span><span class="v">' + esc(m.achievedBy) + '</span></div>' +
        '<div class="ev-row"><span class="k">确认时间</span><span class="v">' + m.achievedAt + '</span></div>' +
        (m.achievedNote ? '<div class="ev-row"><span class="k">备注</span><span class="v">' + esc(m.achievedNote) + '</span></div>' : '') +
      '</div>';
  }

  function detailDrawer(m){
    var st = statusOf(m);
    var p = progressOf(m);
    var hint = dateHint(m);
    var logHtml = m.log.slice().reverse().map(function(l){
      return '<div class="log-item"><div class="log-t">' + l.t.slice(5) + '</div><div class="log-x">' + esc(l.text) + '</div></div>';
    }).join('');

    var taskBlock = '';
    if (p){
      taskBlock = '' +
        '<div class="cond-prog">' +
          '<span class="track"><i style="width:' + (p.total ? Math.round(p.done / p.total * 100) : 0) + '%"></i></span>' +
          '<b>' + p.done + '/' + p.total + '</b>' +
        '</div>' +
        '<div class="task-list">' + p.tasks.map(function(t){
          return '<div class="task-li' + (t.done ? '' : ' miss') + '">' +
            (t.done ? '<span class="ok">' + ICON.check + '</span>' : '<span class="no"></span>') +
            '<span>' + esc(t.name) + '</span>' +
            '<span class="d">' + esc(t.owner) + ' · ' + mmdd(t.end) + '</span>' +
          '</div>';
        }).join('') + '</div>';
    }

    var actions = '';
    if (st === 'achieved'){
      if (m.type === 'release'){
        actions = '<button class="btn primary" data-act="goto-release">查看发布记录</button>';
      } else if (m.type === 'tasks'){
        actions = '<button class="btn primary" data-act="goto-gantt">查看工作项</button>';
      } else {
        actions = '<button class="btn ghost danger-text" data-act="revoke" data-id="' + m.id + '">撤销达成</button>';
      }
    } else if (st === 'cancelled'){
      actions = '<span class="hint">已取消，保留历史记录</span><div class="spacer"></div>' +
        '<button class="btn ghost" data-act="close-drawer">关闭</button>';
    } else {
      var primary = m.type === 'release'
        ? '<button class="btn primary" data-act="release-open">去确认发布</button>'
        : m.type === 'tasks'
          ? '<button class="btn primary" data-act="goto-gantt">去完成剩余工作项</button>'
          : '<button class="btn primary" data-act="achieve" data-id="' + m.id + '">标记达成</button>';
      actions = primary +
        '<button class="btn ghost" data-act="reschedule-open" data-id="' + m.id + '">改期</button>' +
        '<button class="btn ghost danger-text" data-act="cancel-open" data-id="' + m.id + '">取消</button>';
    }
    var detail = conditionDetail(m);

    return '' +
      '<aside class="drawer" role="dialog" aria-label="里程碑详情">' +
        '<div class="dw-head">' +
          '<div class="tags">' +
            '<span class="type-tag">' + typeLabel(m.type) + '</span>' +
            '<span class="state ' + st + '">' + statusLabel(m) + '</span>' +
            (m.key ? '<span class="key-tag">★ 关键</span>' : '') +
          '</div>' +
          '<h2>' + esc(m.name) + '</h2>' +
          '<div class="meta">' +
            '<span>目标 ' + mmdd(m.target) + '</span>' +
            '<span>负责人 ' + esc(m.owner) + '</span>' +
            '<span>' + hint.text + '</span>' +
          '</div>' +
          '<button class="dw-x" data-act="close-drawer" aria-label="关闭">×</button>' +
        '</div>' +
        '<div class="dw-body">' +
          '<div class="cond-card">' +
            '<div class="cond-k">' + ICON.flag + '达成条件</div>' +
            '<div class="cond-v">' + esc(detail.v) + '</div>' +
            '<div class="cond-s">' + esc(detail.s) + '</div>' +
            taskBlock +
          '</div>' +

          linkedObjectHTML(m) +

          '<div class="dw-sec">' +
            '<h4>证据 <span class="cnt">' + (st === 'achieved' ? '已写入' : '尚无') + '</span></h4>' +
            evidenceHTML(m) +
          '</div>' +

          '<div class="dw-sec">' +
            '<h4>动态 <span class="cnt">' + m.log.length + ' 条</span></h4>' +
            '<div class="log">' + logHtml + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="dw-foot">' +
          (m.type === 'manual' ? '<span class="hint">人工节点</span>' :
            '<span class="hint">条件自动判定<br>不接受手动标记</span>') +
          '<div class="spacer"></div>' +
          actions +
        '</div>' +
      '</aside>';
  }

  /* ================= 弹层 ================= */
  function releaseModal(){
    var m = releaseMs();
    var r = state.rel;
    var name = m ? m.name : 'V1.0 上线';
    return '' +
      '<div class="modal" role="dialog" aria-label="确认生产发布">' +
        '<div class="md-head">' +
          '<div><h3>确认生产发布</h3><p>V1.0 · production · 由当前登录者记录</p></div>' +
          '<button class="md-x" data-act="close-modal" aria-label="关闭">×</button>' +
        '</div>' +
        '<div class="md-body">' +
          '<div class="notice">' + ICON.info +
            '<span>发布成功后，里程碑「' + esc(name) + '」将自动达成。记录保存后不可修改，回滚会追加新记录。</span>' +
          '</div>' +
          '<div class="fld">' +
            '<label>发布结果</label>' +
            '<div class="seg">' +
              '<button class="seg-btn' + (r.result === 'success' ? ' on' : '') + '" data-act="rel-result" data-result="success">成功</button>' +
              '<button class="seg-btn' + (r.result === 'partial' ? ' on' : '') + '" data-act="rel-result" data-result="partial">部分成功</button>' +
              '<button class="seg-btn' + (r.result === 'failed' ? ' on' : '') + '" data-act="rel-result" data-result="failed">失败</button>' +
            '</div>' +
            '<div class="help">' + (r.result === 'success' ? '全部目标成功，里程碑将自动达成。' : r.result === 'partial' ? '部分目标成功：记录事实，但不计达成。' : '发布失败：记录事实，不计达成；修复后可重新发布。') + '</div>' +
          '</div>' +
          '<div class="fld">' +
            '<label>说明</label>' +
            '<textarea class="input" data-relbind="note" placeholder="选填：本次发布范围、变更点或失败原因">' + esc(r.note) + '</textarea>' +
          '</div>' +
          '<div class="ro"><span class="k">环境</span><span class="v">production（生产）</span></div>' +
          '<div class="ro"><span class="k">制品</span><span class="v mono">sha256: 9f2c…a71d</span></div>' +
          '<div class="ro"><span class="k">执行人</span><span class="v">' + esc(state.project.owner) + '（服务器登录者）</span></div>' +
        '</div>' +
        '<div class="md-foot">' +
          '<span style="font-size:11px;color:var(--text-3)">保存后作为不可变发布证据</span>' +
          '<div class="spacer"></div>' +
          '<button class="btn ghost" data-act="close-modal">取消</button>' +
          '<button class="btn primary" data-act="release-submit">确认发布</button>' +
        '</div>' +
      '</div>';
  }

  function rescheduleModal(){
    var a = state.act;
    var m = state.milestones.filter(function(x){ return x.id === a.id; })[0];
    var reasons = ['计划调整', '依赖延迟', '范围变更'];
    return '' +
      '<div class="modal" style="width:440px" role="dialog" aria-label="调整目标日期">' +
        '<div class="md-head">' +
          '<div><h3>调整目标日期</h3><p>' + esc(m.name) + ' · 当前 ' + mmdd(m.target) + '</p></div>' +
          '<button class="md-x" data-act="close-modal" aria-label="关闭">×</button>' +
        '</div>' +
        '<div class="md-body">' +
          '<div class="fld"><label>新的目标日期</label><input class="input" type="date" data-actbind="date" value="' + a.date + '"></div>' +
          '<div class="fld"><label>调整原因</label><div class="chips">' + reasons.map(function(r){
            return '<button class="chip' + (a.reason === r ? ' on' : '') + '" data-act="act-reason" data-reason="' + r + '">' + r + '</button>';
          }).join('') + '</div></div>' +
          '<div class="fld" style="margin-bottom:2px"><label>备注</label><textarea class="input" data-actbind="note" placeholder="选填：一句说明即可">' + esc(a.note) + '</textarea></div>' +
        '</div>' +
        '<div class="md-foot"><span style="font-size:11px;color:var(--text-3)">只改目标日期，不改条件</span><div class="spacer"></div><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="act-save">保存</button></div>' +
      '</div>';
  }

  function cancelModal(){
    var a = state.act;
    var m = state.milestones.filter(function(x){ return x.id === a.id; })[0];
    var reasons = ['范围调整', '合并到其他节点', '项目变更'];
    return '' +
      '<div class="modal" style="width:440px" role="dialog" aria-label="取消里程碑">' +
        '<div class="md-head">' +
          '<div><h3>取消里程碑</h3><p>' + esc(m.name) + '</p></div>' +
          '<button class="md-x" data-act="close-modal" aria-label="关闭">×</button>' +
        '</div>' +
        '<div class="md-body">' +
          '<div class="notice warn">' + ICON.alert + '<span>取消后不再计入达成统计，但保留历史记录；不影响工作项、版本与发布记录。</span></div>' +
          '<div class="fld"><label>取消原因</label><div class="chips">' + reasons.map(function(r){
            return '<button class="chip danger' + (a.reason === r ? ' on' : '') + '" data-act="act-reason" data-reason="' + r + '">' + r + '</button>';
          }).join('') + '</div></div>' +
          '<div class="fld" style="margin-bottom:2px"><label>备注</label><textarea class="input" data-actbind="note" placeholder="选填">' + esc(a.note) + '</textarea></div>' +
        '</div>' +
        '<div class="md-foot"><div class="spacer"></div><button class="btn ghost" data-act="close-modal">返回</button><button class="btn danger" data-act="act-save">确认取消</button></div>' +
      '</div>';
  }

  function modalHTML(){
    if (!state.modal) return '';
    var inner = '';
    if (state.modal.kind === 'release') inner = releaseModal();
    else if (state.modal.kind === 'reschedule') inner = rescheduleModal();
    else if (state.modal.kind === 'cancel') inner = cancelModal();
    return '<div class="scrim" data-act="close-modal"></div>' + inner;
  }

  function renderOverlay(){
    var root = $('#overlayRoot');
    var html = '';
    if (state.openDrawer){
      html += '<div class="scrim" data-act="close-drawer"></div>';
      if (state.openDrawer === 'create') html += createDrawer();
      else {
        var m = state.milestones.filter(function(x){ return x.id === state.openDrawer; })[0];
        if (m) html += detailDrawer(m);
      }
    }
    html += modalHTML();
    root.innerHTML = html;
  }

  /* ================= 演示浮层 ================= */
  function renderDemo(){
    var pop = $('#demoPop');
    pop.hidden = !state.demo;
    if (!state.demo) return;
    var dev = state.milestones.filter(function(m){ return m.name === '开发完成'; })[0];
    var t6 = taskById('t6');
    pop.innerHTML = '' +
      '<div class="dp-head"><b>演示操作</b><span>数据虚构，可随时重置</span></div>' +
      '<button class="dp-item" data-act="demo" data-key="' + (t6 && t6.done ? 'reopen' : 'complete') + '">' +
        '<span class="dot ' + (t6 && t6.done ? 'w' : 'g') + '"></span>' +
        '<span class="txt"><b>' + (t6 && t6.done ? '重开「压测执行」' : '完成「压测执行」') + '</b>' +
        '<em>' + (t6 && t6.done ? '开发完成 回到 4/5，自动撤销' : '开发完成 5/5，自动达成') + '</em></span>' +
      '</button>' +
      '<button class="dp-item" data-act="demo" data-key="release"><span class="dot g"></span><span class="txt"><b>生产发布成功</b><em>V1.0 上线 自动达成</em></span></button>' +
      '<button class="dp-item" data-act="demo" data-key="partial"><span class="dot w"></span><span class="txt"><b>记录部分成功</b><em>写入记录，但不计达成</em></span></button>' +
      '<button class="dp-item" data-act="demo" data-key="rollback"><span class="dot w"></span><span class="txt"><b>回滚到上一版本</b><em>达成保留，标记「后回滚」</em></span></button>' +
      '<button class="dp-item" data-act="demo" data-key="accept"><span class="dot b"></span><span class="txt"><b>确认「客户验收」</b><em>人工确认达成</em></span></button>' +
      '<div class="dp-sep"></div>' +
      '<button class="dp-item" data-act="demo" data-key="reset"><span class="dot"></span><span class="txt"><b>重置演示数据</b><em>回到初始状态</em></span></button>';
  }

  /* ================= 渲染 ================= */
  function render(){
    document.documentElement.dataset.theme = state.theme;
    $('#themeIcon').innerHTML = state.theme === 'dark'
      ? '<circle cx="10" cy="10" r="3.4"/><path d="M10 2.6v1.6M10 15.8v1.6M2.6 10h1.6M15.8 10h1.6M4.8 4.8l1.1 1.1M14.1 14.1l1.1 1.1M15.2 4.8l-1.1 1.1M5.9 14.1l-1.1 1.1"/>'
      : '<path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z"/>';
    renderView();
    renderOverlay();
    renderDemo();
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;

    if (act === 'view'){
      state.view = el.dataset.view;
      state.demo = false;
      state.openDrawer = null;
      window.scrollTo(0, 0);
      render();
      return;
    }
    if (act === 'theme'){
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      render();
      return;
    }
    if (act === 'demo-toggle'){
      state.demo = !state.demo;
      renderDemo();
      return;
    }
    if (act === 'stub'){
      toast('原型只演示项目内的里程碑，其他入口未实现');
      return;
    }
    if (act === 'create-open'){
      openCreate();
      render();
      return;
    }
    if (act === 'close-drawer'){
      state.openDrawer = null;
      renderOverlay();
      return;
    }
    if (act === 'ms-open'){
      state.openDrawer = el.dataset.id;
      state.demo = false;
      renderOverlay();
      renderDemo();
      return;
    }
    if (act === 'type'){
      var t = el.dataset.type;
      state.draft.type = t;
      state.draft.name = t === 'release' ? 'V1.0 上线' : t === 'tasks' ? '开发完成' : '阶段验收';
      if (t === 'release') state.draft.target = state.version.end;
      if (t === 'tasks'){
        state.draft.taskIds = defaultTasks();
        state.draft.target = maxEnd(state.draft.taskIds);
      }
      if (t === 'manual') state.draft.target = addDays(TODAY, 14);
      renderOverlay();
      return;
    }
    if (act === 'pick-task'){
      var id = el.dataset.id;
      var arr = state.draft.taskIds;
      var i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      state.draft.target = arr.length ? maxEnd(arr) : state.draft.target;
      renderOverlay();
      return;
    }
    if (act === 'toggle-more'){
      state.draft.more = !state.draft.more;
      renderOverlay();
      return;
    }
    if (act === 'save-ms'){
      saveMilestone();
      return;
    }
    if (act === 'achieve'){
      var mm = state.milestones.filter(function(x){ return x.id === el.dataset.id; })[0];
      if (mm){
        mm.achievedAt = TODAY;
        mm.achievedBy = state.project.owner;
        mm.achievedNote = '';
        mm.auto = false;
        mm.log.push({ t: stamp(), text: state.project.owner + ' 确认达成（人工）' });
        pushActivity(mm.name + ' 确认达成', state.project.owner, 'ms');
        toast('已记录达成 · 证据为负责人确认');
        render();
      }
      return;
    }
    if (act === 'revoke'){
      var rv = state.milestones.filter(function(x){ return x.id === el.dataset.id; })[0];
      if (rv){
        rv.achievedAt = null;
        rv.achievedBy = null;
        rv.achievedNote = '';
        rv.auto = false;
        rv.log.push({ t: stamp(), text:'撤销达成，回到未达成' });
        toast('已撤销达成，里程碑回到未达成', 'warn');
        render();
      }
      return;
    }
    if (act === 'goto-release'){
      state.openDrawer = null;
      state.view = 'release';
      window.scrollTo(0, 0);
      render();
      return;
    }
    if (act === 'goto-gantt'){
      state.openDrawer = null;
      state.view = 'gantt';
      window.scrollTo(0, 0);
      render();
      return;
    }
    if (act === 'release-open'){
      state.openDrawer = null;
      state.rel = { result:'success', note:'' };
      state.modal = { kind:'release' };
      render();
      return;
    }
    if (act === 'close-modal'){
      state.modal = null;
      renderOverlay();
      return;
    }
    if (act === 'rel-result'){
      state.rel.result = el.dataset.result;
      renderOverlay();
      return;
    }
    if (act === 'release-submit'){
      var note = ($('[data-relbind="note"]') || {}).value || state.rel.note;
      var res = state.rel.result;
      addRelease(res, note);
      state.modal = null;
      if (res === 'success'){
        toast('发布成功 · 「' + (releaseMs() ? releaseMs().name : 'V1.0 上线') + '」已自动达成');
      } else if (res === 'partial'){
        toast('已记录部分成功 · 里程碑不达成', 'warn');
      } else {
        toast('已记录发布失败 · 修复后可重新发布', 'err');
      }
      render();
      return;
    }
    if (act === 'reschedule-open'){
      var rid = el.dataset.id;
      var rm = state.milestones.filter(function(x){ return x.id === rid; })[0];
      state.act = { id: rid, date: addDays(rm.target, 7), reason: '计划调整', note: '' };
      state.modal = { kind:'reschedule' };
      renderOverlay();
      return;
    }
    if (act === 'cancel-open'){
      state.act = { id: el.dataset.id, reason: '范围调整', note: '' };
      state.modal = { kind:'cancel' };
      renderOverlay();
      return;
    }
    if (act === 'act-reason'){
      state.act.reason = el.dataset.reason;
      renderOverlay();
      return;
    }
    if (act === 'act-save'){
      var a = state.act;
      var target = state.milestones.filter(function(x){ return x.id === a.id; })[0];
      if (!target) return;
      var dateEl = $('[data-actbind="date"]');
      var noteEl = $('[data-actbind="note"]');
      if (dateEl) a.date = dateEl.value;
      if (noteEl) a.note = noteEl.value;
      if (state.modal.kind === 'reschedule'){
        if (!a.date){ toast('请选择新的目标日期', 'warn'); return; }
        var old = target.target;
        target.target = a.date;
        target.log.push({ t: stamp(), text:'目标日期 ' + mmdd(old) + ' 调整为 ' + mmdd(a.date) + ' · ' + a.reason + (a.note ? ' · ' + a.note : '') });
        toast('目标日期已调整 · 条件不变');
      } else {
        target.cancelled = true;
        target.log.push({ t: stamp(), text:'取消里程碑 · ' + a.reason + (a.note ? ' · ' + a.note : '') });
        pushActivity(target.name + ' 已取消', state.project.owner, 'ms');
        state.openDrawer = null;
        toast('里程碑已取消', 'warn');
      }
      state.modal = null;
      render();
      return;
    }
    if (act === 'demo'){
      var key = el.dataset.key;
      state.demo = false;
      if (key === 'complete'){
        var tt = taskById('t6');
        if (tt) tt.done = true;
        sync();
        var dm = state.milestones.filter(function(m){ return m.name === '开发完成'; })[0];
        var p = dm ? progressOf(dm) : null;
        toast(p && p.done === p.total ? '压测执行 已完成 · 开发完成 5/5 自动达成' : '压测执行 已完成');
        pushActivity('压测执行 完成', '李明', 'task');
      } else if (key === 'reopen'){
        var tr = taskById('t6');
        if (tr) tr.done = false;
        sync();
        toast('压测执行 已重开 · 开发完成回到 4/5', 'warn');
      } else if (key === 'release'){
        addRelease('success', '');
        toast('发布成功 · V1.0 上线 已自动达成');
      } else if (key === 'partial'){
        addRelease('partial', '部分节点未通过健康检查');
        toast('已记录部分成功 · 里程碑不达成', 'warn');
      } else if (key === 'rollback'){
        if (!state.releases.some(function(r){ return r.env === 'production' && r.result === 'success'; })){
          toast('尚无成功发布，无法回滚', 'warn');
        } else {
          addRelease('rollback', '线上指标异常，回滚至上一版本');
          toast('已回滚 · 达成记录保留，标记为「后回滚」', 'warn');
        }
      } else if (key === 'accept'){
        var acc = state.milestones.filter(function(m){ return m.name === '客户验收'; })[0];
        if (acc && !acc.achievedAt){
          acc.achievedAt = TODAY;
          acc.achievedBy = state.project.owner;
          acc.auto = false;
          acc.log.push({ t: stamp(), text: state.project.owner + ' 确认达成（人工）' });
          pushActivity('客户验收 确认达成', state.project.owner, 'ms');
          toast('已记录达成 · 证据为负责人确认');
        }
      } else if (key === 'reset'){
        var view = state.view, theme = state.theme;
        state = blankState();
        state.view = view;
        state.theme = theme;
        toast('演示数据已重置');
      }
      render();
      return;
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.bind && state.draft){
      state.draft[t.dataset.bind] = t.type === 'checkbox' ? t.checked : t.value;
    }
    if (t.dataset && t.dataset.actbind && state.act){
      state.act[t.dataset.actbind] = t.value;
    }
    if (t.dataset && t.dataset.relbind && state.rel){
      state.rel[t.dataset.relbind] = t.value;
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (state.demo){ state.demo = false; renderDemo(); return; }
    if (state.modal){ state.modal = null; renderOverlay(); return; }
    if (state.openDrawer){ state.openDrawer = null; renderOverlay(); }
  });

  document.addEventListener('click', function(e){
    if (!state.demo) return;
    if (e.target.closest('#demoPop') || e.target.closest('[data-act="demo-toggle"]')) return;
    state.demo = false;
    renderDemo();
  });

  function saveMilestone(){
    var d = state.draft;
    var nameEl = $('[data-bind="name"]');
    var targetEl = $('[data-bind="target"]');
    var noteEl = $('[data-bind="note"]');
    if (nameEl) d.name = nameEl.value.trim();
    if (targetEl) d.target = targetEl.value;
    if (noteEl) d.note = noteEl.value;
    if (!d.name){ toast('请填写里程碑名称', 'warn'); if (nameEl) nameEl.focus(); return; }
    if (!d.target){ toast('请选择目标日期', 'warn'); if (targetEl) targetEl.focus(); return; }
    if (d.type === 'tasks' && !d.taskIds.length){ toast('请至少关联 1 个工作项', 'warn'); return; }

    var m = {
      id: 'm' + Date.now(),
      name: d.name,
      type: d.type,
      target: d.target,
      owner: state.project.owner,
      key: !!d.key,
      achievedAt: null,
      achievedBy: null,
      achievedNote: '',
      cancelled: false,
      rollback: false,
      taskIds: d.type === 'tasks' ? d.taskIds.slice() : [],
      versionId: d.type === 'release' ? 'v1' : null,
      auto: false,
      log: [{ t: nowText(), text: '创建里程碑 · ' + typeLabel(d.type) + (d.type === 'tasks' ? ' · 关联 ' + d.taskIds.length + ' 项工作项' : '') }]
    };
    state.milestones.push(m);
    pushActivity('新建里程碑「' + m.name + '」', state.project.owner, 'ms');
    state.openDrawer = null;
    sync();
    if (m.achievedAt){
      toast('里程碑已创建 · 条件已满足，自动达成');
    } else {
      toast('里程碑已创建 · 无需手动维护状态');
    }
    render();
  }

  /* ================= URL 参数 ================= */
  function applyParams(){
    var q = new URLSearchParams(location.search);
    if (q.get('theme') === 'dark') state.theme = 'dark';
    var v = q.get('view');
    if (v === 'gantt' || v === 'release' || v === 'overview') state.view = v;
    var dr = q.get('drawer');
    if (dr === 'create'){
      openCreate();
    } else if (dr){
      var m = state.milestones.filter(function(x){ return x.id === dr; })[0];
      if (m) state.openDrawer = dr;
    }
    if (q.get('modal') === 'release'){
      state.openDrawer = null;
      state.modal = { kind:'release' };
    }
  }

  /* ================= 启动 ================= */
  sync();
  applyParams();
  render();
  window.HG = {
    state: function(){ return state; },
    setView: function(v){ state.view = v; render(); },
    open: function(id){ state.openDrawer = id; renderOverlay(); },
    demo: function(k){
      state.demo = false;
      var ev = { keyboard: true };
      if (k === 'complete' || k === 'reopen' || k === 'reset') { /* handled by UI clicks in demo */ }
    }
  };
})();
</script>
</body>
</html>
