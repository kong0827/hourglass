<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求池 · 派生「已交付」交互原型</title>
<style>
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7; --surface-hover:#F2F4F7; --surface-active:#E9ECF1;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text:#101828; --text-2:#475467; --text-3:#667085;
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EFF4FF; --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-border:#A6F4C5; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-border:#FEDF89; --warning-fg:#B54708;
  --danger:#F04438; --danger-soft:#FEF3F2; --danger-border:#FDA29B; --danger-fg:#B42318;
  --info:#2E90FA; --info-soft:#EFF8FF; --info-border:#B2DDFF; --info-fg:#175CD3;
  --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-border:#D9D6FE;
  --p0:#F04438; --p0-soft:#FEF3F2; --p0-fg:#B42318;
  --p1:#F79009; --p1-soft:#FFFAEB; --p1-fg:#B54708;
  --p2:#2E90FA; --p2-soft:#EFF8FF; --p2-fg:#175CD3;
  --p3:#667085; --p3-soft:#F2F4F7; --p3-fg:#475467;
  --r-sm:8px; --r-md:10px; --r-lg:12px; --r-pill:999px;
  --shadow-sm:0 2px 4px -2px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --sidebar-w:220px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg-app:#0D1219; --surface:#151B24; --surface-sunken:#1A222D; --surface-hover:#1F2937; --surface-active:#26313F;
  --border:#25303D; --border-strong:#334153;
  --text:#E7ECF3; --text-2:#A9B4C2; --text-3:#7B8798;
  --primary:#4C8DFF; --primary-hover:#6BA1FF; --primary-soft:#16243C; --primary-border:#2B4772; --primary-fg:#8FB4FF;
  --success:#32D583; --success-soft:#0E2A1D; --success-border:#1F5C3E; --success-fg:#75E0A7;
  --warning:#FDB022; --warning-soft:#2A2110; --warning-border:#5C4A1E; --warning-fg:#FEC84B;
  --danger:#F97066; --danger-soft:#2B1615; --danger-border:#5C2A26; --danger-fg:#FDA29B;
  --info:#53B1FD; --info-soft:#10202F; --info-border:#1F4468; --info-fg:#84CAFF;
  --plum:#9B8AFB; --plum-soft:#1D1933; --plum-border:#3B3266;
  --p0:#F97066; --p0-soft:#2B1615; --p0-fg:#FDA29B;
  --p1:#FDB022; --p1-soft:#2A2110; --p1-fg:#FEC84B;
  --p2:#53B1FD; --p2-soft:#10202F; --p2-fg:#84CAFF;
  --p3:#7B8798; --p3-soft:#1A222D; --p3-fg:#A9B4C2;
  --shadow-sm:0 2px 4px -2px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 10px -2px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.35);
  --shadow-lg:0 12px 24px -6px rgba(0,0,0,.55),0 4px 8px -4px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;overflow:hidden;background:var(--bg-app);color:var(--text);
  font-family:var(--font-sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
h1,h2,h3,p{margin:0;}
[hidden]{display:none !important;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.app{display:flex;height:100%;}

/* ---------- 侧栏 / 顶栏 ---------- */
.sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.side-brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;flex:0 0 auto;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);display:grid;place-items:center;font-weight:700;font-size:13px;}
.brand-name{font-size:14.5px;font-weight:650;}
.side-nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;}
.nav-label{font-size:11.5px;color:var(--text-3);padding:10px 8px 6px;font-weight:600;letter-spacing:.02em;}
.nav-item{position:relative;display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:13px;text-align:left;}
.nav-item:hover{background:var(--surface-hover);color:var(--text);}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:650;}
.nav-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--primary);}
.nav-ico{width:18px;height:18px;display:grid;place-items:center;color:currentColor;flex:0 0 auto;}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-3);}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);display:grid;place-items:center;font-size:11px;font-weight:700;}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0;}
.topbar{height:60px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;}
.crumb{font-size:12px;color:var(--text-3);}
.crumb b{color:var(--text-2);font-weight:600;}
.topbar-spacer{flex:1 1 auto;}
.search{position:relative;width:260px;}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);}
.search input{width:100%;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 28px 0 30px;font:inherit;font-size:12.5px;color:var(--text);}
.search input::placeholder{color:var(--text-3);}
.search input:focus{outline:none;border-color:var(--primary-border);box-shadow:0 0 0 3px var(--primary-soft);}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);}
.search .clear:hover{background:var(--surface-hover);color:var(--text);}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2);}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text);}

.page{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 24px 24px;}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;}
.page-title{font-size:21px;font-weight:680;letter-spacing:-.01em;}
.page-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);}
.page-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--text-2);white-space:nowrap;transition:all .12s ease;}
.btn:hover{border-color:var(--border-strong);color:var(--text);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--surface-hover);}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:7px;}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);}

.calc-note{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:10px;margin-bottom:12px;font-size:12.5px;color:var(--text-2);line-height:1.55;}
.calc-note b{color:var(--text);font-weight:650;}
.calc-note .pin{flex:0 0 auto;color:var(--info);margin-top:1px;}
.calc-note .tag{flex:0 0 auto;height:19px;padding:0 7px;border-radius:5px;display:inline-flex;align-items:center;background:var(--surface-sunken);color:var(--text-2);border:1px solid var(--border);font-size:11px;font-weight:650;}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.project-select{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-2);font:inherit;font-size:12.5px;padding:0 26px 0 10px;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 20 20' fill='none' stroke='%23667085' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 8l4 4 4-4'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 7px center;}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:550;transition:all .12s ease;white-space:nowrap;}
.chip:hover{border-color:var(--border-strong);color:var(--text);}
.chip.on{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);}
.chip.alert{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning-fg);font-weight:600;}
.chip.alert b{margin-left:3px;}
.chip .n{min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;}
.ctl-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);}
.mini-select{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2);font:inherit;font-size:12.5px;padding:0 24px 0 9px;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 20 20' fill='none' stroke='%23667085' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 8l4 4 4-4'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;}
.mini-select:hover{border-color:var(--border-strong);}
.controls-spacer{flex:1 1 auto;}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--surface-sunken);border-radius:8px;flex:0 0 auto;}
.seg button{height:28px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:550;color:var(--text-2);white-space:nowrap;transition:background .12s ease,color .12s ease;}
.seg button:hover{color:var(--text);}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 2px rgba(16,24,40,.08);}

/* ---------- 看板 ---------- */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;min-height:0;}
.col{flex:1 1 250px;min-width:250px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 330px);min-height:280px;overflow:hidden;}
.col-head{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);}
.pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.col-title{font-size:13px;font-weight:650;}
.col-count{margin-left:auto;height:20px;min-width:22px;padding:0 6px;border-radius:10px;background:var(--surface-sunken);border:1px solid var(--border);color:var(--text-2);font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1 1 auto;}
.col-body.drop{background:var(--primary-soft);outline:1px dashed var(--primary-border);outline-offset:-4px;}
.col-empty{padding:10px 4px;font-size:12px;color:var(--text-3);text-align:center;}

.seg-head{display:flex;align-items:center;gap:7px;padding:5px 4px 3px;font-size:12px;color:var(--text-3);user-select:none;}
.seg-head .cnt{font-weight:650;color:var(--text-2);}
.seg-head .auto{font-size:10.5px;color:var(--text-3);border:1px solid var(--border);background:var(--surface);border-radius:5px;padding:1px 5px;font-weight:600;}
.seg-head .caret{width:16px;height:16px;display:grid;place-items:center;color:var(--text-3);transition:transform .15s ease;}
.seg-head.open .caret{transform:rotate(90deg);}
.seg-head button{display:flex;align-items:center;gap:7px;height:26px;padding:0 4px;border-radius:6px;color:inherit;text-align:left;}
.seg-head button:hover{background:var(--surface-hover);color:var(--text-2);}
.delivered-sec{margin-top:10px;border-top:1px dashed var(--border-strong);padding-top:8px;display:flex;flex-direction:column;gap:8px;}
.done-sec{margin-top:10px;border-top:1px dashed var(--warning-border);padding-top:8px;display:flex;flex-direction:column;gap:8px;}
.done-sec .seg-head .cnt{color:var(--warning-fg);}
.done-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--warning-border);background:var(--warning-soft);border-radius:8px;}
.done-row .dr-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;}
.done-row .dr-title{border:0;background:none;padding:0;text-align:left;font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.done-row .dr-title:hover{color:var(--primary-fg);}
.done-row .dr-meta{font-size:11.5px;color:var(--warning-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.delivered-sec .seg-head{padding-left:0;}
.delivered-sec .col-empty{padding:4px 2px 6px;text-align:left;}

.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px 9px;box-shadow:var(--shadow-sm);cursor:grab;transition:border-color .12s ease,box-shadow .12s ease;}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);}
.card:active{cursor:grabbing;}
.card.locked{cursor:default;}
.card.locked:hover{box-shadow:var(--shadow-sm);border-color:var(--border);}
.card-top{display:flex;align-items:flex-start;gap:6px;}
.pri{flex:0 0 auto;height:18px;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:750;display:inline-flex;align-items:center;margin-top:1px;}
.pri.P0{background:var(--p0-soft);color:var(--p0-fg);}
.pri.P1{background:var(--p1-soft);color:var(--p1-fg);}
.pri.P2{background:var(--p2-soft);color:var(--p2-fg);}
.pri.P3{background:var(--p3-soft);color:var(--p3-fg);}
.card-title{font-size:13px;font-weight:600;line-height:1.45;min-width:0;word-break:break-word;}
.card-title button{text-align:left;border-radius:4px;}
.card-title button:hover{color:var(--primary-fg);}
.card-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px;}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:550;border:1px solid transparent;white-space:nowrap;}
.tag.ghost{background:var(--surface-sunken);color:var(--text-2);border-color:var(--border);}
.tag.info{background:var(--info-soft);color:var(--info-fg);border-color:var(--info-border);}
.tag.plum{background:var(--plum-soft);color:var(--plum);border-color:var(--plum-border);}
.tag.success{background:var(--success-soft);color:var(--success-fg);border-color:var(--success-border);}
.tag.danger{background:var(--danger-soft);color:var(--danger-fg);border-color:var(--danger-border);}
.tag.warn{background:var(--warning-soft);color:var(--warning-fg);border-color:var(--warning-border);}
.tag.delivered{background:var(--success-soft);color:var(--success-fg);border-color:var(--success-border);font-weight:650;}
.tag.ever{background:var(--surface-sunken);color:var(--text-3);border-color:var(--border);}
.card-meta{margin-top:6px;font-size:11.5px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:4px 10px;}
.card-meta .plan{color:var(--text-3);}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.card-src{font-size:11.5px;color:var(--text-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-acts{margin-left:auto;display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.card-acts .btn{height:25px;padding:0 8px;font-size:11.5px;}
.card-state{margin-top:6px;font-size:11.5px;color:var(--warning-fg);display:flex;align-items:center;gap:5px;}
.card-note{margin-top:6px;font-size:11.5px;color:var(--text-3);background:var(--surface-sunken);border-radius:6px;padding:4px 6px;}

/* ---------- 列表 ---------- */
.list-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin-bottom:10px;overflow-x:auto;}
.list-tab{position:relative;height:36px;padding:0 10px;font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:6px 6px 0 0;}
.list-tab:hover{background:var(--surface-hover);color:var(--text);}
.list-tab.on{color:var(--primary-fg);font-weight:650;}
.list-tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px;}
.list-tab .n{height:17px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--surface-sunken);border:1px solid var(--border);font-size:10.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);}
.list-tab.on .n{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.tbl-wrap{overflow:auto;}
table.tbl{width:100%;border-collapse:collapse;min-width:1040px;}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface-sunken);border-bottom:1px solid var(--border);text-align:left;font-size:11.5px;font-weight:650;color:var(--text-3);padding:9px 12px;white-space:nowrap;}
.tbl td{border-bottom:1px solid var(--border);padding:10px 12px;vertical-align:middle;font-size:12.5px;color:var(--text-2);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:var(--surface-hover);}
.tbl .num{text-align:right;}
.cell-title{font-size:12.5px;font-weight:600;color:var(--text);}
.cell-title button{text-align:left;border-radius:4px;}
.cell-title button:hover{color:var(--primary-fg);}
.cell-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.cell-status{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.cell-version .cell-sub{color:var(--text-3);}
.cell-version .warn{color:var(--warning-fg);}
.row-acts{display:flex;align-items:center;gap:4px;justify-content:flex-end;}
.group-row td{background:var(--surface-sunken);padding:7px 12px;}
.group-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);font-weight:600;}
.group-toggle .caret{color:var(--text-3);transition:transform .15s ease;display:inline-grid;place-items:center;}
.group-toggle.open .caret{transform:rotate(90deg);}
.group-toggle .n{font-weight:500;color:var(--text-3);font-size:11.5px;}

/* ---------- 甘特 ---------- */
.gantt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text-3);}
.legend{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.gantt{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;}
.gantt-inner{min-width:1080px;}
.gantt-months{display:flex;height:32px;border-bottom:1px solid var(--border);background:var(--surface-sunken);position:sticky;top:0;z-index:2;}
.g-mon{font-size:11.5px;color:var(--text-3);font-weight:600;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);}
.g-mon:last-child{border-right:none;}
.g-row{display:flex;border-bottom:1px solid var(--border);}
.g-row:last-child{border-bottom:none;}
.g-label{flex:0 0 300px;padding:9px 12px;border-right:1px solid var(--border);min-width:0;}
.g-title{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-title button:hover{color:var(--primary-fg);}
.g-meta{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap;}
.g-track{position:relative;flex:1 1 auto;min-width:0;height:56px;background-image:repeating-linear-gradient(to right,var(--border) 0 1px,transparent 1px 100%);background-size:calc(100% / 13) 100%;}
.g-bar{position:absolute;top:17px;height:14px;border-radius:4px;font-size:10px;color:#fff;display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap;}
.g-bar.review{background:var(--text-3);}
.g-bar.plan{background:var(--info);}
.g-bar.design{background:var(--plum);}
.g-bar.dev{background:var(--primary);}
.g-bar.test{background:var(--warning);}
.g-bar.complete{background:var(--success);}
.g-bar.release{background:var(--success-fg);}
.g-today{position:absolute;top:0;bottom:0;width:1px;background:var(--danger);opacity:.7;}
.g-note{padding:8px 12px;font-size:11.5px;color:var(--text-3);border-top:1px solid var(--border);background:var(--surface-sunken);}

/* ---------- 弹层 / 抽屉 ---------- */
.popover{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:12px;min-width:250px;}
.pop-title{font-size:12px;font-weight:650;color:var(--text);margin-bottom:8px;}
.pop-sec{padding:9px 0;border-top:1px solid var(--border);}
.pop-sec:first-of-type{border-top:none;padding-top:0;}
.pop-label{font-size:11.5px;color:var(--text-3);font-weight:600;margin-bottom:6px;}
.pop-opts{display:flex;gap:6px;flex-wrap:wrap;}
.pop-opt{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;color:var(--text-2);background:var(--surface);}
.pop-opt:hover{border-color:var(--border-strong);color:var(--text);}
.pop-opt[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);font-weight:600;}
.pop-foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border);margin-top:8px;}
.pop-foot .note{font-size:11.5px;color:var(--text-3);}
.pop-foot .btn{margin-left:auto;}

.scrim{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s ease;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:680px;max-width:96vw;background:var(--surface);border-left:1px solid var(--border);z-index:80;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.drawer.on{transform:none;}
.drawer-head{flex:0 0 auto;padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.drawer-title{font-size:16px;font-weight:680;line-height:1.45;min-width:0;}
.drawer-tags{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap;}
.drawer-close{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3);}
.drawer-close:hover{background:var(--surface-hover);color:var(--text);}
.drawer-body{flex:1 1 auto;overflow:auto;padding:16px 20px 24px;}
.d-sec{margin-bottom:20px;}
.d-sec h3{font-size:12.5px;font-weight:650;color:var(--text);margin-bottom:8px;}
.deliver-box{border:1px solid var(--border);background:var(--surface-sunken);border-radius:10px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;}
.deliver-box.ok{border-color:var(--success-border);background:var(--success-soft);}
.deliver-box.warn{border-color:var(--warning-border);background:var(--warning-soft);}
.deliver-box.pending{border-color:var(--warning-border);background:var(--warning-soft);}
.deliver-box.muted{border-color:var(--border);background:var(--surface-sunken);}
.deliver-ico{flex:0 0 auto;margin-top:1px;}
.deliver-main{font-size:13px;font-weight:650;color:var(--text);}
.deliver-sub{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.55;}
.deliver-box.ok .deliver-ico{color:var(--success-fg);}
.deliver-box.warn .deliver-ico{color:var(--warning-fg);}
.deliver-box.pending .deliver-ico{color:var(--warning-fg);}
.deliver-box.muted .deliver-ico{color:var(--text-3);}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.kv div{min-width:0;}
.kv .k{font-size:11.5px;color:var(--text-3);}
.kv .v{font-size:12.5px;color:var(--text);margin-top:2px;word-break:break-word;}
.stages{display:flex;gap:6px;flex-wrap:wrap;}
.stage-chip{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:11.5px;color:var(--text-2);}
.stage-chip b{color:var(--text);font-weight:650;margin-right:4px;}
.stage-chip.auto{border-color:var(--success-border);background:var(--success-soft);color:var(--success-fg);}
.d-table{width:100%;border-collapse:collapse;}
.d-table th{text-align:left;font-size:11px;color:var(--text-3);font-weight:650;padding:6px 8px;background:var(--surface-sunken);border-bottom:1px solid var(--border);white-space:nowrap;}
.d-table td{padding:7px 8px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);}
.d-table tr:last-child td{border-bottom:none;}
.foot-note{font-size:11.5px;color:var(--text-3);line-height:1.65;}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:95;background:var(--text);color:var(--surface);font-size:12.5px;padding:8px 14px;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;max-width:80vw;text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}

@media (max-width:900px){
  .sidebar{display:none;}
  .page{padding:16px 12px 20px;}
  .topbar{padding:0 12px;gap:10px;}
  .search{width:auto;flex:1 1 140px;min-width:110px;}

}

}

};
var STATUS_ORDER = ["review","pass","plan","rej","canceled"];
var PRI_ORDER = {P0:0,P1:1,P2:2,P3:3};

try{

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function isDelivered(d){ return !!d.delivered; }
function taskNums(d){
  var p = String(d.tasks || "0/0").split("/");
  return {done: parseInt(p[0], 10) || 0, total: parseInt(p[1], 10) || 0};
}
/* 已完成：排期中、工作项全关、用例无未通过，但还没有生产发布记录 */
function isDonePending(d){
  var t = taskNums(d);
  return d.status === "plan" && !isDelivered(d) && !d.releasedNoRecord && t.total > 0 && t.done >= t.total;
}
function deliveredLabel(d){ return d.status === "plan" ? "已交付" : "曾交付"; }
function priHTML(p){ return '<span class="pri ' + esc(p) + '">' + esc(p) + '</span>'; }
function statusHTML(st){
  var cls = st === "plan" ? "success" : st === "pass" ? "info" : st === "rej" ? "danger" : "ghost";
  return '<span class="tag ' + cls + '">' + esc(STATUS[st].label) + '</span>';
}
function deliveryTag(d, compact){
  if(isDelivered(d)){
    var cls = d.status === "plan" ? "delivered" : "ever";
    var label = deliveredLabel(d) + (compact ? "" : " " + (d.deliveredAt || "").slice(5));
    return '<span class="tag ' + cls + '" title="由生产发布记录自动判定">' + esc(label) + '</span>';
  }
  if(isDonePending(d)) return '<span class="tag warn" title="关联工作项全部关闭、用例通过，尚无生产发布记录">已完成 · 待发布</span>';
  return "";
}
function sourceOf(d){ return d.source || ""; }

function matchesBase(d){
  if(state.project !== "all" && d.project !== state.project) return false;
  if(state.priorities.length && state.priorities.indexOf(d.priority) === -1) return false;
  if(state.delivery === "delivered" && !isDelivered(d)) return false;
  if(state.delivery === "pending" && isDelivered(d)) return false;
  if(state.delivery === "done" && !isDonePending(d)) return false;
  if(state.query){
    var q = state.query.toLowerCase();
    var hay = [d.title,d.project,d.source,d.category,d.version||""].join(" ").toLowerCase();
    if(hay.indexOf(q) === -1) return false;
  }
  return true;
}
function baseRows(){ return DEMANDS.filter(matchesBase); }
function tabRows(){ var rows = baseRows(); return state.tab === "all" ? rows : rows.filter(function(d){ return d.status === state.tab; }); }
function countOf(st){
  return DEMANDS.filter(function(d){
    if(state.project !== "all" && d.project !== state.project) return false;
    if(state.priorities.length && state.priorities.indexOf(d.priority) === -1) return false;
    if(state.delivery === "delivered" && !isDelivered(d)) return false;
    if(state.delivery === "pending" && isDelivered(d)) return false;
    if(state.delivery === "done" && !isDonePending(d)) return false;
    if(state.query){
      var q = state.query.toLowerCase();
      if([d.title,d.project,d.source,d.category,d.version||""].join(" ").toLowerCase().indexOf(q) === -1) return false;
    }
    return st === "all" || d.status === st;
  }).length;
}
function priRank(p){ return PRI_ORDER[p] === undefined ? 9 : PRI_ORDER[p]; }
function sortedRows(rows){
  var out = rows.slice();
  if(state.sort === "priority") out.sort(function(a,b){ return priRank(a.priority) - priRank(b.priority); });
  else if(state.sort === "expect") out.sort(function(a,b){ return String(a.expect||"9999").localeCompare(String(b.expect||"9999")); });
  else out.sort(function(a,b){
    var sa = STATUS_ORDER.indexOf(a.status), sb = STATUS_ORDER.indexOf(b.status);
    if(sa !== sb) return sa - sb;
    return priRank(a.priority) - priRank(b.priority);
  });
  return out;
}

      '<div class="col-head"><span class="pdot" style="background:' + STATUS[st].color + '"></span><span class="col-title">' + STATUS[st].label + '</span><span class="col-count">' + list.length + '</span></div>' +

var LIST_COLS = ["title","kind","priority","status","project","version","expect","wsjf"];

}
function cell(d, key){
  if(key === "title") return '<div class="cell-title"><button data-detail="' + d.id + '">' + esc(d.title) + '</button></div><div class="cell-sub">' + esc(d.source) + '</div>';
  if(key === "kind") return '<span class="tag ghost">' + esc(d.kind) + '</span>';
  if(key === "priority") return priHTML(d.priority);
  if(key === "status") return '<div class="cell-status">' + statusHTML(d.status) + deliveryTag(d, false) + '</div>';
  if(key === "project") return esc(d.project);
  if(key === "version") return (d.version ? esc(d.version) : '<span style="color:var(--text-3)">—</span>') + (d.releasedNoRecord ? '<div class="cell-sub warn">版本已发布 · 无发布记录</div>' : "");
  if(key === "expect") return esc(d.expect || '—');
  if(key === "wsjf") return d.wsjf == null ? '—' : d.wsjf.toFixed(1);
  return '';
}
function groupKey(d){
  if(isDonePending(d)) return "donePending";
  if(isDelivered(d)) return "delivered";
  if(d.status === "plan") return "active";
  return "other";
}
var GROUP_LABEL = {donePending:"已完成 · 待发布", delivered:"已交付", active:"推进中（已排期未交付）", other:"评审与关闭"};
function renderTable(){
  var rows = sortedRows(tabRows());
  var tabs = [["all","全部需求"]].concat(STATUS_ORDER.map(function(s){ return [s, STATUS[s].label]; }));
  var head = '<div class="list-tabs" role="tablist">' + tabs.map(function(t){
    return '<button class="list-tab' + (state.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '" role="tab" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '<span class="n">' + countOf(t[0]) + '</span></button>';
  }).join("") + '</div>';

  var body = "";
  if(!rows.length){
    body = '<tr><td colspan="' + (9 + (state.showDeliveryCol ? 1 : 0)) + '"><div class="col-empty" style="padding:36px 10px">没有符合当前条件的需求</div></td></tr>';
  }else if(state.group === "none"){
    body = rows.map(function(d){ return rowHTML(d, false); }).join("");
  }else if(state.group === "delivery"){
    ["donePending","delivered","active","other"].forEach(function(g){
      var list = rows.filter(function(d){ return groupKey(d) === g; });
      if(!list.length) return;
      var collapsed = !!state.collapsedGroups[g];
      body += '<tr class="group-row"><td colspan="' + (9 + (state.showDeliveryCol ? 1 : 0)) + '"><button class="group-toggle' + (collapsed ? "" : " open") + '" data-group-toggle="' + g + '"><span class="caret">▶</span><span>' + GROUP_LABEL[g] + '</span><span class="n">' + list.length + ' 项</span></button></td></tr>';
      if(!collapsed) body += list.map(function(d){ return rowHTML(d, true); }).join("");
    });
  }else{
    STATUS_ORDER.forEach(function(st){
      var list = rows.filter(function(d){ return d.status === st; });
      if(!list.length) return;
      var collapsed = !!state.collapsedGroups[st];
      body += '<tr class="group-row"><td colspan="' + (9 + (state.showDeliveryCol ? 1 : 0)) + '"><button class="group-toggle' + (collapsed ? "" : " open") + '" data-group-toggle="' + st + '"><span class="caret">▶</span><span>' + STATUS[st].label + '</span><span class="n">' + list.length + ' 项</span></button></td></tr>';
      if(!collapsed) body += list.map(function(d){ return rowHTML(d, true); }).join("");

  var th = '<th>需求</th><th>类型</th><th>优先级</th><th>状态</th><th>项目</th><th>目标版本</th><th>期望交付</th><th class="num">WSJF</th>' + (state.showDeliveryCol ? '<th>交付时间</th>' : "") + '<th style="text-align:right">操作</th>';
  $("viewRoot").innerHTML = head + '<section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr>' + th + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
}

/* ---------- 甘特 ---------- */
function stagesOf(d, idx){
  var shift = idx % 4;
  var s = [];
  s.push(["review", 0 + shift, 4 + shift]);
  if(d.status === "rej"){
    s.push(["review", 5 + shift, 8 + shift]);
    return s;
  }
  if(d.status === "review") return s;
  if(d.status === "canceled" && !d.planned) return s;
  if(d.status === "pass") return s;
  s.push(["plan", 6 + shift, 11 + shift]);
  if(d.status === "plan"){
    s.push(["design", 12 + shift, 18 + shift]);
    s.push(["dev", 19 + shift, 34 + shift]);
    s.push(["test", 35 + shift, 41 + shift]);
    if(d.delivered){
      s.push(["complete", 42 + shift, 43 + shift]);
      s.push(["release", 44 + shift, 44 + shift]);
    }else if(d.tasks !== "0/0"){
      s.push(["complete", 42 + shift, 43 + shift]);
    }
  }
  if(d.status === "canceled" && d.planned){
    s.push(["design", 12 + shift, 16 + shift]);
    s.push(["dev", 17 + shift, 28 + shift]);
    if(d.delivered) s.push(["release", 29 + shift, 29 + shift]);
  }
  return s;
}
function renderGantt(){
  var rows = sortedRows(tabRows());
  var span = 92;
  var html = '<div class="gantt-head"><span>2026-10-01 → 2026-12-31</span><span class="legend">' +
    Object.keys(STAGE).map(function(k){ return '<span><i style="background:' + STAGE[k].color + '"></i>' + STAGE[k].name + '</span>'; }).join("") +
    '<span><i style="background:var(--danger);opacity:.7"></i>今天</span></span></div>' +
    '<div class="gantt"><div class="gantt-inner">' +
    '<div class="gantt-months"><div class="g-mon" style="flex:0 0 300px;border-right:1px solid var(--border)">需求</div>' +
    '<div class="g-mon" style="flex:31 1 0">10 月</div><div class="g-mon" style="flex:30 1 0">11 月</div><div class="g-mon" style="flex:31 1 0">12 月</div></div>';
  if(!rows.length){
    html += '<div class="col-empty" style="padding:40px">没有符合当前条件的需求</div>';
  }
  rows.forEach(function(d, idx){
    var bars = stagesOf(d, idx).map(function(st){
      var left = st[1] / span * 100, width = Math.max((st[2]-st[1]+1) / span * 100, .8);
      var label = width > 5 ? STAGE[st[0]].name : "";
      return '<span class="g-bar ' + STAGE[st[0]].cls + '" style="left:' + left + '%;width:' + width + '%" title="' + STAGE[st[0]].name + '：第 ' + (st[1]+1) + ' → ' + (st[2]+1) + ' 天">' + label + '</span>';
    }).join("");
    var todayLeft = (43 / span * 100).toFixed(2);
    html += '<div class="g-row"><div class="g-label"><div class="g-title"><button data-detail="' + d.id + '">' + esc(d.title) + '</button></div>' +
      '<div class="g-meta">' + statusHTML(d.status) + deliveryTag(d, false) + (d.releasedNoRecord ? '<span class="tag warn">版本已发布 · 无记录</span>' : "") + '</div></div>' +
      '<div class="g-track">' + bars + '<span class="g-today" style="left:' + todayLeft + '%"></span></div></div>';
  });
  html += '<div class="g-note">发布阶段只来自真实记录；缺记录画缺口，不为历史需求补日期。已交付徽标与看板、列表同源。</div></div></div>';
  $("viewRoot").innerHTML = html;
}

/* ---------- 主渲染 ---------- */
function render(){

  $("groupCtl").hidden = state.view !== "list";
  $("sortCtl").hidden = state.view !== "list";

  else if(state.view === "list") renderTable();
  else renderGantt();
  syncControls();
}
function syncControls(){
  $("searchInput").value = state.query;

  $("projectSelect").value = state.project;
  $("groupSelect").value = state.group;
  $("sortSelect").value = state.sort;

  $("filterCount").hidden = n === 0;

/* ---------- 详情抽屉 ---------- */
function stageRows(d){
  return stagesOf(d, DEMANDS.indexOf(d)).map(function(st){
    return {key:st[0], start:st[1], end:st[2]};
  });
}
function drawerHTML(d){
  var donePending = isDonePending(d);
  var deliverCls = isDelivered(d) ? "ok" : donePending ? "pending" : d.releasedNoRecord ? "warn" : "muted";
  var deliverMain = isDelivered(d) ? (d.status === "plan" ? "已交付" : "曾交付") : donePending ? "已完成 · 待发布" : "未交付";
  var deliverSub = isDelivered(d)
    ? "最近一次生产发布时间 " + esc(d.deliveredAt) + "。判定来源：生产环境成功发布、条目 published。"
    : donePending
      ? "关联工作项 " + esc(d.tasks) + " 已全部关闭" + (d.cases ? "、用例 " + esc(d.cases) + " 通过" : "") + "，但没有生产发布记录。登记生产发布后会自动转为已交付。"
      : d.releasedNoRecord
        ? "目标版本 " + esc(d.version) + " 已标记发布，但未找到生产发布记录。按现有口径不判定为已交付。"
        : "没有找到生产环境成功发布记录。版本已发布但无记录时，同样视为未交付。";
  var done = isDelivered(d) || donePending;
  var rows = d.tasks === "0/0" ? [] : [
    ["T-" + d.id.slice(2) + "-1","开发任务","周明","已完成", isDelivered(d) ? "生产全量生效" : "未生产发布", isDelivered(d) ? d.deliveredAt : "—"],
    ["T-" + d.id.slice(2) + "-2","联调任务","陈可","已完成", isDelivered(d) ? "生产全量生效" : "未生产发布", isDelivered(d) ? d.deliveredAt : "—"],
    ["T-" + d.id.slice(2) + "-3","验证任务","李岚", done ? "已完成" : (d.status === "plan" ? "进行中" : "待处理"), isDelivered(d) ? "生产全量生效" : "未生产发布", isDelivered(d) ? d.deliveredAt : "—"]
  ];
  return '<div class="drawer-head"><div style="min-width:0"><div class="drawer-title">' + esc(d.title) + '</div>' +
    '<div class="drawer-tags">' + statusHTML(d.status) + deliveryTag(d, false) + priHTML(d.priority) + '<span class="tag ghost">' + esc(d.kind) + '</span></div></div>' +
    '<button class="drawer-close" data-close-drawer aria-label="关闭">✕</button></div>' +
    '<div class="drawer-body">' +
      '<div class="d-sec"><div class="deliver-box ' + deliverCls + '">' +
        '<span class="deliver-ico">' + (isDelivered(d)
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>'
          : donePending
            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
            : d.releasedNoRecord
              ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>'
              : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>') + '</span>' +
        '<div><div class="deliver-main">' + deliverMain + (isDelivered(d) ? " · " + esc(d.deliveredAt) : "") + '</div><div class="deliver-sub">' + deliverSub + '</div></div>' +
      '</div></div>' +
      '<div class="d-sec"><h3>基本信息</h3><div class="kv">' +
        '<div><div class="k">所属项目</div><div class="v">' + esc(d.project) + '</div></div>' +
        '<div><div class="k">目标版本</div><div class="v">' + (d.version ? esc(d.version) : "暂不指定") + '</div></div>' +
        '<div><div class="k">期望交付</div><div class="v">' + esc(d.expect || "待评估") + '</div></div>' +
        '<div><div class="k">计划时间</div><div class="v">' + esc(d.planned || "未排期") + '</div></div>' +
        '<div><div class="k">来源</div><div class="v">' + esc(d.source) + '</div></div>' +
        '<div><div class="k">WSJF</div><div class="v">' + (d.wsjf == null ? "未评分" : d.wsjf.toFixed(1)) + '</div></div>' +
      '</div></div>' +
      '<div class="d-sec"><h3>阶段时间轴</h3><div class="stages">' +
        stageRows(d).map(function(s){
          return '<span class="stage-chip' + (s.key === "release" ? " auto" : "") + '"><b>' + STAGE[s.key].name + '</b>第 ' + (s.start+1) + ' → ' + (s.end+1) + ' 天</span>';
        }).join("") +
      '</div></div>' +
      '<div class="d-sec"><h3>关联工作项</h3>' +
        (rows.length ? '<table class="d-table"><thead><tr><th>工作项</th><th>类型</th><th>负责人</th><th>状态</th><th>生产发布事实</th><th>最近发布时间</th></tr></thead><tbody>' +
          rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>'; }).join("") +
        '</tbody></table>' : '<p class="foot-note">尚未拆分工作项。</p>') +
        '<p class="foot-note" style="margin-top:8px">任务发布不等于需求业务验收；交付结论只说明生产交付事实。</p>' +
      '</div>' +
      '<div class="d-sec"><p class="foot-note">需求调期、撤排与取消不自动改变已有任务；交付徽标由发布记录自动派生，恢复或撤排后台仍保留历史交付事实。</p></div>' +
    '</div>';
}
function openDrawer(id){
  var d = DEMANDS.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  $("drawer").innerHTML = drawerHTML(d);
  $("drawer").classList.add("on");
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("on");
}
function closeDrawer(){
  $("drawer").classList.remove("on");
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("on");
}

/* ---------- 弹层 ---------- */
function closePopover(){ $("popover").hidden = true; $("filterBtn").setAttribute("aria-expanded", "false"); }
function openFilter(){
  var p = $("popover");
  p.innerHTML = '<div class="pop-title">筛选需求</div>' +
    '<div class="pop-sec"><div class="pop-label">优先级</div><div class="pop-opts">' +
      ["P0","P1","P2","P3"].map(function(pr){ return '<button class="pop-opt" data-pri="' + pr + '" aria-pressed="' + (state.priorities.indexOf(pr) !== -1) + '">' + pr + '</button>'; }).join("") +
    '</div></div>' +
    '<div class="pop-sec"><div class="pop-label">交付状态</div><div class="pop-opts">' +
      [["any","不限"],["pending","未交付"],["done","已完成未发布"],["delivered","已交付"]].map(function(o){ return '<button class="pop-opt" data-delivery="' + o[0] + '" aria-pressed="' + (state.delivery === o[0]) + '">' + o[1] + '</button>'; }).join("") +
    '</div>' +
    '<p class="foot-note" style="margin-top:7px">交付状态只按生产发布记录判断，不能手工修改。</p></div>' +
    '<div class="pop-foot"><span class="note">' + baseRows().length + ' 条符合条件</span><button class="btn sm" data-reset-filter>重置</button><button class="btn sm primary" data-close-pop>完成</button></div>';
  var r = $("filterBtn").getBoundingClientRect();
  p.hidden = false;
  p.style.top = (r.bottom + 6) + "px";
  p.style.left = Math.min(r.left, window.innerWidth - p.offsetWidth - 12) + "px";
  $("filterBtn").setAttribute("aria-expanded", "true");
}
var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-view]");
  if(t){ state.view = t.dataset.view; saveState(); render(); return; }
  if(e.target.closest("#themeBtn")){
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    try{ localStorage.setItem("demandDeliveredTheme", dark ? "light" : "dark"); }catch(err){}
    return;
  }
  var tab = e.target.closest("[data-tab]");
  if(tab){ state.tab = tab.dataset.tab; state.collapsedGroups = {}; saveState(); render(); return; }
  if(e.target.closest("[data-toggle-delivered]")){ state.deliveredOpen = !state.deliveredOpen; saveState(); render(); return; }
  var detail = e.target.closest("[data-detail]");
  if(detail){ openDrawer(detail.dataset.detail); return; }
  if(e.target.closest("[data-close-drawer]") || e.target.id === "scrim"){ closeDrawer(); return; }
  var act = e.target.closest("[data-act]");
  if(act){
    var d1 = DEMANDS.filter(function(x){ return x.id === act.dataset.id; })[0];
    var names = {pass:"通过评审", plan:"打开排期弹窗", reopen:"重新打开", restore:"恢复需求"};
    toast("原型：对「" + (d1 ? d1.title : "") + "」" + (names[act.dataset.act] || "执行动作") + "（正式版走原弹窗与原因校验）");
    return;
  }
  var more = e.target.closest("[data-more]");
  if(more){
    var d2 = DEMANDS.filter(function(x){ return x.id === more.dataset.id; })[0];
    var items = d2 && d2.status === "plan"
      ? [["调整排期", "打开调期弹窗"],["撤销排期", "退回已通过并填写原因"],["取消需求", "填写原因后作废"]]
      : d2 && d2.status === "rej" ? [["编辑", "编辑需求"],["删除", "删除需求"]]
      : [["编辑", "编辑需求"],["拆分任务", "打开拆分任务"],["删除", "删除需求"]];
    var p = $("popover");
    p.innerHTML = '<div class="pop-title">' + esc(d2 ? d2.title : "") + '</div>' +
      items.map(function(it, i){ return '<button class="pop-opt" data-menu-toast="' + esc(it[1]) + '" style="width:100%;justify-content:flex-start;margin-bottom:4px">' + it[0] + '</button>'; }).join("") +
      (isDelivered(d2) ? '<p class="foot-note" style="margin-top:6px">已交付为自动结论，不提供手工取消入口。</p>' : "");
    var r = more.getBoundingClientRect();
    p.hidden = false;
    p.style.top = Math.min(r.bottom + 6, window.innerHeight - p.offsetHeight - 12) + "px";
    p.style.left = Math.max(12, r.right - p.offsetWidth) + "px";
    return;
  }
  if(e.target.closest("[data-menu-toast]")){ toast("原型：" + e.target.closest("[data-menu-toast]").dataset.menuToast); closePopover(); return; }
  if(e.target.closest("[data-toast]")){ toast(e.target.closest("[data-toast]").dataset.toast); return; }
  if(e.target.closest("#doneChip")){
    state.view = "list"; state.tab = "plan"; state.delivery = "done";
    state.query = ""; state.priorities = []; state.project = "all";
    saveState(); closePopover(); render(); return;
  }
  if(e.target.closest("#filterBtn")){ var p2 = $("popover"); if(!p2.hidden && $("filterBtn").getAttribute("aria-expanded") === "true") closePopover(); else openFilter(); return; }
  if(e.target.closest("[data-close-pop]")){ closePopover(); return; }
  if(e.target.closest("[data-reset-filter]")){ state.priorities = []; state.delivery = "any"; saveState(); closePopover(); render(); return; }
  var pri = e.target.closest("[data-pri]");
  if(pri){
    var v = pri.dataset.pri, i = state.priorities.indexOf(v);
    if(i === -1) state.priorities.push(v); else state.priorities.splice(i, 1);
    saveState(); openFilter(); render(); syncControls(); return;
  }
  var dl = e.target.closest("[data-delivery]");
  if(dl){ state.delivery = dl.dataset.delivery; saveState(); openFilter(); render(); syncControls(); return; }
  var gt = e.target.closest("[data-group-toggle]");
  if(gt){ var k = gt.dataset.groupToggle; state.collapsedGroups[k] = !state.collapsedGroups[k]; saveState(); render(); return; }
  if(!e.target.closest("#popover")) closePopover();
});
document.addEventListener("change", function(e){
  if(e.target.id === "projectSelect"){ state.project = e.target.value; saveState(); render(); }
  if(e.target.id === "groupSelect"){ state.group = e.target.value; state.collapsedGroups = {}; saveState(); render(); }
  if(e.target.id === "sortSelect"){ state.sort = e.target.value; saveState(); render(); }
});
$("searchInput").addEventListener("input", function(e){
  state.query = e.target.value.trim();
  saveState();
  render();
});
$("searchClear").addEventListener("click", function(){ state.query = ""; saveState(); render(); $("searchInput").focus(); });
$("deliveryColBtn").addEventListener("click", function(){ state.showDeliveryCol = !state.showDeliveryCol; saveState(); render(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ closeDrawer(); closePopover(); }
});
document.addEventListener("dragstart", function(e){
  var card = e.target.closest(".card");
  if(card){ e.dataTransfer.setData("text/plain", card.dataset.card); e.dataTransfer.effectAllowed = "move"; }
});
document.addEventListener("dragover", function(e){
  var col = e.target.closest("[data-drop]");
  if(col){ e.preventDefault(); col.classList.add("drop"); }
});
document.addEventListener("dragleave", function(e){
  var col = e.target.closest("[data-drop]");
  if(col && !col.contains(e.relatedTarget)) col.classList.remove("drop");
});
document.addEventListener("drop", function(e){
  var col = e.target.closest("[data-drop]");
  if(!col) return;
  e.preventDefault();
  col.classList.remove("drop");
  var id = e.dataTransfer.getData("text/plain");
  var d = DEMANDS.filter(function(x){ return x.id === id; })[0];
  if(!d) return;
  if(isDelivered(d)){ toast("已交付卡片不可拖拽；调期或撤排请用「更多」菜单"); return; }
  toast("原型：拖到「" + STATUS[col.dataset.drop].label + "」仍走原有流转与原因校验");
});

var savedTheme = null;
try{ savedTheme = localStorage.getItem("demandDeliveredTheme"); }catch(e){}
if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
var params = new URLSearchParams(location.search);
if(["board","list","gantt"].indexOf(params.get("view")) !== -1) state.view = params.get("view");
if(params.get("theme") === "dark" || params.get("theme") === "light") document.documentElement.setAttribute("data-theme", params.get("theme"));
if(params.get("delivered") === "1") state.deliveredOpen = true;
render();
if(params.get("open")) openDrawer(params.get("open"));
</script>
</body>
</html>
