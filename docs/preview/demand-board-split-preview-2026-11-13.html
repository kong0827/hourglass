<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求池 · 主状态与阶段驾驶舱交互原型</title>
<style>
:root{
  --primary:#3370ff;--primary-soft:rgba(51,112,255,.08);--primary-border:rgba(51,112,255,.3);
  --success:#389e0d;--success-soft:rgba(56,158,13,.09);
  --warning:#d48806;--warning-soft:rgba(212,136,6,.1);
  --danger:#cf1322;--danger-soft:rgba(207,19,34,.08);
  --info:#1668dc;--info-soft:rgba(22,104,220,.08);
  --text:#1f2329;--text-2:#4e5969;--text-3:#86909c;
  --border:#e5e6eb;--border-strong:#d0d3d9;
  --surface:#fff;--sunken:#f5f6f8;--bg:#f2f3f5;
  --shadow:0 6px 20px rgba(15,23,42,.08);
  --r-lg:12px;--r-md:10px;--r-sm:6px;
}
body[data-theme="dark"]{
  --primary:#5b8dff;--primary-soft:rgba(91,141,255,.14);--primary-border:rgba(91,141,255,.42);
  --success:#6abf4b;--success-soft:rgba(106,191,75,.14);
  --warning:#e0a33a;--warning-soft:rgba(224,163,58,.14);
  --danger:#f06b6b;--danger-soft:rgba(240,107,107,.13);
  --info:#5b9bff;--info-soft:rgba(91,155,255,.14);
  --text:#e6e8eb;--text-2:#a9b0bb;--text-3:#7d8694;
  --border:#2b3037;--border-strong:#3a4048;
  --surface:#1b1e23;--sunken:#15181c;--bg:#101317;
  --shadow:0 8px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100%;}

/* ---------- 顶部 ---------- */
.app-head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 0}
.head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:680;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--text-3)}
.col-title-link:focus-visible,.link-btn:focus-visible,.card:focus-visible,.back-link:focus-visible,.stage-tab:focus-visible,.seg-btn:focus-visible,.filter-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools input[type="search"],.tools select{height:32px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:0 10px;font-size:12.5px;outline:none}
.tools input[type="search"]{width:200px}
.tools input[type="search"]:focus,.tools select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.icon-btn{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.icon-btn:hover{border-color:var(--border-strong)}
.hint{margin:10px 20px 0;padding:9px 12px;border:1px solid var(--border);background:var(--sunken);border-radius:8px;font-size:12px;color:var(--text-2);line-height:1.6}
.hint b{color:var(--text);font-weight:650}

/* ---------- 看板 ---------- */
.board{display:flex;gap:12px;align-items:stretch;padding:12px 20px 22px;overflow-x:auto;flex:1 1 auto;min-height:0}
.board:focus,.stage-title-row h1:focus{outline:none}
.col{flex:1 1 260px;min-width:250px;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 170px);min-height:300px;overflow:hidden}
.col-head{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.pdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.col-title-link{display:inline-flex;align-items:center;gap:5px;min-width:0;padding:3px 5px;margin-left:-5px;border:1px solid transparent;border-radius:6px;color:var(--text);text-decoration:none}
.col-title-link:hover{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary)}
.col-title{font-size:13px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-open{flex:0 0 auto;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-size:11px;line-height:1}
.col-count{margin-left:auto;height:20px;min-width:22px;padding:0 6px;border-radius:10px;background:var(--sunken);border:1px solid var(--border);color:var(--text-2);font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center}
.col-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.col-empty{padding:18px 8px;text-align:center;font-size:12px;color:var(--text-3);border:1px dashed var(--border);border-radius:8px}
.col-body.drop-ok{background:var(--primary-soft);outline:1px dashed var(--primary-border);outline-offset:-4px}
.col-body.drop-no{background:var(--danger-soft);outline:1px dashed rgba(207,19,34,.4);outline-offset:-4px}

/* 已排期列的阶段分布条 + 列内筛选 */
.dist{flex:0 0 auto;display:flex;gap:2px;height:5px;padding:0 0 0;background:var(--sunken);border-bottom:1px solid var(--border);overflow:hidden}
.dist a{display:block;height:100%;min-width:3px;transition:opacity .15s,filter .15s}
.dist a:hover{filter:brightness(1.12)}
.dist a.dim{opacity:.28}
.dist .waiting{background:var(--border-strong)}
.dist .active{background:var(--primary)}
.dist .donePending{background:var(--warning)}
.dist .delivered{background:var(--success)}
.col-stage-filter{flex:0 0 104px;width:104px;height:26px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:6px;padding:0 5px;font-size:11px;outline:none}
.col-stage-filter:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.col-stage-filter.active{border-color:var(--primary-border);color:var(--primary);background:var(--primary-soft)}
.link-btn{border:0;background:transparent;color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px}
.link-btn:hover{background:var(--primary-soft)}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:border-color .12s,box-shadow .12s,transform .12s;cursor:pointer}
.card.can-drag{cursor:grab}
.card.can-drag:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.card.dragging{opacity:.45;transform:scale(.99)}
.card-title{font-size:13px;font-weight:640;line-height:1.45;word-break:break-word}
.card-meta{font-size:11.5px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.card-meta .sep{color:var(--border-strong)}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;line-height:17px;padding:0 6px;border-radius:5px;border:1px solid var(--border);color:var(--text-2);background:var(--sunken);white-space:nowrap}
.tag.p0{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}
.tag.p1{color:var(--warning);background:var(--warning-soft);border-color:rgba(212,136,6,.24)}
.tag.p2{color:var(--info);background:var(--info-soft);border-color:rgba(22,104,220,.2)}
.tag.p3{color:var(--text-3)}
.tag.warn{color:var(--warning);background:var(--warning-soft);border-color:rgba(212,136,6,.24)}
.tag.ok{color:var(--success);background:var(--success-soft);border-color:rgba(56,158,13,.24)}
.tag.bad{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}
.stage{font-size:11px;line-height:17px;padding:0 6px;border-radius:5px;border:1px dashed var(--border-strong);color:var(--text-3);background:transparent;white-space:nowrap}
.stage.waiting{color:var(--text-3)}
.stage.active{color:var(--primary);border-color:var(--primary-border);background:var(--primary-soft)}
.stage.donePending{color:var(--warning);border-color:rgba(212,136,6,.35);background:var(--warning-soft)}
.stage.delivered{color:var(--success);border-color:rgba(56,158,13,.35);background:var(--success-soft)}
.card-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3)}
.progress{flex:1 1 auto;height:5px;border-radius:3px;background:var(--border);overflow:hidden;min-width:40px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px}
.progress.ok i{background:var(--success)}
.lock{flex:0 0 auto;font-size:11px;color:var(--text-3);display:inline-flex;align-items:center;gap:3px}
.card-note{font-size:11.5px;color:var(--text-2);background:var(--sunken);border-radius:6px;padding:5px 7px;line-height:1.5;word-break:break-word}
.card.released .card-title{color:var(--text-2)}
.card-open{margin-left:auto;color:var(--primary);font-size:11.5px;font-weight:600;white-space:nowrap}
.stage-demand:hover{border-color:var(--primary-border);box-shadow:var(--shadow)}

/* ---------- 阶段驾驶舱 ---------- */
.stage-page{flex:1 1 auto;min-width:0}
.stage-head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 0}
.stage-head-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-link{height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--primary-border);border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;text-decoration:none}
.back-link:hover{background:var(--primary);color:#fff}
.crumbs{font-size:12px;color:var(--text-3)}
.stage-head-top .icon-btn{margin-left:auto}
.stage-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.stage-title-row h1{margin:0;font-size:20px;line-height:1.35;font-weight:680}
.stage-title-row .stage{font-size:12px;line-height:22px;padding:0 8px}
.stage-total{font-size:12px;color:var(--text-2)}
.stage-tabs{display:flex;gap:20px;margin-top:12px;overflow-x:auto}
.stage-tabs.derived-tabs{margin-top:0;padding-top:8px;border-top:1px solid var(--border)}
.stage-tab{flex:0 0 auto;padding:0 1px 10px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-2);font-size:12.5px;text-decoration:none}
.stage-tab b{margin-left:4px;font-size:11px;color:var(--text-3)}
.stage-tab:hover{color:var(--primary)}
.stage-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:650}
.stage-tab.active b{color:var(--primary)}
.stage-body{width:100%;max-width:1600px;margin:0 auto;padding:16px 20px 28px}
.stage-intro{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.stage-intro h2{margin:0 0 4px;font-size:14px;font-weight:650}
.stage-rule{margin:0;max-width:920px;color:var(--text-2);font-size:12.5px;line-height:1.7}
.stage-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.metric{padding:12px 16px;border-left:1px solid var(--border)}
.metric:first-child{border-left:0}
.metric-label{font-size:11.5px;color:var(--text-2)}
.metric-value{margin-top:2px;font-size:21px;line-height:1.3;font-weight:680;font-variant-numeric:tabular-nums}
.metric-value.warn{color:var(--warning)}
.metric-note{margin-top:2px;font-size:11.5px;color:var(--text-3)}
.stage-filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.filter-field{display:flex;flex-direction:column;gap:4px}
.filter-field>span{font-size:11.5px;color:var(--text-2)}
.filter-field input,.filter-field select{height:34px;width:148px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:0 9px;font-size:12.5px;outline:none}
.filter-field input{width:210px}
.filter-field input:focus,.filter-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.filter-group-label{align-self:center;font-size:11.5px;color:var(--text-2)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--sunken)}
.seg-btn{height:28px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:var(--text-2);font-size:12px}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.1);font-weight:600}
.filter-toggle{height:34px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2);font-size:12px}
.filter-toggle[aria-pressed="true"]{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary);font-weight:600}
.stage-result-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;color:var(--text-2);font-size:12px}
.stage-result-bar b{color:var(--text);font-weight:650}
.result-note{color:var(--text-3)}
.version-lane{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--sunken);overflow:hidden}
.lane-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.lane-title{font-size:13px;font-weight:680}
.lane-count{height:20px;min-width:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:10px;color:var(--text-2);font-size:11px}
.lane-meta{font-size:11.5px;color:var(--text-3)}
.lane-stats{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11.5px;color:var(--text-2)}
.lane-progress{width:120px;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.lane-progress i{display:block;height:100%;background:var(--primary);border-radius:3px}
.lane-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:12px}
.stage-empty{margin-top:12px;padding:36px 18px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface)}
.stage-empty h3{margin:0 0 6px;font-size:14px}
.stage-empty p{margin:0 0 12px;color:var(--text-3);font-size:12px}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.drawer-head h2{margin:0;font-size:15px;font-weight:680;line-height:1.45;flex:1 1 auto}
.drawer-body{padding:14px 18px 24px;overflow-y:auto}
.d-sec{padding:12px 0;border-bottom:1px solid var(--border)}
.d-sec:last-child{border-bottom:0}
.d-sec h3{margin:0 0 8px;font-size:12px;font-weight:650;color:var(--text-3);letter-spacing:.3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.kv div{min-width:0}
.kv .k{font-size:11.5px;color:var(--text-3);margin-bottom:1px}
.kv .v{font-size:12.5px;word-break:break-word}
.desc{font-size:12.5px;color:var(--text-2);line-height:1.7;margin:0}
.derive{border:1px solid var(--border);background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.65}
.derive b{font-weight:650}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--text-3);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--border)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:0}
.foot-note{font-size:11.5px;color:var(--text-3);line-height:1.6;margin:8px 0 0}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .14s;z-index:50;padding:20px}
.modal.on{opacity:1;pointer-events:auto}
.modal-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.modal-box h3{margin:0 0 4px;font-size:14px;font-weight:680}
.modal-box p{margin:0 0 12px;font-size:12px;color:var(--text-3);line-height:1.6}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:12.5px;outline:none}
.field textarea{min-height:74px;resize:vertical;line-height:1.6}
.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.04)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:#1f2329;color:#fff;font-size:12.5px;line-height:1.5;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;max-width:min(560px,90vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#8a4b00}
.toast.err{background:#8c1a24}

@media (max-width:1280px){
  .tools input[type="search"]{width:150px}
}
@media (max-width:980px){
  .col{min-width:232px}
  .board{max-height:none}
  .stage-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{border-top:1px solid var(--border)}
  .metric:nth-child(-n+2){border-top:0}
  .metric:nth-child(odd){border-left:0}
  .metric:last-child{grid-column:1 / -1;border-left:0}
  .filter-actions{width:100%;margin-left:0}
}
@media (max-width:700px){
  .app-head,.stage-head{padding:10px 12px 0}
  .board{padding:10px 12px 16px}
  .stage-body{padding:12px 12px 20px}
  .hint{margin:8px 12px 0}
  .col{flex:0 0 82vw;min-width:0;max-height:none;min-height:0}
  .tools{width:100%;margin-left:0}
  .tools input[type="search"]{flex:1 1 120px;width:auto}
  .kv{grid-template-columns:1fr}
  .stage-tabs{gap:16px}
  .stage-metrics{grid-template-columns:1fr 1fr}
  .metric{padding:10px 12px}
  .metric-value{font-size:18px}
  .filter-field,.filter-field input,.filter-field select{width:100%}
  .filter-field{flex:1 1 140px}
  .lane-stats{width:100%;margin-left:0}
  .lane-grid{grid-template-columns:1fr;padding:10px}
  .crumbs{display:none}
}
</style>
</head>
<body data-theme="light">
<div class="app">
  <header class="app-head" id="boardHead">
    <div class="head-row">
      <div class="brand">
        <h1>需求池</h1>
        <span>四列总览 + 状态工作页 · 原型演示数据</span>
      </div>
      <div class="tools">
        <input type="search" id="q" placeholder="搜索标题 / 项目 / 来源" aria-label="搜索">
        <select id="project" aria-label="按项目筛选"><option value="all">全部项目</option></select>
        <select id="pri" aria-label="按优先级筛选">
          <option value="all">全部优先级</option>
          <option value="P0">P0</option><option value="P1">P1</option>
          <option value="P2">P2</option><option value="P3">P3</option>
        </select>
        <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">☾</button>
      </div>
    </div>

    {id:"D-114",title:"报表订阅推送",project:"财务对账平台",priority:"P2",kind:"体验优化",source:"审计 · 钱",wsjf:3.8,status:"plan",version:"V1.1",expect:"2026-10-15",created:"2026-09-10",desc:"按订阅规则生成报表并推送到企微群。",tasks:[{t:"订阅规则",col:"done"},{t:"推送任务",col:"done"}],cases:{passed:2,total:2},releasedAt:"2026-10-12"},
    {id:"D-115",title:"直播带货模块",project:"会员中心",priority:"P1",kind:"新功能",source:"运营 · 高",wsjf:5.5,status:"closed",closeReason:"rej",closeStage:"review",note:"ROI 测算不足，且供应链未就绪，下季度再议",created:"2026-10-08",desc:"小程序内直播讲解与挂车售卖。"},
    {id:"D-116",title:"旧版对账中心下线公告",project:"商户对账平台",priority:"P3",kind:"体验优化",source:"运营 · 高",wsjf:1.8,status:"closed",closeReason:"cancel",closeStage:"pass",note:"业务方撤回，本季度不做",created:"2026-09-30",desc:"在旧版对账中心首页展示下线时间与迁移指引。"},
    {id:"D-117",title:"移动端手势密码",project:"掌上营业厅 App",priority:"P2",kind:"新功能",source:"安全 · 郑",wsjf:2.6,status:"closed",closeReason:"dup",closeStage:"review",note:"与 D-090 重复，已合并到手势登录改造",created:"2026-10-05",desc:"App 登录后支持手势密码二次验证。"},
    {id:"D-118",title:"退款单批量重试",project:"聚合支付网关",priority:"P2",kind:"新功能",source:"客服 · 叶",wsjf:5.2,status:"plan",version:"V1.2",expect:"2026-11-22",created:"2026-10-16",desc:"批量选择失败退款单重新发起，记录每次结果。",tasks:[{t:"批量重试",col:"done"},{t:"结果回写",col:"done"}],cases:{passed:2,total:2}}
  ];

  var STATUS = {
    review:{label:"待评审",color:"var(--text-3)"},
    pass:{label:"已通过",color:"var(--info)"},
    plan:{label:"已排期",color:"var(--success)"},
    closed:{label:"已关闭",color:"var(--text-3)"}
  };
  var CLOSE_STAGE = {review:"待评审",pass:"已通过",plan:"已排期"};
  var CLOSE_REASON = {rej:"评审不通过",cancel:"中途取消",dup:"重复需求"};
  var STAGE = {
    waiting:{label:"待开工",cls:"waiting"},
    active:{label:"推进中",cls:"active"},
    donePending:{label:"已完成 · 待发布",cls:"donePending"},
    delivered:{label:"已交付",cls:"delivered"}
  };
  var VERSIONS = ["V1.2","V1.3"];

  var STAGE_COPY = {
    all:{title:"交付全景",rule:"已排期需求的交付阶段全部由工作项、用例和生产发布记录派生。先在这里看整体分布，再通过阶段页签聚焦开工、推进、发布或交付回放。"},
    waiting:{title:"开工准备墙",rule:"已排期但尚无工作项开工。优先检查拆解是否完备、期望日期是否临近；点击卡片可回看工作项与排期依据。"},
    active:{title:"推进健康度",rule:"已有工作项开工但尚未达到完成口径。按版本或项目聚合进度，重点看用例未全通过、期望日期已过等需关注项。"},
    donePending:{title:"发布候选墙",rule:"工作项全部关闭且用例全部通过，但还没有生产发布记录。按目标版本归组形成发布候选，不以手工标记代替发布。"},
    delivered:{title:"交付回放",rule:"已有生产发布记录。按版本或项目回看真实发布日期与需求范围，期望日期仅作计划对照。"}
  };
  var STATUS_PAGE_COPY = {
    review:{title:"评审工作台",rule:"集中查看尚未评审的需求，按项目或优先级组织评审顺序；高优先级与期望日期已过的需求优先处理。"},
    pass:{title:"排期准备页",rule:"这里只处理评审通过、尚未排期的需求。按项目或优先级查看排期顺序，不展示交付阶段；交付阶段从已排期后开始派生。"},
    closed:{title:"关闭归档",rule:"按关闭原因、关闭前阶段和项目回看历史需求。恢复去向由关闭前阶段决定，交付证据与关闭原因继续保留。"}
  };
  var TODAY = "2026-11-13";

  var state = {stage:"all",q:"",project:"all",pri:"all",theme:"light"};
  var stageViewState = {q:"",project:"all",pri:"all",version:"all",risk:false,group:"version"};
  var statusViewState = {
    review:{q:"",project:"all",pri:"all",focus:false,group:"project"},
    pass:{q:"",project:"all",pri:"all",focus:false,group:"project"},
    closed:{q:"",project:"all",pri:"all",reason:"all",closeStage:"all",group:"reason"}
  };
  var draggedId = null, didDrag = false;

  var board = document.getElementById("board");
  var boardHead = document.getElementById("boardHead");
  var stagePage = document.getElementById("stagePage");
  var hint = document.getElementById("hint");
  var toastEl = document.getElementById("toast");
  var drawer = document.getElementById("drawer");
  var drawerMask = document.getElementById("drawerMask");
  var drawerTitle = document.getElementById("drawerTitle");
  var drawerBody = document.getElementById("drawerBody");

  /* ---------------- 派生逻辑 ---------------- */
  function derivedStage(d){
    if(d.status !== "plan") return null;
    if(d.releasedAt) return "delivered";
    var tasks = d.tasks || [];
    var total = tasks.length;
    var closed = tasks.filter(function(x){ return x.col === "done"; }).length;
    var started = tasks.some(function(x){ return x.col !== "backlog"; });
    var c = d.cases || {passed:0,total:0};
    if(total > 0 && closed === total && c.passed === c.total) return "donePending";
    if(started) return "active";
    return "waiting";
  }
  function taskCounts(d){
    var tasks = d.tasks || [];
    return {
      total:tasks.length,
      closed:tasks.filter(function(x){ return x.col === "done"; }).length,
      started:tasks.filter(function(x){ return x.col !== "backlog"; }).length
    };
  }
  function taskStateName(col){
    return {backlog:"待处理",dev:"开发中",test:"测试中",done:"已完成"}[col] || col;
  }
  function restartTarget(d){
    return d.closeStage === "review" ? "review" : "pass";
  }
  function findDemand(id){
    for(var i=0;i<DEMANDS.length;i++){ if(DEMANDS[i].id === id) return DEMANDS[i]; }
    return null;
  }

  /* ---------------- 筛选 ---------------- */
  function baseDemands(){
    var q = state.q.trim().toLowerCase();
    return DEMANDS.filter(function(d){
      if(state.project !== "all" && d.project !== state.project) return false;
      if(state.pri !== "all" && d.priority !== state.pri) return false;
      if(q){
        var hay = (d.title + "\n" + d.project + "\n" + (d.source || "") + "\n" + (d.desc || "") + "\n" + d.id).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  /* ---------------- 渲染 ---------------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function priTag(p){
    return '<span class="tag ' + (p||"P2").toLowerCase() + '">' + esc(p||"P2") + '</span>';
  }
  function stageChip(stage){
    if(!stage) return "";
    return '<span class="stage ' + STAGE[stage].cls + '" title="派生展示，不可手工修改">' + STAGE[stage].label + '</span>';
  }
  function closeChip(d){
    return '<span class="tag">' + CLOSE_REASON[d.closeReason] + '</span>';
  }
  function cardHTML(d){
    var stage = derivedStage(d);
    var tc = taskCounts(d);
    var cls = "card can-drag" + (stage === "delivered" ? " released" : "");
    var html = '<article class="' + cls + '" data-id="' + d.id + '" draggable="true" tabindex="0">';
    html += '<div class="card-title">' + esc(d.title) + '</div>';
    html += '<div class="card-meta"><span>' + esc(d.project) + '</span><span class="sep">·</span><span>' + esc(d.source || "—") + '</span></div>';
    html += '<div class="card-tags">' + priTag(d.priority);
    if(d.status === "plan"){
      html += stageChip(stage);
      if(d.version) html += '<span class="tag">' + esc(d.version) + '</span>';
    }else if(d.status === "closed"){
      html += closeChip(d);
      html += '<span class="tag">关闭前 ' + (CLOSE_STAGE[d.closeStage] || "待评审") + '</span>';
    }else{
      html += '<span class="tag">WSJF ' + d.wsjf.toFixed(1) + '</span>';
      if(d.expect) html += '<span class="tag">期望 ' + esc(d.expect) + '</span>';
    }
    html += '</div>';

    if(d.status === "plan"){
      if(tc.total){
        var pct = Math.round(tc.closed / tc.total * 100);
        html += '<div class="card-foot" title="工作项：已关闭 ' + tc.closed + ' / 共 ' + tc.total + '"><span>工作项 ' + tc.closed + '/' + tc.total + '</span>'
          + '<span class="progress' + (stage === "donePending" || stage === "delivered" ? " ok" : "") + '"><i style="width:' + pct + '%"></i></span></div>';
        if(d.cases && d.cases.total){
          html += '<div class="card-meta"><span>用例 ' + d.cases.passed + '/' + d.cases.total + ' 通过</span>'
            + (d.releasedAt ? '<span class="sep">·</span><span>生产发布 ' + esc(d.releasedAt) + '</span>' : '')
            + '</div>';
        }else if(d.releasedAt){
          html += '<div class="card-meta"><span>生产发布 ' + esc(d.releasedAt) + '</span></div>';
        }
      }else{
        html += '<div class="card-tags"><span class="tag warn">无工作项</span><span class="tag">待拆解</span></div>';
      }
    }else if(d.status === "closed" && d.note){
      html += '<div class="card-note">' + esc(d.note) + '</div>';
    }
    html += '</article>';
    return html;
  }

  function stageRank(d){
    var rank = {active:0,donePending:1,waiting:2,delivered:3};
    var r = rank[derivedStage(d)];
    return r == null ? 4 : r;
  }
  function boardColumns(rows){
    return [
      {key:"review",label:"待评审",color:"var(--text-3)"},
      {key:"pass",label:"已通过",color:"var(--info)"},
      {key:"plan",label:"已排期",color:"var(--success)"},
      {key:"closed",label:"已关闭",color:"var(--text-3)"}
    ].map(function(col){
      var list = rows.filter(function(d){ return d.status === col.key; });
      if(col.key !== "plan") return columnHTML(col, list);

      var all = list.slice().sort(function(a,b){
        var ra = stageRank(a), rb = stageRank(b);
        if(ra !== rb) return ra - rb;
        return String(a.id).localeCompare(String(b.id));
      });
      var shown = state.stage === "all" ? all : all.filter(function(d){ return derivedStage(d) === state.stage; });
      return columnHTML(col, shown, {total:all.length, distributed:all});
    }).join("");
  }
  function distHTML(list){
    var counts = {};
    STAGE_FILTERS.forEach(function(k){ counts[k] = 0; });
    list.forEach(function(d){ var s = derivedStage(d); if(s) counts[s]++; });
    var segs = STAGE_FILTERS.map(function(k){
      if(!counts[k]) return "";
      var dim = state.stage !== "all" && state.stage !== k ? " dim" : "";
      return '<a class="' + k + dim + '" href="#/status/plan/' + k + '" style="flex:' + counts[k] + ' 1 0" title="进入' + STAGE[k].label + '驾驶舱，' + counts[k] + ' 条"></a>';
    }).join("");
    var label = STAGE_FILTERS.map(function(k){ return STAGE[k].label + " " + counts[k]; }).join("，");
    return '<div class="dist" role="img" aria-label="已排期阶段分布：' + label + '">' + segs + '</div>';
  }
  function stageFilterHTML(list){
    var counts = {};
    STAGE_FILTERS.forEach(function(k){ counts[k] = 0; });
    list.forEach(function(d){ var s = derivedStage(d); if(s) counts[s]++; });
    var html = '<select class="col-stage-filter' + (state.stage !== "all" ? " active" : "") + '" data-stage-filter aria-label="只筛选已排期列的交付阶段">';
    html += '<option value="all"' + (state.stage === "all" ? " selected" : "") + '>全部阶段</option>';
    STAGE_FILTERS.forEach(function(k){
      html += '<option value="' + k + '"' + (state.stage === k ? " selected" : "") + '>' + STAGE[k].label + ' ' + counts[k] + '</option>';
    });
    return html + '</select>';
  }
  function columnHTML(col, list, meta){
    var filtered = meta && state.stage !== "all";
    var html = '<section class="col" data-col="' + col.key + '">';
    html += '<div class="col-head"><span class="pdot" style="background:' + col.color + '"></span>'
      + '<a class="col-title-link" href="#/status/' + col.key + '" aria-label="进入' + esc(col.label) + '工作页"><span class="col-title">' + esc(col.label) + '</span><span class="col-open" aria-hidden="true">↗</span></a>'
      + (meta ? stageFilterHTML(meta.distributed) : '')
      + '<span class="col-count">' + (filtered ? list.length + " / " + meta.total : list.length) + '</span>'
      + '</div>';
    if(meta) html += distHTML(meta.distributed);
    html += '<div class="col-body" data-drop="' + col.key + '">';
    if(list.length){
      html += list.map(cardHTML).join("");
    }else if(filtered && meta){
      html += '<div class="col-empty">该阶段暂无需求<br><button type="button" class="link-btn" data-clear style="margin-top:6px">显示全部阶段</button></div>';
    }else{
      html += '<div class="col-empty">暂无需求</div>';
    }
    html += '</div></section>';
    return html;
  }

  var STAGE_FILTERS = ["waiting","active","donePending","delivered"];
  function render(){
    var base = baseDemands();
    var planAll = base.filter(function(d){ return d.status === "plan"; });
    board.innerHTML = boardColumns(base);

    if(state.stage === "all"){
      hint.innerHTML = '<b>需求看板</b>：四个状态列常驻，拖拽即流转；点击列标题 ↗ 进入对应工作页。'
        + '「已排期」进入交付驾驶舱，列头下拉只筛选当前列，下方分布条可直达具体阶段，其他三列始终保持总览。'
        + '卡片上的 <span class="stage waiting">待开工</span> <span class="stage active">推进中</span> <span class="stage donePending">已完成 · 待发布</span> <span class="stage delivered">已交付</span> 均由工作项、用例与生产发布记录自动派生。';
      return;
    }
    var shown = planAll.filter(function(d){ return derivedStage(d) === state.stage; }).length;

  function demandRisks(d){

    if(d.cases && d.cases.total && d.cases.passed < d.cases.total) risks.push("用例未全通过");
    if(!d.releasedAt && d.expect && d.expect < TODAY) risks.push("期望日期已过");

  function stageDemands(stage, filtered){

      if(!filtered) return true;
      if(stageViewState.project !== "all" && d.project !== stageViewState.project) return false;
      if(stageViewState.pri !== "all" && d.priority !== stageViewState.pri) return false;
      if(stageViewState.version !== "all" && (d.version || "") !== stageViewState.version) return false;
      if(stageViewState.risk && !demandRisks(d).length) return false;
      if(q){
        var hay = (d.title + "\n" + d.project + "\n" + (d.source || "") + "\n" + (d.desc || "") + "\n" + d.id + "\n" + (d.version || "")).toLowerCase();
        if(hay.indexOf(q) === -1) return false;

  function sumProgress(rows){
    var sum = {closed:0,total:0,passed:0,cases:0};

  function stageDemandHTML(d){

  /* ---------------- 主状态工作页 ---------------- */
  function statusTabsHTML(active){

  }

  function statusFocus(status,d){

      if(status === "closed" && vs.closeStage !== "all" && d.closeStage !== vs.closeStage) return false;

  function renderStatusPage(status){
    var vs = statusViewState[status];
    var all = statusDemands(status,false);
    var copy = STATUS_PAGE_COPY[status];
    var projects = DEMANDS.map(function(d){ return d.project; }).filter(function(v,i,a){ return a.indexOf(v) === i; }).sort();
    var groupOptions = status === "closed" ? [["reason","关闭原因"],["project","项目"]] : [["project","项目"],["priority","优先级"]];
    var html = '<header class="stage-head"><div class="stage-head-top">'
      + '<a class="back-link" href="#/board">← 返回需求池</a><span class="crumbs">需求池 / ' + STATUS[status].label + '</span>'
      + '<button class="icon-btn" id="stageThemeBtn" type="button" title="切换主题" aria-label="切换主题">' + (state.theme === "light" ? "☾" : "☀") + '</button></div>'
      + '<div class="stage-title-row"><h1 id="stageTitle" tabindex="-1">' + copy.title + '</h1><span class="tag">' + STATUS[status].label + '</span><span class="stage-total">' + all.length + ' 条需求</span></div>'
      + statusTabsHTML(status)
      + '</header><section class="stage-body"><div class="stage-intro"><div><h2>' + STATUS[status].label + '工作视图</h2><p class="stage-rule">' + copy.rule + '</p></div></div>'
      + '<div class="stage-metrics" id="statusMetrics"></div>'
      + '<div class="stage-filters" aria-label="' + STATUS[status].label + '需求筛选">'
      + '<label class="filter-field"><span>搜索</span><input id="statusQ" type="search" value="' + esc(vs.q) + '" placeholder="标题 / 编号 / 来源"></label>'
      + '<label class="filter-field"><span>项目</span><select id="statusProject"><option value="all">全部项目</option>' + projects.map(function(p){ return '<option value="' + esc(p) + '"' + (vs.project === p ? " selected" : "") + '>' + esc(p) + '</option>'; }).join("") + '</select></label>'
      + '<label class="filter-field"><span>优先级</span><select id="statusPri"><option value="all">全部优先级</option>' + ["P0","P1","P2","P3"].map(function(p){ return '<option value="' + p + '"' + (vs.pri === p ? " selected" : "") + '>' + p + '</option>'; }).join("") + '</select></label>';
    if(status === "closed"){
      html += '<label class="filter-field"><span>关闭原因</span><select id="statusReason"><option value="all">全部原因</option>' + Object.keys(CLOSE_REASON).map(function(k){ return '<option value="' + k + '"' + (vs.reason === k ? " selected" : "") + '>' + CLOSE_REASON[k] + '</option>'; }).join("") + '</select></label>'
        + '<label class="filter-field"><span>关闭前阶段</span><select id="statusCloseStage"><option value="all">全部阶段</option>' + Object.keys(CLOSE_STAGE).map(function(k){ return '<option value="' + k + '"' + (vs.closeStage === k ? " selected" : "") + '>' + CLOSE_STAGE[k] + '</option>'; }).join("") + '</select></label>';
    }
    html += '<div class="filter-actions"><span class="filter-group-label">分组</span><div class="seg" role="group" aria-label="卡片分组方式">';
    groupOptions.forEach(function(pair){
      html += '<button type="button" class="seg-btn" data-status-group="' + pair[0] + '" aria-pressed="' + (vs.group === pair[0]) + '">' + pair[1] + '</button>';
    });
    html += '</div>';
    if(status !== "closed") html += '<button type="button" class="filter-toggle" data-status-focus aria-pressed="' + vs.focus + '">' + (status === "review" ? "只看高优先级" : "只看 30 天内期望") + '</button>';
    html += '<button type="button" class="filter-toggle" data-reset-status-filters>清除筛选</button></div></div>'
      + '<div class="stage-result-bar" id="statusResultBar" aria-live="polite"></div><div id="statusLanes"></div></section>';
    stagePage.setAttribute("data-view","status");
    stagePage.setAttribute("data-status",status);
    stagePage.removeAttribute("data-stage");
    stagePage.innerHTML = html;
    renderStatusResults();
  }

  function routeStage(){
    var m = location.hash.match(/^#\/status\/plan(?:\/(waiting|active|donePending|delivered))?$/);
    return m ? (m[1] || "all") : null;
  }
  function routeStatus(){
    var m = location.hash.match(/^#\/status\/(review|pass|closed)$/);
    return m ? m[1] : null;
  }
  function renderRoute(){
    var stage = routeStage();
    var status = routeStatus();
    closeDrawer();
    if(stage || status){
      boardHead.hidden = true;
      board.hidden = true;
      stagePage.hidden = false;
      if(stage){
        renderStagePage(stage);
        document.title = (stage === "all" ? "已排期" : STAGE[stage].label) + " · 交付驾驶舱";
      }else{
        renderStatusPage(status);
        document.title = STATUS[status].label + " · " + STATUS_PAGE_COPY[status].title;
      }
      document.getElementById("stageTitle").focus({preventScroll:true});
    }else{
      stagePage.hidden = true;
      stagePage.removeAttribute("data-view");
      stagePage.removeAttribute("data-stage");
      stagePage.removeAttribute("data-status");
      boardHead.hidden = false;
      board.hidden = false;
      render();
      document.title = "需求池 · 主状态与阶段驾驶舱交互原型";
      board.focus({preventScroll:true});
    }
  }

  /* ---------------- 拖拽 ---------------- */
  var TRANSITIONS = {
    review:["pass","closed"],
    pass:["review","plan","closed"],
    plan:["pass","closed"],
    closed:["review","pass"]
  };

  board.addEventListener("dragstart", function(e){
    var card = e.target.closest(".card");
    if(!card){ e.preventDefault(); return; }
    draggedId = card.getAttribute("data-id");
    didDrag = true;
    card.classList.add("dragging");
    try{ e.dataTransfer.setData("text/plain", draggedId); e.dataTransfer.effectAllowed = "move"; }catch(err){}
  });
  board.addEventListener("dragend", function(e){
    var card = e.target.closest(".card");
    if(card) card.classList.remove("dragging");
    board.querySelectorAll(".col-body").forEach(function(b){ b.classList.remove("drop-ok","drop-no"); });
    draggedId = null;
    setTimeout(function(){ didDrag = false; }, 60);
  });
  board.addEventListener("dragover", function(e){
    if(!draggedId) return;
    var body = e.target.closest(".col-body[data-drop]");
    if(!body) return;
    e.preventDefault();
    var d = findDemand(draggedId);
    var to = body.getAttribute("data-drop");
    var ok = TRANSITIONS[d.status] && TRANSITIONS[d.status].indexOf(to) > -1;
    body.classList.toggle("drop-ok", ok);
    body.classList.toggle("drop-no", !ok);
  });
  board.addEventListener("dragleave", function(e){
    var body = e.target.closest(".col-body");
    if(body) body.classList.remove("drop-ok","drop-no");
  });
  board.addEventListener("drop", function(e){
    var body = e.target.closest(".col-body[data-drop]");
    if(!body || !draggedId) return;
    e.preventDefault();
    var d = findDemand(draggedId);
    var to = body.getAttribute("data-drop");
    body.classList.remove("drop-ok","drop-no");
    if(!d) return;
    if(to === d.status){
      body.classList.remove("drop-ok","drop-no");
      return;
    }
    if(!(TRANSITIONS[d.status] && TRANSITIONS[d.status].indexOf(to) > -1)){
      invalidDrop(d, to);
      return;
    }
    applyTransition(d, to);
  });

  function invalidDrop(d, to){
    if(d.status === "plan" && to === "review"){
      toast("已排期的需求不能直接回待评审：请先拖回「已通过」撤销排期", "warn");
    }else if(d.status === "closed" && to === "plan"){
      toast("已关闭的需求不能直接排期：请先恢复，恢复去向由关闭时的阶段决定", "warn");
    }else if(d.status === "review" && to === "plan"){
      toast("请先评审通过，再拖到「已排期」", "warn");
    }else if(d.status === "closed" && to === "review" && restartTarget(d) !== "review"){
      toast("该需求关闭前已通过评审，恢复后回到「已通过」，不能直接回「待评审」", "warn");
    }else{
      toast("该流转不允许", "warn");
    }
  }

  function applyTransition(d, to){
    if(d.status === "review" && to === "pass"){
      d.status = "pass"; render(); toast("已通过「" + d.title + "」，可排期进入版本");
      return;
    }
    if(d.status === "review" && to === "closed"){
      openCloseModal(d); return;
    }
    if(d.status === "pass" && to === "review"){
      d.status = "review"; render(); toast("已撤回「" + d.title + "」，回到待评审");
      return;
    }
    if(d.status === "pass" && to === "plan"){
      openPlanModal(d); return;
    }
    if(d.status === "pass" && to === "closed"){
      openCloseModal(d); return;
    }
    if(d.status === "plan" && to === "pass"){
      openReasonModal({
        title:"撤销排期",
        desc:"退回已通过，清除目标版本与计划时间；关联任务的版本与日期保持不变。",
        noteLabel:"撤排原因",
        okText:"确认撤排",
        onOk:function(note){
          d.status = "pass"; d.version = null; d.note = note;
          render(); toast("已撤销「" + d.title + "」的排期，退回已通过");
        }
      });
      return;
    }
    if(d.status === "plan" && to === "closed"){
      openCloseModal(d); return;
    }
    if(d.status === "closed"){
      var target = restartTarget(d);
      openReasonModal({
        title:"恢复需求",
        desc:"恢复去向由关闭前阶段决定：" + (CLOSE_STAGE[d.closeStage] || "待评审") + "关闭 → " + STATUS[target].label + "。已有工作项保持不变。",
        noteLabel:"恢复原因",
        okText:"确认恢复",
        onOk:function(note){
          d.status = target;
          d.note = note;
          d.closeReason = null;
          d.closeStage = null;
          render(); toast("已恢复「" + d.title + "」到「" + STATUS[target].label + "」");
        }
      });
    }
  }

  /* ---------------- 弹层 ---------------- */
  var modal = document.getElementById("modal");
  var modalTitle = document.getElementById("modalTitle");
  var modalDesc = document.getElementById("modalDesc");
  var modalTypeWrap = document.getElementById("modalTypeWrap");
  var modalType = document.getElementById("modalType");
  var modalVersionWrap = document.getElementById("modalVersionWrap");
  var modalVersion = document.getElementById("modalVersion");
  var modalNoteLabel = document.getElementById("modalNoteLabel");
  var modalNote = document.getElementById("modalNote");
  var modalOk = document.getElementById("modalOk");
  var modalCancel = document.getElementById("modalCancel");

  function showModal(){
    modal.classList.add("on");
    setTimeout(function(){ modalNote.focus(); }, 30);
  }
  function hideModal(){
    modal.classList.remove("on");
    modalNote.classList.remove("invalid");
    modalOk.onclick = null;
  }
  function openReasonModal(o){
    modalTitle.textContent = o.title;
    modalDesc.textContent = o.desc || "";
    modalTypeWrap.style.display = "none";
    modalVersionWrap.style.display = "none";
    modalNoteLabel.textContent = o.noteLabel || "原因";
    modalNote.value = "";
    modalNote.placeholder = o.placeholder || "必填，将写入需求记录";
    modalOk.textContent = o.okText || "确定";
    modalOk.onclick = function(){
      var note = modalNote.value.trim();
      if(!note){ modalNote.classList.add("invalid"); modalNote.focus(); return; }
      hideModal();
      o.onOk(note);
    };
    showModal();
  }
  function openCloseModal(d){
    modalTitle.textContent = "关闭「" + d.title + "」";
    modalDesc.textContent = "关闭后需求不再推进，历史保留；关闭前阶段与原因会写入记录，恢复去向据此决定。";
    modalTypeWrap.style.display = "";
    modalVersionWrap.style.display = "none";
    modalType.innerHTML = Object.keys(CLOSE_REASON).map(function(k){
      return '<option value="' + k + '">' + CLOSE_REASON[k] + '</option>';
    }).join("");
    modalNoteLabel.textContent = "关闭原因";
    modalNote.value = "";
    modalNote.placeholder = "必填，例如：ROI 不足 / 业务方撤回 / 与某需求重复";
    modalOk.textContent = "确认关闭";
    modalOk.onclick = function(){
      var note = modalNote.value.trim();
      if(!note){ modalNote.classList.add("invalid"); modalNote.focus(); return; }
      d.closeStage = d.status;
      d.closeReason = modalType.value;
      d.status = "closed";
      d.note = note;
      hideModal();
      render();
      toast("已关闭「" + d.title + "」；恢复去向为「" + STATUS[restartTarget(d)].label + "」");
    };
    showModal();
  }
  function openPlanModal(d){
    modalTitle.textContent = "安排「" + d.title + "」排期";
    modalDesc.textContent = "原型仅演示目标版本；正式实现还需校验版本是否已发布、日期是否合法。";
    modalTypeWrap.style.display = "none";
    modalVersionWrap.style.display = "";
    modalVersion.innerHTML = '<option value="">暂不指定版本</option>' + VERSIONS.map(function(v){
      return '<option value="' + v + '">' + v + '</option>';
    }).join("");
    modalNoteLabel.textContent = "排期说明（选填）";
    modalNote.value = "";
    modalNote.placeholder = "选填";
    modalOk.textContent = "确认排期";
    modalOk.onclick = function(){
      d.status = "plan";
      d.version = modalVersion.value || null;
      d.note = modalNote.value.trim();
      hideModal();
      render();
      var msg = "已排期「" + d.title + "」" + (d.version ? "，目标版本 " + d.version : "，目标未指定");
      var hidden = state.stage !== "all" && derivedStage(d) !== state.stage;
      if(hidden) msg += "；该需求当前为「" + STAGE[derivedStage(d)].label + "」，不在筛选结果中";
      toast(msg, hidden ? "warn" : "");
    };
    showModal();
  }
  modalCancel.addEventListener("click", hideModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) hideModal(); });

  /* ---------------- 详情抽屉 ---------------- */
  function openDrawer(id){
    var d = findDemand(id);
    if(!d) return;
    drawerTitle.textContent = d.title;
    var stage = derivedStage(d);
    var tc = taskCounts(d);
    var html = "";

    html += '<div class="d-sec"><div class="card-tags">'
      + '<span class="tag">' + STATUS[d.status].label + '</span>'
      + priTag(d.priority) + stageChip(stage)
      + '<span class="tag">' + esc(d.kind || "其他") + '</span></div></div>';

    html += '<div class="d-sec"><h3>基本信息</h3><div class="kv">'
      + kv("需求编号", d.id) + kv("所属项目", d.project)
      + kv("来源", d.source || "—") + kv("期望交付", d.expect || "待评估")
      + kv("目标版本", d.version || "—") + kv("WSJF", d.wsjf.toFixed(1))
      + kv("提交时间", d.created) + kv("当前状态", STATUS[d.status].label)
      + '</div></div>';

    if(d.desc){
      html += '<div class="d-sec"><h3>需求描述</h3><p class="desc">' + esc(d.desc) + '</p></div>';
    }

    if(d.status === "plan" && stage){
      html += '<div class="d-sec"><h3>派生进度</h3>';
      html += '<div class="derive"><div>' + deriveText(d, stage) + '</div></div>';
      html += '<table class="tbl" style="margin-top:10px"><thead><tr><th>工作项</th><th>状态</th></tr></thead><tbody>';
      if(tc.total){
        d.tasks.forEach(function(t){
          html += '<tr><td>' + esc(t.t) + '</td><td>' + taskStateName(t.col) + '</td></tr>';
        });
      }else{
        html += '<tr><td colspan="2" style="color:var(--text-3)">还没有拆分工作项</td></tr>';
      }
      html += '</tbody></table>';
      html += '<p class="foot-note">状态仍是「已排期」。推进中 / 已完成 · 待发布 / 已交付由工作项、用例与生产发布记录自动计算，看板和详情都不提供手工修改入口。</p>';
      html += '</div>';
    }

    if(d.status === "closed"){
      html += '<div class="d-sec"><h3>关闭信息</h3><div class="kv">'
        + kv("关闭原因类型", CLOSE_REASON[d.closeReason] || "—")
        + kv("关闭前阶段", CLOSE_STAGE[d.closeStage] || "待评审")
        + kv("恢复去向", STATUS[restartTarget(d)].label + "（由关闭前阶段决定）")
        + kv("关闭原因", d.note || "未填写")
        + '</div></div>';
    }

    if(d.status === "review" && d.note){
      html += '<div class="d-sec"><h3>评审备注</h3><p class="desc">' + esc(d.note) + '</p></div>';
    }

    drawerBody.innerHTML = html;
    drawer.classList.add("on");
    drawerMask.classList.add("on");
  }
  function kv(k, v){
    return '<div><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }
  function deriveText(d, stage){
    var tc = taskCounts(d);
    var c = d.cases || {passed:0,total:0};
    if(stage === "delivered"){
      return "<b>已交付</b>：生产环境已成功发布（" + esc(d.releasedAt) + "），版本 " + esc(d.version || "—") + " 的发布项已生效。";
    }
    if(stage === "donePending"){
      return "<b>已完成 · 待发布</b>：关联工作项 " + tc.closed + "/" + tc.total + " 已全部关闭，用例 " + c.passed + "/" + c.total + " 通过，但尚无生产发布记录。";
    }
    if(stage === "active"){
      if(tc.total && tc.closed === tc.total && c.passed < c.total){
        return "<b>推进中</b>：工作项已全部关闭，但用例仅 " + c.passed + "/" + c.total + " 通过，不能算完成。";
      }
      return "<b>推进中</b>：工作项 " + tc.started + "/" + tc.total + " 已开工，尚未全部关闭。";
    }
    if(!tc.total){
      return "<b>待开工</b>：已排期但还没有拆分工作项，需先拆解再推进。";
    }
    return "<b>待开工</b>：已排期，关联工作项均未开工。";
  }
  function closeDrawer(){
    drawer.classList.remove("on");
    drawerMask.classList.remove("on");
  }
  drawerMask.addEventListener("click", closeDrawer);
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);

  /* ---------------- 卡片点击 ---------------- */
  board.addEventListener("click", function(e){
    if(e.target.closest("[data-clear]")){ state.stage = "all"; render(); return; }
    var card = e.target.closest(".card");
    if(!card || didDrag) return;
    openDrawer(card.getAttribute("data-id"));
  });
  board.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if(!card) return;
    e.preventDefault();
    openDrawer(card.getAttribute("data-id"));
  });

  /* ---------------- 视图 / 筛选 / 主题 ---------------- */
  board.addEventListener("change", function(e){
    var select = e.target.closest("[data-stage-filter]");
    if(!select) return;
    state.stage = select.value;
    render();
  });
  stagePage.addEventListener("click", function(e){
    var riskBtn = e.target.closest("[data-risk-toggle]");
    if(riskBtn){
      stageViewState.risk = !stageViewState.risk;
      riskBtn.setAttribute("aria-pressed",String(stageViewState.risk));
      renderStageResults();
      return;
    }
    var groupBtn = e.target.closest("[data-group]");
    if(groupBtn){
      stageViewState.group = groupBtn.getAttribute("data-group");
      stagePage.querySelectorAll("[data-group]").forEach(function(btn){ btn.setAttribute("aria-pressed",String(btn === groupBtn)); });
      renderStageResults();
      return;
    }
    if(e.target.closest("[data-reset-stage-filters]")){
      stageViewState.q = "";
      stageViewState.project = "all";
      stageViewState.pri = "all";
      stageViewState.version = "all";
      stageViewState.risk = false;
      document.getElementById("stageQ").value = "";
      document.getElementById("stageProject").value = "all";
      document.getElementById("stagePri").value = "all";
      document.getElementById("stageVersion").value = "all";
      stagePage.querySelector("[data-risk-toggle]").setAttribute("aria-pressed","false");
      renderStageResults();
      return;
    }
    var statusGroupBtn = e.target.closest("[data-status-group]");
    if(statusGroupBtn){
      var groupStatus = stagePage.getAttribute("data-status");
      statusViewState[groupStatus].group = statusGroupBtn.getAttribute("data-status-group");
      stagePage.querySelectorAll("[data-status-group]").forEach(function(btn){ btn.setAttribute("aria-pressed",String(btn === statusGroupBtn)); });
      renderStatusResults();
      return;
    }
    var statusFocusBtn = e.target.closest("[data-status-focus]");
    if(statusFocusBtn){
      var focusStatus = stagePage.getAttribute("data-status");
      statusViewState[focusStatus].focus = !statusViewState[focusStatus].focus;
      statusFocusBtn.setAttribute("aria-pressed",String(statusViewState[focusStatus].focus));
      renderStatusResults();
      return;
    }
    if(e.target.closest("[data-reset-status-filters]")){
      var resetStatus = stagePage.getAttribute("data-status");
      var resetState = statusViewState[resetStatus];
      resetState.q = "";
      resetState.project = "all";
      resetState.pri = "all";
      if(resetStatus === "closed"){
        resetState.reason = "all";
        resetState.closeStage = "all";
        document.getElementById("statusReason").value = "all";
        document.getElementById("statusCloseStage").value = "all";
      }else{
        resetState.focus = false;
        stagePage.querySelector("[data-status-focus]").setAttribute("aria-pressed","false");
      }
      document.getElementById("statusQ").value = "";
      document.getElementById("statusProject").value = "all";
      document.getElementById("statusPri").value = "all";
      renderStatusResults();
      return;
    }
    if(e.target.closest("#stageThemeBtn")){ toggleTheme(); return; }
    var card = e.target.closest(".stage-demand,.status-demand");
    if(card) openDrawer(card.getAttribute("data-id"));
  });
  stagePage.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".stage-demand,.status-demand");
    if(!card) return;
    e.preventDefault();
    openDrawer(card.getAttribute("data-id"));
  });
  stagePage.addEventListener("input", function(e){
    if(e.target.id === "stageQ"){
      stageViewState.q = e.target.value;
      renderStageResults();
    }else if(e.target.id === "statusQ"){
      statusViewState[stagePage.getAttribute("data-status")].q = e.target.value;
      renderStatusResults();
    }
  });
  stagePage.addEventListener("change", function(e){
    if(e.target.id === "stageProject") stageViewState.project = e.target.value;
    else if(e.target.id === "stagePri") stageViewState.pri = e.target.value;
    else if(e.target.id === "stageVersion") stageViewState.version = e.target.value;
    else if(e.target.id === "statusProject") statusViewState[stagePage.getAttribute("data-status")].project = e.target.value;
    else if(e.target.id === "statusPri") statusViewState[stagePage.getAttribute("data-status")].pri = e.target.value;
    else if(e.target.id === "statusReason") statusViewState.closed.reason = e.target.value;
    else if(e.target.id === "statusCloseStage") statusViewState.closed.closeStage = e.target.value;
    else return;
    if(e.target.id.indexOf("status") === 0) renderStatusResults();
    else renderStageResults();
  });

  var qInput = document.getElementById("q");
  qInput.addEventListener("input", function(){ state.q = qInput.value; render(); });

  var projectSel = document.getElementById("project");
  DEMANDS.map(function(d){ return d.project; }).filter(function(v,i,a){
    return a.indexOf(v) === i;
  }).sort().forEach(function(p){
    var opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    projectSel.appendChild(opt);
  });
  projectSel.addEventListener("change", function(){ state.project = projectSel.value; render(); });

  var priSel = document.getElementById("pri");
  priSel.addEventListener("change", function(){ state.pri = priSel.value; render(); });

  var themeBtn = document.getElementById("themeBtn");
  try{
    if(new URLSearchParams(location.search).get("theme") === "dark") state.theme = "dark";
  }catch(err){}
  document.body.setAttribute("data-theme", state.theme);
  themeBtn.textContent = state.theme === "light" ? "☾" : "☀";
  function toggleTheme(){
    state.theme = state.theme === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", state.theme);
    themeBtn.textContent = state.theme === "light" ? "☾" : "☀";
    var stageThemeBtn = document.getElementById("stageThemeBtn");
    if(stageThemeBtn) stageThemeBtn.textContent = themeBtn.textContent;
  }
  themeBtn.addEventListener("click",toggleTheme);
  window.addEventListener("hashchange",renderRoute);

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      hideModal();
      closeDrawer();
    }
  });

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg, kind){
    toastEl.textContent = msg;
    toastEl.className = "toast on" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = "toast"; }, 2600);
  }

  renderRoute();
})();
</script>
</body>
</html>
