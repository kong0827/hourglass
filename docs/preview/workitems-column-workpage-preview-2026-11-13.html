<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作项 · 看板与列状态工作页交互原型</title>
<style>
:root{
  --primary:#3370ff;--primary-soft:rgba(51,112,255,.08);--primary-border:rgba(51,112,255,.3);
  --success:#389e0d;--success-soft:rgba(56,158,13,.09);
  --warning:#d48806;--warning-soft:rgba(212,136,6,.1);
  --danger:#cf1322;--danger-soft:rgba(207,19,34,.08);
  --info:#1668dc;--info-soft:rgba(22,104,220,.08);
  --plum:#8b6fb5;--plum-soft:rgba(139,111,181,.1);
  --text:#1f2329;--text-2:#4e5969;--text-3:#86909c;
  --border:#e5e6eb;--border-strong:#d0d3d9;
  --surface:#fff;--sunken:#f5f6f8;--bg:#f2f3f5;
  --shadow:0 6px 20px rgba(15,23,42,.08);
  --r-lg:12px;--r-md:10px;--r-sm:6px;
}
body[data-theme="dark"]{
  --primary:#5b8dff;--primary-soft:rgba(91,141,255,.14);--primary-border:rgba(91,141,255,.42);
  --success:#6abf4b;--success-soft:rgba(106,191,75,.14);
  --warning:#e0a33a;--warning-soft:rgba(224,163,58,.14);
  --danger:#f06b6b;--danger-soft:rgba(240,107,107,.13);
  --info:#5b9bff;--info-soft:rgba(91,155,255,.14);
  --plum:#a58fce;--plum-soft:rgba(165,143,206,.14);
  --text:#e6e8eb;--text-2:#a9b0bb;--text-3:#7d8694;
  --border:#2b3037;--border-strong:#3a4048;
  --surface:#1b1e23;--sunken:#15181c;--bg:#101317;
  --shadow:0 8px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{display:flex;flex-direction:column;min-height:100%;}

/* ---------- 顶部 ---------- */
.app-head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 0}
.head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:680;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--text-3)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools input[type="search"],.tools select{height:32px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:0 10px;font-size:12.5px;outline:none}
.tools input[type="search"]{width:210px}
.tools input[type="search"]:focus,.tools select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.icon-btn{width:auto;min-width:32px;height:32px;padding:0 9px;border:1px solid var(--border);background:var(--surface);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2)}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text)}
.hint{margin:10px 20px 0;padding:9px 12px;border:1px solid var(--border);background:var(--sunken);border-radius:8px;font-size:12px;color:var(--text-2);line-height:1.65}
.hint b{color:var(--text);font-weight:650}
.hint .kbd{display:inline-block;padding:0 4px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);font-size:11px}

/* ---------- 看板 ---------- */
.board{display:flex;gap:12px;align-items:stretch;padding:12px 20px 22px;overflow-x:auto;flex:1 1 auto;min-height:0}
.col{flex:1 1 250px;min-width:238px;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 178px);min-height:320px;overflow:hidden}
.col-head{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.pdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.col-title-link{display:inline-flex;align-items:center;gap:5px;min-width:0;padding:3px 5px;margin-left:-5px;border:1px solid transparent;border-radius:6px;color:var(--text);text-decoration:none}
.col-title-link:hover{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary)}
.col-title{font-size:13px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-open{flex:0 0 auto;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-size:11px;line-height:1}
.col-count{margin-left:auto;height:20px;min-width:22px;padding:0 6px;border-radius:10px;background:var(--sunken);border:1px solid var(--border);color:var(--text-2);font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center}
.col-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.col-empty{padding:18px 8px;text-align:center;font-size:12px;color:var(--text-3);border:1px dashed var(--border);border-radius:8px}
.col-add{height:34px;border:1px dashed var(--border-strong);border-radius:8px;background:transparent;color:var(--text-3);font-size:12px;flex:0 0 auto}
.col-add:hover{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary)}
.col-foot{border-top:1px solid var(--border);padding:8px 10px;background:var(--surface)}
.col-foot-split{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col-foot-note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--text-3)}
.col-foot-link{flex:0 0 auto;font-size:11.5px;font-weight:600;color:var(--primary);text-decoration:none}
.col-foot-link:hover{text-decoration:underline}

/* ---------- 卡片 ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 11px;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:border-color .12s,box-shadow .12s,transform .12s;cursor:pointer}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(51,112,255,0)}30%{box-shadow:0 0 0 3px rgba(51,112,255,.35)}}
.card-title-row{display:flex;align-items:flex-start;gap:6px;min-width:0}
.card-title{margin:0;font-size:13px;font-weight:640;line-height:1.45;word-break:break-word;flex:1 1 auto}
.card-meta{font-size:11.5px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;min-width:0;align-items:center}
.card-meta .sep{color:var(--border-strong)}
.card-meta .over{color:var(--danger)}
.card-meta .today{color:var(--warning)}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);min-width:0}

.tag{font-size:11px;line-height:17px;padding:0 6px;border-radius:5px;border:1px solid var(--border);color:var(--text-2);background:var(--sunken);white-space:nowrap}
.tag.p0{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}
.tag.p1{color:var(--warning);background:var(--warning-soft);border-color:rgba(212,136,6,.24)}
.tag.p2{color:var(--info);background:var(--info-soft);border-color:rgba(22,104,220,.2)}
.tag.p3{color:var(--text-3)}
.tag.warn{color:var(--warning);background:var(--warning-soft);border-color:rgba(212,136,6,.24)}
.tag.bad{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}
.tag.ok{color:var(--success);background:var(--success-soft);border-color:rgba(56,158,13,.24)}
.tag.plum{color:var(--plum);background:var(--plum-soft);border-color:rgba(139,111,181,.28)}
.mini-tag{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:4px;border:1px solid var(--border);color:var(--text-3);background:var(--sunken);white-space:nowrap;flex:0 0 auto}
.mini-tag.type-story{color:var(--info);background:var(--info-soft);border-color:rgba(22,104,220,.2)}
.mini-tag.type-task{color:var(--text-2)}
.mini-tag.type-bug{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}
.mini-tag.type-epic{color:var(--plum);background:var(--plum-soft);border-color:rgba(139,111,181,.28)}
.mini-tag.sev{color:var(--danger);background:var(--danger-soft);border-color:rgba(207,19,34,.22)}

.progress{flex:1 1 auto;height:5px;border-radius:3px;background:var(--border);overflow:hidden;min-width:40px;position:relative}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px}
.progress.ok i{background:var(--success)}
.progress.over i{background:var(--danger)}
.progress-meta{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:11px}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;color:#fff;flex:0 0 auto;background:var(--text-3)}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-open{margin-left:auto;color:var(--primary);font-size:11.5px;font-weight:600;white-space:nowrap}
.blocked{color:var(--warning);font-size:11px;display:inline-flex;align-items:center;gap:3px}

/* ---------- 工作页 ---------- */
.stage-page{flex:1 1 auto;min-width:0}
.stage-head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 0}
.stage-head-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-link{height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--primary-border);border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;text-decoration:none}
.back-link:hover{background:var(--primary);color:#fff}
.crumbs{font-size:12px;color:var(--text-3)}
.stage-head-top .icon-btn{margin-left:auto}
.stage-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.stage-title-row h1{margin:0;font-size:20px;line-height:1.35;font-weight:680}
.stage-title-row h1:focus{outline:none}
.stage-total{font-size:12px;color:var(--text-2)}
.stage-tabs{display:flex;gap:20px;margin-top:12px;overflow-x:auto}
.stage-tab{flex:0 0 auto;padding:0 1px 10px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-2);font-size:12.5px;text-decoration:none}
.stage-tab b{margin-left:4px;font-size:11px;color:var(--text-3)}
.stage-tab:hover{color:var(--primary)}
.stage-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:650}
.stage-tab.active b{color:var(--primary)}
.stage-body{width:100%;max-width:1600px;margin:0 auto;padding:16px 20px 28px}
.stage-intro h2{margin:0 0 4px;font-size:14px;font-weight:650}
.stage-rule{margin:0;max-width:980px;color:var(--text-2);font-size:12.5px;line-height:1.7}
.stage-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.metric{padding:12px 16px;border-left:1px solid var(--border);min-width:0}
.metric:first-child{border-left:0}
.metric-label{font-size:11.5px;color:var(--text-2)}
.metric-value{margin-top:2px;font-size:21px;line-height:1.3;font-weight:680;font-variant-numeric:tabular-nums}
.metric-value.warn{color:var(--warning)}
.metric-value.bad{color:var(--danger)}
.metric-value.ok{color:var(--success)}
.metric-note{margin-top:2px;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.filter-field{display:flex;flex-direction:column;gap:4px}
.filter-field>span{font-size:11.5px;color:var(--text-2)}
.filter-field input,.filter-field select{height:34px;width:124px;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:0 9px;font-size:12.5px;outline:none}
.filter-field input{width:200px}
.filter-field input:focus,.filter-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.filter-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 100%;justify-content:flex-end;margin-left:0;padding-top:10px;border-top:1px solid var(--border)}
.filter-group-label{align-self:center;font-size:11.5px;color:var(--text-2)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--sunken)}
.seg-btn{height:28px;padding:0 9px;border:0;border-radius:5px;background:transparent;color:var(--text-2);font-size:12px}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.1);font-weight:600}
.filter-toggle{height:34px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2);font-size:12px}
.filter-toggle[aria-pressed="true"]{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary);font-weight:600}
.filter-toggle:hover{border-color:var(--border-strong)}
.stage-result-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;color:var(--text-2);font-size:12px}
.stage-result-bar b{color:var(--text);font-weight:650}
.result-note{color:var(--text-3)}
.version-lane{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--sunken);overflow:hidden}
.lane-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.lane-title{font-size:13px;font-weight:680}
.lane-count{height:20px;min-width:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:10px;color:var(--text-2);font-size:11px}
.lane-meta{font-size:11.5px;color:var(--text-3)}
.lane-stats{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11.5px;color:var(--text-2);flex-wrap:wrap}
.lane-progress{width:110px;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.lane-progress i{display:block;height:100%;background:var(--primary);border-radius:3px}
.lane-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:10px;padding:12px}
.wi-card{gap:6px}
.wi-card .card-title-row{align-items:center}
.wi-card .card-meta{justify-content:space-between}
.wi-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);border-top:1px solid var(--border);padding-top:6px}
.wi-foot .due{font-variant-numeric:tabular-nums}
.stage-empty{margin-top:12px;padding:36px 18px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface)}
.stage-empty h3{margin:0 0 6px;font-size:14px}
.stage-empty p{margin:0 0 12px;color:var(--text-3);font-size:12px}
.lane-empty{padding:22px;text-align:center;color:var(--text-3);font-size:12px}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.drawer-head h2{margin:0;font-size:15px;font-weight:680;line-height:1.45;flex:1 1 auto}
.drawer-body{padding:14px 18px 24px;overflow-y:auto}
.d-sec{padding:12px 0;border-bottom:1px solid var(--border)}
.d-sec:last-child{border-bottom:0}
.d-sec h3{margin:0 0 8px;font-size:12px;font-weight:650;color:var(--text-3);letter-spacing:.3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.kv div{min-width:0}
.kv .k{font-size:11.5px;color:var(--text-3);margin-bottom:1px}
.kv .v{font-size:12.5px;word-break:break-word}
.desc{font-size:12.5px;color:var(--text-2);line-height:1.7;margin:0}
.derive{border:1px solid var(--border);background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.65}
.derive b{font-weight:650}
.foot-note{font-size:11.5px;color:var(--text-3);line-height:1.6;margin:8px 0 0}
.act-list{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--text-2)}
.act-row{display:flex;gap:8px}
.act-row time{flex:0 0 auto;color:var(--text-3);font-variant-numeric:tabular-nums}
.drawer-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.04)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:#1f2329;color:#fff;font-size:12.5px;line-height:1.5;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;max-width:min(560px,90vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#8a4b00}

@media (max-width:1280px){
  .tools input[type="search"]{width:160px}
  .filter-field input{width:170px}
}
@media (max-width:1100px){
  .stage-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric{border-top:1px solid var(--border)}
  .metric:nth-child(-n+3){border-top:0}
  .metric:nth-child(3n+1){border-left:0}
}
@media (max-width:980px){
  .col{min-width:232px}
  .stage-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(-n+3){border-top:1px solid var(--border)}
  .metric:nth-child(-n+2){border-top:0}
  .metric:nth-child(odd){border-left:0}
  .metric:nth-child(3n+1){border-left:1px solid var(--border)}
  .filter-actions{width:100%;margin-left:0}
}
@media (max-width:700px){
  .app-head,.stage-head{padding:10px 12px 0}
  .board{padding:10px 12px 16px}
  .stage-body{padding:12px 12px 20px}
  .hint{margin:8px 12px 0}
  .col{flex:0 0 82vw;min-width:0;max-height:none;min-height:0}
  .tools{width:100%;margin-left:0}
  .tools input[type="search"]{flex:1 1 120px;width:auto}
  .kv{grid-template-columns:1fr}
  .stage-tabs{gap:16px}
  .stage-metrics{grid-template-columns:1fr 1fr}
  .metric{padding:10px 12px}
  .metric:nth-child(odd){border-left:0}
  .metric:nth-child(-n+2){border-top:0}
  .metric:nth-child(n+3){border-top:1px solid var(--border)}
  .metric-value{font-size:18px}
  .metric:last-child{grid-column:1 / -1;border-left:0}
  .stage-filters{padding:10px;gap:8px}
  .filter-field,.filter-field input,.filter-field select{width:100%;min-width:0}
  .filter-field{flex:1 1 calc(50% - 5px)}
  .filter-field:first-child{flex-basis:100%}
  .filter-actions{justify-content:flex-start}
  .lane-stats{width:100%;margin-left:0}
  .lane-grid{grid-template-columns:1fr;padding:10px}
  .crumbs{display:none}
}
</style>
</head>
<body data-theme="light">
<div class="app">
  <header class="app-head" id="boardHead">
    <div class="head-row">
      <div class="brand">
        <h1>工作项</h1>
        <span>看板 + 列状态工作页 · 原型演示数据</span>
      </div>

  function esc(s){

  function fmtMD(s){ return s ? s.slice(5) : "—"; }

  function inDoneRange(t, range){
    if(!range || range === "all") return true;

    return !!t.completedAt && (!start || t.completedAt >= start);
  }
  function matches(t){
    var f = fstate(t.column);
    if(t.column === "done" && !inDoneRange(t, f.range)) return false;
    if(f.project !== "all" && t.project !== f.project) return false;
    if(f.owner !== "all" && (t.owner || "未分配") !== f.owner) return false;
    if(f.pri !== "all" && t.priority !== f.pri) return false;
    if(f.type !== "all" && (t.type || "task") !== f.type) return false;
    if(f.module !== "all" && t.module !== f.module) return false;
    if(f.due !== "all"){
      var k = dueInfo(t).kind;
      if(f.due === "over" && k !== "over") return false;
      if(f.due === "today" && k !== "today") return false;
      if(f.due === "soon" && !(k === "today" || k === "soon")) return false;
      if(f.due === "none" && t.due) return false;
    }
    if(f.risk && !risks(t).length) return false;
    if(f.q){
      var q = f.q.toLowerCase();
      var hay = (t.id + "\n" + t.title + "\n" + t.project + "\n" + t.module + "\n" + (t.owner || "") + "\n" + (t.tags || []).join(" ") + "\n" + (t.version || "")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function compare(a, b){
    var f = fstate(a.column);
    if(f.sort === "priority") return (PRI_RANK[a.priority] || 9) - (PRI_RANK[b.priority] || 9) || dueCompare(a, b);
    if(f.sort === "updated") return String(b.updated || "").localeCompare(String(a.updated || ""));
    if(f.sort === "completed") return String(b.completedAt || "").localeCompare(String(a.completedAt || ""));
    return dueCompare(a, b) || (PRI_RANK[a.priority] || 9) - (PRI_RANK[b.priority] || 9);
  }
  function dueCompare(a, b){
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return a.due.localeCompare(b.due);
  }

  function groupKey(t){
    var f = fstate(t.column);
    if(f.group === "project") return t.project;

  function metric(label, value, note, tone){

  function metricsHTML(col, rows, allRows){
    var total = allRows.length;
    var over = rows.filter(function(t){ return !isDone(t) && dueInfo(t).kind === "over"; }).length;
    var blocked = rows.filter(function(t){ return t.blocked; }).length;
    var unassigned = rows.filter(function(t){ return !t.owner; }).length;
    var est = sum(rows, "estimate");
    var act = sum(rows, "actual");
    var high = rows.filter(function(t){ return t.priority === "P0" || t.priority === "P1"; }).length;
    var dates = rows.map(function(t){ return col.done ? t.completedAt : t.due; }).filter(Boolean).sort();

    if(col.id === "backlog"){
      return metric("待处理", total, "当前列共 " + total + " 项")
        + metric("已逾期", over + " 项", over ? "需重新确认截止日期" : "当前结果无逾期", over ? "bad" : "ok")
        + metric("未分配", unassigned + " 项", unassigned ? "没有负责人就不会被推进" : "全部已有负责人", unassigned ? "warn" : "ok")
        + metric("预估合计", fmtMin(est), "尚未发生实际工时")
        + metric("最早截止", dates.length ? fmtMD(dates[0]) : "—", "按截止日期升序");
    }
    if(col.id === "doing"){
      var pct = est ? Math.round(act / est * 100) : 0;
      var today = rows.filter(function(t){ return dueInfo(t).kind === "today"; }).length;
      return metric("进行中", total, "当前列共 " + total + " 项")
        + metric("已逾期", over + " 项", over ? "优先确认是否可关闭或改期" : "当前结果无逾期", over ? "bad" : "ok")
        + metric("被阻塞", blocked + " 项", blocked ? "需先解除依赖" : "当前结果无阻塞", blocked ? "warn" : "ok")
        + metric("工时消耗", pct + "%", fmtMin(act) + " / 预估 " + fmtMin(est), pct >= 100 ? "warn" : "")
        + metric("今天到期", today + " 项", today ? "今天必须给出结论" : "今天没有到期项");
    }
    if(col.id === "test"){
      var waits = rows.map(function(t){ return daysSince(t.since); });
      var longest = waits.length ? Math.max.apply(null, waits) : 0;
      return metric("待测试", total, "当前列共 " + total + " 项")
        + metric("等待最久", longest + " 天", "从进入待测试列算起", longest >= 3 ? "warn" : "")
        + metric("已逾期", over + " 项", over ? "等待已吃掉交付缓冲" : "当前结果无逾期", over ? "bad" : "ok")
        + metric("被阻塞", blocked + " 项", blocked ? "先解除依赖再排测试" : "当前结果无阻塞", blocked ? "warn" : "ok")
        + metric("最早截止", dates.length ? fmtMD(dates[0]) : "—", "按截止日期升序");
    }
    if(col.id === "testing"){
      return metric("测试中", total, "当前列共 " + total + " 项")
        + metric("高优先级", high + " 项", "P0 / P1 优先回归", high ? "warn" : "")
        + metric("被阻塞", blocked + " 项", blocked ? "阻塞会拖长回归周期" : "当前结果无阻塞", blocked ? "warn" : "ok")
        + metric("已逾期", over + " 项", over ? "需当天给出结论" : "当前结果无逾期", over ? "bad" : "ok")
        + metric("实际工时", fmtMin(act), "当前结果累计，不含正在计时");
    }
    var f = fstate(col.id);
    var metricRange = f.range === "all" ? "quarter" : f.range;
    var mRows = f.range === "all"
      ? rows.filter(function(t){ return inDoneRange(t, "quarter"); })
      : rows;
    var rangeLabel = RANGE_LABEL[metricRange] || "本周";
    var weekDone = allRows.filter(function(t){ return t.completedAt && t.completedAt >= WEEK_START; }).length;
    var cycles = mRows.map(function(t){
      if(t.completedAt && t.since) return daysBetween(t.since, t.completedAt);
      return null;
    }).filter(function(x){ return x != null; });
    var avgCycle = cycles.length ? Math.round(cycles.reduce(function(s, x){ return s + x; }, 0) / cycles.length * 10) / 10 : "—";
    var lateDone = mRows.filter(function(t){ return t.completedAt && t.due && t.completedAt > t.due; }).length;
    var mEst = sum(mRows, "estimate"), mAct = sum(mRows, "actual");
    var pct = mEst ? Math.round(mAct / mEst * 100) : 0;
    var windowNote = f.range === "all"
      ? "全部仅查明细，指标按近 90 天"
      : (f.range === "week" ? "周一至今天 · 服务端聚合" : "服务端按时间窗聚合" + (weekDone ? " · 本周 " + weekDone + " 项" : ""));
    return metric(rangeLabel + "完成", mRows.length + " 项", windowNote)
      + metric("平均周期", avgCycle + " 天", "进入本列到完成，按当前结果")
      + metric("逾期完成", lateDone + " 项", lateDone ? "完成晚于原截止日期" : "全部按截止日期完成", lateDone ? "warn" : "ok")
      + metric("工时消耗", pct + "%", fmtMin(mAct) + " / 预估 " + fmtMin(mEst), pct >= 100 ? "warn" : "")
      + metric("最近完成", dates.length ? fmtMD(dates[dates.length - 1]) : "—", "按完成日期");
  }

  function laneStats(col, rows){
    if(col.done){
      var late = rows.filter(function(t){ return t.completedAt && t.due && t.completedAt > t.due; }).length;
      return late ? '<span class="tag warn">' + late + ' 项逾期完成</span>' : '<span class="tag ok">按截止完成</span>';
    }
    var over = rows.filter(function(t){ return dueInfo(t).kind === "over"; }).length;
    var blocked = rows.filter(function(t){ return t.blocked; }).length;
    var act = sum(rows, "actual"), est = sum(rows, "estimate");
    var pct = est ? Math.min(100, Math.round(act / est * 100)) : 0;
    return '<span>实际 ' + fmtMin(act) + ' / 预估 ' + fmtMin(est) + '</span>' +
      '<span class="lane-progress" title="工时消耗 ' + pct + '%"><i style="width:' + pct + '%"></i></span>' +
      (over ? '<span class="tag bad">逾期 ' + over + '</span>' : '<span class="tag ok">无逾期</span>') +
      (blocked ? '<span class="tag warn">阻塞 ' + blocked + '</span>' : '');
  }

  function wiCard(t){
    var tags = priTag(t.priority);
    if(t.blocked) tags += '<span class="tag bad" title="' + esc(t.blockedReason || "被阻塞") + '">被阻塞</span>';
    if(t.column === "test") tags += '<span class="tag">等待 ' + daysSince(t.since) + ' 天</span>';
    if(t.tags && t.tags.length) tags += '<span class="tag">' + esc(t.tags[0]) + '</span>';
    tags += riskTags(t, 2, true);
    var footMeta = isDone(t)
      ? '<span>完成 ' + esc(fmtMD(t.completedAt)) + '</span><span>周期 ' + daysBetween(t.since, t.completedAt) + ' 天</span>'
      : '<span>' + dueHTML(t) + '</span><span>实际 ' + fmtMin(t.actual) + ' / 预估 ' + fmtMin(t.estimate) + '</span>';
    return '<article class="card wi-card" data-id="' + esc(t.id) + '" tabindex="0" aria-label="' + esc(t.title) + '">' +
      '<div class="card-title-row">' + typeTag(t.type) + '<h3 class="card-title">' + esc(t.title) + '</h3></div>' +
      '<div class="card-meta"><span>' + esc(t.project) + ' · ' + esc(t.module) + '</span>' +
        '<span class="who">' + avatar(t.owner) + '<span>' + esc(t.owner || "未分配") + '</span></span></div>' +
      '<div class="card-tags">' + tags + '</div>' +
      '<div class="wi-foot">' + footMeta + '<span class="card-open">查看详情 →</span></div>' +
    '</article>';
  }

  function laneHTML(col, name, rows){
    var meta = col.done
      ? (function(){
          var ds = rows.map(function(t){ return t.completedAt; }).filter(Boolean).sort();
          return ds.length ? "最近完成 " + fmtMD(ds[ds.length - 1]) : "暂无完成记录";
        })()
      : (function(){
          var ds = rows.map(function(t){ return t.due; }).filter(Boolean).sort();
          return ds.length ? "最近截止 " + fmtMD(ds[0]) : "暂无截止日期";
        })();
    return '<section class="version-lane"><div class="lane-head">' +
      '<span class="lane-title">' + esc(name) + '</span><span class="lane-count">' + rows.length + '</span>' +
      '<span class="lane-meta">' + esc(meta) + '</span>' +
      '<div class="lane-stats">' + laneStats(col, rows) + '</div></div>' +
      '<div class="lane-grid">' + rows.map(wiCard).join("") + '</div></section>';
  }

  function optionsHTML(values, selected, allLabel, labelFn){
    var html = '<option value="all">' + esc(allLabel) + '</option>';
    values.forEach(function(v){
      html += '<option value="' + esc(v) + '"' + (selected === v ? " selected" : "") + '>' + esc(labelFn ? labelFn(v) : v) + '</option>';
    });
    return html;
  }

  function renderColumnPage(colId){
    var col = colById(colId);
    if(!col) return;
    var f = fstate(colId);
    var all = columnTasks(colId);
    var owners = PEOPLE.slice().sort(function(a,b){ return a.localeCompare(b,"zh-CN"); });
    var modules = [];
    TASKS.forEach(function(t){ if(modules.indexOf(t.module) === -1) modules.push(t.module); });
    modules.sort(function(a,b){ return a.localeCompare(b,"zh-CN"); });

    var html = '<header class="stage-head"><div class="stage-head-top">' +
      '<a class="back-link" href="#/board">← 返回工作项看板</a>' +
      '<span class="crumbs">工作项 / ' + esc(col.name) + '</span>' +
      '<button class="icon-btn" id="stageThemeBtn" type="button" title="切换主题" aria-label="切换主题">' + (state.theme === "light" ? "深色" : "浅色") + '</button></div>' +
      '<div class="stage-title-row"><h1 tabindex="-1" id="stageTitle">' + esc(col.name) + '</h1>' +
        '<span class="tag">状态工作页</span><span class="stage-total">' + all.length + ' 项工作项</span></div>' +
      '<nav class="stage-tabs" aria-label="切换看板列">' +
      COLS.map(function(c){
        return '<a class="stage-tab' + (c.id === colId ? " active" : "") + '" href="#/column/' + c.id + '"' +
          (c.id === colId ? ' aria-current="page"' : '') + '>' + esc(c.name) + '<b>' + columnTasks(c.id).length + '</b></a>';
      }).join("") + '</nav></header>';

    html += '<section class="stage-body">' +
      '<div class="stage-intro"><div><h2>' + esc(col.title) + '</h2><p class="stage-rule">' + esc(col.rule) + '</p></div></div>' +
      '<div class="stage-metrics" id="stageMetrics"></div>' +
      '<div class="stage-filters" aria-label="' + esc(col.name) + '工作项筛选">' +
        '<label class="filter-field"><span>搜索</span><input id="stageQ" type="search" value="' + esc(f.q) + '" placeholder="标题 / 编号 / 负责人 / 标签"></label>' +
        (col.done ? '<label class="filter-field"><span>完成时间</span><select id="stageRange">' +
          [["week","本周"],["month","本月"],["quarter","近 90 天"],["all","全部历史"]].map(function(p){
            return '<option value="' + p[0] + '"' + (f.range === p[0] ? " selected" : "") + '>' + p[1] + '</option>';
          }).join("") + '</select></label>' : '') +
        '<label class="filter-field"><span>项目</span><select id="stageProject">' + optionsHTML(PROJECTS, f.project, "全部项目") + '</select></label>' +
        '<label class="filter-field"><span>负责人</span><select id="stageOwner">' + optionsHTML(owners, f.owner, "全部负责人") + '</select></label>' +
        '<label class="filter-field"><span>优先级</span><select id="stagePri">' + optionsHTML(["P0","P1","P2","P3"], f.pri, "全部优先级") + '</select></label>' +
        '<label class="filter-field"><span>类型</span><select id="stageType">' + optionsHTML(["task","story","bug","epic"], f.type, "全部类型", function(v){ return TYPES[v]; }) + '</select></label>' +
        '<label class="filter-field"><span>模块</span><select id="stageModule">' + optionsHTML(modules, f.module, "全部模块") + '</select></label>' +
        '<label class="filter-field"><span>截止</span><select id="stageDue">' +
          '<option value="all"' + (f.due === "all" ? " selected" : "") + '>全部</option>' +
          '<option value="over"' + (f.due === "over" ? " selected" : "") + '>已逾期</option>' +
          '<option value="today"' + (f.due === "today" ? " selected" : "") + '>今天到期</option>' +
          '<option value="soon"' + (f.due === "soon" ? " selected" : "") + '>3 天内</option>' +
          '<option value="none"' + (f.due === "none" ? " selected" : "") + '>未设截止</option>' +
        '</select></label>' +
        '<label class="filter-field"><span>排序</span><select id="stageSort">' +
          (col.done
            ? '<option value="completed"' + (f.sort === "completed" ? " selected" : "") + '>完成时间</option>'
            : '<option value="due"' + (f.sort === "due" ? " selected" : "") + '>截止日期</option>') +
          '<option value="priority"' + (f.sort === "priority" ? " selected" : "") + '>优先级</option>' +
          '<option value="updated"' + (f.sort === "updated" ? " selected" : "") + '>最近更新</option>' +
        '</select></label>' +
        '<div class="filter-actions"><span class="filter-group-label">分组</span><div class="seg" role="group" aria-label="工作项分组方式">' +
          [["owner","负责人"],["project","项目"],["priority","优先级"],["module","模块"]].map(function(p){
            return '<button type="button" class="seg-btn" data-group="' + p[0] + '" aria-pressed="' + (f.group === p[0]) + '">' + p[1] + '</button>';
          }).join("") +
        '</div>' +
        (col.done ? '' : '<button type="button" class="filter-toggle" data-risk aria-pressed="' + f.risk + '">只看需关注</button>') +
        '<button type="button" class="filter-toggle" data-reset>清除筛选</button></div>' +
      '</div>' +
      '<div class="stage-result-bar" id="stageResultBar" aria-live="polite"></div>' +
      '<div id="stageLanes"></div></section>';

    stagePage.innerHTML = html;
    stagePage.setAttribute("data-column", colId);
    renderColumnResults();
  }

  function renderColumnResults(){
    var colId = stagePage.getAttribute("data-column");
    if(!colId) return;
    var col = colById(colId);
    var f = fstate(colId);
    var all = columnTasks(colId);
    var rows = all.filter(matches).slice().sort(compare);
    var metricsEl = document.getElementById("stageMetrics");
    if(metricsEl) metricsEl.innerHTML = metricsHTML(col, rows, all);

    var sortLabel = f.sort === "priority" ? "优先级升序" : (f.sort === "updated" ? "最近更新降序" : (f.sort === "completed" ? "完成时间降序" : "截止日期升序（逾期优先）"));
    var groupLabel = {owner:"负责人",project:"项目",priority:"优先级",module:"模块"}[f.group];
    var bar = document.getElementById("stageResultBar");
    if(bar && col.done){
      var windowRows = all.filter(function(t){ return inDoneRange(t, f.range); });
      bar.innerHTML = '<b>' + RANGE_LABEL[f.range] + ' ' + windowRows.length + ' 条</b>' +
        '<span class="result-note">当前显示 ' + rows.length + ' 条 · 按' + groupLabel + '分组（已加载） · ' + sortLabel +
        ' · 指标由服务端聚合 · 单次最多 100 条' + (f.range === "all" ? ' · 全部按完成时间游标翻页' : '') + '</span>';
    }else if(bar){
      bar.innerHTML = '<b>显示 ' + rows.length + ' / ' + all.length + ' 条</b>' +
        '<span class="result-note">按' + groupLabel + '分组 · ' + sortLabel + ' · 单次最多加载 100 条</span>';
    }

    var groups = {};
    rows.forEach(function(t){
      var k = groupKey(t);
      if(!groups[k]) groups[k] = [];
      groups[k].push(t);
    });
    var names = Object.keys(groups).sort(function(a,b){
      var ra = groupRank(a, f.group), rb = groupRank(b, f.group);
      if(ra !== rb) return ra - rb;
      return a.localeCompare(b,"zh-CN",{numeric:true});
    });
    var lanes = document.getElementById("stageLanes");
    if(!lanes) return;
    if(!names.length){
      lanes.innerHTML = '<div class="stage-empty"><h3>当前筛选下没有工作项</h3>' +
        '<p>可以调整负责人、优先级、截止状态或搜索词，也可以清除全部筛选。</p>' +
        '<button class="btn primary" type="button" data-reset>清除筛选</button></div>';
      return;
    }
    lanes.innerHTML = names.map(function(name){
      return laneHTML(col, groupName(name, f.group), groups[name]);
    }).join("");
  }

  /* ---------------- 路由 ---------------- */
  function routeColumn(){
    var m = location.hash.match(/^#\/column\/([a-z]+)$/);
    return m && COL_IDS.indexOf(m[1]) > -1 ? m[1] : null;
  }
  function renderRoute(){
    closeDrawer();
    var colId = routeColumn();
    if(colId){
      boardHead.hidden = true;
      board.hidden = true;
      stagePage.hidden = false;
      renderColumnPage(colId);
      document.title = colById(colId).name + " · 工作项状态工作页";
      var title = document.getElementById("stageTitle");
      if(title) title.focus({preventScroll:true});
    }else{
      stagePage.hidden = true;
      stagePage.removeAttribute("data-column");
      stagePage.innerHTML = "";
      boardHead.hidden = false;
      board.hidden = false;
      renderBoard();
      document.title = "工作项 · 看板与列状态工作页交互原型";
      board.focus({preventScroll:true});
      if(state.focusId){
        var el = board.querySelector('.card[data-id="' + state.focusId + '"]');
        state.focusId = null;
        if(el){
          el.classList.add("flash");
          try{ el.focus({preventScroll:true}); el.scrollIntoView({block:"center", inline:"center"}); }catch(e){}
          setTimeout(function(){ el.classList.remove("flash"); }, 1200);
        }
      }
    }
  }

  /* ---------------- 详情抽屉 ---------------- */
  function kv(k, v){ return '<div><div class="k">' + esc(k) + '</div><div class="v">' + (v == null ? "—" : v) + '</div></div>'; }
  function openDrawer(id){
    var t = findTask(id);
    if(!t) return;
    var col = colById(t.column);
    drawerTitle.textContent = t.title;
    var d = dueInfo(t);
    var rs = risks(t);
    var html = "";
    html += '<div class="d-sec"><div class="card-tags">' +
      '<span class="tag">' + esc(col.name) + '</span>' + typeTag(t.type) + priTag(t.priority) +
      (t.blocked ? '<span class="tag bad">被阻塞</span>' : '') +
      rs.filter(function(r){ return r !== "被阻塞"; }).map(function(r){ return '<span class="tag warn">' + esc(r) + '</span>'; }).join("") +
    '</div></div>';

    html += '<div class="d-sec"><h3>基本信息</h3><div class="kv">' +
      kv("编号", esc(t.id)) + kv("项目", esc(t.project)) +
      kv("模块", esc(t.module)) + kv("负责人", esc(t.owner || "未分配")) +
      kv("计划版本", esc(t.version || "待规划")) +
      kv("截止日期", t.due ? esc(t.due) : "未设置") +
      kv("进入本列", esc(t.since) + (isDone(t) ? "" : "（" + daysSince(t.since) + " 天）")) +
      kv("实际 / 预估", fmtMin(t.actual) + " / " + fmtMin(t.estimate)) +
      kv("子任务", t.sub[0] + " / " + t.sub[1]) +
      kv("分支", t.branch ? esc(t.branch) : "未关联") +
      '</div></div>';

    if(t.desc) html += '<div class="d-sec"><h3>描述</h3><p class="desc">' + esc(t.desc) + '</p></div>';

    var next = "";
    if(isDone(t)){
      next = "<b>已完成</b>：完成于 " + esc(t.completedAt) + "，周期 " + daysBetween(t.since, t.completedAt) + " 天" +
        (t.due && t.completedAt > t.due ? "，晚于原截止日期 " + esc(t.due) : "，未晚于截止日期") + "。";
    }else if(t.blocked){
      next = "<b>当前被阻塞</b>：" + esc(t.blockedReason || "未填写原因") + "。先解除依赖，再判断是否需要改期或拆分。";
    }else if(d.kind === "over"){
      next = "<b>已逾期</b>：原截止 " + esc(t.due) + "，逾期 " + (-dayDiff(t.due, TODAY)) + " 天。需要当天给出新日期、关闭或升级处理。";
    }else if(t.estimate && t.actual > t.estimate){
      next = "<b>工时已超预估</b>：实际 " + fmtMin(t.actual) + "，预估 " + fmtMin(t.estimate) + "。建议重估剩余工作或拆分。";
    }else if(t.column === "test" && daysSince(t.since) >= 3){
      next = "<b>等待偏长</b>：进入待测试已 " + daysSince(t.since) + " 天，建议确认测试排期。";
    }else{
      next = "<b>暂无风险</b>：按当前截止日期和负责人推进即可。";
    }
    html += '<div class="d-sec"><h3>风险与下一步</h3><div class="derive">' + next + '</div>' +
      '<p class="foot-note">列的统计只读；推进、改期、关闭和计时沿用现有工作项详情，不在工作页里直接改写状态。</p></div>';

    html += '<div class="d-sec"><h3>最近活动</h3><div class="act-list">' +
      '<div class="act-row"><time>11-13</time><span>负责人更新了进度到 ' + (Number(t.progress) || 0) + '%</span></div>' +
      '<div class="act-row"><time>11-12</time><span>从「' + (t.column === "backlog" ? "待处理" : "上一列") + '」进入「' + esc(col.name) + '」</span></div>' +
      '<div class="act-row"><time>11-10</time><span>截止日期调整为 ' + esc(t.due || "未设置") + '</span></div>' +
      '</div></div>';

    html += '<div class="drawer-foot"><button class="btn" type="button" id="drawerLocate">在看板中定位</button>' +
      '<button class="btn primary" type="button" id="drawerCloseBtn">知道了</button></div>';

    drawerBody.innerHTML = html;
    drawer.classList.add("on");
    drawerMask.classList.add("on");
    var locate = document.getElementById("drawerLocate");
    if(locate) locate.addEventListener("click", function(){
      state.focusId = t.id;
      if(location.hash && location.hash !== "#/board") location.hash = "#/board";
      else renderRoute();
    });
    var closeBtn = document.getElementById("drawerCloseBtn");
    if(closeBtn) closeBtn.addEventListener("click", closeDrawer);
  }
  function closeDrawer(){
    drawer.classList.remove("on");
    drawerMask.classList.remove("on");
  }
  drawerMask.addEventListener("click", closeDrawer);
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);

  /* ---------------- 事件 ---------------- */
  function bindCardEvents(root){
    root.addEventListener("click", function(e){
      var add = e.target.closest("[data-add]");
      if(add){ toast("原型演示：新建入口沿用现有抽屉"); return; }
      var card = e.target.closest(".card");
      if(card) openDrawer(card.getAttribute("data-id"));
    });
    root.addEventListener("keydown", function(e){
      if(e.key !== "Enter" && e.key !== " ") return;
      var card = e.target.closest(".card");
      if(!card) return;
      e.preventDefault();
      openDrawer(card.getAttribute("data-id"));
    });
  }
  bindCardEvents(board);

  stagePage.addEventListener("click", function(e){
    var groupBtn = e.target.closest("[data-group]");
    if(groupBtn){
      var colId = stagePage.getAttribute("data-column");
      fstate(colId).group = groupBtn.getAttribute("data-group");
      stagePage.querySelectorAll("[data-group]").forEach(function(btn){ btn.setAttribute("aria-pressed", String(btn === groupBtn)); });
      renderColumnResults();
      return;
    }
    var riskBtn = e.target.closest("[data-risk]");
    if(riskBtn){
      var cid = stagePage.getAttribute("data-column");
      if(colById(cid).done) return;
      fstate(cid).risk = !fstate(cid).risk;
      riskBtn.setAttribute("aria-pressed", String(fstate(cid).risk));
      renderColumnResults();
      return;
    }
    if(e.target.closest("[data-reset]")){
      resetFilters(stagePage.getAttribute("data-column"));
      return;
    }
    if(e.target.closest("#stageThemeBtn")){ toggleTheme(); return; }
    var card = e.target.closest(".card");
    if(card) openDrawer(card.getAttribute("data-id"));
  });
  stagePage.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if(!card) return;
    e.preventDefault();
    openDrawer(card.getAttribute("data-id"));
  });

  function resetFilters(colId){
    var f = fstate(colId);
    f.q = ""; f.project = "all"; f.owner = "all"; f.pri = "all"; f.type = "all"; f.module = "all"; f.due = "all"; f.range = "week"; f.risk = false;
    renderColumnPage(colId);
  }

  stagePage.addEventListener("input", function(e){
    if(e.target.id !== "stageQ") return;
    var colId = stagePage.getAttribute("data-column");
    fstate(colId).q = e.target.value;
    renderColumnResults();
  });
  stagePage.addEventListener("change", function(e){
    var colId = stagePage.getAttribute("data-column");
    if(!colId) return;
    var f = fstate(colId);
    var map = {stageProject:"project",stageOwner:"owner",stagePri:"pri",stageType:"type",stageModule:"module",stageDue:"due",stageRange:"range",stageSort:"sort"};
    var key = map[e.target.id];
    if(!key) return;
    f[key] = e.target.value;
    renderColumnResults();
  });

  qInput.addEventListener("input", function(){ state.q = qInput.value; renderBoard(); });
  PROJECTS.forEach(function(p){
    var opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    projectSel.appendChild(opt);
  });
  projectSel.addEventListener("change", function(){ state.project = projectSel.value; renderBoard(); });

  function toggleTheme(){
    state.theme = state.theme === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", state.theme);
    themeBtn.textContent = state.theme === "light" ? "深色" : "浅色";
    var st = document.getElementById("stageThemeBtn");
    if(st) st.textContent = state.theme === "light" ? "深色" : "浅色";
  }
  themeBtn.addEventListener("click", toggleTheme);

  window.addEventListener("hashchange", renderRoute);
  try{
    if(new URLSearchParams(location.search).get("theme") === "dark") toggleTheme();
    var rp = new URLSearchParams(location.search).get("range");
    if(rp && ["week","month","quarter","all"].indexOf(rp) > -1) vs.done.range = rp;
  }catch(e){ /* 本地文件环境不支持 URLSearchParams 时忽略 */ }
  renderRoute();
})();
</script>
</body>
</html>
