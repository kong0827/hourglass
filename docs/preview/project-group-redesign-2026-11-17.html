<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙漏 · 项目分组（简化版）原型</title>
<style>
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7; --surface-hover:#F2F4F7; --surface-active:#E9ECF1;
  --border:#E4E7EC; --border-strong:#D0D5DD; --text:#101828; --text-2:#475467; --text-3:#667085;
  --primary:#2563EB; --primary-soft:#EFF4FF; --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-fg:#B54708;
  --danger:#F04438; --danger-soft:#FEF3F2; --danger-fg:#B42318;
  --info:#2E90FA; --info-soft:#EFF8FF; --info-fg:#175CD3;
  --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-fg:#5B3FD1;
  --toast-bg:#101828; --toast-fg:#F2F4F7; --toast-action:#93B4F8;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r-sm:8px; --r-md:10px; --r-lg:12px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 2px 4px -2px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --shadow-xl:0 24px 48px -12px rgba(16,24,40,.18);
  --sidebar-w:216px; --topbar-h:56px;
}
[data-theme="dark"]{
  --bg-app:#0F1115; --surface:#171A21; --surface-sunken:#1E222B; --surface-hover:#1E222B; --surface-active:#262B36;
  --border:#262B36; --border-strong:#344053; --text:#F2F4F7; --text-2:#C6CDD8; --text-3:#8A93A6;
  --primary:#4E7FE8; --primary-soft:#1B2B4D; --primary-border:#2E4A85; --primary-fg:#7DA2F0;
  --success:#32D583; --success-soft:#0B2E1F; --success-fg:#6CE9A6;
  --warning:#F79009; --warning-soft:#33230A; --warning-fg:#FEC84B;
  --danger:#F97066; --danger-soft:#3B1512; --danger-fg:#FDA29B;
  --info:#53B1FD; --info-soft:#0B2537; --info-fg:#84CAFF;
  --plum:#9B8AFB; --plum-soft:#251D47; --plum-fg:#B7A6FE;
  --toast-bg:#F2F4F7; --toast-fg:#101828; --toast-action:#1D4ED8;
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-sm:0 2px 4px -2px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 12px 24px -6px rgba(0,0,0,.4),0 4px 8px -4px rgba(0,0,0,.3);
  --shadow-xl:0 24px 48px -12px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
[hidden]{display:none!important;}
body{font-family:var(--font-sans);font-size:13px;color:var(--text);background:var(--bg-app);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;}
button:disabled{cursor:not-allowed;}
input,select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);height:34px;padding:0 10px;font-size:12.5px;}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.app{display:flex;min-height:100vh;}
/* ---------- 侧栏（产品上下文） ---------- */
.sidebar{width:var(--sidebar-w);flex:0 0 auto;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;}
.side-brand{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;flex:0 0 auto;}
.side-brand-name{font-size:15px;font-weight:650;letter-spacing:-.01em;}
.side-nav{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:10px 12px 12px;}
.nav-sec{padding:10px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-3);}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13px;font-weight:550;width:100%;text-align:left;}
.nav-item svg{flex:0 0 auto;opacity:.8;}
.nav-item:hover{background:var(--surface-hover);color:var(--text);}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:650;}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px;}
.avatar{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--primary);flex:0 0 auto;}
.side-user-n{font-size:12.5px;font-weight:600;line-height:1.25;}
.side-user-r{font-size:11px;color:var(--text-3);}
/* ---------- 顶栏 ---------- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 max(24px, calc((100% - 1680px)/2 + 24px));background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.tb-title{font-size:15px;font-weight:650;letter-spacing:-.01em;}
.tb-sub{font-size:12px;color:var(--text-3);margin-top:1px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.proto-pill{font-size:11px;font-weight:650;padding:3px 9px;border-radius:var(--r-pill);background:var(--warning-soft);color:var(--warning-fg);white-space:nowrap;}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);}
/* ---------- 内容 ---------- */
.content{flex:1 1 auto;width:100%;max-width:1680px;margin:0 auto;padding:20px 24px 64px;min-width:0;}
.pagebar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);flex-wrap:wrap;}
.search-box{position:relative;flex:0 0 auto;}
.search-box input{width:280px;padding-left:32px;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search-box kbd{margin-left:6px;}
.pagebar .spacer{flex:1;}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s;}
.btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong);}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px;}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.28);}
.btn.primary:hover{background:var(--primary-fg);border-color:var(--primary-fg);color:#fff;}
.btn.primary:disabled{background:var(--primary);border-color:var(--primary);opacity:.45;box-shadow:none;}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);}
.btn.soft:hover{background:var(--primary-border);border-color:var(--primary-border);color:var(--primary-fg);}
.btn.danger{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger-fg);}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger-fg);}
/* ---------- 总览条 ---------- */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;margin-bottom:14px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs);}
.stat{background:var(--surface);padding:11px 14px;min-width:0;}
.stat-k{font-size:11.5px;color:var(--text-3);white-space:nowrap;}
.stat-v{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-v small{font-size:11.5px;font-weight:600;color:var(--text-3);margin-left:3px;}
.stat-v.good{color:var(--success-fg);}
.stat-v.warn{color:var(--warning-fg);}
/* ---------- 分组 ---------- */
.group{margin-bottom:14px;padding:10px 14px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);}
.ghead{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 2px;border-radius:var(--r-sm);transition:background .15s;}
.ghead:hover{background:var(--surface-hover);}
.gchev{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--text-3);flex:0 0 auto;}
.gchev:hover{color:var(--text);background:var(--surface-active);}
.gchev svg{transition:transform .18s ease;}
.gchev[aria-expanded="false"] svg{transform:rotate(-90deg);}
.gdot{width:4px;height:16px;border-radius:2px;flex:0 0 auto;}
.gname{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;}
.gmeta{font-size:12px;color:var(--text-3);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gspace{flex:1 1 auto;}
.gmore{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);flex:0 0 auto;}
.gmore:hover{background:var(--surface-active);color:var(--text);}
.ginput{height:30px;width:200px;font-size:14px;font-weight:650;padding:0 8px;}
.gbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px;}
.group.is-ungrouped{border-style:dashed;box-shadow:none;background:transparent;}
.group.is-ungrouped .ghead:hover{background:var(--surface-hover);}
.group.is-ungrouped .gname{color:var(--text-2);}
/* ---------- 项目卡 ---------- */
.proj{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;min-width:0;transition:border-color .15s,box-shadow .15s;}
.proj:hover{border-color:var(--primary-border);box-shadow:var(--shadow-sm);}
.ptop{display:flex;align-items:center;gap:8px;min-width:0;}
.pname{flex:1 1 auto;min-width:0;padding:0;text-align:left;font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pname:hover{color:var(--primary-fg);}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap;flex:0 0 auto;}
.badge.ok{background:var(--success-soft);color:var(--success-fg);}
.badge.off{background:var(--surface-sunken);color:var(--text-3);}
.pmeta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);flex-wrap:wrap;}
.pav{width:18px;height:18px;border-radius:6px;background:var(--primary-soft);color:var(--primary-fg);font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;}
.pmeta .sep{width:3px;height:3px;border-radius:50%;background:var(--border-strong);flex:0 0 auto;}
.pbar{display:flex;height:6px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-sunken);}
.pbar i{display:block;height:100%;}
.pbar .m{background:var(--info);}
.pbar .p{background:var(--plum);}
.plegend{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--text-3);}
.plegend b{color:var(--text-2);font-weight:650;font-variant-numeric:tabular-nums;}
.plegend .k{display:inline-flex;align-items:center;gap:5px;}
.plegend .k::before{content:"";width:7px;height:7px;border-radius:2px;}
.plegend .k.m::before{background:var(--info);}
.plegend .k.p::before{background:var(--plum);}
.plegend .ontime{margin-left:auto;white-space:nowrap;}
.plegend .ontime b{color:var(--text-2);}
.plegend .ontime.good b{color:var(--success-fg);}
.plegend .ontime.warn b{color:var(--warning-fg);}
.pdesc{font-size:12px;color:var(--text-3);line-height:1.5;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pfoot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding-top:10px;margin-top:1px;}
.pbtn{height:26px;padding:0 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;}
.pbtn:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text);}
.plink{margin-left:auto;height:26px;padding:0 4px;border-radius:6px;font-size:12px;font-weight:650;color:var(--primary-fg);display:inline-flex;align-items:center;gap:4px;}
.plink:hover{background:var(--primary-soft);}
@keyframes flash{0%{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-border);}100%{border-color:var(--border);box-shadow:0 0 0 0 transparent;}}
.proj.flash{animation:flash 1.1s ease-out 1;}
/* ---------- 空状态 ---------- */
.gempty{grid-column:1/-1;min-height:64px;border:1px dashed var(--border-strong);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--text-3);}
.linkbtn{font-size:12.5px;font-weight:650;color:var(--primary-fg);padding:2px 4px;border-radius:5px;}
.linkbtn:hover{background:var(--primary-soft);}
.noresult{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);color:var(--text-3);font-size:12.5px;}
.noresult b{font-size:13.5px;color:var(--text);}
.noresult svg{color:var(--text-3);margin-bottom:2px;}
/* ---------- 新建分组 ---------- */
.newgroup{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-xs);}
.newgroup input{flex:1 1 auto;min-width:0;max-width:320px;}
/* ---------- 全部项目汇总 ---------- */
.summary{margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);overflow:hidden;}
.sumhead{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:0 14px;text-align:left;}
.sumhead:hover{background:var(--surface-hover);}
.sumhead .gchev svg{transition:transform .18s ease;}
.sumhead[aria-expanded="false"] .gchev svg{transform:rotate(-90deg);}
.sumtitle{font-size:13px;font-weight:700;white-space:nowrap;}
.summeta{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sumhint{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;}
.sumbody{border-top:1px solid var(--border);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{font-size:11.5px;font-weight:650;color:var(--text-3);text-align:left;padding:10px 14px;background:var(--surface-sunken);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover td{background:var(--surface-hover);}
tr.grprow td{background:var(--surface-sunken);font-weight:700;font-size:12px;padding:8px 14px;}
tr.grprow .g{display:inline-flex;align-items:center;gap:8px;}
tr.grprow .sub{font-weight:500;color:var(--text-3);margin-left:12px;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.bar-duo{display:inline-flex;height:7px;width:96px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-sunken);vertical-align:middle;margin-right:8px;}
.bar-duo i{display:block;height:100%;}
.bar-duo .m{background:var(--info);}
.bar-duo .p{background:var(--plum);}
/* ---------- 弹出层 ---------- */
.pop{position:fixed;z-index:50;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:5px;display:none;}
.pop.show{display:block;}
.pop:focus{outline:none;}
.pop-hd{font-size:11px;font-weight:650;color:var(--text-3);padding:6px 9px 4px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pop-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--text-2);text-align:left;white-space:nowrap;}
.pop-item:hover{background:var(--surface-hover);color:var(--text);}
.pop-item:disabled{opacity:.4;pointer-events:none;}
.pop-item.danger{color:var(--danger-fg);}
.pop-item.danger:hover{background:var(--danger-soft);color:var(--danger-fg);}
.pop-item .cdot{width:8px;height:8px;border-radius:3px;flex:0 0 auto;}
.pop-item .check{margin-left:auto;color:var(--primary-fg);flex:0 0 auto;}
.pop-sep{height:1px;background:var(--border);margin:5px 0;}
.swatches{display:flex;gap:8px;padding:9px;}
.swatches button{width:20px;height:20px;border-radius:6px;}
.swatches button.on{outline:2px solid var(--text);outline-offset:1px;}
/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;}
.overlay.show{opacity:1;pointer-events:auto;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:420px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);z-index:61;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.mhead{display:flex;align-items:center;padding:16px 18px 6px;}
.mtitle{font-size:15px;font-weight:700;}
.mclose{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);}
.mclose:hover{background:var(--surface-hover);color:var(--text);}
.mbody{padding:8px 18px 4px;display:flex;flex-direction:column;gap:14px;}
.mfoot{padding:16px 18px;display:flex;justify-content:flex-end;gap:8px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
.field label .req{color:var(--danger);}
.field input,.field select{width:100%;}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.5;}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);display:flex;align-items:center;gap:12px;background:var(--toast-bg);color:var(--toast-fg);font-size:12.5px;font-weight:600;padding:9px 10px 9px 16px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:70;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{color:var(--toast-action);font-weight:700;font-size:12.5px;padding:3px 6px;border-radius:5px;}
.toast button:hover{background:rgba(127,127,127,.18);}
.toast.no-undo{padding-right:16px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;}
}
@media (max-width:1240px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (max-width:960px){
  .sidebar{display:none;}
  .content{padding:16px 14px 48px;}
  .gbody{grid-template-columns:1fr;}
  .gmeta{display:none;}
  .search-box{flex:1 1 auto;}
  .search-box input{width:100%;}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧栏：产品上下文 ===== -->
  <aside class="sidebar">
    <div class="side-brand">
      <span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2h12M6 22h12M7 2v4l5 6 5-6V2M7 22v-4l5-6 5 6v4"/></svg></span>
      <span class="side-brand-name">沙漏</span>
    </div>
    <nav class="side-nav">
      <div class="nav-sec">工作</div>

<script>
(function(){
"use strict";

/* ================== 演示数据 ================== */
var PALETTE = ["#2563EB","#7A5AF8","#0E7C70","#D48806","#C11574","#667085"];
var groups = [
  {id:"g1", name:"核心交易", color:"#2563EB"},
  {id:"g2", name:"数据中台", color:"#7A5AF8"},
  {id:"g3", name:"增长线",   color:"#0E7C70"}
];
var projects = [
  {id:"p1", name:"支付网关", group:"g1", owner:"陈晓",   firstRel:"2026-06-15", tasks:128, vers:[2,1,1], mvp:1160, post:12830, ontime:92, desc:"统一收单、渠道路由与退款"},
  {id:"p2", name:"清结算",   group:"g1", owner:"王一帆", firstRel:"2026-08-02", tasks:64,  vers:[1,1,0], mvp:940,  post:3120,  ontime:85, desc:"日终对账、分账与资金归集"},
  {id:"p3", name:"实时数仓", group:"g2", owner:"李婷",   firstRel:"",          tasks:56,  vers:[0,1,2], mvp:2180, post:0,     ontime:78, desc:"Flink 实时链路与 DWD 主题"},
  {id:"p4", name:"指标平台", group:"g2", owner:"孔祥劲", firstRel:"2026-05-20", tasks:73,  vers:[1,0,1], mvp:1520, post:4410,  ontime:88, desc:"指标口径、血缘与自助分析"},
  {id:"p5", name:"推荐引擎", group:"",   owner:"陈晓",   firstRel:"",          tasks:41,  vers:[0,1,1], mvp:860,  post:0,     ontime:0,  desc:"召回、排序与冷启动策略"},
  {id:"p6", name:"运营后台", group:"",   owner:"李婷",   firstRel:"2026-03-11", tasks:97,  vers:[3,0,1], mvp:2310, post:6880,  ontime:81, desc:"活动配置、审核与投放"}
];

/* ================== 状态 ================== */
var collapsed = {};        // gid / "__un" -> true
var renamingId = null;
var pendingDeleteId = null;
var addingGroup = false;
var summaryOpen = false;
var kw = "";
var popGid = null, popPid = null;
var undoFn = null, toastTimer = null;
var lastFocus = null;

var ICON = {
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  move:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 12.5h5m-2-2 2 2-2 2"/></svg>',
  arrow:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  check:'<svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>'
};

function gOf(id){ for(var i=0;i<groups.length;i++) if(groups[i].id===id) return groups[i]; return null; }
function pOf(id){ for(var i=0;i<projects.length;i++) if(projects[i].id===id) return projects[i]; return null; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function sum(list,key){ return list.reduce(function(a,p){return a+p[key];},0); }
function fmtH(min){
  if(!min) return "0h";
  var h = Math.round(min/60), d = Math.floor(h/8);
  if(h >= 80) return d+"d "+(h%8)+"h";
  return h+"h";
}
function debounce(fn, ms){ var t; return function(){ var a=arguments, s=this; clearTimeout(t); t=setTimeout(function(){fn.apply(s,a);},ms); }; }

/* ================== toast ================== */
function showToast(msg, fn){
  var t = document.getElementById("toast");
  undoFn = fn || null;
  t.className = "toast show" + (fn ? "" : " no-undo");
  t.innerHTML = "<span>"+esc(msg)+"</span>" + (fn ? '<button type="button" data-undo>撤销</button>' : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); undoFn = null; }, fn ? 6000 : 2600);
}
function toast(msg){ showToast(msg, null); }
function toastUndo(msg, fn){ showToast(msg, fn); }
document.getElementById("toast").addEventListener("click", function(e){
  if(e.target.closest("[data-undo]")){
    var f = undoFn; undoFn = null;
    document.getElementById("toast").classList.remove("show");
    if(f) f();
  }
});

/* ================== 渲染 ================== */
function matches(p){ return !kw || p.name.toLowerCase().indexOf(kw) >= 0; }

function ontimeHTML(p){
  if(!p.ontime) return '<span class="ontime" title="尚未产生已发布版本">准时 <b>—</b></span>';
  var cls = p.ontime >= 90 ? " good" : (p.ontime < 80 ? " warn" : "");
  return '<span class="ontime'+cls+'" title="准时完成率">准时 <b>'+p.ontime+'%</b></span>';
}

function cardHTML(p){
  var total = p.mvp + p.post;
  var mw = total ? Math.round(p.mvp/total*100) : 0;
  var versTotal = p.vers[0] + p.vers[1] + p.vers[2];
  var versHTML = versTotal
    ? '<span title="已发布 '+p.vers[0]+' / 进行中 '+p.vers[1]+' / 规划 '+p.vers[2]+'">版本 '+p.vers.join("/")+'</span>'
    : '<span>暂无版本</span>';
  var badge = p.firstRel
    ? '<span class="badge ok" title="首版上线日">首版 '+esc(p.firstRel.slice(5).replace("-","/"))+'</span>'
    : '<span class="badge off" title="在项目页标记首版上线后，可查看首版 / 迭代拆分">未标记首版</span>';
  var bar = total
    ? '<div class="pbar" role="img" aria-label="首版 '+fmtH(p.mvp)+'，迭代 '+fmtH(p.post)+'"><i class="m" style="width:'+mw+'%"></i><i class="p" style="width:'+(100-mw)+'%"></i></div>'
    : '<div class="pbar" aria-hidden="true"></div>';
  var legend = total
    ? '<div class="plegend"><span class="k m">首版 <b>'+fmtH(p.mvp)+'</b></span><span class="k p">迭代 <b>'+fmtH(p.post)+'</b></span>'+ontimeHTML(p)+'</div>'
    : '<div class="plegend"><span>尚无工时</span>'+ontimeHTML(p)+'</div>';
  return '<article class="proj" id="card-'+p.id+'">'
    + '<div class="ptop"><button class="pname" data-act="open" data-pid="'+p.id+'">'+esc(p.name)+'</button>'+badge+'</div>'
    + (p.desc ? '<div class="pdesc">'+esc(p.desc)+'</div>' : '')
    + '<div class="pmeta"><span class="pav" aria-hidden="true">'+esc(p.owner.slice(0,1))+'</span><span>'+esc(p.owner)+'</span>'
    + '<span class="sep"></span><span>'+p.tasks+' 工作项</span>'
    + '<span class="sep"></span>'+versHTML+'</div>'
    + bar + legend
    + '<div class="pfoot"><button class="pbtn" data-act="move" data-pid="'+p.id+'">'+ICON.move+'移至</button>'
    + '<button class="plink" data-act="open" data-pid="'+p.id+'">打开'+ICON.arrow+'</button></div>'
    + '</article>';
}

function emptyHTML(gid, searching){
  if(searching) return "";
  return '<div class="gempty"><span>这个分组还没有项目</span><button class="linkbtn" data-act="newIn" data-gid="'+gid+'">新建项目</button></div>';
}

function groupHTML(g, shown, searching){
  var all = projects.filter(function(p){ return p.group === g.id; });
  var closed = !searching && !!collapsed[g.id];
  var renaming = renamingId === g.id;
  var deleting = pendingDeleteId === g.id;
  var rated = all.filter(function(p){ return p.ontime > 0; });
  var avgOn = rated.length ? Math.round(sum(rated,"ontime")/rated.length) : 0;
  var metaText = all.length + " 个项目";
  if(sum(all,"tasks")) metaText += " · 工作项 "+sum(all,"tasks");
  if(sum(all,"mvp") + sum(all,"post")) metaText += " · 首版 "+fmtH(sum(all,"mvp"))+" · 迭代 "+fmtH(sum(all,"post"));
  if(avgOn) metaText += " · 准时 "+avgOn+"%";
  var head;

  if(deleting){
    head = '<div class="ghead" data-gid="'+g.id+'">'
      + '<span class="gdot" style="background:'+g.color+'"></span>'
      + '<span class="gname">删除「'+esc(g.name)+'」？</span>'
      + '<span class="gmeta">组内 '+all.length+' 个项目会回到「未分组」，可撤销</span>'
      + '<span class="gspace"></span>'
      + '<button class="btn sm" data-act="delCancel">取消</button>'
      + '<button class="btn sm danger" data-act="delOk" data-gid="'+g.id+'">删除分组</button>'
      + '</div>';
  } else if(renaming){
    head = '<div class="ghead" data-gid="'+g.id+'">'
      + '<span class="gdot" style="background:'+g.color+'"></span>'
      + '<input class="ginput" id="renameInput" data-gid="'+g.id+'" value="'+esc(g.name)+'" maxlength="20" aria-label="分组名称">'
      + '<span class="gmeta">Enter 保存 · Esc 取消</span>'
      + '</div>';
  } else {
    head = '<div class="ghead" data-gid="'+g.id+'">'
      + '<button class="gchev" data-act="toggle" data-gid="'+g.id+'" aria-expanded="'+(!closed)+'" aria-controls="gbody-'+g.id+'" aria-label="'+(closed?"展开":"收起")+'「'+esc(g.name)+'」">'+ICON.chev+'</button>'
      + '<span class="gdot" style="background:'+g.color+'"></span>'
      + '<span class="gname">'+esc(g.name)+'</span>'
      + '<span class="gmeta">'+metaText+'</span>'
      + '<span class="gspace"></span>'
      + '<button class="btn soft sm" data-act="newIn" data-gid="'+g.id+'">'+ICON.plus+'新建项目</button>'
      + '<button class="gmore" data-act="menu" data-gid="'+g.id+'" aria-haspopup="menu" aria-label="「'+esc(g.name)+'」分组操作">'+ICON.dots+'</button>'
      + '</div>';
  }

  var body = "";
  if(!closed && !deleting){
    body = '<div class="gbody" id="gbody-'+g.id+'">'
      + (shown.length ? shown.map(cardHTML).join("") : emptyHTML(g.id, searching))
      + '</div>';
  }
  return '<section class="group" id="grp-'+g.id+'" data-gid="'+g.id+'">'+head+body+'</section>';
}

function ungroupedHTML(shown, searching){
  var all = projects.filter(function(p){ return p.group === ""; });
  var closed = !searching && !!collapsed["__un"];
  var head = '<div class="ghead" data-gid="__un">'
    + '<button class="gchev" data-act="toggle" data-gid="__un" aria-expanded="'+(!closed)+'" aria-controls="gbody-un" aria-label="'+(closed?"展开":"收起")+'未分组">'+ICON.chev+'</button>'
    + '<span class="gdot" style="background:var(--border-strong)"></span>'
    + '<span class="gname">未分组</span>'
    + '<span class="gmeta">'+all.length+' 个项目</span>'
    + '<span class="gspace"></span>'
    + '<button class="btn soft sm" data-act="newIn" data-gid="">'+ICON.plus+'新建项目</button>'
    + '</div>';
  var body = "";
  if(!closed){
    body = '<div class="gbody" id="gbody-un">'+shown.map(cardHTML).join("")+'</div>';
  }
  return '<section class="group is-ungrouped" id="grp-un" data-gid="__un">'+head+body+'</section>';
}

function renderAddGroup(){
  var w = document.getElementById("addGroupWrap");
  if(kw || !addingGroup){ w.innerHTML = ""; return; }
  w.innerHTML = '<div class="newgroup">'
    + '<input id="ngInput" placeholder="分组名称，如：增长线" maxlength="20" aria-label="新分组名称">'
    + '<button class="btn sm soft" data-act="ngAdd">添加</button>'
    + '<button class="btn sm" data-act="ngCancel">取消</button></div>';
  var i = document.getElementById("ngInput");
  if(i) i.focus();
}

function render(){
  var searching = !!kw;
  var shownCount = 0;
  var html = "";

  groups.forEach(function(g){
    var shown = projects.filter(function(p){ return p.group === g.id && matches(p); });
    shownCount += shown.length;
    if(searching && !shown.length) return;
    html += groupHTML(g, shown, searching);
  });

  var unShown = projects.filter(function(p){ return p.group === "" && matches(p); });
  if(unShown.length){
    shownCount += unShown.length;
    html += ungroupedHTML(unShown, searching);
  }

  document.getElementById("list").innerHTML = html;
  document.getElementById("noresult").hidden = !(searching && shownCount === 0);
  document.getElementById("noresultKw").textContent = kw;

  renderAddGroup();
  renderSummary();
  renderStats();
  updateSub();

  if(renamingId){
    var ri = document.getElementById("renameInput");
    if(ri){ ri.focus(); ri.select(); }
  }
}

function updateSub(){
  var count = projects.length;
  var gcount = groups.length;
  document.getElementById("tbSub").textContent = count+" 个项目 · "+gcount+" 个分组 · 分组只做归类，不影响版本与统计";
}

function renderStats(){
  var rated = projects.filter(function(p){ return p.ontime > 0; });
  var on = rated.length ? Math.round(sum(rated,"ontime")/rated.length) : 0;
  var noRel = projects.filter(function(p){ return !p.firstRel; }).length;
  document.getElementById("sProjects").textContent = projects.length;
  document.getElementById("sGroups").textContent = groups.length;
  document.getElementById("sMvp").textContent = fmtH(sum(projects,"mvp"));
  document.getElementById("sPost").textContent = fmtH(sum(projects,"post"));
  var onEl = document.getElementById("sOn");
  onEl.textContent = on ? on+"%" : "—";
  onEl.classList.toggle("good", on >= 90);
  onEl.classList.toggle("warn", on > 0 && on < 80);
  document.getElementById("sNoRel").textContent = noRel;
}

/* ================== 全部项目汇总 ================== */
function summaryGroupRow(name, color, kids){
  var sub = kids.length+" 个项目";
  if(sum(kids,"tasks")) sub += " · 工作项 "+sum(kids,"tasks");
  if(sum(kids,"mvp") + sum(kids,"post")) sub += " · 首版 "+fmtH(sum(kids,"mvp"))+" · 迭代 "+fmtH(sum(kids,"post"));
  return '<tr class="grprow"><td colspan="7"><span class="g">'
    + '<i style="width:8px;height:8px;border-radius:3px;background:'+color+';display:inline-block;"></i>'
    + esc(name)+'</span>'
    + '<span class="sub">'+sub+'</span></td></tr>';
}

function summaryRow(p){
  var total = p.mvp + p.post;
  var mw = total ? Math.round(p.mvp/total*100) : 0;
  return '<tr><td style="font-weight:650;">'+esc(p.name)+'</td>'
    + '<td>'+esc(p.owner)+'</td>'
    + '<td>'+(p.firstRel ? esc(p.firstRel) : '<span style="color:var(--text-3);">未标记</span>')+'</td>'
    + '<td class="num">'+p.vers.join(" / ")+'</td>'
    + '<td>'+(total
        ? '<span class="bar-duo"><i class="m" style="width:'+mw+'%"></i><i class="p" style="width:'+(100-mw)+'%"></i></span>'+fmtH(p.mvp)+' · '+fmtH(p.post)
        : '<span style="color:var(--text-3);">暂无工时</span>')+'</td>'
    + '<td class="num">'+(p.ontime ? p.ontime+"%" : '<span style="color:var(--text-3);">—</span>')+'</td>'
    + '<td><button class="linkbtn" data-act="open" data-pid="'+p.id+'">打开</button></td></tr>';
}

function renderSummary(){
  document.getElementById("summary").hidden = !!kw;
  var head = document.getElementById("sumHead");
  var body = document.getElementById("sumBody");
  head.setAttribute("aria-expanded", summaryOpen ? "true" : "false");
  body.hidden = !summaryOpen;

  var rated = projects.filter(function(p){ return p.ontime > 0; });
  var avgOn = rated.length ? Math.round(sum(rated,"ontime")/rated.length) : 0;
  var meta = projects.length+" 个项目 · 首版 "+fmtH(sum(projects,"mvp"))+" · 迭代 "+fmtH(sum(projects,"post"));
  if(avgOn) meta += " · 准时 "+avgOn+"%";
  document.getElementById("sumMeta").textContent = meta;
  document.getElementById("sumHint").textContent = summaryOpen ? "点击收起" : "点开对比各分组";

  if(!summaryOpen){ body.innerHTML = ""; return; }

  var rows = "";
  groups.forEach(function(g){
    var kids = projects.filter(function(p){ return p.group === g.id; });
    if(!kids.length) return;
    rows += summaryGroupRow(g.name, g.color, kids);
    kids.forEach(function(p){ rows += summaryRow(p); });
  });
  var un = projects.filter(function(p){ return p.group === ""; });
  if(un.length){
    rows += summaryGroupRow("未分组", "var(--border-strong)", un);
    un.forEach(function(p){ rows += summaryRow(p); });
  }
  body.innerHTML = '<div class="tbl-wrap"><table>'
    + '<thead><tr><th>项目</th><th>负责人</th><th>首版上线</th><th class="num">版本（发 / 进 / 划）</th><th>投入（首版 · 迭代）</th><th class="num">准时完成率</th><th>操作</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>';
}

/* ================== 分组操作 ================== */
function toggle(gid){
  if(kw) return;
  collapsed[gid] = !collapsed[gid];
  render();
}

function commitRename(gid){
  if(renamingId !== gid) return;
  var inp = document.getElementById("renameInput");
  var name = inp ? inp.value.trim() : "";
  var g = gOf(gid);
  renamingId = null;
  if(g && name && name !== g.name){
    g.name = name;
    toast("已重命名为「"+name+"」");
  }
  render();
}

function doDelete(gid){
  var idx = -1;
  for(var i=0;i<groups.length;i++) if(groups[i].id===gid){ idx=i; break; }
  if(idx < 0) return;
  var g = groups[idx];
  var members = projects.filter(function(p){ return p.group === gid; }).map(function(p){ return p.id; });
  members.forEach(function(pid){ pOf(pid).group = ""; });
  groups.splice(idx, 1);
  pendingDeleteId = null;
  delete collapsed["__un"];
  render();
  toastUndo("已删除分组「"+g.name+"」", function(){
    groups.splice(Math.min(idx, groups.length), 0, g);
    members.forEach(function(pid){ pOf(pid).group = gid; });
    delete collapsed[gid];
    render();
  });
}

function moveProject(pid, toGid){
  var p = pOf(pid);
  if(!p || p.group === toGid) return;
  var from = p.group;
  p.group = toGid;
  delete collapsed[toGid || "__un"];
  closePop();
  render();
  var el = document.getElementById("card-"+pid);
  if(el){
    el.classList.add("flash");
    el.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  toastUndo("已移到「"+(toGid ? gOf(toGid).name : "未分组")+"」", function(){
    p.group = from;
    delete collapsed[from || "__un"];
    render();
  });
}

/* ================== 弹出层 ================== */
var popEl = document.getElementById("pop");
var popTrigger = null;

function showPop(trigger){
  popTrigger = trigger;
  popEl.classList.add("show");
  var r = trigger.getBoundingClientRect();
  var w = popEl.offsetWidth, h = popEl.offsetHeight;
  var left = r.left;
  if(left + w > window.innerWidth - 12) left = window.innerWidth - w - 12;
  left = Math.max(12, left);
  var top = r.bottom + 6;
  if(top + h > window.innerHeight - 12) top = r.top - h - 6;
  popEl.style.left = left + "px";
  popEl.style.top = Math.max(12, top) + "px";
  popEl.tabIndex = -1;
  popEl.focus();
}function closePop(){ popEl.classList.remove("show"); popTrigger = null; }

function openMenu(btn){
  var gid = btn.dataset.gid;
  var g = gOf(gid);
  if(!g) return;
  popGid = gid;
  var idx = groups.indexOf(g);
  popEl.innerHTML = '<div class="pop-hd">分组「'+esc(g.name)+'」</div>'
    + '<button class="pop-item" role="menuitem" data-pop="rename">重命名</button>'
    + '<button class="pop-item" role="menuitem" data-pop="color">换颜色</button>'
    + '<div class="pop-sep"></div>'
    + '<button class="pop-item" role="menuitem" data-pop="up"'+(idx === 0 ? ' disabled' : '')+'>上移</button>'
    + '<button class="pop-item" role="menuitem" data-pop="down"'+(idx === groups.length-1 ? ' disabled' : '')+'>下移</button>'
    + '<div class="pop-sep"></div>'
    + '<button class="pop-item danger" role="menuitem" data-pop="delete">删除分组</button>';
  showPop(btn);
}

function openColors(g){
  popEl.innerHTML = '<div class="pop-hd">「'+esc(g.name)+'」颜色</div>'
    + '<div class="swatches">'+PALETTE.map(function(c){
        return '<button type="button" data-color="'+c+'" style="background:'+c+'" aria-label="颜色 '+c+'"'+(g.color===c?' class="on"':'')+'></button>';
      }).join("")+'</div>';
}

function openMove(btn){
  var p = pOf(btn.dataset.pid);
  if(!p) return;
  popPid = p.id;
  var html = '<div class="pop-hd">移动到分组</div>'
    + '<button class="pop-item" role="menuitem" data-move-to="">未分组'+(p.group === "" ? ICON.check : "")+'</button>';
  groups.forEach(function(g){
    html += '<button class="pop-item" role="menuitem" data-move-to="'+g.id+'">'
      + '<span class="cdot" style="background:'+g.color+'"></span>'+esc(g.name)
      + (p.group === g.id ? ICON.check : "")+'</button>';
  });
  popEl.innerHTML = html;
  showPop(btn);
}

popEl.addEventListener("click", function(e){
  var ci = e.target.closest("[data-color]");
  if(ci){
    var g = gOf(popGid);
    if(g){ g.color = ci.dataset.color; }
    closePop();
    render();
    if(g) toast("已换色");
    return;
  }
  var it = e.target.closest("[data-pop]");
  if(it){
    var action = it.dataset.pop;
    var gid = popGid;
    var grp = gOf(gid);
    if(action === "rename"){ closePop(); renamingId = gid; pendingDeleteId = null; render(); }
    else if(action === "color"){ openColors(grp); }
    else if(action === "delete"){ closePop(); pendingDeleteId = gid; render(); }
    else if(action === "up" || action === "down"){
      var i = groups.indexOf(grp), j = action === "up" ? i-1 : i+1;
      if(j < 0 || j >= groups.length) return;
      groups.splice(i, 1); groups.splice(j, 0, grp);
      closePop(); render();
      toast("已"+ (action === "up" ? "上移" : "下移") +"分组「"+grp.name+"」");
    }
    return;
  }
  var mi = e.target.closest("[data-move-to]");
  if(mi){ moveProject(popPid, mi.dataset.moveTo); }
});

document.addEventListener("click", function(e){
  if(e.target.closest("#pop")) return;
  if(e.target.closest('[data-act="menu"], [data-act="move"]')) return;
  closePop();
});
window.addEventListener("resize", closePop);
window.addEventListener("scroll", closePop, true);

/* ================== 列表交互 ================== */
var list = document.getElementById("list");

list.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(t){
    var act = t.dataset.act;
    if(act === "toggle"){ toggle(t.dataset.gid); return; }
    if(act === "menu"){ e.stopPropagation(); openMenu(t); return; }
    if(act === "move"){ e.stopPropagation(); openMove(t); return; }
    if(act === "newIn"){ openNew(t.dataset.gid || ""); return; }
    if(act === "open"){ var p = pOf(t.dataset.pid); if(p) toast("原型中：打开项目「"+p.name+"」"); return; }
    if(act === "delOk"){ doDelete(t.dataset.gid); return; }
    if(act === "delCancel"){ pendingDeleteId = null; render(); return; }
  }
  var head = e.target.closest(".ghead");
  if(head && !pendingDeleteId && !renamingId && !e.target.closest("input")){
    toggle(head.dataset.gid);
  }
});

document.getElementById("sumBody").addEventListener("click", function(e){
  var b = e.target.closest('[data-act="open"]');
  if(!b) return;
  var p = pOf(b.dataset.pid);
  if(p) toast("原型中：打开项目「"+p.name+"」");
});

list.addEventListener("keydown", function(e){
  if(e.target.id === "renameInput"){
    if(e.key === "Enter"){ e.preventDefault(); commitRename(e.target.dataset.gid); }
    else if(e.key === "Escape"){ e.preventDefault(); renamingId = null; render(); }
  }
});
list.addEventListener("focusout", function(e){
  if(e.target.id === "renameInput"){ commitRename(e.target.dataset.gid); }
});

/* ================== 新建分组 ================== */
var addWrap = document.getElementById("addGroupWrap");

addWrap.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  if(t.dataset.act === "ngStart"){ addingGroup = true; renderAddGroup(); return; }
  if(t.dataset.act === "ngCancel"){ addingGroup = false; renderAddGroup(); return; }
  if(t.dataset.act === "ngAdd"){ addGroup(); return; }
});
addWrap.addEventListener("keydown", function(e){
  if(e.target.id === "ngInput"){
    if(e.key === "Enter"){ e.preventDefault(); addGroup(); }
    else if(e.key === "Escape"){ addingGroup = false; renderAddGroup(); }
  }
});

function addGroup(){
  var inp = document.getElementById("ngInput");
  var name = inp ? inp.value.trim() : "";
  if(!name){ toast("请输入分组名称"); if(inp) inp.focus(); return; }
  var g = {id:"g"+Date.now(), name:name, color:PALETTE[groups.length % PALETTE.length]};
  groups.push(g);
  addingGroup = false;
  delete collapsed[g.id];
  render();
  var sec = document.getElementById("grp-"+g.id);
  if(sec) sec.scrollIntoView({block:"nearest", behavior:"smooth"});
  toast("已创建分组「"+name+"」");
}

/* ================== 新建项目 ================== */
var overlay = document.getElementById("overlay");
var dlg = document.getElementById("dlg");
var fName = document.getElementById("fName");
var fGroup = document.getElementById("fGroup");
var fCreate = document.getElementById("fCreate");

function openNew(gid){
  lastFocus = document.activeElement;
  fName.value = "";
  fGroup.innerHTML = '<option value="">未分组</option>'
    + groups.map(function(g){ return '<option value="'+g.id+'">'+esc(g.name)+'</option>'; }).join("");
  fGroup.value = gid || "";
  document.getElementById("fOwner").value = "孔祥劲";
  syncCreate();
  overlay.classList.add("show");
  dlg.classList.add("show");
  setTimeout(function(){ fName.focus(); }, 120);
}
function closeModal(){
  overlay.classList.remove("show");
  dlg.classList.remove("show");
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function syncCreate(){ fCreate.disabled = !fName.value.trim(); }

fName.addEventListener("input", syncCreate);
fName.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !fCreate.disabled) createProject();
});
fCreate.addEventListener("click", createProject);
document.getElementById("btnNew").addEventListener("click", function(){ openNew(""); });
document.getElementById("btnNewGroup").addEventListener("click", function(){
  addingGroup = true;
  renderAddGroup();
});
document.getElementById("sumHead").addEventListener("click", function(){
  summaryOpen = !summaryOpen;
  render();
});
overlay.addEventListener("click", closeModal);
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeModal); });

function createProject(){
  var name = fName.value.trim();
  if(!name){ fName.focus(); return; }
  var gid = fGroup.value;
  var p = {id:"p"+Date.now(), name:name, group:gid, owner:document.getElementById("fOwner").value, firstRel:"", tasks:0, vers:[0,0,0], mvp:0, post:0};
  projects.push(p);
  delete collapsed[gid || "__un"];
  closeModal();
  render();
  var el = document.getElementById("card-"+p.id);
  if(el){
    el.classList.add("flash");
    el.scrollIntoView({block:"center", behavior:"smooth"});
  }
  toast("已创建「"+name+"」"+(gid ? "，归入「"+gOf(gid).name+"」" : ""));
}

/* ================== 搜索 / 快捷键 ================== */
var q = document.getElementById("q");
q.addEventListener("input", function(){ kw = this.value.trim().toLowerCase(); render(); });

document.getElementById("noresult").addEventListener("click", function(e){
  if(e.target.closest('[data-act="clearSearch"]')){
    q.value = ""; kw = ""; render(); q.focus();
  }
});

document.addEventListener("keydown", function(e){
  var tag = document.activeElement ? document.activeElement.tagName : "";
  if(e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(tag)){
    e.preventDefault(); q.focus(); q.select();
  }
  if(e.key === "Escape"){
    if(dlg.classList.contains("show")){ closeModal(); return; }
    if(popEl.classList.contains("show")){
      var tr = popTrigger;
      closePop();
      if(tr && tr.focus) tr.focus();
      return;
    }
    if(document.activeElement === q && q.value){ q.value = ""; kw = ""; render(); }
  }
});

/* ================== 主题 ================== */
document.getElementById("themeBtn").addEventListener("click", function(){
  var d = document.documentElement;
  var dark = d.getAttribute("data-theme") === "dark";
  if(dark) d.removeAttribute("data-theme");
  else d.setAttribute("data-theme", "dark");
  document.getElementById("iconSun").style.display = dark ? "" : "none";
  document.getElementById("iconMoon").style.display = dark ? "none" : "";
});

/* ================== 初始化 ================== */
render();
})();
</script>
</body>
</html>
