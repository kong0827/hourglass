<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙漏 · 一页式交付说明原型 · 2026-11-13</title>
<style>
:root{
  --bg-app:#F4F6F9; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#F0F2F5;
  --border:#E4E7EC; --border-strong:#D0D5DD; --border-soft:#EEF0F3;
  --text:#1F2329; --text-2:#4E5969; --text-3:#86909C;
  --primary:#3370FF; --primary-soft:#EEF4FF; --primary-border:#C9DAFF; --primary-fg:#245BDB;
  --ok:#389E0D; --ok-soft:#F0F9EB; --ok-border:#C9E7B8; --ok-text:#237804;
  --warn:#D48806; --warn-soft:#FFF8E6; --warn-border:#F2D48A; --warn-text:#AD6800;
  --danger:#CF1322; --danger-soft:#FFF1F0; --danger-border:#F3B7B7; --danger-text:#A8071A;
  --chip-bg:#F7F8FA; --row-hover:#FAFBFC; --progress-bg:#EEF0F3;
  --topbar-bg:rgba(255,255,255,.88); --seg-bg:#F0F2F5;
  --shadow:0 1px 2px rgba(31,35,41,.04),0 8px 24px rgba(31,35,41,.06);
  --shadow-lg:0 18px 48px rgba(31,35,41,.14);
  --r-sm:7px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="dark"]{
  --bg-app:#0F1115; --surface:#181B21; --surface-2:#20242C; --surface-3:#262B34;
  --border:#2C323C; --border-strong:#3A414D; --border-soft:#242A33;
  --text:#E8EAED; --text-2:#A8AFBA; --text-3:#7C8491;
  --primary:#6B9BFF; --primary-soft:#1D2A44; --primary-border:#2D4470; --primary-fg:#9DBBFF;
  --ok:#5BBF6A; --ok-soft:#16281A; --ok-border:#24512B; --ok-text:#8FD48F;
  --warn:#E0A43A; --warn-soft:#2A2112; --warn-border:#5A4419; --warn-text:#F0C36A;
  --danger:#FF6B6B; --danger-soft:#2C1717; --danger-border:#5A2727; --danger-text:#FF9B9B;
  --chip-bg:#20242C; --row-hover:#1D222A; --progress-bg:#2C323C;
  --topbar-bg:rgba(15,17,21,.86); --seg-bg:#20242C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2);
  --shadow-lg:0 24px 64px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-app);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--primary-soft);color:var(--primary-fg)}

/* ============ 原型说明条 ============ */
.proto-bar{max-width:1440px;margin:18px auto 10px;padding:0 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.proto-kicker{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:var(--r-pill);background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);font-weight:700;font-size:10.5px;letter-spacing:.04em}
.proto-kicker i{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block}
.proto-bar b{color:var(--text);font-size:12.5px;font-weight:650}
.proto-bar .sep{color:var(--border-strong)}
.proto-tip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);color:var(--text-3);font-size:11px}
.proto-tip i{width:5px;height:5px;border-radius:50%;background:var(--warn);display:inline-block}
.proto-bar .spacer{flex:1}
.proto-bar .btn{height:26px;font-size:11.5px;padding:0 9px}

/* ============ 应用外壳 ============ */
.app{max-width:1440px;margin:0 auto 30px;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);min-height:820px}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px 12px;display:flex;flex-direction:column;gap:4px;min-height:820px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px;font-weight:750;font-size:15px;letter-spacing:.01em}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(150deg,#3370FF,#7A5AF8);display:grid;place-items:center;color:#fff;flex:none}
.brand small{display:block;font-size:10px;color:var(--text-3);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.ws-pick{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:11.5px;color:var(--text-2)}
.ws-pick b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:600}
.ws-pick .wsdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.nav-lab{font-size:10px;color:var(--text-3);padding:8px 10px 3px;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;height:31px;padding:0 10px;border:0;background:transparent;border-radius:7px;color:var(--text-2);font-size:12.5px;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item .ic{width:15px;height:15px;flex:none;opacity:.58}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:650}
.nav-item.on .ic{opacity:1}
.nav-item .badge{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--primary-fg);background:var(--surface);border:1px solid var(--primary-border);border-radius:var(--r-pill);padding:0 5px;line-height:16px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:10px 4px 0;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.side-foot .avatar{width:26px;height:26px;font-size:10.5px}
.side-foot b{display:block;color:var(--text-2);font-size:11.5px;font-weight:600}

.workspace{min-width:0;display:flex;flex-direction:column;background:var(--bg-app)}
.topbar{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--topbar-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--text-3);white-space:nowrap;overflow-x:auto}
.crumb b{color:var(--text);font-weight:650}
.crumb .sep{color:var(--border-strong)}
.topbar .grow{flex:1}
.topbar .btn{height:28px;font-size:11.5px;padding:0 9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary-fg);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;border:1px solid var(--primary-border)}

/* ============ 内容 ============ */
.content{padding:22px 28px 70px;max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:18px;justify-content:space-between;margin-bottom:15px}
.page-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head h1{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}
.page-sub{font-size:12.5px;line-height:1.7;color:var(--text-3);margin:7px 0 0;max-width:640px}
.auto-stats{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-3)}
.auto-stats span{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--text-3)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)} .dot.primary{background:var(--primary)}
.page-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 11px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text-2);font-size:12.5px;line-height:1;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:650;box-shadow:0 2px 6px rgba(51,112,255,.18)}
.btn.primary:hover{filter:brightness(1.04);background:var(--primary)}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);font-weight:600}
.btn.soft:hover{background:var(--primary-soft);border-color:var(--primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text-2)}
.btn.sm{height:27px;padding:0 9px;font-size:11.5px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;filter:none}
.btn:disabled:hover{background:var(--surface);color:var(--text-2)}

.chip{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--chip-bg);color:var(--text-3);font-size:10.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok-text)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn-text)}
.chip.danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-text)}
.chip.primary{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg)}

/* ============ 生成条件 ============ */
.gen-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 15px 11px;margin-bottom:12px;box-shadow:var(--shadow)}
.gen-grid{display:grid;grid-template-columns:1fr 1.06fr 1.14fr 1.18fr auto;gap:11px;align-items:end}
.gen-action .btn{white-space:nowrap}
.field label,.field .lab{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:5px;letter-spacing:.02em}
.readonly{height:32px;display:flex;align-items:center;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select{width:100%;height:32px;appearance:none;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text-2);font-size:12.5px;padding:0 27px 0 9px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 20 20' fill='none' stroke='%2386909C' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 8l4 4 4-4'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.seg{display:inline-flex;align-items:center;gap:2px;height:32px;padding:2px;background:var(--seg-bg);border-radius:var(--r-sm);width:100%}
.seg button{flex:1;height:26px;border:0;border-radius:5px;background:transparent;color:var(--text-3);font-size:11.5px;white-space:nowrap;padding:0 7px}
.seg button:hover{color:var(--text-2)}
.seg button.active{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 2px rgba(31,35,41,.08)}
.gen-action{display:flex;align-items:flex-end}
.gen-action .btn{height:32px}
.settings-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:10px;padding:9px 0 0;border:0;border-top:1px dashed var(--border);background:transparent;color:var(--text-3);font-size:11.5px;text-align:left}
.settings-toggle:hover{color:var(--text-2)}
.settings-toggle b{color:var(--text-2);font-weight:600}
.settings-toggle .chev{font-size:10px;color:var(--text-3)}
.settings-body{display:grid;grid-template-columns:210px 1fr 1.2fr;gap:12px;margin-top:10px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px}
.check{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);margin:0 0 7px;cursor:pointer;user-select:none}
.check:last-child{margin-bottom:0}
.check input{width:14px;height:14px;accent-color:var(--primary);margin:0}
.note-input{width:100%;min-height:58px;resize:vertical;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:12px;line-height:1.65;padding:7px 9px}
.note-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.note-input::placeholder{color:var(--text-3)}

/* ============ 提示条 ============ */
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid;border-radius:var(--r-md);margin-bottom:12px;font-size:12px;line-height:1.6}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn-text)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok-text)}
.banner.danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-text)}
.banner-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;border:1px solid currentColor;margin-top:1px}
.banner-main{flex:1;min-width:0}
.banner-main strong{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.banner-main p{margin:0;font-size:11.5px;opacity:.9}
.banner-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding-top:1px}
.banner .btn{height:27px;font-size:11.5px;padding:0 9px}
.banner .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.banner.warn .btn.soft{background:var(--surface);border-color:var(--warn-border);color:var(--warn-text)}
.banner.ok .btn.soft{background:var(--surface);border-color:var(--ok-border);color:var(--ok-text)}
.banner.danger .btn.soft{background:var(--surface);border-color:var(--danger-border);color:var(--danger-text)}

/* ============ 文档 ============ */
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:44px 52px 34px;position:relative;overflow:hidden}
.sheet.is-loading{min-height:620px;display:grid;place-items:center}
.loading-box{text-align:center;color:var(--text-3);font-size:12.5px}
.loading-box .spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doc-head{padding-bottom:20px;border-bottom:1px solid var(--border)}
.doc-kicker{font-size:10.5px;letter-spacing:.14em;color:var(--primary-fg);font-weight:750;text-transform:uppercase}
.doc-title-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin:7px 0 6px}
.doc-head h1{font-size:25px;line-height:1.32;margin:0;letter-spacing:-.015em;font-weight:750}
.doc-title-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding-top:3px}
.doc-sub{font-size:13px;line-height:1.7;color:var(--text-3);margin:0}
.doc-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px}
.doc-meta span{display:block;font-size:10px;color:var(--text-3);letter-spacing:.04em;margin-bottom:3px}
.doc-meta strong{display:block;font-size:12px;font-weight:650;color:var(--text-2);line-height:1.45;word-break:break-word}
.doc-flags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.doc-warning{margin-top:14px;padding:9px 11px;border:1px solid var(--danger-border);border-left:3px solid var(--danger);border-radius:7px;background:var(--danger-soft);color:var(--danger-text);font-size:11.5px;line-height:1.6}
.doc-section{padding:21px 0 19px;border-bottom:1px solid var(--border-soft)}
.doc-section:last-of-type{border-bottom:0;padding-bottom:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.section-head h2{font-size:14.5px;font-weight:700;margin:0;letter-spacing:.01em}
.section-head .hint{font-size:11px;color:var(--text-3);font-weight:400}
.narrative{font-size:13px;line-height:1.82;color:var(--text);padding:8px 10px;border:1px solid transparent;border-radius:7px;white-space:pre-wrap;transition:background .15s,border-color .15s}
.narrative.pending{background:var(--warn-soft);border-color:var(--warn-border)}
.narrative.editing{background:var(--surface-2);border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.narrative:focus{outline:none}
.narrative:hover{border-color:var(--border)}
.narrative.editing:hover{border-color:var(--primary)}
.suggest-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--text-3)}
.ai-chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:var(--r-pill);background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);font-size:10px;font-weight:700}
.suggest-bar .btn{height:25px;font-size:11px;padding:0 8px}
.suggest-bar.done{color:var(--ok-text)}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:11px}
.metric{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.metric b{display:block;font-size:17px;line-height:1.3;font-weight:750;letter-spacing:-.01em}
.metric span{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
.metric.ok b{color:var(--ok-text)}
.metric.warn b{color:var(--warn-text)}
.metric.primary b{color:var(--primary-fg)}

.table-wrap{border:1px solid var(--border);border-radius:8px;overflow-x:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}
th{text-align:left;background:var(--surface-2);color:var(--text-3);font-size:10px;font-weight:700;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;line-height:1.55}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--row-hover)}
td .sub{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
.badge{display:inline-flex;align-items:center;height:19px;padding:0 6px;border:1px solid;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok-text)}
.badge.warn{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn-text)}
.badge.danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-text)}
.badge.muted{background:var(--surface-2);border-color:var(--border);color:var(--text-3)}
.inline-note{font-size:11px;line-height:1.65;color:var(--text-3);margin:8px 0 0}
.inline-note b{color:var(--text-2);font-weight:600}
.scope-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--text-3)}
.link-btn{border:0;background:transparent;color:var(--primary-fg);font-size:11px;padding:0;font-weight:600}
.link-btn:hover{text-decoration:underline}

.change-list{display:grid;gap:6px;margin-top:9px}
.change-item{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:9px;align-items:start;padding:7px 9px;border:1px solid var(--border-soft);border-radius:7px;background:var(--surface-2);font-size:11.5px;line-height:1.6}
.change-item .date{color:var(--text-3);font-variant-numeric:tabular-nums}
.change-item b{font-weight:650;color:var(--text-2)}
.change-item .impact{color:var(--text-3);font-size:10.5px;white-space:nowrap}
.quality-card{border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:var(--surface)}
.quality-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quality-top b{font-size:23px;line-height:1;letter-spacing:-.02em;color:var(--ok-text)}
.quality-top .qual-label{display:block;font-size:10.5px;color:var(--text-3);margin-top:3px}
.quality-nums{font-size:11px;color:var(--text-3)}
.progress{height:7px;border-radius:var(--r-pill);background:var(--progress-bg);overflow:hidden;margin:9px 0 7px}

  'file-text':'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 12h6M9 16h6"/>',
  'bar-chart':'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  'users':'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16.5 5.2a3 3 0 1 0 0 5.6M18 15c2.5 0 4 1.6 4 4"/>',
  'alert':'<path d="M12 3l9 18H3z"/><path d="M12 9v5M12 17h.01"/>',
  'gear':'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'
};
function icon(name){
  return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
}
function templateLabel(){
  return {customer:'客户版', manager:'管理版', internal:'内部版'}[state.template];
}
function showEffort(){
  return state.template !== 'customer' || state.includeHours;
}
function sectionCount(){
  let n = 6;
  if (showEffort()) n++;
  if (state.template === 'internal') n++;
  return n;
}
function pendingCount(){
  return (state.pending.change ? 1 : 0) + (state.pending.issue ? 1 : 0);
}
function blocked(){
  return state.release === 'none';
}
function canExport(){
  return pendingCount() === 0 && (state.release !== 'none' || state.template !== 'customer');
}
function badgeFor(status){
  if (blocked()){
    if (status === 'released') return '<span class="badge muted">已完成</span>';
    if (status === 'partial') return '<span class="badge warn">部分完成</span>';
    if (status === 'deferred') return '<span class="badge muted">未完成</span>';
    return '<span class="badge muted">待确认</span>';
  }
  if (status === 'released') return '<span class="badge ok">已发布</span>';
  if (status === 'partial') return '<span class="badge warn">部分发布</span>';
  if (status === 'deferred') return '<span class="badge muted">未发布</span>';
  return '<span class="badge muted">待确认</span>';
}

/* ================= 渲染 ================= */
function renderContent(){
  const y = window.scrollY;
  $('#content').innerHTML = pageHead() + genCard() + banner() +
    '<article class="sheet '+(state.generating?'is-loading':'')+'">' +
      (state.generating ? loadingBox() : sheet()) +
    '</article>' +
    '<div class="page-foot">原型演示 · 示例数据均为虚构 · 交互与视觉用于评审，不代表最终实现</div>';
  window.scrollTo(0, y);
  if (state.focusField && !state.generating){
    const el = $('[data-field="'+state.focusField+'"]');
    if (el){
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    state.focusField = null;
  }
}

function pageHead(){
  const lockedChip = state.locked ? '<span class="chip ok">已锁定快照</span>' : '<span class="chip primary"><i class="dot primary"></i>自动生成</span>';
  const releaseChip = blocked() ? '<span class="chip danger">未确认发布</span>' : '';
  return '<div class="page-head">' +
    '<div>' +
      '<div class="page-title-row"><h1>交付说明</h1>' + lockedChip + releaseChip + '</div>' +
      '<p class="page-sub">把版本承诺、实际发布、质量与投入收成一页，给不需要登录系统的人看。</p>' +
      '<div class="auto-stats">' +
        '<span><i class="dot ok"></i>' + sectionCount() + ' 个区块自动生成</span>' +
        '<span><i class="dot warn"></i>' + pendingCount() + ' 处待确认</span>' +
        '<span><i class="dot"></i>0 个必填字段</span>' +
        '<span>数据截至 ' + escapeHtml(state.generatedAt) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="page-actions">' +
      '<button class="btn" data-action="open-sources">查看数据来源</button>' +
      '<button class="btn" data-action="open-share" ' + ((!canExport() || blocked())?'disabled':'') + '>分享</button>' +
      '<button class="btn primary" data-action="open-export" ' + (!canExport()?'disabled':'') + '>导出</button>' +
      '<button class="btn" data-action="confirm" ' + (state.locked || pendingCount()>0 || (blocked() && state.template==='customer') ? 'disabled' : '') + '>' + (state.locked?'已锁定':'确认并锁定') + '</button>' +
    '</div>' +
  '</div>';
}

function genCard(){
  return '<div class="gen-card">' +
    '<div class="gen-grid">' +
      '<div class="field"><label>项目</label><div class="readonly">' + escapeHtml(DATA.project) + '</div></div>' +
      '<div class="field"><label>版本</label><div class="readonly">' + escapeHtml(DATA.version) + '</div></div>' +
      '<div class="field"><label>发布记录</label>' +
        '<select class="select" id="releaseSelect">' +
          '<option value="success" ' + (state.release==='success'?'selected':'') + '>' + escapeHtml(DATA.releaseSuccess) + '</option>' +
          '<option value="none" ' + (state.release==='none'?'selected':'') + '>尚未确认生产发布</option>' +
        '</select>' +
      '</div>' +
      '<div class="field"><label>语气</label><div class="seg">' +
        '<button class="' + (state.template==='customer'?'active':'') + '" data-action="set-template" data-template="customer">客户版</button>' +
        '<button class="' + (state.template==='manager'?'active':'') + '" data-action="set-template" data-template="manager">管理版</button>' +
        '<button class="' + (state.template==='internal'?'active':'') + '" data-action="set-template" data-template="internal">内部版</button>' +
      '</div></div>' +
      '<div class="field gen-action"><button class="btn" data-action="regen" ' + (state.generating?'disabled':'') + '>' + (state.generating?'生成中…':'重新生成') + '</button></div>' +
    '</div>' +
    '<button class="settings-toggle" data-action="toggle-settings">' +
      '<span>生成设置 · <b>' + settingsSummary() + '</b></span>' +
      '<span class="chev">' + (state.settingsOpen?'收起 ▴':'展开 ▾') + '</span>' +
    '</button>' +
    (state.settingsOpen ? settingsBody() : '') +
  '</div>';
}

function settingsSummary(){
  return templateLabel() +
    ' · ' + (state.includeUnreleased ? '含 2 项未发布' : '仅列已发布') +
    ' · ' + (state.includeHours ? '含工时明细' : '不含工时明细') +
    ' · 交付对象：' + escapeHtml(state.audience);
}

function settingsBody(){
  return '<div class="settings-body">' +
    '<div class="field"><label>交付对象</label>' +
      '<select class="select" id="audienceSelect">' +
        ['华东水务集团（示例）','南方燃气（示例）','内部管理层','仅自己'].map(v => '<option ' + (state.audience===v?'selected':'') + '>' + v + '</option>').join('') +
      '</select>' +
    '</div>' +
    '<div class="field"><span class="lab">内容选项</span>' +
      '<label class="check"><input type="checkbox" id="unreleasedToggle" ' + (state.includeUnreleased?'checked':'') + '> 包含未发布项（建议开启）</label>' +
      '<label class="check"><input type="checkbox" id="hoursToggle" ' + (state.includeHours?'checked':'') + '> 包含工时明细</label>' +
    '</div>' +
    '<div class="field"><label>补充说明（选填）</label>' +
      '<textarea class="note-input" id="noteInput" placeholder="可留空；系统已根据记录生成主要内容">' + escapeHtml(state.note) + '</textarea>' +
    '</div>' +
  '</div>';
}

function banner(){
  if (blocked()){
    const canDraft = state.template !== 'customer';
    return '<div class="banner danger">' +
      '<div class="banner-icon">!</div>' +
      '<div class="banner-main"><strong>未找到成功的生产发布记录</strong><p>' + (canDraft ? '当前是内部草稿，可以导出，但不能对外分享为客户版。' : '客户版交付说明不能生成。请先确认生产发布，或切换为内部版生成草稿。') + '</p></div>' +
      '<div class="banner-actions">' +
        (canDraft ? '<button class="btn soft" data-action="open-export">导出内部草稿</button>' : '<button class="btn soft" data-action="toast" data-msg="实际产品会跳到版本页的发布确认">去确认发布</button><button class="btn" data-action="set-template" data-template="internal">切换内部版</button>') +
      '</div>' +
    '</div>';
  }
  if (pendingCount() > 0){
    return '<div class="banner warn">' +
      '<div class="banner-icon">!</div>' +
      '<div class="banner-main"><strong>已自动生成 ' + sectionCount() + ' 个区块，仅 ' + pendingCount() + ' 处文字需要你确认</strong><p>数字来自版本、发布、测试与工时记录；不需要手工填写。确认后即可导出或分享。</p></div>' +
      '<div class="banner-actions">' +
        '<button class="btn soft" data-action="accept-all">一键确认 ' + pendingCount() + ' 处</button>' +
        '<button class="btn ghost" data-action="goto-pending">逐项查看</button>' +
      '</div>' +
    '</div>';
  }
  return '<div class="banner ok">' +
    '<div class="banner-icon">✓</div>' +
    '<div class="banner-main"><strong>全部已确认，可以导出或分享</strong><p>导出时会生成不可变快照；分享链接只读。</p></div>' +
    '<div class="banner-actions"><button class="btn soft" data-action="open-export">导出</button></div>' +
  '</div>';
}

function loadingBox(){
  return '<div class="loading-box"><div class="spinner"></div>正在读取版本、发布、测试与工时记录…</div>';
}

function narrative(field, text, pending){
  const editable = state.editMode && !state.locked;
  return '<div class="narrative ' + (pending?'pending':'') + ' ' + (editable?'editing':'') + '" data-field="' + field + '" ' + (editable?'contenteditable="true" spellcheck="false"':'') + '>' + escapeHtml(text) + '</div>';
}

function suggestBar(kind){
  return '<div class="suggest-bar">' +
    '<span class="ai-chip">系统建议 · 待确认</span>' +
    '<span>请核对这段对外表述</span>' +
    '<button class="btn soft" data-action="accept-' + kind + '">确认这段</button>' +
    '<button class="btn ghost" data-action="rewrite-' + kind + '">改写</button>' +
  '</div>';
}

function sheet(){
  const sub = state.template === 'customer'
    ? '提交 ' + state.audience + ' · 说明本次交付范围与实际发布内容'
    : state.template === 'manager'
      ? '内部管理版 · 含投入、风险与未完成项'
      : '内部复盘版 · 含内部备注，不对外';
  const editBtn = '<button class="btn sm" data-action="toggle-edit" ' + (state.locked?'disabled':'') + '>' + (state.editMode?'完成编辑':'编辑文字') + '</button>';
  return '<div class="doc-head">' +
      '<div class="doc-kicker">交付说明 · ' + templateLabel() + '</div>' +
      '<div class="doc-title-row">' +
        '<h1>' + escapeHtml(DATA.project) + ' · ' + escapeHtml(DATA.version) + '</h1>' +
        '<div class="doc-title-actions">' + (state.locked?'<span class="chip ok">已锁定快照</span>':'') + editBtn + '</div>' +
      '</div>' +
      '<p class="doc-sub">' + escapeHtml(sub) + '</p>' +
      '<div class="doc-meta">' +
        '<div><span>交付对象</span><strong>' + escapeHtml(state.audience) + '</strong></div>' +
        '<div><span>交付周期</span><strong>' + DATA.period + '</strong></div>' +
        '<div><span>发布记录</span><strong>' + (blocked()?'尚未确认':escapeHtml(DATA.releaseSuccess)) + '</strong></div>' +
        '<div><span>编制</span><strong>' + DATA.owner + ' · 项目负责人</strong></div>' +
      '</div>' +
      '<div class="doc-flags">' +
        '<span class="chip primary"><i class="dot primary"></i>由系统记录自动生成</span>' +
        (blocked()?'<span class="chip danger">发布未确认</span>':'<span class="chip ok">发布已确认</span>') +
        (pendingCount()?'<span class="chip warn">' + pendingCount() + ' 处待确认</span>':'<span class="chip ok">文字已确认</span>') +
      '</div>' +
    '</div>' +
    (blocked()?'<div class="doc-warning">未确认生产发布：以下为内部草稿，客户版不可导出。实际发布以成功的生产发布记录为准。</div>':'') +
    summarySection() + scopeSection() + changeSection() + qualitySection() +
    (showEffort()?effortSection():'') + riskSection() +
    (state.template==='internal'?internalSection():'') +
    (state.note.trim()?noteSection():'') +
    evidenceSection() +
    '<div class="doc-foot">本说明由沙漏根据系统记录自动生成，实际发布以发布记录为准；不替代部署执行、流水线验证或客户验收。生成时间：' + escapeHtml(state.generatedAt) + '。</div>';
}

function summarySection(){
  const isBlocked = blocked();
  const metrics = state.template === 'customer'
    ? [
        {k:'16 / 18', v:isBlocked?'范围已完成':'已发布', cls:isBlocked?'warn':'ok'},
        {k:'94.9%', v:'回归通过率', cls:''},
        {k:'2 项', v:'后续计划', cls:'warn'},
        {k:'1 项', v:'已知问题', cls:'warn'}
      ]
    : [
        {k:'16 / 18', v:isBlocked?'范围已完成':'已发布', cls:isBlocked?'warn':'ok'},
        {k:'94.9%', v:'回归通过率', cls:''},
        {k:'286h', v:'累计投入', cls:'primary'},
        {k:'6 个', v:'未关闭缺陷', cls:'warn'}
      ];
  const summaryText = isBlocked && state.summaryText === DATA.summary ? DATA.draftSummary : state.summaryText;
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>交付摘要</h2><span class="hint">自动生成 · 数字只读；文字可编辑</span></div>' +
    narrative('summaryText', summaryText, false) +
    '<div class="metric-grid">' + metrics.map(m => '<div class="metric ' + m.cls + '"><b>' + m.k + '</b><span>' + m.v + '</span></div>').join('') + '</div>' +
  '</section>';
}

function scopeSection(){
  const rows = state.includeUnreleased ? DATA.scope : DATA.scope.filter(r => r.status !== 'deferred');
  const more = state.expandScope ? DATA.moreScope : [];
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>交付范围</h2><span class="hint">' + DATA.planned + ' 项承诺 · ' + DATA.released + ' 项' + (blocked()?'完成':'已发布') + ' · ' + DATA.deferred + ' 项' + (blocked()?'未完成':'延后') + '</span></div>' +
    '<div class="table-wrap"><table>' +
      '<thead><tr><th>模块</th><th>工作项</th><th>类型</th><th>状态</th><th>说明</th></tr></thead>' +
      '<tbody>' + rows.concat(more).map(r =>
        '<tr><td>' + escapeHtml(r.module) + '</td><td><b>' + escapeHtml(r.item) + '</b></td><td>' + escapeHtml(r.type) + '</td><td>' + badgeFor(r.status) + '</td><td><span class="sub">' + escapeHtml(r.note) + '</span></td></tr>'
      ).join('') + '</tbody>' +
    '</table></div>' +
    (!state.includeUnreleased ? '<p class="inline-note">已按设置隐藏 2 项未发布内容；对客户建议保留未发布项，避免范围误读。</p>' : '') +
    '<div class="scope-foot">' +
      '<button class="link-btn" data-action="expand-scope">' + (state.expandScope?'收起明细':'展开全部 18 项') + '</button>' +
      '<span>' + (blocked() ? '状态来自版本任务关联；生产发布尚未确认，完成状态不代表已对外交付。' : '状态来自版本任务关联与发布记录；部分发布表示 Web 已上线、App 待发。') + '</span>' +
    '</div>' +
  '</section>';
}

function changeSection(){
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>变更说明</h2><span class="hint">来自需求调期与任务改版本记录</span></div>' +
    narrative('changeText', state.changeText, state.pending.change) +
    (state.pending.change ? suggestBar('change') : '<div class="suggest-bar done"><span class="chip ok">已确认</span><span>变更原因与影响已核对</span></div>') +
    '<div class="change-list">' + DATA.changes.map(c =>
      '<div class="change-item"><span class="date">' + c.date + '</span><span><b>' + c.title + '</b></span><span class="impact">' + c.impact + '</span></div>'
    ).join('') + '</div>' +
  '</section>';
}

function qualitySection(){
  const q = DATA.quality;
  const pct = Math.round(q.executed / q.cases * 100);
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>质量与验证</h2><span class="hint">' + q.plan + ' · ' + q.cases + ' 条用例</span></div>' +
    '<div class="quality-card">' +
      '<div class="quality-top">' +
        '<div><b>' + q.passRate + '</b><span class="qual-label">回归通过率</span></div>' +
        '<div class="quality-nums">已执行 ' + q.executed + '/' + q.cases + ' · 通过 ' + q.passed + ' · 失败 ' + q.failed + ' · 阻塞 ' + q.blocked + '</div>' +
      '</div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="quality-foot"><span>未关闭缺陷 ' + q.defects + ' 个：P1 ' + q.p1 + ' · P2 ' + q.p2 + ' · P3 ' + q.p3 + '</span><button class="link-btn" data-action="toast" data-msg="实际产品会打开测试报告">查看测试报告</button></div>' +
    '</div>' +
    '<div class="known-issue">' +
      '<div class="ki-head"><span class="chip warn">已知问题</span><span>待现场验证</span></div>' +
      narrative('issueText', state.issueText, state.pending.issue) +
      (state.pending.issue ? suggestBar('issue') : '<div class="suggest-bar done"><span class="chip ok">已确认</span></div>') +
    '</div>' +
  '</section>';
}

function effortSection(){
  const e = DATA.effort;
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>' + (state.template==='customer'?'投入概况':'投入与负载') + '</h2><span class="hint">有效工时，不是计费工时</span></div>' +
    '<div class="effort-top">' +
      '<div class="effort-total"><b>' + e.total + 'h</b><span>累计投入</span></div>' +
      '<div class="effort-note">按工作日 9:00–18:00、每日 8 小时额度折算；不含未记录时间。</div>' +
    '</div>' +
    '<div class="bars">' + e.modules.map(m =>
      '<div class="bar-row"><span>' + m.name + '</span><div class="bar-track"><i class="bar-fill" style="width:' + Math.round(m.hours/e.total*100) + '%"></i></div><span>' + m.hours + 'h</span></div>'
    ).join('') + '</div>' +
    (state.template!=='customer' ? '<div class="people"><span class="people-label">按成员</span>' + e.people.map(p => '<span class="person">' + p.name + ' ' + p.hours + 'h</span>').join('') + '</div>' : '') +
  '</section>';
}

function riskSection(){
  const title = state.template==='customer' ? '后续计划与已知问题' : '风险与未完成项';
  const rows = state.includeUnreleased || state.template!=='customer' ? DATA.risks : DATA.risks.filter(r => r.item.indexOf('导入模板')<0 && r.item.indexOf('签字')<0);
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>' + title + '</h2><span class="hint">' + (state.template==='customer'?'自动汇总，供客户了解后续安排':'含负责人与下一步') + '</span></div>' +
    '<div class="table-wrap"><table>' +
      '<thead><tr><th>事项</th><th>影响</th>' + (state.template==='customer'?'<th>下一步</th><th>状态</th>':'<th>负责人</th><th>下一步</th><th>状态</th>') + '</tr></thead>' +
      '<tbody>' + rows.map(r =>
        '<tr><td><b>' + r.item + '</b></td><td>' + r.impact + '</td>' +
        (state.template==='customer'?'':'<td>' + r.owner + '</td>') +
        '<td>' + r.next + '</td><td><span class="badge ' + r.tone + '">' + r.state + '</span></td></tr>'
      ).join('') + '</tbody>' +
    '</table></div>' +
  '</section>';
}

function internalSection(){
  return '<section class="doc-section internal-note">' +
    '<div class="section-head"><h2>内部备注</h2><span class="hint">仅内部版可见，不进入分享链接</span></div>' +
    narrative('internalNote', state.internalNote, false) +
    '<p class="inline-note">此区块不会出现在客户版或分享链接中。</p>' +
  '</section>';
}

function noteSection(){
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>补充说明</h2><span class="hint">由你填写</span></div>' +
    '<div class="narrative">' + escapeHtml(state.note) + '</div>' +
  '</section>';
}

function evidenceSection(){
  const list = DATA.evidence.filter(e => !e.internalOnly || state.template!=='customer');
  const releasePending = blocked();
  return '<section class="doc-section">' +
    '<div class="section-head"><h2>证据与附件</h2><span class="hint">只读 · 可追溯到原始记录</span></div>' +
    '<div class="evidence-list">' + list.map(e =>
      '<div class="evidence-item"><div><b>' + e.name + '</b><span class="meta">' +
        (releasePending && e.name === '发布记录' ? '尚未确认生产发布 · 无可用发布快照' : releasePending && e.name === '发布制品' ? '待发布确认后生成' : e.meta) +
      '</span></div><button class="btn" data-action="toast" data-msg="原型中仅演示，实际会打开对应记录">查看</button></div>'
    ).join('') + '</div>' +
  '</section>';
}

/* ================= 交互 ================= */
const modalRoot = $('#modalRoot');
let toastTimer = null;

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function closeModal(){
  modalRoot.classList.remove('open');
  modalRoot.innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(type){
  let head = '', body = '', foot = '';
  if (type === 'sources'){
    head = '数据来源';
    body = '<p class="modal-lead">这页的所有数字都来自下列记录，只读；修改请回到对应记录。</p>' +
      '<table class="source-table"><thead><tr><th>来源</th><th>内容</th><th>数量</th><th>状态</th></tr></thead><tbody>' +
      '<tr><td>版本范围</td><td>V2.3 计划交付工作项</td><td>18 项</td><td class="st">已读取</td></tr>' +
      '<tr><td>发布记录</td><td>REL-2026-1112-01</td><td>1 条</td><td class="st">已读取</td></tr>' +
      '<tr><td>测试计划</td><td>V2.3 回归</td><td>120 条用例</td><td class="st">已读取</td></tr>' +
      '<tr><td>工时日志</td><td>2026-10-08—11-12</td><td>286h</td><td class="st">已读取</td></tr>' +
      '<tr><td>变更记录</td><td>需求调期 / 任务改版本</td><td>2 条</td><td class="st">已读取</td></tr>' +
      '<tr><td>已知问题</td><td>弱网重复提交</td><td>1 条</td><td class="st">已读取</td></tr>' +
      '</tbody></table>' +
      '<div class="modal-note">交付说明不会反向修改版本、发布或测试数据；缺失项会显示“未提供/未验证”，不自动补造。</div>';
    foot = '<button class="btn" data-action="close-modal">关闭</button>';
  } else if (type === 'share'){
    const disabled = !canExport() || blocked();
    head = '分享只读链接';
    body = '<p class="modal-lead">对方无需登录即可查看当前快照，不能编辑。</p>' +
      (disabled ? '<div class="modal-warn">' + (blocked()?'尚未确认生产发布，不能生成对外分享链接；内部草稿请只在内部流转。':'还有 ' + pendingCount() + ' 处文字待确认，确认后再分享。') + '</div>' : '') +
      '<label class="field-label">链接</label>' +
      '<div class="copy-row"><input class="select" readonly value="https://hourglass.example/s/8f3c2a71"><button class="btn" data-action="copy-link" ' + (disabled?'disabled':'') + '>复制</button></div>' +
      '<label class="field-label">可见范围</label>' +
      '<select class="select"><option>获得链接的人（只读）</option><option>仅空间成员</option></select>' +
      '<div class="modal-note">对方看到的是 ' + state.generatedAt + ' 的快照，不会随系统后续修改而变化；内部备注不会出现在链接里。</div>';
    foot = '<button class="btn" data-action="close-modal">关闭</button>';
  } else if (type === 'export'){
    const disabled = !canExport();
    head = '导出交付说明';
    body = '<p class="modal-lead">选择导出格式。导出时会生成当前内容的不可变快照。</p>' +
      (disabled ? '<div class="modal-warn">' + (blocked()?'尚未确认生产发布，客户版不可导出。':'还有 ' + pendingCount() + ' 处文字待确认。') + '</div>' : '') +
      (blocked() && !disabled ? '<div class="modal-warn">当前为内部草稿，导出文件会标注“草稿 · 未确认发布”，不可直接发给客户。</div>' : '') +
      '<label class="export-option"><input type="radio" name="format" value="PDF" checked><div><b>PDF · A4</b><span>适合发给客户或附在邮件里</span></div></label>' +
      '<label class="export-option"><input type="radio" name="format" value="Markdown"><div><b>Markdown</b><span>适合贴进知识库或工单</span></div></label>' +
      '<label class="export-option"><input type="radio" name="format" value="打印"><div><b>打印</b><span>浏览器打印预览，可另存为 PDF</span></div></label>' +
      '<div class="modal-note">导出内容包含当前可见区块；内部备注只在内部版导出。不会包含任何未授权项目的记录。</div>';
    foot = '<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="do-export" ' + (disabled?'disabled':'') + '>生成</button>';
  }
  modalRoot.innerHTML = '<div class="modal-backdrop" data-action="close-modal"></div>' +
    '<div class="modal" role="dialog" aria-modal="true" aria-label="' + head + '">' +
      '<div class="modal-head"><h3>' + head + '</h3><button class="x" data-action="close-modal" aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' + body + '</div>' +
      '<div class="modal-foot">' + foot + '</div>' +
    '</div>';
  modalRoot.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function gotoPending(){
  const el = $('.narrative.pending');
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function acceptAll(){
  const n = pendingCount();
  state.pending.change = false;
  state.pending.issue = false;
  renderContent();
  toast(n ? '已确认 ' + n + ' 处文字，可以导出或分享' : '当前没有待确认内容，可直接导出或分享');
}

function nowStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function regen(){
  if (state.generating) return;
  state.generating = true;
  state.locked = false;
  state.editMode = false;
  renderContent();
  setTimeout(() => {
    state.generating = false;
    state.generatedAt = nowStamp();
    renderContent();
    toast('已根据最新记录重新生成');
  }, 700);
}

function toggleTheme(){
  const html = document.documentElement;
  const next = html.dataset.theme === 'light' ? 'dark' : 'light';
  html.dataset.theme = next;
  try { localStorage.setItem('hg-delivery-theme', next); } catch(e) {}
  const label = next === 'light' ? '深色' : '浅色';
  $('#themeBtnTop').textContent = label;
  $('#themeBtn').textContent = label;
}

/* 事件 */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  if (action === 'toast'){
    toast(t.dataset.msg || '原型演示');
  } else if (action === 'toggle-theme'){
    toggleTheme();
  } else if (action === 'set-template'){
    state.template = t.dataset.template;
    state.includeHours = state.template !== 'customer';
    state.editMode = false;
    state.locked = false;
    renderContent();
  } else if (action === 'regen'){
    regen();
  } else if (action === 'toggle-settings'){
    state.settingsOpen = !state.settingsOpen;
    renderContent();
  } else if (action === 'accept-all'){
    acceptAll();
  } else if (action === 'accept-change'){
    state.pending.change = false;
    renderContent();
    toast('变更说明已确认，剩余 ' + pendingCount() + ' 处');
  } else if (action === 'accept-issue'){
    state.pending.issue = false;
    renderContent();
    toast('已知问题说明已确认，剩余 ' + pendingCount() + ' 处');
  } else if (action === 'rewrite-change'){
    state.editMode = true;
    state.focusField = 'changeText';
    renderContent();
  } else if (action === 'rewrite-issue'){
    state.editMode = true;
    state.focusField = 'issueText';
    renderContent();
  } else if (action === 'goto-pending'){
    gotoPending();
  } else if (action === 'expand-scope'){
    state.expandScope = !state.expandScope;
    renderContent();
  } else if (action === 'toggle-edit'){
    if (state.locked) return;
    state.editMode = !state.editMode;
    renderContent();
    if (!state.editMode) toast('文字修改已保存');
  } else if (action === 'confirm'){
    if (pendingCount() > 0){ toast('还有 ' + pendingCount() + ' 处待确认'); gotoPending(); return; }
    if (blocked() && state.template === 'customer'){ toast('请先确认生产发布'); return; }
    state.locked = true;
    state.editMode = false;
    renderContent();
    toast('已确认并锁定快照');
  } else if (action === 'open-sources'){
    openModal('sources');
  } else if (action === 'open-share'){
    openModal('share');
  } else if (action === 'open-export'){
    openModal('export');
  } else if (action === 'close-modal'){
    closeModal();
  } else if (action === 'copy-link'){
    const val = 'https://hourglass.example/s/8f3c2a71';
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(val).then(() => toast('演示链接已复制')).catch(() => toast('演示链接：' + val));
    } else {
      toast('演示链接：' + val);
    }
  } else if (action === 'do-export'){
    const fmt = ($('input[name="format"]:checked') || {}).value || 'PDF';
    closeModal();
    state.locked = true;
    state.editMode = false;
    renderContent();
    toast('已生成 ' + fmt + ' 并锁定快照（原型演示）');
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'releaseSelect'){
    state.release = e.target.value;
    state.expandScope = false;
    renderContent();
  } else if (e.target.id === 'audienceSelect'){
    state.audience = e.target.value;
    renderContent();
  } else if (e.target.id === 'unreleasedToggle'){
    state.includeUnreleased = e.target.checked;
    renderContent();
  } else if (e.target.id === 'hoursToggle'){
    state.includeHours = e.target.checked;
    renderContent();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'noteInput'){
    state.note = e.target.value;
  }
});

document.addEventListener('focusout', (e) => {
  const el = e.target.closest('[data-field]');
  if (el && el.isContentEditable){
    state[el.dataset.field] = el.innerText.trim();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalRoot.classList.contains('open')) closeModal();
});

/* 初始化 */
try {
  const saved = localStorage.getItem('hg-delivery-theme');
  if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
} catch(e) {}
/* 侧栏图标补渲染：静态 HTML 中保留 ${icon('x')} 占位，避免重复维护 SVG */
document.querySelectorAll('.nav-item').forEach((el) => {
  el.innerHTML = el.innerHTML.replace(/\$\{icon\('([a-z-]+)'\)\}/g, (_, name) => icon(name));
});
$('#themeBtnTop').textContent = document.documentElement.dataset.theme === 'dark' ? '浅色' : '深色';
$('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '浅色' : '深色';
renderContent();
</script>
</body>
</html>
