<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙漏 · 一页式交付说明 · 交互原型 v2 · 2026-11-13</title>
<style>
/* ============================================================
   令牌：与 frontend/css/tokens.css 同源，原型不另造配色
   ============================================================ */
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7;
  --surface-hover:#F2F4F7; --surface-active:#E9ECF1;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text:#101828; --text-2:#475467; --text-3:#667085; --text-inverse:#FFFFFF;
  --scrim:rgba(16,24,40,.32);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EFF4FF;
  --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-border:#A6F4C5; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-border:#FEDF89; --warning-fg:#B54708;
  --danger:#F04438;  --danger-soft:#FEF3F2;  --danger-border:#FDA29B;  --danger-fg:#B42318;
  --info:#2E90FA;    --info-soft:#EFF8FF;    --info-border:#B2DDFF;    --info-fg:#175CD3;
  --plum:#7A5AF8;    --plum-soft:#F4F3FF;    --plum-border:#D9D6FE;    --plum-fg:#5B3FD1;
  --teal:#0E9384; --magenta:#DD2590; --slate:#98A2B3;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,Menlo,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 2px 4px -2px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --shadow-xl:0 24px 48px -12px rgba(16,24,40,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
  --paper-band:linear-gradient(115deg,#EFF4FF 0%,#F4F3FF 46%,#ECFDF3 100%);
  --body-glow:radial-gradient(1100px 420px at 12% -8%,#E8F0FF 0%,rgba(232,240,255,0) 62%),
              radial-gradient(900px 380px at 92% -4%,#F1EEFF 0%,rgba(241,238,255,0) 58%);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg-app:#0D1219; --surface:#151B24; --surface-sunken:#1A222D;
  --surface-hover:#1F2937; --surface-active:#26313F;
  --border:#25303D; --border-strong:#334153;
  --text:#E7ECF3; --text-2:#A9B4C2; --text-3:#7B8798; --text-inverse:#0D1219;
  --scrim:rgba(0,0,0,.6);
  --primary:#4C8DFF; --primary-hover:#6BA1FF; --primary-soft:#16243C;
  --primary-border:#2B4772; --primary-fg:#8FB4FF;
  --success:#32D583; --success-soft:#0E2A1D; --success-border:#1F5C3E; --success-fg:#75E0A7;
  --warning:#FDB022; --warning-soft:#2A2110; --warning-border:#5C4A1E; --warning-fg:#FEC84B;
  --danger:#F97066;  --danger-soft:#2B1615;  --danger-border:#5C2A26;  --danger-fg:#FDA29B;
  --info:#53B1FD;    --info-soft:#10202F;    --info-border:#1F4468;    --info-fg:#84CAFF;
  --plum:#9B8AFB;    --plum-soft:#1D1933;    --plum-border:#3B3266;    --plum-fg:#B9ACFC;
  --teal:#2ED3B7; --magenta:#F670C7; --slate:#6B7787;
  --paper-band:linear-gradient(115deg,#16243C 0%,#1D1933 48%,#0E2A1D 100%);
  --body-glow:radial-gradient(1100px 420px at 12% -8%,#132038 0%,rgba(19,32,56,0) 62%),
              radial-gradient(900px 380px at 92% -4%,#1A1730 0%,rgba(26,23,48,0) 58%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--body-glow),var(--bg-app);background-attachment:fixed;
  color:var(--text);font-family:var(--font-sans);font-size:13px;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--primary-soft);color:var(--primary-fg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* 自绘滚动条：与令牌同色，不用浏览器默认 */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--surface-sunken);border-radius:var(--r-pill)}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-pill);border:2px solid var(--surface-sunken)}
*::-webkit-scrollbar-thumb:hover{background:var(--primary-border)}
.ic{width:16px;height:16px;flex:none}

/* ============ 原型说明条 ============ */
.proto-bar{max-width:1440px;margin:16px auto 10px;padding:0 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
.proto-kicker{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:var(--r-pill);background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);font-weight:700;font-size:10.5px;letter-spacing:.05em}
.proto-kicker i{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.proto-bar b{color:var(--text);font-weight:650;font-size:12.5px}
.proto-bar .grow{flex:1}
.proto-tabs{display:flex;gap:3px;padding:3px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--r-pill)}
.proto-tabs button{height:25px;padding:0 12px;border:0;background:transparent;border-radius:var(--r-pill);color:var(--text-3);font-size:11.5px;font-weight:600}
.proto-tabs button.on{background:var(--surface);color:var(--primary-fg);box-shadow:var(--shadow-xs)}

/* ============ 应用外壳 ============ */
.app{max-width:1440px;margin:0 auto 26px;display:grid;grid-template-columns:240px minmax(0,1fr);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:clip;box-shadow:var(--shadow-lg);min-height:880px}
.sidebar{border-right:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.side-brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px;border:0;background:none;font-size:15.5px;font-weight:750;letter-spacing:.02em;color:var(--text)}
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--primary),var(--plum));box-shadow:0 3px 8px rgba(37,99,235,.28)}
.ws-switch{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken);text-align:left}
.ws-meta{min-width:0;flex:1}
.ws-n{display:block;font-size:12.5px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-kind{display:block;font-size:10.5px;color:var(--text-3)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--a,#475467);flex:none}
.nav-sec{font-size:10px;color:var(--text-3);letter-spacing:.1em;padding:9px 10px 3px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border:0;background:none;border-radius:var(--r-sm);color:var(--text-2);font-size:12.5px;text-align:left;transition:background .15s var(--ease),color .15s var(--ease)}
.nav-item .ic{opacity:.6}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:650}
.nav-item.on .ic{opacity:1}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg-app)}
.topbar{position:sticky;top:0;z-index:30;height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.tb-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.tb-grow{flex:1}
.content{padding:20px 22px 60px;min-width:0}

/* ============ 通用控件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border-strong);
  border-radius:var(--r-sm);background:var(--surface);color:var(--text-2);font-size:12.5px;line-height:1;white-space:nowrap;
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.btn:hover{background:var(--surface-hover);color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:650;box-shadow:0 2px 8px rgba(37,99,235,.22)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);font-weight:620}
.btn.soft:hover{border-color:var(--primary);color:var(--primary-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--text-2)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-fg);font-weight:620}
.btn.sm{height:27px;padding:0 9px;font-size:11.5px;border-radius:var(--r-xs)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.primary:disabled{opacity:1;background:var(--surface-3);border-color:var(--border);color:var(--text-3);font-weight:600}
.btn.primary:disabled:hover{filter:none;background:var(--surface-3)}
.btn:disabled:hover{background:var(--surface);color:var(--text-2)}
.btn.primary:disabled:hover{background:var(--primary);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-pill);
  background:var(--surface-sunken);color:var(--text-3);font-size:10.5px;font-weight:620;white-space:nowrap}
.chip.ok{background:var(--success-soft);border-color:var(--success-border);color:var(--success-fg)}
.chip.warn{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning-fg)}
.chip.bad{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-fg)}
.chip.pri{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg)}
.chip.plum{background:var(--plum-soft);border-color:var(--plum-border);color:var(--plum-fg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;flex:none}
.dot.ok{background:var(--success)}.dot.warn{background:var(--warning)}.dot.bad{background:var(--danger)}.dot.pri{background:var(--primary)}
.select{width:100%;height:31px;appearance:none;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);
  color:var(--text-2);font-size:12px;padding:0 26px 0 9px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 20 20' fill='none' stroke='%23667085' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 8l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center}
.select:hover{border-color:var(--primary-border)}
.input{width:100%;height:31px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;font-size:12px;color:var(--text)}
.input:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.seg{display:flex;gap:2px;padding:2px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--r-sm)}
.seg button{flex:1;height:25px;padding:0 8px;border:0;background:none;border-radius:6px;color:var(--text-3);font-size:11.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--primary-fg);box-shadow:var(--shadow-xs)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text-2);padding:3px 0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:32px;height:18px;border-radius:var(--r-pill);background:var(--border-strong);position:relative;flex:none;transition:background .18s var(--ease)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs);transition:transform .18s var(--ease)}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.switch .sw-t{flex:1;min-width:0}
.switch .sw-h{display:block;font-size:10.5px;color:var(--text-3);margin-top:1px}
.range{width:100%;appearance:none;height:20px;background:none}
.range::-webkit-slider-runnable-track{height:4px;border-radius:var(--r-pill);background:var(--surface-active)}
.range::-webkit-slider-thumb{appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);box-shadow:var(--shadow-sm)}
.range::-moz-range-track{height:4px;border-radius:var(--r-pill);background:var(--surface-active)}
.range::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.range-lab{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-top:-2px}

/* ============ 页头 ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.page-title-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.015em;line-height:1.25}
.page-sub{font-size:12.5px;color:var(--text-3);line-height:1.7;margin-top:6px;max-width:660px}
.head-facts{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-3)}
.head-facts span{display:inline-flex;align-items:center;gap:5px}
.page-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}

/* ============ 提示条 ============ */
.banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);margin-bottom:14px;box-shadow:var(--shadow-xs)}
.banner .bi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.banner .bt{font-size:12.5px;font-weight:680;color:var(--text)}
.banner .bp{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.6}
.banner .ba{margin-left:auto;display:flex;gap:7px;flex:none}
.banner.warn{background:var(--warning-soft);border-color:var(--warning-border)}
.banner.warn .bi{background:var(--warning);color:#fff}
.banner.warn .bt{color:var(--warning-fg)}
.banner.ok{background:var(--success-soft);border-color:var(--success-border)}
.banner.ok .bi{background:var(--success);color:#fff}
.banner.ok .bt{color:var(--success-fg)}
.banner.bad{background:var(--danger-soft);border-color:var(--danger-border)}
.banner.bad .bi{background:var(--danger);color:#fff}
.banner.bad .bt{color:var(--danger-fg)}
.banner.lock{background:var(--plum-soft);border-color:var(--plum-border)}
.banner.lock .bi{background:var(--plum);color:#fff}
.banner.lock .bt{color:var(--plum-fg)}

/* ============ 工作台布局 ============ */
.work{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:16px;align-items:start}
.secnav{position:sticky;top:60px;z-index:12;display:flex;gap:5px;overflow-x:auto;padding:8px 2px;margin-bottom:8px;
  background:color-mix(in srgb,var(--bg-app) 92%,transparent);backdrop-filter:blur(8px)}
.secnav button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-pill);
  background:var(--surface);color:var(--text-3);font-size:11px;font-weight:600;white-space:nowrap;flex:none}
.secnav button:hover{border-color:var(--primary-border);color:var(--primary-fg)}
.secnav button .n{font-family:var(--font-mono);font-size:9.5px;opacity:.7}

/* ============ 常驻控制区 ============ */
.rail{position:sticky;top:60px;max-height:calc(100vh - 76px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
.rail-head{position:sticky;top:0;z-index:2;padding:12px 14px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.rail-head h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.rail-head .rh-sub{font-size:10.5px;color:var(--text-3);margin-top:4px;line-height:1.6}
.rail-meter{display:flex;gap:6px;margin-top:9px}
.rail-meter div{flex:1;padding:6px 7px;border-radius:var(--r-sm);background:var(--surface-sunken);border:1px solid var(--border)}
.rail-meter b{display:block;font-size:14px;font-weight:750;font-family:var(--font-mono);letter-spacing:-.02em}
.rail-meter span{display:block;font-size:9.5px;color:var(--text-3);margin-top:1px}
.rail-meter .m-ok b{color:var(--success-fg)}
.rail-meter .m-warn b{color:var(--warning-fg)}
.rgroup{padding:11px 14px;border-bottom:1px solid var(--border)}
.rgroup:last-child{border-bottom:0}
.rg-lab{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.09em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rg-lab .ic{width:13px;height:13px;opacity:.7}
.rfield{margin-bottom:9px}
.rfield:last-child{margin-bottom:0}
.rfield > label,.rfield > .rl{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:5px}
.rail-foot{padding:11px 14px;display:flex;gap:6px;flex-wrap:wrap;background:var(--surface-sunken);border-top:1px solid var(--border)}
.rail-foot .btn{flex:1;min-width:calc(50% - 3px)}
.rail-note{padding:9px 14px;font-size:10.5px;color:var(--text-3);line-height:1.65;background:var(--surface-sunken);border-top:1px solid var(--border)}
.rail.locked .rgroup{opacity:.5;pointer-events:none}
.rail-lockbar{padding:10px 14px;background:var(--plum-soft);border-bottom:1px solid var(--plum-border);font-size:11px;color:var(--plum-fg);line-height:1.6}
.rail-lockbar .btn{margin-top:7px;width:100%}
.ta{width:100%;min-height:60px;resize:vertical;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);padding:7px 9px;font-size:11.5px;line-height:1.6;color:var(--text)}
.ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}

/* ============ 纸张 ============ */
.sheet{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:clip}
.sheet.compact .sec{padding:12px 20px}
.sheet.compact .narr{font-size:12px;line-height:1.7}
.sheet.compact .metric b{font-size:19px}
.doc-head{position:relative;padding:20px 26px 16px;background:var(--paper-band);border-bottom:1px solid var(--border)}
.doc-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--plum) 55%,var(--teal))}
.doc-letter{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.doc-letter .brand-mark{width:24px;height:24px;border-radius:7px}
.doc-letter .lt{font-size:12px;font-weight:700;letter-spacing:.02em}
.doc-letter .ls{font-size:10.5px;color:var(--text-3);letter-spacing:.06em}
.doc-letter .grow{flex:1}
.doc-no{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);text-align:right;line-height:1.5}
.doc-kicker{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--primary-fg);text-transform:uppercase}
.doc-title{font-size:24px;font-weight:760;letter-spacing:-.02em;line-height:1.3;margin-top:7px}
.doc-sub{font-size:12.5px;color:var(--text-2);margin-top:7px;line-height:1.7}
.doc-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.doc-meta > div{padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--border)}
.doc-meta span{display:block;font-size:10px;color:var(--text-3);letter-spacing:.03em}
.doc-meta strong{display:block;font-size:12px;font-weight:680;margin-top:3px;line-height:1.45}
.doc-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.doc-tools{display:flex;gap:6px;align-items:center;margin-top:12px}
.doc-watermark{position:absolute;right:22px;bottom:14px;transform:rotate(-5deg);border:2px solid var(--danger-border);color:var(--danger-fg);
  font-size:13px;font-weight:800;letter-spacing:.22em;padding:4px 12px;border-radius:6px;opacity:.8;background:var(--danger-soft);pointer-events:none}
.doc-warning{margin:0;padding:10px 26px;background:var(--danger-soft);border-bottom:1px solid var(--danger-border);color:var(--danger-fg);font-size:11.5px;line-height:1.65}

.sec{padding:17px 26px;border-bottom:1px solid var(--border);scroll-margin-top:104px;animation:rise .32s var(--ease) both}
.sec:last-of-type{border-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sec{animation:none}}
.sec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.sec-idx{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--primary-fg);background:var(--primary-soft);
  border:1px solid var(--primary-border);border-radius:5px;padding:2px 5px;line-height:1.2}
.sec-head h2{font-size:14.5px;font-weight:720;letter-spacing:-.01em}
.sec-hint{font-size:11px;color:var(--text-3);margin-left:auto;text-align:right}

.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}
.metric{position:relative;text-align:left;padding:10px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken);
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease),transform .15s var(--ease)}
.metric:hover{border-color:var(--primary-border);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.metric b{display:block;font-size:22px;font-weight:760;letter-spacing:-.03em;line-height:1.15;font-family:var(--font-mono)}
.metric b small{font-size:12px;font-weight:650;margin-left:2px;font-family:var(--font-sans)}
.metric span{display:block;font-size:10.5px;color:var(--text-3);margin-top:4px}
.metric em{display:block;font-style:normal;font-size:10px;color:var(--text-3);margin-top:3px;opacity:.85}
.metric .src{position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:4px;display:grid;place-items:center;
  color:var(--text-3);opacity:0;transition:opacity .15s var(--ease)}
.metric:hover .src{opacity:1;color:var(--primary-fg)}
.metric.ok b{color:var(--success-fg)} .metric.warn b{color:var(--warning-fg)}
.metric.bad b{color:var(--danger-fg)} .metric.pri b{color:var(--primary-fg)} .metric.plum b{color:var(--plum-fg)}

.narr{font-size:12.5px;line-height:1.85;color:var(--text-2);border-radius:var(--r-sm);padding:2px 0}
.narr[contenteditable="true"]{background:var(--primary-soft);border:1px dashed var(--primary-border);padding:9px 11px;color:var(--text);outline:none}
.narr[contenteditable="true"]:focus{border-style:solid;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.narr-wrap.pending .narr{background:var(--warning-soft);border-left:3px solid var(--warning);padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.narr-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.narr-bar .nb-t{font-size:10.5px;color:var(--text-3)}
.missing{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface-sunken);color:var(--text-3);font-size:11.5px;line-height:1.6}
.missing .ic{color:var(--warning-fg)}

.bar{display:flex;height:12px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-active);border:1px solid var(--border)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block}
.baseline{display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px;align-items:center;margin-bottom:8px}
.bl-lab{font-size:10.5px;color:var(--text-3)}
.bl-bar{display:flex;align-items:center;gap:8px}
.bl-bar .bar{flex:1}
.bl-bar b{font-size:11px;font-family:var(--font-mono);color:var(--text-2);white-space:nowrap}

.rows{border:1px solid var(--border);border-radius:var(--r-md);overflow:clip}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 92px 84px;gap:10px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--border);font-size:12px}
.row:last-child{border-bottom:0}
.row.head{background:var(--surface-sunken);font-size:10.5px;color:var(--text-3);font-weight:650;letter-spacing:.03em}
.row.body:hover{background:var(--surface-hover)}
.row .mod{font-size:10.5px;color:var(--plum-fg);background:var(--plum-soft);border:1px solid var(--plum-border);border-radius:5px;padding:2px 6px;justify-self:start;white-space:nowrap}
.row .tt{min-width:0}
.row .tt b{display:block;font-weight:600;font-size:12px;line-height:1.45}
.row .tt span{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono)}
.row .ty{font-size:10.5px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:10.5px;font-weight:650;border:1px solid var(--border);background:var(--surface-sunken);color:var(--text-3);white-space:nowrap}
.badge.ok{background:var(--success-soft);border-color:var(--success-border);color:var(--success-fg)}
.badge.warn{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning-fg)}
.badge.bad{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-fg)}
.badge.pri{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg)}
.more-row{display:flex;align-items:center;justify-content:center;padding:8px;background:var(--surface-sunken);border-top:1px solid var(--border)}

.ledger{display:flex;flex-direction:column;gap:9px}
.led{display:grid;grid-template-columns:58px minmax(0,1fr);gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken)}
.led-d{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--primary-fg);background:var(--surface);border:1px solid var(--primary-border);
  border-radius:6px;height:24px;display:grid;place-items:center}
.led-t{font-size:12.5px;font-weight:640;line-height:1.5}
.led-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.led-w{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6}

.qgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.qbox{border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;background:var(--surface-sunken)}
.qbox h4{font-size:11px;color:var(--text-3);font-weight:650;margin-bottom:9px;letter-spacing:.03em}
.qnums{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.qnums div{font-size:10.5px;color:var(--text-3)}
.qnums b{display:block;font-size:15px;font-weight:730;font-family:var(--font-mono);color:var(--text)}
.defs{display:flex;flex-direction:column;gap:7px}
.def{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2)}
.def .p{width:26px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:750;flex:none}
.def .p.p1{background:var(--danger-soft);color:var(--danger-fg);border:1px solid var(--danger-border)}
.def .p.p2{background:var(--warning-soft);color:var(--warning-fg);border:1px solid var(--warning-border)}
.def .p.p3{background:var(--info-soft);color:var(--info-fg);border:1px solid var(--info-border)}
.def .grow{flex:1}
.def b{font-family:var(--font-mono);font-weight:700}

.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:66px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:11.5px}
.hb .hn{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{height:9px;border-radius:var(--r-pill);background:var(--surface-active);overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:var(--r-pill)}
.hb .hv{text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-2)}
.effort-foot{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--text-3)}
.effort-foot b{color:var(--text-2);font-family:var(--font-mono)}

.evlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ev{display:flex;gap:10px;padding:10px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken);align-items:flex-start}
.ev .ei{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary-fg);border:1px solid var(--primary-border)}
.ev.plum .ei{background:var(--plum-soft);color:var(--plum-fg);border-color:var(--plum-border)}
.ev.ok .ei{background:var(--success-soft);color:var(--success-fg);border-color:var(--success-border)}
.ev.warn .ei{background:var(--warning-soft);color:var(--warning-fg);border-color:var(--warning-border)}
.ev b{display:block;font-size:12px;font-weight:660}
.ev span{display:block;font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.55;font-family:var(--font-mono);word-break:break-all}
.ev .btn{margin-left:auto;flex:none}
.internal-sec{background:repeating-linear-gradient(135deg,var(--surface) 0 12px,var(--surface-sunken) 12px 24px)}
.doc-foot{padding:13px 26px 18px;font-size:10.5px;color:var(--text-3);line-height:1.75;background:var(--surface-sunken)}
.doc-foot b{color:var(--text-2)}
.page-foot{margin:14px 2px 0;font-size:10.5px;color:var(--text-3);text-align:center;line-height:1.7}

/* ============ 入口页（版本页） ============ */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;box-shadow:var(--shadow-xs)}
.toolbar .grow{flex:1}
.toolbar .meta{font-size:11.5px;color:var(--text-3)}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:clip;margin-bottom:14px}
.vc-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--paper-band)}
.vc-head h3{font-size:16px;font-weight:730;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vc-head p{font-size:11.5px;color:var(--text-3);margin-top:5px}
.vc-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vc-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.vc-stat b{display:block;font-size:18px;font-weight:750;font-family:var(--font-mono);letter-spacing:-.02em}
.vc-stat span{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}
.vc-body{padding:13px 16px}
.vc-body h4{font-size:11px;color:var(--text-3);letter-spacing:.05em;margin-bottom:9px}
.relrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 84px 100px;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:7px;background:var(--surface-sunken);font-size:11.5px}
.relrow b{font-family:var(--font-mono);font-size:11.5px;font-weight:680}
.relrow span{color:var(--text-3);font-size:10.5px;display:block;margin-top:2px;font-family:var(--font-sans)}
.newdot{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:var(--r-pill);background:var(--plum);color:#fff;font-size:9px;font-weight:750;letter-spacing:.04em;margin-left:2px}
.annot{display:none;margin-top:10px;padding:10px 12px;border:1px dashed var(--plum-border);border-radius:var(--r-md);background:var(--plum-soft);color:var(--plum-fg);font-size:11.5px;line-height:1.7}
body.annot-on .annot{display:block}
.annot b{font-weight:700}

/* ============ 抽屉 / 弹窗 / 吐司 ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);z-index:80;animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-xl);z-index:90;display:flex;flex-direction:column;animation:slide .22s var(--ease)}
@keyframes slide{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.dw-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.dw-head h3{font-size:14px;font-weight:700}
.dw-head p{font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.6}
.dw-body{flex:1;overflow-y:auto;padding:14px 16px}
.dw-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface-sunken)}
.dw-foot .btn{flex:1}
.caliber{padding:10px 12px;border-radius:var(--r-md);background:var(--primary-soft);border:1px solid var(--primary-border);color:var(--primary-fg);font-size:11.5px;line-height:1.7;margin-bottom:12px}
.srcrec{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:7px;background:var(--surface-sunken)}
.srcrec .si{font-family:var(--font-mono);font-size:10px;color:var(--primary-fg);background:var(--surface);border:1px solid var(--primary-border);border-radius:5px;padding:2px 5px;height:20px;flex:none}
.srcrec b{display:block;font-size:12px;font-weight:620;line-height:1.5}
.srcrec span{display:block;font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.modal-wrap{position:fixed;inset:0;z-index:95;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px}
.modal{width:min(760px,100%);min-width:0;max-height:min(86vh,860px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);display:flex;flex-direction:column;overflow:clip;animation:pop .2s var(--ease)}
.modal.narrow{width:min(520px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.md-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.md-head h3{font-size:14.5px;font-weight:720;flex:1}
.md-body{padding:16px 18px;overflow-y:auto;flex:1}
.md-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--surface-sunken)}
.md-foot .grow{flex:1}
.x-btn{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-3);display:grid;place-items:center}
.x-btn:hover{background:var(--surface-hover);color:var(--text)}
.fmt-tabs{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.fmt-tabs button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text-3);font-size:12px;font-weight:620}
.fmt-tabs button.on{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg)}
.paper-frame{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken);padding:14px;max-height:420px;min-width:0;overflow:auto}
.paper{width:794px;transform-origin:top left;background:#fff;box-shadow:var(--shadow-md);border-radius:4px;overflow:clip}
.paper-holder{height:400px;overflow:hidden}
.md-body{min-width:0}
.md-foot{flex-wrap:wrap}
.md-pre{margin:0;padding:12px;border-radius:var(--r-md);background:var(--surface-sunken);border:1px solid var(--border);
  font-family:var(--font-mono);font-size:11px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;max-height:340px;overflow:auto}
.share-url{display:flex;gap:7px;align-items:center;margin:10px 0 12px}
.share-url .input{font-family:var(--font-mono);font-size:11px}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:9px;align-items:center;margin-bottom:9px;font-size:12px}
.kv > span{color:var(--text-3);font-size:11px}
.snap{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-sunken);margin-bottom:7px;font-size:11.5px}
.snap b{font-family:var(--font-mono);font-size:11.5px}
.snap span{color:var(--text-3);font-size:10.5px}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;padding:10px 16px;border-radius:var(--r-pill);
  background:var(--text);color:var(--surface);font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger-fg);color:#fff}
.toast.warn{background:var(--warning-fg);color:#fff}

/* ============ 接收人只读视图 ============ */
body[data-screen="share"] .sidebar,body[data-screen="share"] .topbar,body[data-screen="share"] .tabbar{display:none}
body[data-screen="share"] .app{grid-template-columns:minmax(0,1fr);background:transparent;border:0;box-shadow:none}
body[data-screen="share"] .main{background:transparent}
body[data-screen="share"] .content{padding:0 20px 60px}
.share-wrap{max-width:900px;margin:0 auto}
.share-top{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);position:sticky;top:10px;z-index:20}
.share-top .brand-mark{width:26px;height:26px;border-radius:8px}
.share-top .st-t{font-size:12.5px;font-weight:700}
.share-top .st-s{font-size:10.5px;color:var(--text-3);margin-top:2px}
.share-top .grow{flex:1}
.share-foot{margin-top:14px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);
  font-size:11px;color:var(--text-3);line-height:1.8}

/* ============ 移动端 ============ */
.tabbar{display:none}
@media (max-width:1080px){
  .work{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;order:-1}
  .rail-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .rgroup{border-bottom:1px solid var(--border)}
  .rail-foot,.rail-note,.rail-lockbar{grid-column:1/-1}
  .secnav{top:60px}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);border-radius:0;border-left:0;border-right:0;margin-bottom:0;min-height:100vh}
  .sidebar{display:none}
  .topbar{height:52px;padding:0 14px}
  .tb-sub{display:none}
  .content{padding:14px 12px 96px}
  .proto-bar{padding:0 12px;margin:10px auto 8px}
  .page-head{flex-direction:column;gap:10px}
  .page-actions{justify-content:flex-start;width:100%}
  .page-actions .btn{flex:1;min-width:calc(50% - 4px)}
  .work{gap:12px}
  .rail-body{grid-template-columns:minmax(0,1fr)}
  .doc-head{padding:16px 16px 14px}
  .doc-title{font-size:19px}
  .doc-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-no{display:none}
  .doc-watermark{right:12px;top:12px;bottom:auto;font-size:11px;padding:3px 9px;letter-spacing:.16em}
  .sec{padding:14px 16px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qgrid{grid-template-columns:minmax(0,1fr)}
  .evlist{grid-template-columns:minmax(0,1fr)}

function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
}
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}
function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast(okMsg || '已复制'), () => toast('复制失败，请手动选中复制', 'warn'));
  }else{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg || '已复制'); }catch(e){ toast('复制失败，请手动选中复制', 'warn'); }
    ta.remove();
  }
}

function sourceData(key){

    passRate:{title:'回归通过率', caliber:'口径：通过用例数 / 已执行用例数（不含未执行）。数据来自关联到本版本的测试计划执行结果。',
      rows:q.cases ? [{id:q.plan.split(' · ')[0], m:'执行 ' + exec + ' / ' + q.cases + ' 条 · 通过 ' + q.passed, s:'测试报告 TR-2026-1112'},
        {id:'FAIL-4', m:'失败 4 条已修复并复测通过', s:'缺陷回链：BUG-3011 / 3012 / 3015 / 3018'},

        : [{id:'—', m:'未创建测试计划', s:'没有执行结果，不显示通过率'}]},
    deferred:{title:'后续计划 ' + (c.deferred + c.partial) + ' 项', caliber:'口径：承诺台账中未随本次发布交付的项，含部分发布与改版本延后，去向取工作项的目标版本。',
      rows:d.scope.filter(x => x.s !== 'released').map(x => ({id:x.ref.split(' · ')[0], m:x.t, s:x.ref}))},
    defects:{title:'未关闭缺陷', caliber:'口径：本次回归关联缺陷中状态未关闭的项，按优先级分组。',
      rows:q.defects.length ? q.defects.map(x => ({id:x.p, m:'共 ' + x.total + ' 项 · 未关闭 ' + x.open + ' 项', s:'来源：缺陷库 · 关联版本 ' + d.version})) : [{id:'—', m:'无缺陷记录', s:'未执行回归'}]},
    effort:{title:'实际投入 ' + e.total + 'h', caliber:'口径：版本范围内工作项的计时与补记合计，按工时发生日期落在版本周期内统计；不是计费工时。',
      rows:e.people.length ? e.people.map(p => ({id:p.name, m:p.v + 'h', s:'周回顾 · 计时明细可逐条下钻'})) : [{id:'—', m:'无计时与补记记录', s:'不反推投入'}]},
    estimate:{title:'预估工时 ' + e.estimate + 'h', caliber:'口径：版本范围内工作项预估分钟之和，取发布快照时刻的值。',
      rows:[{id:'SNAP', m:'版本范围快照 · 冻结于 ' + (r ? r.at : '—'), s:'快照后预估变化不影响本说明'}]},

      '<div class="dw-head"><div style="flex:1"><h3>数据来源总览</h3><p>' + esc(d.project) + ' · ' + esc(d.version) + ' · 全部为只读聚合，不新增录入表单</p></div>' +
        '<button class="x-btn" data-act="close-layer" aria-label="关闭">' + icon('x') + '</button></div>' +
      '<div class="dw-body">' +
        '<div class="caliber">生成过程只读：聚合接口一次取回版本、发布、测试、工时与变更记录，不写任何业务表；只有「导出快照」会落一条不可变记录。</div>' +
        rows.map(x => '<div class="srcrec"><span class="si">' + icon('layers') + '</span><div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '<br>' + esc(x[2]) + '</span></div></div>').join('') +
        '<div class="missing" style="margin-top:10px">' + icon('info') + '<div>缺失处理：任何一段没有记录，就显示「未提供 / 未验证」，不推断、不补造，也不阻断其余区块生成。</div></div>' +
      '</div>' +
      '<div class="dw-foot"><button class="btn" data-act="close-layer">关闭</button></div>' +
    '</aside>');
}

/* ---------------- 导出 ---------------- */
function markdown(){
  const d = D(), c = d.counts, q = d.quality, r = rel();
  const exec = q.passed + q.failed + q.blocked;
  const L = [];
  L.push('# 交付说明 · ' + d.project + ' · ' + d.version);
  L.push('');
  L.push('- 语气：' + toneName() + '　交付对象：' + audience());
  L.push('- 交付周期：' + d.period);
  L.push('- 发布记录：' + (r ? r.label : '尚未确认'));
  L.push('- 编制：' + d.owner + ' · ' + d.ownerRole + '　编号：' + d.docNo);
  L.push('');
  L.push('## 一、交付摘要');
  L.push(d.text.summary[state.verbosity]);
  L.push('');
  L.push('| 指标 | 数值 | 口径 |');
  L.push('| --- | --- | --- |');
  L.push('| 已发布 | ' + c.released + ' / ' + c.planned + ' | 发布快照中处理结果为已发布 / 承诺台账 |');
  L.push('| 部分发布 | ' + c.partial + ' | 同一需求分批发布 |');
  L.push('| 延后 | ' + c.deferred + ' | 改版本至后续版本 |');
  L.push('| 回归通过率 | ' + (exec ? pct(q.passed, exec) + '%' : '未执行回归') + ' | 通过 / 已执行 |');
  if(showEffort()) L.push('| 实际投入 | ' + (d.effort.total ? d.effort.total + 'h' : '未记录工时') + ' | 计时 + 补记 |');
  L.push('');
  L.push('## 二、交付范围');
  scopeRows().forEach(x => L.push('- [' + (x.s === 'released' ? '已发布' : x.s === 'partial' ? '部分发布' : '延后') + '] ' + x.mod + ' · ' + x.t + '（' + x.ref + '）'));
  if(state.showChanges){
    L.push('');
    L.push('## 三、变更说明');
    L.push(edited.change != null ? edited.change : d.text.change[state.verbosity]);
    d.changes.forEach(x => L.push('- ' + x.d + '　' + x.t + '　' + x.tags.join(' / ') + '　' + x.who));
    if(!d.changes.length) L.push('- 无变更记录（基线 ' + d.baseline.at + ' 建立）');
  }
  L.push('');
  L.push('## 四、质量与验证');
  L.push(edited.issue != null ? edited.issue : d.text.issue[state.verbosity]);
  L.push('');
  L.push('## 五、后续计划与风险');
  d.risks.forEach(x => L.push('- ' + x.t + '　' + x.im + (state.tone === 'customer' ? '' : '　责任人 ' + x.own) + '　' + x.next + '　' + x.st));
  if(state.tone === 'internal'){ L.push(''); L.push('## 六、内部备注（不对外）'); L.push(d.text.internal); }
  if(state.note.trim()){ L.push(''); L.push('## 补充说明'); L.push(state.note.trim()); }
  L.push('');
  L.push('## 证据与附件');
  visibleEvidence().forEach(x => L.push('- ' + x.n + '：' + x.m));
  L.push('');
  L.push('---');
  L.push('本说明由沙漏根据系统记录自动生成，实际交付以发布记录为准；不替代部署执行、流水线验证或客户验收签认。');
  return L.join('\n');
}
function openExport(){
  if(!canExport()){ toast(exportBlockReason(), 'warn'); return; }
  exportFmt = 'pdf';
  renderExport();
}
function renderExport(){
  const body = exportFmt === 'pdf'
    ? '<div class="paper-frame"><div class="paper-holder"><div class="paper" id="paperPreview" style="transform:scale(.48)">' +
        '<article class="sheet compact" style="border:0;box-shadow:none;border-radius:0">' + sheetInner({readonly:true, clean:true}) + '</article>' +
      '</div></div></div>' +
      '<div class="missing" style="margin-top:11px">' + icon('print') + '<div>PDF 走浏览器打印管线（A4、隐藏应用外壳与控件），可直接「另存为 PDF」。页眉带编号与生成时间，页脚固定口径声明。</div></div>'
    : exportFmt === 'md'
      ? '<pre class="md-pre" id="mdPre">' + esc(markdown()) + '</pre>'
      : '<div class="caliber">HTML 快照是单文件、离线可开的静态页，包含当前语气下的全部内容与样式，不含任何脚本与内部备注（客户版）。适合邮件附件或归档。</div>' +
        '<div class="snap"><span>' + icon('note') + '</span><div style="flex:1"><b>交付说明-' + esc(D().version) + '-' + esc(toneName()) + '.html</b><span>约 68 KB · 含样式 · 无脚本</span></div><span class="badge ok">可离线打开</span></div>';
  layer('<div class="scrim" data-act="close-layer"></div>' +
    '<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="导出交付说明">' +
      '<div class="md-head">' + icon('down') + '<h3>导出交付说明</h3><span class="chip pri">' + esc(toneName()) + '</span>' +
        '<button class="x-btn" data-act="close-layer" aria-label="关闭">' + icon('x') + '</button></div>' +
      '<div class="md-body">' +
        '<div class="fmt-tabs">' + [['pdf','PDF / 打印'],['md','Markdown'],['html','HTML 快照']].map(([k, n]) =>
          '<button type="button" class="' + (exportFmt === k ? 'on' : '') + '" data-act="fmt" data-fmt="' + k + '">' + n + '</button>').join('') + '</div>' +
        body +
        '<div style="height:12px"></div>' +
        '<div class="missing">' + icon('lock') + '<div>导出即锁定：本次内容会存为不可变快照 <b>' + nextSnapId() + '</b>，之后系统记录变化不影响它。要更新内容需重新生成，会得到新编号。</div></div>' +
      '</div>' +
      '<div class="md-foot">' +
        '<span class="grow" style="font-size:11px;color:var(--text-3)">' + (exportFmt === 'pdf' ? '约 ' + ($('#pageEst') ? $('#pageEst').textContent : '1') + ' 页 A4' : '纯文本 / 单文件') + ' · ' + esc(toneName()) + '</span>' +
        (exportFmt === 'md' ? '<button class="btn" data-act="copy-md">' + icon('copy') + '复制</button>' : '') +
        '<button class="btn" data-act="close-layer">取消</button>' +
        '<button class="btn primary" data-act="do-export">' + icon('down') + (exportFmt === 'pdf' ? '打印 / 存为 PDF' : '下载文件') + '</button>' +
      '</div>' +
    '</div></div>');
  const p = $('#paperPreview');
  if(p) fitPaper();
}
function fitPaper(){
  const p = $('#paperPreview'), frame = $('.paper-frame'), holder = $('.paper-holder');
  if(!p || !frame || !holder) return;
  const k = Math.min(0.62, (frame.clientWidth - 28) / 794);
  p.style.transform = 'scale(' + k + ')';
  holder.style.width = Math.round(794 * k) + 'px';
  holder.style.height = Math.min(400, Math.round(p.getBoundingClientRect().height)) + 'px';
}
window.addEventListener('resize', fitPaper);
function nextSnapId(){
  return 'SNAP-' + D().docNo.replace('DS-', '') + '-' + String(snapshots.length + 1).padStart(2, '0');
}
function doExport(){
  const id = nextSnapId();
  const at = '2026-11-13 09:' + String(20 + snapshots.length).padStart(2, '0');
  if(exportFmt === 'md') download('交付说明-' + D().version + '-' + toneName() + '.md', markdown(), 'text/markdown;charset=utf-8');
  else if(exportFmt === 'html'){
    const css = $('style').textContent;
    const html = '<!DOCTYPE html><html lang="zh-CN" data-theme="' + state.theme + '"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1"><title>交付说明 · ' + esc(D().version) + '</title><style>' + css +
      'body{background:var(--bg-app);padding:24px}.sheet{max-width:900px;margin:0 auto}</style></head><body>' +
      '<article class="sheet">' + sheetInner({readonly:true, clean:true}) + '</article></body></html>';
    download('交付说明-' + D().version + '-' + toneName() + '.html', html, 'text/html;charset=utf-8');
  }
  snapshots.push({id, at, tone:toneName(), fmt:{pdf:'PDF', md:'Markdown', html:'HTML'}[exportFmt]});
  state.locked = true;
  state.editMode = false;
  closeLayer();
  render();
  toast('已生成不可变快照 ' + id);
  if(exportFmt === 'pdf') setTimeout(() => window.print(), 260);
}
function openSnapshots(){
  layer('<div class="scrim" data-act="close-layer"></div>' +
    '<aside class="drawer" role="dialog" aria-modal="true" aria-label="快照列表">' +
      '<div class="dw-head"><div style="flex:1"><h3>导出快照</h3><p>每次导出产生一份不可变快照，编号递增，内容不随系统变化。</p></div>' +
        '<button class="x-btn" data-act="close-layer" aria-label="关闭">' + icon('x') + '</button></div>' +
      '<div class="dw-body">' +
        (snapshots.length ? snapshots.slice().reverse().map(s => '<div class="snap"><span>' + icon('lock') + '</span>' +
          '<div style="flex:1"><b>' + esc(s.id) + '</b><span>' + esc(s.at) + ' · ' + esc(s.tone) + ' · ' + esc(s.fmt) + '</span></div>' +
          '<button class="btn sm ghost" data-act="toast" data-msg="原型：下载该快照">' + icon('down') + '</button></div>').join('')
          : '<div class="missing">' + icon('info') + '<div>还没有导出过。导出后这里会出现不可变快照，可重复下载同一份内容。</div></div>') +
        '<div class="annot" style="display:block;margin-top:12px"><b>设计标注 ⑤</b> 快照不是「导出文件」而是产品对象：可重复下载、可分享、可对比两次交付说明的差异，也是北极星指标「每周有效交付说明数」的计数单位。</div>' +
      '</div>' +
      '<div class="dw-foot"><button class="btn" data-act="close-layer">关闭</button>' +
        '<button class="btn primary" data-act="regen">重新生成草稿</button></div>' +
    '</aside>');
}

/* ---------------- 分享 ---------------- */
function openShare(){
  if(!canShare()){ toast(shareBlockReason(), 'warn'); return; }
  renderShare();
}
function renderShare(){
  const url = share ? share.url : '';
  layer('<div class="scrim" data-act="close-layer"></div>' +
    '<div class="modal-wrap"><div class="modal narrow" role="dialog" aria-modal="true" aria-label="分享交付说明">' +
      '<div class="md-head">' + icon('share') + '<h3>分享只读链接</h3><span class="chip pri">' + esc(toneName()) + '</span>' +
        '<button class="x-btn" data-act="close-layer" aria-label="关闭">' + icon('x') + '</button></div>' +
      '<div class="md-body">' +
        '<div class="caliber">分享的是当前这份快照的只读投影：接收人无需登录；内部备注、成员工时明细与制品校验值不会下发。</div>' +
        '<div class="kv"><span>有效期</span><select class="select" data-ctl="shareDays">' +
          [7, 30, 90].map(x => '<option value="' + x + '"' + (shareDays === x ? ' selected' : '') + '>' + x + ' 天</option>').join('') + '</select></div>' +
        '<div class="kv"><span>允许下载</span><label class="switch"><input type="checkbox" data-ctl="shareDownload"' + (shareDownload ? ' checked' : '') + '><span class="track"></span><span class="sw-t">接收人可下载 PDF</span></label></div>' +
        '<div class="share-url"><input class="input" id="shareUrl" readonly value="' + esc(url) + '" placeholder="点「生成链接」后出现只读地址">' +
          '<button class="btn soft" data-act="gen-share">' + (share ? '已生成' : '生成链接') + '</button></div>' +
        (share ? '<div class="snap"><span>' + icon('lock') + '</span><div style="flex:1"><b>' + esc(share.snap) + '</b>' +
          '<span>生成于 ' + esc(share.at) + ' · 有效至 ' + esc(share.until) + ' · 已被打开 ' + share.opens + ' 次</span></div>' +
          '<button class="btn sm danger" data-act="revoke-share">撤销</button></div>' : '') +
        '<div class="missing" style="margin-top:10px">' + icon('info') + '<div>客户版链接不含内部备注；内部版不可分享；没有成功生产发布记录时不可分享。</div></div>' +
      '</div>' +
      '<div class="md-foot"><span class="grow"></span>' +
        '<button class="btn" data-act="close-layer">关闭</button>' +
        '<button class="btn" data-act="preview-share"' + (share ? '' : ' disabled') + '>' + icon('eye') + '接收人视图</button>' +
        '<button class="btn primary" data-act="copy-share"' + (share ? '' : ' disabled') + '>' + icon('copy') + '复制链接</button>' +
      '</div>' +
    '</div></div>');
}
function genShare(){
  const token = Array.from({length:24}, () => 'abcdef0123456789'[Math.floor(Math.random() * 16)]).join('');
  const until = new Date(Date.now() + shareDays * 86400000);
  const snap = snapshots.length ? snapshots[snapshots.length - 1].id : nextSnapId();
  if(!snapshots.length) snapshots.push({id:snap, at:'2026-11-13 09:20', tone:toneName(), fmt:'分享快照'});
  share = {
    token, snap, days:shareDays, at:'2026-11-13 09:20', opens:0,
    until:until.toISOString().slice(0, 10),
    url:'https://pm.example.com/hourglass/share.html?kind=delivery&token=' + token
  };
  renderShare();
  toast('只读链接已生成（' + shareDays + ' 天有效）');
}

/* ---------------- 层 ---------------- */
function layer(html){ $('#layerRoot').innerHTML = html; }
function closeLayer(){ $('#layerRoot').innerHTML = ''; }

/* ---------------- 交互 ---------------- */
function applyTone(t){
  state.tone = t;
  state.showEffort = t !== 'customer';
  if(t === 'internal'){ state.evidence = 2; }
  else if(state.evidence === 2) state.evidence = 1;
  if(t !== 'customer' && !state.audience.trim()) state.audience = '';
}
function resetAll(keepScreen){
  const sc = state.screen, th = state.theme, an = state.annot, scene = state.scene;
  state = Object.assign({}, DEFAULTS, {screen:keepScreen ? sc : 'work', theme:th, annot:an, scene});
  if(state.scene === 'sparse') state.releaseId = 'rel-1111';
  pending = {change:true, issue:true};
  edited = {}; snapshots = []; share = null;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  if(t.disabled) return;
  switch(act){
    case 'noop': return;
    case 'screen':
      state.screen = t.dataset.screen;
      if(state.screen === 'share' && !share){ state.screen = 'share'; }
      closeLayer(); render(); window.scrollTo({top:0});
      break;
    case 'nav':
      if(t.dataset.nav === 'note'){ state.screen = 'work'; render(); window.scrollTo({top:0}); }
      else if(t.dataset.nav === 'phase'){ state.screen = 'entry'; render(); window.scrollTo({top:0}); }
      else toast('原型：' + t.textContent.trim() + ' 为真实应用已有页面');
      break;
    case 'entry-generate':
      state.releaseId = t.dataset.rel; state.screen = 'work'; state.locked = false;
      render(); window.scrollTo({top:0}); toast('已按该发布记录生成交付说明');
      break;
    case 'theme':
      state.theme = state.theme === 'light' ? 'dark' : 'light'; render();
      break;
    case 'annot':
      state.annot = !state.annot; render();
      break;
    case 'tone':
      applyTone(t.dataset.tone); render();
      break;
    case 'gran':
      state.granularity = t.dataset.gran; render();
      break;
    case 'evidence':
      state.evidence = Number(t.dataset.lv); render();
      break;
    case 'density':
      state.density = t.dataset.density; render();
      break;
    case 'use-production': {
      const p = D().releases.find(r => r.env === 'production');
      if(p){ state.releaseId = p.id; render(); toast('已改用生产发布记录'); }
      break;
    }
    case 'reset':
      resetAll(true); render(); toast('已恢复默认：客户版 · 最近一次成功生产发布');
      break;
    case 'scene':
      state.scene = state.scene === 'full' ? 'sparse' : 'full';
      resetAll(true); render(); window.scrollTo({top:0});
      toast(state.scene === 'sparse' ? '已切到记录不完整的版本（缺失如何标注）' : '已切回完整记录的版本');
      break;
    case 'regen':
      state.locked = false; pending = {change:true, issue:true}; edited = {};
      closeLayer(); render(); toast('已按最新记录重新生成草稿');
      break;
    case 'accept':
      pending[t.dataset.key] = false; render(); toast('已确认，这段文字仍可改写');
      break;
    case 'accept-all':
      pending = {change:false, issue:false}; render(); toast('两处表述已确认，可以导出或分享');
      break;
    case 'goto-pending': {
      const key = pending.change ? 'changes' : 'quality';
      const el = $('#sec-' + key);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      break;
    }
    case 'jump': {
      const el = $('#sec-' + t.dataset.sec);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      break;
    }
    case 'edit':
      state.editMode = !state.editMode; render();
      if(state.editMode) toast('文字可直接改写，数字保持只读');
      break;
    case 'edit-one': {
      state.editMode = true; render();
      const el = $('[data-field="' + t.dataset.field + '"]');
      if(el){ el.focus(); el.scrollIntoView({behavior:'smooth', block:'center'}); }
      break;
    }
    case 'restore':
      delete edited[t.dataset.field]; render(); toast('已恢复系统草稿');
      break;
    case 'source': openSource(t.dataset.src); break;
    case 'open-sources': openSourcesOverview(); break;
    case 'open-export': openExport(); break;
    case 'open-share': openShare(); break;
    case 'open-snapshots': openSnapshots(); break;
    case 'fmt': exportFmt = t.dataset.fmt; renderExport(); break;
    case 'do-export': doExport(); break;
    case 'copy-md': copyText(markdown(), 'Markdown 已复制'); break;
    case 'gen-share': genShare(); break;
    case 'copy-share': if(share) copyText(share.url, '只读链接已复制'); break;
    case 'revoke-share':
      share = null; renderShare(); toast('链接已撤销，接收人再打开会看到失效提示', 'warn');
      break;
    case 'preview-share':
      closeLayer(); state.screen = 'share'; render(); window.scrollTo({top:0});
      break;
    case 'print': window.print(); break;
    case 'close-layer': closeLayer(); break;
    case 'toast': toast(t.dataset.msg || '原型演示'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ctl]');
  if(!el) return;
  const k = el.dataset.ctl;
  if(k === 'shareDays'){ shareDays = Number(el.value); if(share){ share.days = shareDays; } renderShare(); return; }
  if(k === 'shareDownload'){ shareDownload = el.checked; renderShare(); return; }
  if(el.type === 'checkbox') state[k] = el.checked;
  else if(k === 'verbosity') state[k] = Number(el.value);
  else state[k] = el.value;
  if(k === 'releaseId' && state.locked) state.locked = false;
  render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.matches('[data-ctl="audience"],[data-ctl="note"]')){
    state[el.dataset.ctl] = el.value;
    const pos = el.selectionStart;
    render();
    const again = $('[data-ctl="' + el.dataset.ctl + '"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(err){} }
    return;
  }
  if(el.matches('[data-ctl="verbosity"]')){ state.verbosity = Number(el.value); render(); return; }
  const f = el.closest('[data-field]');
  if(f){
    const field = f.dataset.field;
    edited[field] = f.textContent;
    const bar = $('[data-bar="' + field + '"]');
    if(bar) bar.innerHTML = '<span class="chip warn">已改写 · 待确认</span><span class="nb-t">改完点确认</span>' +
      '<button class="btn sm soft" data-act="accept" data-key="' + (field === 'change' ? 'change' : 'issue') + '">确认这段</button>' +
      '<button class="btn sm ghost" data-act="restore" data-field="' + field + '">恢复系统草稿</button>';
    pending[field === 'change' ? 'change' : 'issue'] = true;
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeLayer(); }
});

/* ---------------- 启动 ---------------- */
render();
window.PROTO = {
  get state(){ return state; },
  get pending(){ return pending; },
  get snapshots(){ return snapshots; },
  get share(){ return share; },
  render,
  set(patch){ Object.assign(state, patch); render(); },
  act(sel){ const el = $(sel); if(el){ el.click(); return true; } return false; }
};
</script>
