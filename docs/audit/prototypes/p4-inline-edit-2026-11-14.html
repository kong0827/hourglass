<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 · 关联就地编辑原型（2026-11-14）</title>
<style>
/* ===== 设计令牌：与 frontend/css/tokens.css 同口径 ===== */
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7; --surface-hover:#F2F4F7; --surface-active:#E9ECF1;
  --border:#E4E7EC; --border-strong:#D0D5DD; --text:#101828; --text-2:#475467; --text-3:#667085; --text-inverse:#FFFFFF;
  --scrim:rgba(16,24,40,.32);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EFF4FF; --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-border:#A6F4C5; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-border:#FEDF89; --warning-fg:#B54708;
  --danger:#F04438; --danger-soft:#FEF3F2; --danger-border:#FDA29B; --danger-fg:#B42318;
  --info:#2E90FA; --info-soft:#EFF8FF; --info-border:#B2DDFF; --info-fg:#175CD3;
  --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-border:#D9D6FE; --plum-fg:#5B3FD1;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --shadow-xl:0 24px 48px -12px rgba(16,24,40,.18);
  --ring-focus:0 0 0 3px rgba(37,99,235,.16);
  --ease-out:cubic-bezier(.2,.8,.2,1); --dur-fast:120ms; --dur-base:180ms;
}
html[data-theme="dark"]{
  --bg-app:#0C111D; --surface:#161B26; --surface-sunken:#1F2430; --surface-hover:#1F2430; --surface-active:#2A3040;
  --border:#2A3040; --border-strong:#3A4152; --text:#F2F4F7; --text-2:#CDD3DF; --text-3:#98A2B3; --text-inverse:#0C111D;
  --scrim:rgba(0,0,0,.55);
  --primary:#5B8DEF; --primary-hover:#7AA2F7; --primary-soft:#1B2740; --primary-border:#33507E; --primary-fg:#9DBDF7;
  --success-soft:#122A1E; --success-border:#1F5138; --success-fg:#6CE9A6;
  --warning-soft:#2E2410; --warning-border:#5C451A; --warning-fg:#FEC84B;
  --danger-soft:#2E1615; --danger-border:#5C2A26; --danger-fg:#FDA29B;
  --info-soft:#12233A; --info-border:#274567; --info-fg:#84CAFF;
  --plum-soft:#221B3A; --plum-border:#3D3163; --plum-fg:#C3B5FD;
  --shadow-lg:0 12px 24px -6px rgba(0,0,0,.5),0 4px 8px -4px rgba(0,0,0,.4);
  --shadow-xl:0 24px 48px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:var(--font-sans);background:var(--bg-app);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--surface);}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}

/* ===== 原型工具条（仅评审用，非产品组件） ===== */
.proto-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.proto-bar .pt{font-size:13px;font-weight:700;color:var(--text);margin-right:4px;}
.proto-bar .psub{font-size:11.5px;color:var(--text-3);margin-right:auto;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);}
.seg button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--text-2);border-right:1px solid var(--border);}
.seg button:last-child{border-right:0;}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-fg);}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface);font-size:12px;font-weight:600;color:var(--text-2);}
.pbtn:hover{border-color:var(--border-strong);background:var(--surface-hover);color:var(--text);}
.pbtn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.pbtn.primary:hover{background:var(--primary-hover);}
.pbtn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary-fg);}

/* ===== 舞台 ===== */
.stage{display:flex;justify-content:center;padding:26px 16px 80px;}
.stage.is-mobile{padding:0;}
.device{width:100%;max-width:860px;}
.stage.is-mobile .device{max-width:390px;min-height:100vh;background:var(--bg-app);box-shadow:var(--shadow-xl);}

/* ===== 抽屉（阅读态） ===== */
.drawer{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;}
.stage.is-mobile .drawer{border:0;border-radius:0;box-shadow:none;min-height:100vh;}
.drawer-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);}
.dh-top{display:flex;align-items:center;gap:10px;min-width:0;}
.type-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-pill);
  background:var(--success-soft);color:var(--success-fg);font-size:11.5px;font-weight:650;flex:0 0 auto;}
.drawer-no{height:22px;padding:0 9px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);
  font-size:11.5px;font-weight:650;color:var(--text-2);font-family:var(--font-mono);flex:0 0 auto;}
.ds-status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--border);
  border-radius:var(--r-pill);background:var(--surface);font-size:11.5px;font-weight:650;color:var(--text-2);flex:0 0 auto;margin-left:auto;}
.ds-status i{width:7px;height:7px;border-radius:50%;background:var(--info);}
.dh-title{margin:10px 0 0;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--text);line-height:1.3;}
.dh-hint{margin:7px 0 0;font-size:11.5px;color:var(--text-3);}
.drawer-tabs{display:flex;align-items:center;gap:2px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.drawer-tab{position:relative;height:40px;padding:0 12px;font-size:13px;font-weight:550;color:var(--text-2);border-radius:var(--r-xs);}
.drawer-tab:hover{color:var(--text);background:var(--surface-hover);}
.drawer-tab[aria-selected="true"]{color:var(--primary-fg);font-weight:650;}
.drawer-tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--primary);}
.drawer-tab .tab-cnt{font-size:11px;color:var(--text-3);margin-left:3px;}
.drawer-body{padding:16px 20px 22px;}
.stage.is-mobile .drawer-body{padding:14px 14px 28px;}

/* ===== 关联卡 ===== */
.drawer-card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-xs);padding:13px 15px;}
.drawer-card + .drawer-card{margin-top:12px;}
.drawer-card-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;min-height:18px;}
.drawer-card-head h3{font-size:12.5px;font-weight:650;color:var(--text);margin:0;}
.drawer-card-head .foot-note{margin-left:auto;font-size:10.5px;font-weight:400;color:var(--text-3);}
.read-evidence{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 12px;margin:0;font-size:12.5px;align-items:center;}
.read-evidence dt{color:var(--text-3);white-space:nowrap;}
.read-evidence dd{margin:0;color:var(--text);min-width:0;display:flex;align-items:center;gap:6px;}
.read-evidence dd .val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 跳转值：主色 + 悬停下划线（与产品 dd.ev-link 一致） */
.ev-link{cursor:pointer;color:var(--primary-fg);border-radius:var(--r-xs);transition:color var(--dur-fast) var(--ease-out);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;text-align:left;padding:0;}
.ev-link:hover{color:var(--primary);text-decoration:underline;text-underline-offset:2px;}
.ev-link:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.ev-link.ver{color:var(--plum-fg);}
.ev-link.ver:hover{color:var(--plum);}
.muted-val{color:var(--text-3);}
.avatar{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--primary-soft);
  color:var(--primary-fg);font-size:10px;font-weight:700;flex:0 0 auto;}
/* P4 新增：就地编辑铅笔（仅需求/分支行，可写时出现）。值仍是跳转，铅笔单独触发选择浮层。 */
.assoc-edit{flex:0 0 auto;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:var(--r-xs);
  color:var(--text-3);border:1px solid transparent;opacity:.55;transition:opacity var(--dur-fast),background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast);}
.read-evidence dd:hover .assoc-edit,.assoc-edit:focus-visible{opacity:1;}
.assoc-edit:hover{background:var(--primary-soft);color:var(--primary-fg);border-color:var(--primary-border);}
.assoc-edit:focus-visible{outline:2px solid var(--primary);outline-offset:1px;opacity:1;}
.assoc-edit svg{width:13px;height:13px;}
.read-only .assoc-edit{display:none;}
/* 只读提示条 */
.ro-note{display:none;align-items:center;gap:7px;margin:0 0 12px;padding:8px 11px;border:1px solid var(--warning-border);
  border-radius:var(--r-sm);background:var(--warning-soft);color:var(--warning-fg);font-size:11.5px;line-height:1.5;}
.read-only .ro-note{display:flex;}
.p4-legend{margin:12px 2px 0;font-size:11px;line-height:1.6;color:var(--text-3);}
.p4-legend b{color:var(--text-2);font-weight:650;}
.p4-legend .k{display:inline-flex;align-items:center;gap:4px;padding:0 6px;height:18px;border-radius:var(--r-xs);
  background:var(--primary-soft);color:var(--primary-fg);font-weight:650;}

/* ===== 选择浮层（复用 search-picker 骨架） ===== */
.pop-scrim{position:fixed;inset:0;background:var(--scrim);z-index:200;animation:fade var(--dur-fast) ease-out;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.menu.search-picker{position:fixed;z-index:260;width:344px;max-width:calc(100vw - 24px);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column;
  animation:pop var(--dur-base) var(--ease-out);}
@keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.search-picker-head{padding:10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.search-picker-search{position:relative;}
.search-picker-search > svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;width:15px;height:15px;}
.search-picker-search input{width:100%;height:34px;padding:0 30px 0 32px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-size:13px;}
.search-picker-search input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring-focus);}
.pp-clear-search{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--text-3);}
.pp-clear-search:hover{background:var(--surface-hover);color:var(--text);}
.search-picker-tools{display:flex;align-items:center;gap:8px;margin-top:8px;}
.pp-count{flex:1 1 auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;}
.pp-count .pp-title{font-weight:650;color:var(--text-2);}
.search-picker-results{flex:1 1 auto;min-height:0;max-height:min(360px,60vh);overflow-y:auto;padding:6px;scrollbar-width:thin;}
.search-picker-clear{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:12.5px;text-align:left;}
.search-picker-clear:hover,.search-picker-clear:focus-visible{background:var(--surface-hover);}
.search-picker-clear.selected{background:var(--primary-soft);color:var(--primary-fg);font-weight:600;}
.search-picker-clear .ci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface-sunken);color:var(--text-3);flex:0 0 auto;}
.search-picker-option{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-sm);text-align:left;}
.search-picker-option:hover,.search-picker-option:focus-visible{background:var(--surface-hover);}
.search-picker-option.selected{background:var(--primary-soft);}
.search-picker-option.selected .sp-title{color:var(--primary-fg);}
.sp-ico{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface-sunken);color:var(--text-3);}
.sp-ico.branch{background:var(--info-soft);color:var(--info-fg);}
.sp-ico.demand{background:var(--plum-soft);color:var(--plum-fg);}
.search-picker-option-main{flex:1 1 auto;min-width:0;}
.sp-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:20px;color:var(--text);font-weight:600;}
.sp-meta{display:flex;align-items:center;gap:5px;margin-top:1px;font-size:11.5px;line-height:16px;color:var(--text-3);min-width:0;}
.sp-tag{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;background:var(--surface-sunken);color:var(--text-2);white-space:nowrap;}
.sp-tag.plan{background:var(--info-soft);color:var(--info-fg);}
.sp-tag.pass{background:var(--success-soft);color:var(--success-fg);}
.sp-tag.dev{background:var(--warning-soft);color:var(--warning-fg);}
.sp-tag.closed{background:var(--surface-sunken);color:var(--text-3);}
.sp-tag.arch{background:var(--surface-sunken);color:var(--text-3);}
.sp-check{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;color:var(--primary-fg);font-size:11px;font-weight:650;}
.search-picker-empty{padding:24px 12px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--text-3);}
.search-picker-empty .btn{margin-top:10px;}
.search-picker-foot{padding:8px 12px;border-top:1px solid var(--border);background:var(--surface-sunken);font-size:11px;line-height:16px;color:var(--text-2);flex:0 0 auto;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2);}
.btn:hover{border-color:var(--border-strong);background:var(--surface-hover);color:var(--text);}
.btn.sm{height:26px;padding:0 10px;font-size:12px;}
/* 移动端底部浮层 */
.menu.search-picker.as-sheet{left:12px!important;right:12px!important;top:auto!important;bottom:12px!important;width:auto!important;max-height:80vh;}
.menu.search-picker.as-sheet .search-picker-results{max-height:none;}
.sheet-grip{display:none;}
.as-sheet .sheet-grip{display:block;width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:8px auto 0;}

/* ===== Toast ===== */
.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-md);background:var(--text);color:var(--surface);
  font-size:12.5px;font-weight:550;box-shadow:var(--shadow-lg);animation:toastin var(--dur-base) var(--ease-out);max-width:min(92vw,460px);}
.toast .ti{display:inline-grid;place-items:center;width:16px;height:16px;flex:0 0 auto;}
.toast.ok .ti{color:var(--success);}
.toast.warn .ti{color:var(--warning);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="proto-bar">
  <span class="pt">P4 · 关联就地编辑</span>
  <span class="psub">阅读态「关联」卡 · 需求 / 分支值仍可跳转，铅笔就地改 · 失焦自动保存</span>
  <div class="seg" role="group" aria-label="视口">
    <button id="vpDesktop" aria-pressed="true">桌面 1440</button>
    <button id="vpMobile" aria-pressed="false">移动 390</button>
  </div>
  <button class="pbtn" id="roToggle" aria-pressed="false">只读项目</button>
  <button class="pbtn" id="themeToggle" aria-pressed="false">深色</button>
  <button class="pbtn" id="openDemand">打开「关联需求」</button>
  <button class="pbtn" id="openBranch">打开「所属分支」</button>
  <button class="pbtn primary" id="resetBtn">重置</button>
</div>

<div class="stage" id="stage">
  <div class="device">
    <div class="drawer read-mode" id="drawer">
      <div class="drawer-head">
        <div class="dh-top">
          <span class="type-badge">故事</span>
          <span class="drawer-no">HG-1024</span>
          <span class="ds-status"><i></i>进行中</span>
        </div>
        <h2 class="dh-title">抄表核算 · 阶梯水价计算</h2>
        <p class="dh-hint">点标题、描述或概览事实即可改，失焦自动保存；关联需求 / 分支点铅笔就地改，完整字段用「编辑」。</p>
      </div>
      <div class="drawer-tabs" role="tablist">
        <button class="drawer-tab" role="tab">概览</button>
        <button class="drawer-tab" role="tab">执行<span class="tab-cnt">2/5</span></button>
        <button class="drawer-tab" role="tab" aria-selected="true">关联</button>
        <button class="drawer-tab" role="tab">动态<span class="tab-cnt">6</span></button>
      </div>
      <div class="drawer-body">
        <div class="ro-note">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7v4m0 3h.01M8.3 3.3L2.6 13a1.6 1.6 0 0 0 1.4 2.4h12a1.6 1.6 0 0 0 1.4-2.4L11.7 3.3a1.6 1.6 0 0 0-2.8 0z"/></svg>
          <span>你对该项目只有查看权限：关联值仍可点击跳转，但不显示就地编辑铅笔。</span>
        </div>
        <section class="drawer-card">
          <div class="drawer-card-head"><h3>关联</h3><span class="foot-note">关联需求或文档会同步项目</span></div>
          <dl class="read-evidence" id="assocList"><!-- JS 渲染 --></dl>
          <p class="p4-legend"><b>就地编辑口径：</b>「关联需求 / 所属分支」值仍是<span class="k">跳转</span>，右侧铅笔<span class="k">就地改</span>；选中即保存（乐观更新 + 失败回滚），无需进入完整编辑表单。版本（需理由）、所属项目（重）、依赖（已有连线）不在本批。</p>
        </section>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  "use strict";
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
  var ICON = {
    pencil:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 3.6l3.6 3.6M4 16l1-4 9.4-9.4a1.6 1.6 0 0 1 2.3 0l1.7 1.7a1.6 1.6 0 0 1 0 2.3L9 16.2z"/></svg>',
    search:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M17 17l-3.5-3.5"/></svg>',
    close:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>',
    check:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>',
    branch:'<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="7" r="2"/><path d="M6 7v6M14 9c0 3-3 3-5 4"/></svg>',
    demand:'<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h7l3 3v11H5z"/><path d="M12 3v3h3M7.5 10h5M7.5 13h5"/></svg>',
    none:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M5.5 14.5l9-9"/></svg>',
    ok:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><path d="M6.5 10.5l2.5 2.5 4.5-5"/></svg>'
  };

  /* ===== 种子数据（贴合演示：华东水务集团 · 营收中台） ===== */
  var DEFAULTS = {
    project:"华东水务集团 · 营收中台", module:"核算引擎", owner:"林舟",
    version:"v2.3 迭代二", epic:"营收核算引擎", doc:"阶梯水价 PRD v3",
    demandId:"d1", branchId:"b1"
  };
  var DEMANDS = [
    {id:"d1", title:"阶梯水价核算规则", status:"pass", label:"评审通过"},
    {id:"d2", title:"抄表异常自动告警", status:"plan", label:"规划中"},
    {id:"d3", title:"线上缴费渠道接入", status:"pass", label:"评审通过"},
    {id:"d4", title:"水费账单推送", status:"dev", label:"开发中"},
    {id:"d5", title:"历史欠费追缴", status:"closed", label:"已关闭"},
    {id:"d6", title:"营收对账报表", status:"plan", label:"规划中"}
  ];
  var BRANCHES = [
    {id:"b1", name:"feature/tiered-pricing", target:"release/v2.3", status:"active", label:"进行中"},
    {id:"b2", name:"feature/meter-reading", target:"release/v2.3", status:"active", label:"进行中"},
    {id:"b3", name:"fix/billing-rounding", target:"release/v2.3", status:"active", label:"进行中"},
    {id:"b4", name:"feature/payment-channel", target:"release/v2.4", status:"active", label:"进行中"},
    {id:"b5", name:"release/v2.3", target:"main", status:"active", label:"发布分支"},
    {id:"b6", name:"hotfix/login-token", target:"main", status:"arch", label:"已归档"}
  ];
  var state = { demandId:DEFAULTS.demandId, branchId:DEFAULTS.branchId, readOnly:false, mobile:false };

  var $ = function(id){ return document.getElementById(id); };
  var assocList = $("assocList");

  function demandById(id){ return DEMANDS.filter(function(d){return d.id===id;})[0]||null; }
  function branchById(id){ return BRANCHES.filter(function(b){return b.id===id;})[0]||null; }

  /* ===== 渲染关联卡 ===== */
  function jumpVal(cls, text, title){
    return '<button type="button" class="ev-link '+cls+'" title="'+esc(title)+'">'+esc(text)+'</button>';
  }
  function editBtn(kind, label){
    if(state.readOnly) return "";
    return '<button type="button" class="assoc-edit" data-edit="'+kind+'" aria-label="就地编辑'+esc(label)+'" title="就地编辑'+esc(label)+'（值仍可点击跳转）">'+ICON.pencil+'</button>';
  }
  function renderAssoc(){
    var d = demandById(state.demandId), b = branchById(state.branchId);
    var rows = [
      ['所属项目', jumpVal("", DEFAULTS.project, "打开项目："+DEFAULTS.project)],
      ['模块', '<span class="val">'+esc(DEFAULTS.module)+'</span>'],
      ['负责人', '<span class="avatar">林</span><span class="val">'+esc(DEFAULTS.owner)+'</span>'],
      ['计划版本', jumpVal("ver", DEFAULTS.version, "打开版本："+DEFAULTS.version)],
      ['关联需求', (d?jumpVal("", d.title, "打开需求："+d.title):'<span class="val muted-val">未关联</span>') + editBtn("demand","关联需求")],
      ['所属史诗', jumpVal("", DEFAULTS.epic, "打开史诗工作项："+DEFAULTS.epic)],
      ['所属分支', (b?jumpVal("", b.name, "打开分支："+b.name):'<span class="val muted-val">未设置</span>') + editBtn("branch","所属分支")],
      ['关联文档', jumpVal("", DEFAULTS.doc, "打开关联文档："+DEFAULTS.doc)]
    ];
    assocList.innerHTML = rows.map(function(r){ return '<dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd>'; }).join("");
  }

  /* ===== Toast ===== */
  function toast(msg, kind){
    var wrap = $("toastWrap");
    var el = document.createElement("div");
    el.className = "toast " + (kind||"ok");
    el.innerHTML = '<span class="ti">'+(kind==="warn"?ICON.none:ICON.ok)+'</span><span>'+esc(msg)+'</span>';
    wrap.appendChild(el);
    setTimeout(function(){ el.style.transition="opacity .2s"; el.style.opacity="0"; setTimeout(function(){ el.remove(); },220); }, 2200);
  }

  /* ===== 选择浮层 ===== */
  var activePop = null;
  function closePop(){
    if(!activePop) return;
    var rec = activePop; activePop = null;
    if(rec.scrim) rec.scrim.remove();
    rec.el.remove();
    document.removeEventListener("keydown", rec.onKey, true);
    if(rec.anchor && rec.anchor.focus) try{ rec.anchor.focus({preventScroll:true}); }catch(e){}
  }
  function openPicker(kind, anchor){
    closePop();
    if(state.readOnly){ toast("你对该项目只有查看权限","warn"); return; }
    var isDemand = kind==="demand";
    var title = isDemand?"关联需求":"所属分支";
    var curId = isDemand?state.demandId:state.branchId;
    var opts = isDemand?DEMANDS:BRANCHES;
    var clearLabel = isDemand?"不关联":"未设置";
    var foot = isDemand
      ? "候选来自当前项目；已拒绝 / 已取消需求不作为新关联。选中即保存。"
      : "候选来自当前项目分支；归档分支已标注。选中即保存。";
    var query = "";

    var scrim = document.createElement("div"); scrim.className="pop-scrim";
    var el = document.createElement("div");
    el.className="menu search-picker"+(state.mobile?" as-sheet":"");
    el.setAttribute("role","dialog"); el.setAttribute("aria-label",title);
    el.innerHTML =
      '<div class="sheet-grip"></div>'+
      '<div class="search-picker-head">'+
        '<div class="search-picker-search">'+ICON.search+
          '<input type="text" placeholder="'+(isDemand?"搜索需求标题…":"搜索分支名 / 目标分支…")+'" aria-label="'+esc(title)+'" role="combobox" aria-expanded="true" autocomplete="off" spellcheck="false">'+
          '<button class="pp-clear-search" type="button" aria-label="清除搜索" hidden>'+ICON.close+'</button>'+
        '</div>'+
        '<div class="search-picker-tools"><span class="pp-count" aria-live="polite"></span></div>'+
      '</div>'+
      '<div class="search-picker-results" role="listbox" aria-label="'+esc(title)+'"></div>'+
      '<div class="search-picker-foot">'+esc(foot)+'</div>';
    document.body.appendChild(scrim); document.body.appendChild(el);
    var input = el.querySelector("input"), clearSearch = el.querySelector(".pp-clear-search");
    var results = el.querySelector(".search-picker-results"), count = el.querySelector(".pp-count");

    function labelOf(o){ return isDemand?o.title:o.name; }
    function metaOf(o){
      if(isDemand) return '<span class="sp-tag '+o.status+'">'+esc(o.label)+'</span>';
      return '<span class="sp-tag '+(o.status==="arch"?"arch":"plan")+'">'+esc(o.label)+'</span><span>→ '+esc(o.target)+'</span>';
    }
    function matches(o){
      var q=query.trim().toLowerCase(); if(!q) return true;
      var hay = isDemand ? o.title : (o.name+" "+o.target);
      return hay.toLowerCase().indexOf(q)!==-1;
    }
    function optHTML(o){
      var on = curId===o.id;
      return '<button class="search-picker-option'+(on?" selected":"")+'" type="button" role="option" aria-selected="'+on+'" data-pick="'+esc(o.id)+'">'+
        '<span class="sp-ico '+kind+'">'+(isDemand?ICON.demand:ICON.branch)+'</span>'+
        '<span class="search-picker-option-main"><span class="sp-title">'+esc(labelOf(o))+'</span>'+
        '<span class="sp-meta">'+metaOf(o)+'</span></span>'+
        (on?'<span class="sp-check">'+ICON.check+'当前</span>':'')+'</button>';
    }
    function render(){
      clearSearch.hidden = !query;
      var filtered = opts.filter(matches);
      var html = "";
      if(!query.trim()){
        var noneOn = !curId;
        html += '<button class="search-picker-clear'+(noneOn?" selected":"")+'" type="button" role="option" aria-selected="'+noneOn+'" data-pick="">'+
          '<span class="ci">'+ICON.none+'</span><span>'+esc(clearLabel)+'</span>'+
          (noneOn?'<span class="sp-check" style="margin-left:auto">'+ICON.check+'当前</span>':'')+'</button>';
      }
      filtered.forEach(function(o){ html += optHTML(o); });
      if(!filtered.length){
        html = '<div class="search-picker-empty">没有匹配「'+esc(query.trim())+'」的'+(isDemand?"需求":"分支")+'<br><button class="btn sm" type="button" data-clearq>清除搜索</button></div>';
      }
      results.innerHTML = html;
      count.innerHTML = '<span class="pp-title">'+esc(title)+'</span>'+
        (query.trim()?("匹配 "+filtered.length+" 条"):(opts.length+" 条候选"));
    }
    function reposition(){
      if(state.mobile){ el.style.left="12px"; el.style.right="12px"; el.style.top="auto"; el.style.bottom="12px"; el.style.width="auto"; return; }
      var r = anchor.getBoundingClientRect();
      var w = el.offsetWidth, h = el.offsetHeight;
      var left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
      var top = r.bottom + 6;
      if(top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
      el.style.left=left+"px"; el.style.top=top+"px"; el.style.right="auto"; el.style.bottom="auto";
    }
    function pick(id){
      var o = id ? opts.filter(function(x){return x.id===id;})[0] : null;
      if(id && !o) return;
      var prev = isDemand?state.demandId:state.branchId;
      if((id||"") === (prev||"")){ closePop(); return; }
      /* 乐观更新 */
      if(isDemand) state.demandId = id||""; else state.branchId = id||"";
      renderAssoc();
      closePop();
      var name = o ? labelOf(o) : clearLabel;
      toast("已更新"+title+"："+name+"（已自动保存）","ok");
    }
    input.addEventListener("input", function(){ query=input.value; render(); reposition(); });
    clearSearch.addEventListener("click", function(){ input.value=""; query=""; render(); input.focus(); });
    results.addEventListener("click", function(e){
      if(e.target.closest("[data-clearq]")){ input.value=""; query=""; render(); input.focus(); return; }
      var b=e.target.closest("[data-pick]"); if(b) pick(b.dataset.pick);
    });
    scrim.addEventListener("click", closePop);
    var onKey = function(e){
      if(e.key==="Escape"){ e.preventDefault(); closePop(); return; }
      if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Home"||e.key==="End"){
        var btns = Array.prototype.slice.call(results.querySelectorAll(".search-picker-option,.search-picker-clear"));
        if(!btns.length) return;
        e.preventDefault();
        var i = btns.indexOf(document.activeElement), next;
        if(e.key==="Home") next=0; else if(e.key==="End") next=btns.length-1;
        else if(e.key==="ArrowDown") next = i<0?0:(i+1)%btns.length;
        else next = i<=0?btns.length-1:i-1;
        btns[next].focus();
      }
    };
    document.addEventListener("keydown", onKey, true);
    activePop = { el:el, scrim:scrim, onKey:onKey, anchor:anchor };
    render(); reposition();
    setTimeout(function(){ if(activePop&&activePop.el===el) input.focus(); },40);
  }

  /* ===== 事件接线 ===== */
  assocList.addEventListener("click", function(e){
    var ed = e.target.closest("[data-edit]");
    if(ed){ openPicker(ed.dataset.edit, ed); return; }
    var jump = e.target.closest(".ev-link");
    if(jump){ toast("跳转："+jump.textContent+"（演示原型，实际打开对应详情）","ok"); }
  });
  assocList.addEventListener("keydown", function(e){
    if(e.key!=="Enter"&&e.key!==" ") return;
    var ed=e.target.closest("[data-edit]"); if(ed){ e.preventDefault(); openPicker(ed.dataset.edit, ed); return; }
    var jump=e.target.closest(".ev-link"); if(jump){ e.preventDefault(); jump.click(); }
  });

  function setViewport(mobile){
    state.mobile = mobile;
    $("stage").classList.toggle("is-mobile", mobile);
    $("vpDesktop").setAttribute("aria-pressed", String(!mobile));
    $("vpMobile").setAttribute("aria-pressed", String(mobile));
    closePop();
  }
  $("vpDesktop").addEventListener("click", function(){ setViewport(false); });
  $("vpMobile").addEventListener("click", function(){ setViewport(true); });
  $("roToggle").addEventListener("click", function(){
    state.readOnly = !state.readOnly;
    this.setAttribute("aria-pressed", String(state.readOnly));
    $("drawer").classList.toggle("read-only", state.readOnly);
    renderAssoc(); closePop();
  });
  $("themeToggle").addEventListener("click", function(){
    var dark = document.documentElement.getAttribute("data-theme")==="dark";
    document.documentElement.setAttribute("data-theme", dark?"light":"dark");
    this.setAttribute("aria-pressed", String(!dark));
    this.textContent = dark?"深色":"浅色";
  });
  $("openDemand").addEventListener("click", function(){
    var btn = assocList.querySelector('[data-edit="demand"]'); if(btn) openPicker("demand", btn);
  });
  $("openBranch").addEventListener("click", function(){
    var btn = assocList.querySelector('[data-edit="branch"]'); if(btn) openPicker("branch", btn);
  });
  $("resetBtn").addEventListener("click", function(){
    state.demandId=DEFAULTS.demandId; state.branchId=DEFAULTS.branchId;
    renderAssoc(); closePop(); toast("已重置为默认关联","ok");
  });
  window.addEventListener("resize", function(){ if(activePop) closePop(); });

  renderAssoc();
  window.PROTO = { state:state, openPicker:openPicker, closePop:closePop, renderAssoc:renderAssoc };
})();
</script>
</body>
</html>
