<!doctype html>
<html lang="zh-CN" data-layout="desktop">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>阶段工时 · 项目与版本原型（2026-11-20）</title>
<!-- 复用真实前端样式：令牌、组件、面板、表格、版本详情与阶段汇总 -->
<link rel="stylesheet" href="../../../frontend/css/tokens.css" />
<link rel="stylesheet" href="../../../frontend/css/base.css" />
<link rel="stylesheet" href="../../../frontend/css/layout.css" />
<link rel="stylesheet" href="../../../frontend/css/components.css" />
<link rel="stylesheet" href="../../../frontend/css/manager.css" />
<link rel="stylesheet" href="../../../frontend/css/version.css" />
<link rel="stylesheet" href="../../../frontend/css/views-phase-demands.css" />
<link rel="stylesheet" href="../../../frontend/css/mobile.css" />
<style>
/* ===== 原型舞台（仅原型用） ===== */
html,body{min-height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-size:13px;}
.proto-shell{display:flex;min-height:100vh;background:var(--bg);}
.pb-side{width:236px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;}
.pb-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:2px 6px 12px;}
.pb-logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,var(--primary),var(--plum));color:#fff;display:grid;place-items:center;font-size:11px;}
.pb-ws{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;}
.pb-ws .av{width:24px;height:24px;border-radius:7px;background:var(--surface-sunken);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text-2);}
.pb-ws .nm{font-size:12.5px;font-weight:600;}
.pb-ws .mt{font-size:10.5px;color:var(--text-3);}
.pb-nav{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--text-2);}
.pb-nav .grp{font-size:10.5px;color:var(--text-3);padding:12px 6px 4px;}
.pb-nav .it{padding:7px 8px;border-radius:7px;display:flex;align-items:center;gap:8px;}
.pb-nav .it.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:600;box-shadow:inset 2px 0 0 var(--primary);}
.pb-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.proto-appbar{display:flex;align-items:center;gap:10px;padding:10px var(--content-pad);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.proto-appbar .ttl{font-size:15px;font-weight:650;line-height:1.25;}
.proto-appbar .crumb{font-size:11px;color:var(--text-3);}
.proto-appbar .sp{flex:1 1 auto;}
.proto-search{display:flex;align-items:center;gap:6px;width:230px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-sunken);color:var(--text-3);font-size:12px;}
.synth{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px dashed var(--warning-border);border-radius:var(--r-pill);background:var(--warning-soft);color:var(--warning-fg);font-size:10.5px;font-weight:650;white-space:nowrap;}
.proto-page{display:flex;flex-direction:column;gap:14px;padding:16px var(--content-pad) 48px;min-width:0;}

/* ===== 原型控制条 ===== */
.proto-bar{position:fixed;left:16px;bottom:14px;z-index:400;width:430px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow-lg);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.proto-bar .name{width:100%;font-size:12px;font-weight:650;}
.proto-bar .name span{font-weight:400;color:var(--text-3);margin-left:5px;}
.proto-bar .lbl{font-size:10.5px;color:var(--text-3);margin-right:-2px;}
.pseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
.pseg button{height:26px;padding:0 8px;border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--text-3);font-size:11.5px;cursor:pointer;}
.pseg button:last-child{border-right:0;}
.pseg button.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:600;}
.pbtn{height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2);font-size:11.5px;cursor:pointer;}
body.shot .proto-bar{display:none;}
body.shot .proto-appbar{position:static;}

/* ===== 阶段投入面板 ===== */
.stage-panel{padding:15px;}
.stage-panel .manager-panel-head{align-items:flex-start;margin-bottom:12px;}
.stage-head-l{display:flex;flex-direction:column;gap:2px;min-width:0;}
.stage-head-l b{font-size:14px;font-weight:650;}
.stage-head-l span{font-size:12px;line-height:1.6;color:var(--text-3);}
.stage-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.stage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px;}
.stage-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);text-align:left;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease;}
.stage-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
.stage-card:focus-visible{outline:2px solid var(--ring-focus);outline-offset:2px;}
.stage-name{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-2);}
.stage-name i{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
.stage-v{margin-top:2px;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.stage-v.zero{color:var(--text-3);font-size:22px;}
.stage-meta{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.stage-items{font-size:11px;color:var(--text-3);}
.stage-card .stage-cta{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:600;color:var(--text-3);opacity:.65;transition:opacity .12s ease,color .12s ease;}
.stage-card:hover .stage-cta,.stage-card:focus-visible .stage-cta{opacity:1;color:var(--primary-fg);}
.stage-bar{display:flex;height:8px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-sunken);}
.stage-bar i{display:block;height:100%;}
.stage-legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:7px 0 12px;font-size:12px;color:var(--text-2);}
.stage-legend button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:2px 0;font:inherit;color:inherit;cursor:pointer;}
.stage-legend button:hover{color:var(--primary-fg);text-decoration:underline;text-underline-offset:2px;}
.stage-legend i{width:8px;height:8px;border-radius:2px;}
.stage-legend .muted{color:var(--text-3);}
.stage-tbl{font-size:12.5px;}
.stage-tbl th:first-child{width:210px;}
.stage-tbl th:last-child{width:58px;text-align:right;}
.stage-tbl tbody tr{cursor:pointer;}
.stage-tbl tbody tr:hover{background:var(--surface-hover);}
.stage-tbl tbody tr:focus-visible{outline:2px solid var(--ring-focus);outline-offset:-2px;}
.stage-tbl .st-name{display:flex;align-items:center;gap:7px;font-weight:550;color:var(--text);}
.stage-tbl .st-name i{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
.stage-tbl .st-note{display:block;margin-left:15px;font-size:11px;color:var(--text-3);}
.stage-tbl .st-go{font-size:11.5px;color:var(--text-3);white-space:nowrap;}
.stage-tbl tbody tr:hover .st-go{color:var(--primary-fg);}
.stage-tbl tr.roll-total td{font-weight:650;color:var(--text);background:var(--surface-2);}
.stage-foot{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:11.5px;line-height:1.6;color:var(--text-3);}
.stage-foot .warn{color:var(--warning-fg);}
.stage-empty{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--border);border-radius:var(--r-sm);background:var(--surface-2);font-size:12px;color:var(--text-3);}
.stage-empty b{color:var(--text-2);}

/* ===== 版本列表 ===== */
.vsum{padding:14px 15px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-xs);}
.vlist{margin-top:2px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;}
.prow{display:grid;grid-template-columns:minmax(205px,1.45fr) 136px minmax(150px,1fr) 190px 118px 126px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);min-width:0;}
.prow:last-child{border-bottom:0;}
.prow:hover{background:var(--surface-hover);}
.prow.vlist-head{background:var(--tbl-head);font-size:11px;color:var(--text-3);font-weight:550;padding-top:8px;padding-bottom:8px;}
.vlist-head span{white-space:nowrap;}
.ver-name{min-width:0;}
.ver-name>b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text);}
.ver-name>small{display:block;margin-top:2px;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ver-time{font-size:12px;color:var(--text-2);line-height:1.5;}
.ver-time small{display:block;font-size:11px;color:var(--text-3);}
.ver-prog{min-width:0;}
.ver-prog .pbar{display:flex;height:6px;border-radius:var(--r-xs);background:var(--surface-sunken);overflow:hidden;}
.ver-prog .pbar i{display:block;height:100%;}
.ver-prog .pbar i.done{background:var(--success);}
.ver-prog .pbar i.doing{background:var(--info);}
.ver-prog .ptxt{display:flex;align-items:baseline;gap:5px;margin-top:4px;font-size:11px;color:var(--text-3);}
.ver-prog .ptxt b{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;}
.vstage{min-width:0;}
.vstage .sbar{display:flex;height:6px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-sunken);}
.vstage .sbar i{display:block;height:100%;}
.vstage .stxt{margin-top:4px;font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.vstage .stxt b{font-weight:550;color:var(--text-2);}
.ver-rel{font-size:12px;color:var(--text-2);line-height:1.5;}
.ver-rel small{display:block;font-size:11px;color:var(--text-3);}
.ver-acts{display:flex;justify-content:flex-end;gap:6px;}
.note-line{display:flex;align-items:flex-start;gap:6px;margin-top:9px;font-size:11.5px;line-height:1.6;color:var(--text-3);}

/* ===== 版本详情 ===== */
.vd-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:2px;}
.vd-back{border:0;background:none;color:var(--text-3);font-size:12px;cursor:pointer;padding:3px 0;}
.vd-back:hover{color:var(--primary-fg);}
.vd-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:-.02em;}
.vd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--text-3);}
.vd-actions{margin-left:auto;display:flex;gap:8px;}
.vd-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px 0 2px;}
.vd-tabs button{border:0;background:none;padding:10px 12px;font:inherit;font-size:13px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.vd-tabs button.on{color:var(--primary-fg);font-weight:600;border-bottom-color:var(--primary);}
.vd-grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;}
.vd-kv{display:flex;flex-direction:column;gap:7px;font-size:12px;}
.vd-kv div{display:flex;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1px dashed var(--border);}
.vd-kv div:last-child{border-bottom:0;}
.vd-kv span{color:var(--text-3);}
.vd-kv b{font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right;}
.vd-note{font-size:12px;line-height:1.7;color:var(--text-2);}

/* ===== 跨版本 ===== */
.phase-tbl{font-size:12.5px;}
.proto-cross .roll-tbl{min-width:900px;}
.cell-drill{border:0;background:none;padding:2px 0;font:inherit;color:var(--text-2);font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dashed var(--border);}
.cell-drill:hover,.cell-drill:focus-visible{color:var(--primary-fg);border-bottom-color:var(--primary);outline:none;}
.cell-drill.zero{color:var(--text-3);}
.ver-rollup-title span{font-size:11.5px;color:var(--text-3);}
.cross-hint{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px;color:var(--text-3);}

/* ===== 下钻抽屉 ===== */
#drill{z-index:500;}
#drill .sheet{width:min(900px,100vw);max-width:900px;height:100%;max-height:none;display:flex;flex-direction:column;border:0;border-left:1px solid var(--border);border-radius:0;overflow:hidden;background:var(--surface);}
body.shot #drill,body.shot #drill .sheet{animation:none!important;opacity:1!important;transform:none!important;}
.vstage .sbar i[data-drill-stage]{cursor:pointer;}
.vstage .sbar i[data-drill-stage]:hover{filter:brightness(.92);}
.cross-cards,.drill-cards{display:none;}
.cross-card{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--surface);}
.cc-head{display:flex;align-items:center;gap:8px;min-width:0;}
.cc-head .link{font-weight:600;font-size:13.5px;text-align:left;}
.cc-dev{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--success-fg);}
.cc-dev.over{color:var(--danger-fg);}
.cc-meta{margin-top:3px;font-size:11.5px;color:var(--text-3);}
.cc-stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px;}
.cc-stage{display:flex;align-items:center;gap:5px;min-width:0;height:32px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);font:inherit;font-size:11px;color:var(--text-2);cursor:pointer;text-align:left;}
.cc-stage i{width:6px;height:6px;border-radius:2px;flex:none;}
.cc-stage span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cc-stage b{margin-left:auto;font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums;}
.cc-stage.zero{color:var(--text-3);cursor:default;}
.cc-stage.zero b{color:var(--text-3);}
.drill-card{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--surface);cursor:pointer;}
.dc-head{display:flex;align-items:baseline;gap:8px;}
.dc-head b{font-size:13px;min-width:0;line-height:1.45;}
.dc-h{margin-left:auto;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.dc-meta{margin-top:3px;font-size:11.5px;color:var(--text-3);}
.dc-foot{display:flex;justify-content:space-between;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--text-3);}
.dc-foot b{color:var(--text);}
.vchips{display:none;}
.vchip{display:flex;align-items:center;gap:5px;min-width:0;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);font:inherit;font-size:11px;color:var(--text-2);cursor:pointer;text-align:left;}
.vchip i{width:6px;height:6px;border-radius:2px;flex:none;}
.vchip b{margin-left:auto;font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums;}
.vchip.zero{color:var(--text-3);cursor:default;justify-content:center;grid-column:1/-1;}
[data-layout="mobile"] .vstage .sbar,[data-layout="mobile"] .vstage .stxt{display:none;}
[data-layout="mobile"] .vchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;}
[data-layout="mobile"] #drill{width:390px;max-width:100%;}
[data-layout="mobile"] .proto-cross .tbl-wrap{display:none;}
[data-layout="mobile"] .cross-cards{display:grid;gap:8px;padding:10px 12px 0;}
[data-layout="mobile"] .drill-table-wrap{display:none;}
[data-layout="mobile"] .drill-cards{display:grid;gap:8px;padding:10px 12px;}
.drill-sub{font-size:12px;color:var(--text-3);line-height:1.5;}
.drill-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);}
.fchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);font-size:11.5px;color:var(--text-2);}
.fchip b{font-weight:600;color:var(--text);}
.fchip button{border:0;background:none;color:var(--text-3);cursor:pointer;padding:0;font-size:14px;line-height:1;}
.fchip button:hover{color:var(--danger-fg);}
.drill-search{flex:1 1 160px;min-width:120px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font:inherit;font-size:12px;color:var(--text);}
.drill-body{padding:0;overflow:auto;flex:1 1 auto;min-height:0;}
.drill-body .tbl-wrap{padding:0 18px 8px;}
.drill-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.drill-tbl th{height:32px;text-align:left;font-size:11px;font-weight:550;color:var(--text-3);background:var(--tbl-head);border-bottom:1px solid var(--border);padding:0 8px;white-space:nowrap;}
.drill-tbl td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text-2);}
.drill-tbl tr:last-child td{border-bottom:0;}
.drill-tbl tbody tr{cursor:pointer;}
.drill-tbl tbody tr:hover{background:var(--surface-hover);}
.drill-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.drill-tbl .tt{font-weight:550;color:var(--text);}
.drill-tbl .tt small{display:block;font-weight:400;font-size:11px;color:var(--text-3);}
.drill-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);background:var(--surface-2);}
.drill-empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.drill-empty .ico{width:38px;height:38px;border-radius:50%;background:var(--surface-sunken);display:grid;place-items:center;font-size:17px;color:var(--text-3);}
.drill-empty b{font-size:13px;color:var(--text-2);}
.drill-empty p{margin:0;font-size:12px;color:var(--text-3);max-width:360px;line-height:1.65;}
.proto-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:600;max-width:min(560px,calc(100vw - 32px));padding:9px 14px;border-radius:10px;background:var(--text);color:var(--surface);font-size:12px;line-height:1.5;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s ease;}
.proto-toast.on{opacity:1;}

/* ===== 390 ===== */
[data-layout="mobile"] body{background:var(--surface-sunken);}
[data-layout="mobile"] .proto-shell{width:390px;max-width:100%;margin:0;box-shadow:var(--shadow-lg);}
[data-layout="mobile"] .pb-side{display:none;}
[data-layout="mobile"] .proto-search{display:none;}
[data-layout="mobile"] .proto-appbar{padding:8px 12px;gap:8px;}
[data-layout="mobile"] .synth{font-size:10px;padding:0 6px;}
[data-layout="mobile"] .proto-page{padding:12px 12px 40px;gap:10px;}
[data-layout="mobile"] .manager-kpis{grid-template-columns:1fr 1fr;gap:8px;}
[data-layout="mobile"] .manager-kpi{min-height:84px;padding:10px 11px;gap:3px;}
[data-layout="mobile"] .manager-kpi>b{font-size:20px;line-height:24px;}
[data-layout="mobile"] .manager-kpi>small{font-size:10.5px;line-height:1.4;}
[data-layout="mobile"] .stage-panel{padding:12px;}
[data-layout="mobile"] .stage-panel .manager-panel-head{gap:8px;}
[data-layout="mobile"] .stage-tools{justify-content:flex-start;}
[data-layout="mobile"] .stage-grid{grid-template-columns:1fr;gap:7px;}
[data-layout="mobile"] .stage-card{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name v" "meta v" "items cta";align-items:center;gap:1px 10px;padding:10px 12px;min-height:64px;}
[data-layout="mobile"] .stage-name{grid-area:name;}
[data-layout="mobile"] .stage-v{grid-area:v;font-size:22px;margin:0;}
[data-layout="mobile"] .stage-meta{grid-area:meta;}
[data-layout="mobile"] .stage-items{grid-area:items;}
[data-layout="mobile"] .stage-card .stage-cta{position:static;grid-area:cta;justify-self:end;opacity:1;margin:0;color:var(--primary-fg);}
[data-layout="mobile"] .stage-legend{gap:10px 14px;margin-bottom:10px;}

function fmt(h){ if(h === null || h === undefined) return "—"; return (Math.round(h * 10) / 10).toFixed(1).replace(/\.0$/, "") + "h"; }
function pct(v, total){ return total ? Math.round(v * 100 / total) : 0; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function stageMeta(key){ return STAGES.filter(function(s){ return s.key === key; })[0]; }

function sumEst(stage){ return STAGES.reduce(function(a,s){ return a + (stage[s.key].est || 0); }, 0); }
function stageSet(zero){
  var set = {};
  STAGES.forEach(function(m){
    var b = BASE[m.key];
    set[m.key] = { act: zero && m.key === "product" ? 0 : b.act, est: zero && m.key === "product" ? 0 : b.est, items: zero && m.key === "product" ? 0 : b.items };
  });
  return set;
}

function stageCardsHTML(stage, total, estTotal, scope, opts){
  opts = opts || {};
  var isEst = ui.mode === "estimate";
  var denom = isEst ? estTotal : total;

    var v = isEst ? stage[m.key].est : stage[m.key].act;

    var zero = !v;
    return '<button class="stage-card" type="button" data-drill-stage="' + m.key + '" data-drill-scope="' + esc(scope) + '"'

      + '<span class="stage-meta">' + (zero && m.key === "product" && !isEst ? "暂无需求类工作项，不做摊派" : (isEst ? "实际 " : "预估 ") + fmt(other) + " · 占 " + pct(v, denom) + "%") + '</span>'

/* 三段占比取整后可能差 1%：差额落在最后一段，保证条宽、图例与表格一致 */
function stagePcts(stage, denom, key){
  var parts = STAGES.map(function(m){ return { key:m.key, p:pct(stage[m.key][key || "act"], denom) }; });
  var sum = parts.reduce(function(a,p){ return a + p.p; }, 0);
  if(parts.length && denom) parts[parts.length - 1].p += 100 - sum;
  return parts;
}
function stageBarHTML(stage, total, estTotal, scope, ver){

    }).join("") + '</div>';
}

/* ---------- 下钻 ---------- */
var drillState = { st:null, ver:null, scope:"", q:"" };
function openDrill(st, ver, scope){
  drillState = { st:st, ver:ver || null, scope:scope || "", q:"" };
  renderDrill();
  document.getElementById("drill").classList.add("open");
}
function closeDrill(){ document.getElementById("drill").classList.remove("open"); }
function drillZeroProduct(){
  return ui.zero && drillState.scope.indexOf("项目") === 0;
}
function drillScopeItems(){
  return DRILL_ITEMS.filter(function(i){
    if(drillState.ver && i.ver !== drillState.ver) return false;
    if(drillState.st && i.stage !== drillState.st) return false;
    if(drillZeroProduct() && i.stage === "product") return false;
    if(drillState.q && (i.title + i.cat + i.owner + i.type).indexOf(drillState.q) < 0) return false;
    return true;
  });
}
function drillScopeTotal(){
  return DRILL_ITEMS.filter(function(i){
    if(drillState.ver && i.ver !== drillState.ver) return false;
    if(drillZeroProduct() && i.stage === "product") return false;
    return true;
  }).reduce(function(a,i){ return a + i.stageH; }, 0);
}
function renderDrill(){
  var meta = drillState.st ? stageMeta(drillState.st) : null;
  var items = drillScopeItems();
  var sum = items.reduce(function(a,i){ return a + i.stageH; }, 0);
  var total = drillScopeTotal();
  var tag = document.getElementById("drillTag");
  tag.textContent = meta ? meta.name : "全部阶段";
  tag.style.background = meta ? "color-mix(in srgb, " + meta.color + " 14%, transparent)" : "";
  tag.style.color = meta ? meta.color : "";
  document.getElementById("drillSub").textContent = (drillState.scope || "全部范围") + " · " + (meta ? meta.name : "全部阶段") + " · " + fmt(sum) + " / " + fmt(total) + "（" + pct(sum, total) + "%）";
  var chips = '<span class="fchip"><b>' + esc(drillState.scope || "全部范围") + '</b>' + (drillState.ver ? ' · ' + esc(drillState.ver) : '') + '</span>'
    + (meta ? '<span class="fchip">阶段 <b>' + esc(meta.name) + '</b><button type="button" data-clear-stage aria-label="移除阶段筛选">×</button></span>' : '')
    + '<button class="link" type="button" data-clear-all>清除筛选</button>'
    + '<input class="drill-search" id="drillSearch" type="search" placeholder="搜索工作项、分类、负责人" value="' + esc(drillState.q) + '" aria-label="搜索明细" />';
  document.getElementById("drillTools").innerHTML = chips;
  var body = document.getElementById("drillBody");
  if(!items.length){
    var isProduct = drillState.st === "product";
    body.innerHTML = '<div class="drill-empty"><span class="ico">' + (isProduct ? "需" : "时") + '</span>'
      + '<b>' + (isProduct ? "该范围还没有需求类工作项" : "该范围还没有已结束的计时") + '</b>'
      + '<p>' + (isProduct ? "产品 / 设计按需求类工作项计时统计，没有需求类工作项时计 0，不做摊派。新建一条需求并记录计时后，这里会按需求归入产品 / 设计。" : "测试窗口内、或任务 / 缺陷上的计时结束后，才会进入阶段明细。") + '</p>'
      + '<button class="btn sm primary" type="button" data-toast="原型：' + (isProduct ? "新建需求" : "查看工作项") + '">' + (isProduct ? "新建需求" : "查看工作项") + '</button></div>';
  }else{
    var cards = items.map(function(i){
      return '<article class="drill-card" data-toast="原型：打开工作项「' + esc(i.title) + '」"><div class="dc-head"><b>' + esc(i.title) + '</b><span class="dc-h">' + fmt(i.stageH) + '</span></div>'
        + '<div class="dc-meta">' + esc(i.ver) + ' · ' + esc(i.type) + ' · ' + esc(i.cat) + ' · ' + esc(i.owner) + '</div>'
        + '<div class="dc-foot"><span>阶段工时 <b>' + fmt(i.stageH) + '</b></span><span>总实际 ' + fmt(i.totalH) + '</span></div></article>';
    }).join("");
    body.innerHTML = '<div class="tbl-wrap drill-table-wrap"><table class="drill-tbl"><thead><tr><th>工作项</th><th>类型</th><th>分类</th><th>负责人</th><th class="num">阶段工时</th><th class="num">总实际</th></tr></thead><tbody>'
      + items.map(function(i){
        return '<tr data-toast="原型：打开工作项「' + esc(i.title) + '」"><td class="tt">' + esc(i.title) + '<small>' + esc(i.ver) + ' · ' + esc(i.type) + '</small></td>'
          + '<td>' + esc(i.type) + '</td><td>' + esc(i.cat) + '</td><td>' + esc(i.owner) + '</td>'
          + '<td class="num"><b>' + fmt(i.stageH) + '</b></td><td class="num">' + fmt(i.totalH) + '</td></tr>';
      }).join("") + '</tbody></table></div>'
      + '<div class="drill-cards">' + cards + '</div>';
  }
  document.getElementById("drillFoot").textContent = items.length + " 个工作项 · 阶段工时 " + fmt(sum) + " · 不含史诗";
}

/* ---------- 框架 / 事件 ---------- */
var SCENE_META = {
  project:{ title:"项目驾驶舱", crumb:"项目 / 资金通", nav:"project" },
  versions:{ title:"版本与发布", crumb:"规划 / 版本与发布", nav:"version" },
  detail:{ title:"版本详情", crumb:"版本与发布 / V1.2 支付体验", nav:"version" },
  cross:{ title:"首版 / 迭代分析", crumb:"版本与发布 / 首版与迭代分析", nav:"version" }
};
function render(){
  var meta = SCENE_META[ui.scene] || SCENE_META.project;
  document.getElementById("appTitle").textContent = meta.title;
  document.getElementById("appCrumb").textContent = meta.crumb;
  document.querySelectorAll("[data-nav]").forEach(function(el){ el.classList.toggle("on", el.getAttribute("data-nav") === meta.nav); });
  document.querySelectorAll("#segScene button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-s") === ui.scene); });
  document.querySelectorAll("#segLayout button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-l") === ui.layout); });
  document.getElementById("btnZero").classList.toggle("on", ui.zero);
  var html = ui.scene === "versions" ? versionsHTML() : ui.scene === "detail" ? detailHTML() : ui.scene === "cross" ? crossHTML() : projectHTML();
  document.getElementById("page").innerHTML = html;
  var qs = new URLSearchParams();
  qs.set("scene", ui.scene);
  if(ui.layout === "mobile") qs.set("mobile", "1");
  if(ui.zero) qs.set("zero", "1");
  if(document.body.classList.contains("shot")) qs.set("shot", "1");
  history.replaceState(null, "", location.pathname + "?" + qs.toString());
  if(autoDrill){
    var st = autoDrill === "1" ? "dev" : autoDrill;
    var scope = ui.scene === "versions" ? "当前筛选的 4 个版本" : ui.scene === "detail" ? "版本 · V1.2" : ui.scene === "cross" ? "版本 · V1.2" : "项目 · 资金通";
    openDrill(st, "V1.2", scope);
    autoDrill = null;
  }
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-toast]") : null;
  if(t){ e.preventDefault(); e.stopPropagation(); toast(t.getAttribute("data-toast")); return; }
  var scene = e.target.closest("[data-scene]");
  if(scene){ ui.scene = scene.getAttribute("data-scene"); render(); window.scrollTo(0,0); return; }
  var openVer = e.target.closest("[data-open-ver]");
  var drill = e.target.closest("[data-drill-stage]");
  if(drill){
    var stage = drill.getAttribute("data-drill-stage");
    var scope = drill.getAttribute("data-drill-scope") || "";
    var ver = drill.getAttribute("data-drill-ver") || null;
    openDrill(stage, ver, scope);
    return;
  }
  if(openVer){ ui.scene = "detail"; render(); window.scrollTo(0,0); return; }
  var mode = e.target.closest("[data-mode]");
  if(mode){ ui.mode = mode.getAttribute("data-mode"); render(); return; }
  if(e.target.closest("[data-close-drill]")){ closeDrill(); return; }
  if(e.target.closest("[data-clear-all]")){ closeDrill(); return; }
  if(e.target.closest("[data-clear-stage]")){
    drillState.st = null;
    renderDrill();
    return;
  }
  if(e.target.closest("#drillSearch") === null && e.target.closest("#drill") === null){ /* noop */ }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeDrill();
  if(e.key === "Enter" && e.target.matches && e.target.matches("tr[data-drill-stage]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", function(e){
  if(e.target.id === "drillSearch"){
    drillState.q = e.target.value.trim();
    renderDrill();
    var inp = document.getElementById("drillSearch");
    if(inp){ inp.focus(); inp.setSelectionRange(drillState.q.length, drillState.q.length); }
  }
});
document.getElementById("segScene").addEventListener("click", function(e){
  var b = e.target.closest("button[data-s]");
  if(!b) return;
  ui.scene = b.getAttribute("data-s");
  render();
  window.scrollTo(0,0);
});
document.getElementById("segLayout").addEventListener("click", function(e){
  var b = e.target.closest("button[data-l]");
  if(!b) return;
  ui.layout = b.getAttribute("data-l");
  document.documentElement.setAttribute("data-layout", ui.layout);
  render();
});
document.getElementById("btnZero").addEventListener("click", function(){
  ui.zero = !ui.zero;
  render();
});
document.getElementById("btnDrill").addEventListener("click", function(){
  openDrill("dev", "V1.2", ui.scene === "versions" ? "当前筛选的 4 个版本" : ui.scene === "detail" ? "版本 · V1.2" : "项目 · 资金通");
});
render();
if(params.get("debug") === "1"){
  setTimeout(function(){
    var cells = [].slice.call(document.querySelectorAll(".stage-tbl th, .stage-tbl tbody tr:first-child td"));
    var info = cells.map(function(el){
      var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
      return { tag:el.tagName, text:(el.textContent || "").trim().slice(0, 12), x:Math.round(r.x), w:Math.round(r.width), display:cs.display, visibility:cs.visibility, color:cs.color, textAlign:cs.textAlign };
    });
    var wide = [].slice.call(document.querySelectorAll("body *")).filter(function(el){
      return el.getBoundingClientRect().width > 400 && el.tagName !== "HTML" && el.tagName !== "BODY";
    }).slice(0, 12).map(function(el){
      var r = el.getBoundingClientRect();
      return { tag:el.tagName, cls:(el.className || "").toString().slice(0, 40), w:Math.round(r.width), x:Math.round(r.x) };
    });
    document.body.setAttribute("data-debug", JSON.stringify({ doc:document.documentElement.scrollWidth, body:document.body.scrollWidth, page:Math.round(document.getElementById("page").getBoundingClientRect().width), cells:info, wide:wide }));
  }, 120);
}
})();
</script>
</body>
</html>
