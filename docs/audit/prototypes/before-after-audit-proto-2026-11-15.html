<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙漏 · 审计修复前后对比原型 · 2026-11-15</title>
<style>
/* ============ 令牌（与 frontend/css/tokens.css 对齐） ============ */
:root{
  --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7; --surface-hover:#F2F4F7;
  --border:#E4E7EC; --border-strong:#D0D5DD; --text:#101828; --text-2:#475467; --text-3:#667085;
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EFF4FF; --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
  --success:#12B76A; --success-soft:#ECFDF3; --success-border:#A6F4C5; --success-fg:#067647;
  --warning:#F79009; --warning-soft:#FFFAEB; --warning-border:#FEDF89; --warning-fg:#B54708;
  --danger:#F04438; --danger-soft:#FEF3F2; --danger-border:#FDA29B; --danger-fg:#B42318;
  --info:#2E90FA; --info-soft:#EFF8FF; --info-border:#B2DDFF; --info-fg:#175CD3;
  --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-border:#D9D6FE; --plum-fg:#5B3FD1;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 2px 4px -2px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
  --shadow-xl:0 24px 48px -12px rgba(16,24,40,.18);
  --ring:0 0 0 3px rgba(37,99,235,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EDEFF3;font-family:var(--font-sans);font-size:13px;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none !important}
code{font-family:var(--font-mono);font-size:11px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:4px;padding:0 4px}

/* ============ 原型工具条 ============ */
.proto-bar{position:sticky;top:0;z-index:90;min-height:48px;display:flex;align-items:center;gap:14px;padding:7px 14px;
  background:#0C1424;color:#E7EEF9;box-shadow:0 1px 0 rgba(255,255,255,.06);flex-wrap:wrap}
.pb-brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.01em;white-space:nowrap;font-size:13px}
.pb-brand i{width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,#5B8DEF,#8B5CF6);display:inline-block}
.pb-tag{font-size:9.5px;font-weight:750;letter-spacing:.08em;color:#9FD0FF;background:rgba(46,144,250,.18);border:1px solid rgba(46,144,250,.3);padding:2px 6px;border-radius:999px}
.pb-date{font-size:11px;color:#8FA3BF;font-family:var(--font-mono)}
.pb-grow{flex:1}
.pb-group{display:flex;align-items:center;gap:6px;font-size:11px;color:#9DB0C9;white-space:nowrap}
.pb-seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:2px;flex-wrap:wrap}
.pb-seg button{height:24px;padding:0 9px;border-radius:6px;font-size:11px;color:#B9C7DB;white-space:nowrap}
.pb-seg button.on{background:#F1F6FF;color:#0C1424;font-weight:650}
.pb-seg button:hover:not(.on){background:rgba(255,255,255,.08)}
.pb-chk{display:flex;align-items:center;gap:6px;font-size:11px;color:#B9C7DB;cursor:pointer;user-select:none}
.pb-chk input{accent-color:#5B8DEF}

/* ============ 对比板 ============ */
#board{padding:18px 18px 42px;max-width:1680px;margin:0 auto}
.scene-head{display:flex;align-items:flex-start;gap:12px;margin:0 2px 12px;flex-wrap:wrap}
.scene-head h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.scene-head .sub{margin:4px 0 0;font-size:12px;color:var(--text-2);max-width:980px;line-height:1.65}
.scene-head .ev{margin-left:auto;font-size:10.5px;color:var(--text-3);text-align:right;line-height:1.7}
.pri{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.03em}
.pri.p0{background:var(--danger-soft);color:var(--danger-fg);border:1px solid var(--danger-border)}
.pri.p1{background:var(--warning-soft);color:var(--warning-fg);border:1px solid var(--warning-border)}
.pri.p2{background:var(--info-soft);color:var(--info-fg);border:1px solid var(--info-border)}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.compare.solo-before{grid-template-columns:minmax(0,1fr)}
.compare.solo-after{grid-template-columns:minmax(0,1fr)}
.compare.solo-before .pane.after,.compare.solo-after .pane.before{display:none}
.pane{margin:0;min-width:0;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.pane.before{border-top:3px solid #E5484D}
.pane.after{border-top:3px solid #12B76A}
.pane figcaption{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);background:#FCFCFD;min-height:38px}
.pane figcaption .tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em}
.pane.before .tag{background:var(--danger-soft);color:var(--danger-fg);border:1px solid var(--danger-border)}
.pane.after .tag{background:var(--success-soft);color:var(--success-fg);border:1px solid var(--success-border)}
.pane figcaption b{font-size:12px;font-weight:650}
.pane figcaption .meta{font-size:10.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.pane .solo{margin-left:6px;height:22px;padding:0 7px;border:1px solid var(--border);border-radius:5px;font-size:10px;color:var(--text-2);background:#fff}
.pane .solo:hover{background:var(--surface-hover)}
.viewport{--s:.78;position:relative;overflow:hidden;background:#E9ECF1;border-bottom:1px solid var(--border);display:flex;justify-content:center}
.screen{width:820px;height:640px;position:relative;overflow:hidden;background:var(--bg-app);transform-origin:top center;transform:scale(var(--s));flex:0 0 auto}
.ann-list{margin:0;padding:10px 14px 12px;list-style:none;display:grid;gap:6px}
.ann-list li{display:flex;gap:8px;font-size:11.5px;color:var(--text-2);line-height:1.55}
.ann-list .n{flex:0 0 auto}
.ann-list li b{color:var(--text)}
.n{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:9.5px;font-weight:800;color:#fff;background:#E5484D;line-height:1;vertical-align:1px;margin-right:3px}
.after .n,.n.green{background:#0E9F6E}
.n.blue{background:#2563EB}
.n.gray{background:#667085}
body.no-ann .n{display:none}
.take{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 34px}
.take-col{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 14px}
.take-col h4{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.take-col ul{margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:var(--text-2)}
.take-col li b{color:var(--text)}
.mig{grid-column:1/-1;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mig table{width:100%;border-collapse:collapse;font-size:11.5px}
.mig th,.mig td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--border)}
.mig th{background:var(--surface-sunken);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.mig tr:last-child td{border-bottom:0}
.mig td:first-child{font-weight:600}
.mig .to{color:var(--success-fg);font-weight:600}

/* ============ App 外壳 ============ */
.app{display:grid;grid-template-columns:176px minmax(0,1fr);height:100%;background:var(--bg-app)}
.nav{background:#FBFCFE;border-right:1px solid var(--border);padding:12px 10px 9px;display:flex;flex-direction:column;min-height:0}
.nav-brand{display:flex;align-items:center;gap:8px;padding:1px 5px 11px}
.nav-logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#7A5AF8);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:750;box-shadow:0 4px 10px rgba(37,99,235,.24)}
.nav-brand b{font-size:14px}
.space{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 8px;margin-bottom:11px}
.space-av{width:23px;height:23px;border-radius:7px;background:#E7EDF9;color:#33507A;font-weight:750;font-size:10px;display:grid;place-items:center}
.space b{display:block;font-size:11.5px;font-weight:650}
.space small{display:block;font-size:9.5px;color:var(--text-3);margin-top:1px}
.nav-sec{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--text-3);padding:9px 7px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:8px;height:29px;padding:0 8px;border-radius:7px;color:var(--text-2);font-size:11.5px;font-weight:550}
.nav-item svg{width:14px;height:14px;color:#7A8699;stroke-width:1.6;flex:0 0 auto}
.nav-item:hover{background:var(--surface-hover)}
.nav-item.on{background:var(--primary-soft);color:var(--primary-fg);font-weight:650}
.nav-item.on svg{color:var(--primary-fg)}
.nav-foot{margin-top:auto;display:flex;align-items:center;gap:7px;padding:9px 5px 1px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-3)}
.avatar{width:22px;height:22px;border-radius:50%;background:#E7EDF9;color:#33507A;font-size:9.5px;font-weight:750;display:grid;place-items:center}
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{height:44px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--border);background:#fff;flex:0 0 auto}
.topbar .grow{flex:1}
.tb-search{display:flex;align-items:center;gap:6px;height:27px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-sunken);color:var(--text-3);font-size:10.5px;min-width:170px}
.tb-search kbd{margin-left:auto;font-family:var(--font-mono);font-size:9px;border:1px solid var(--border-strong);border-radius:3px;padding:0 3px;background:#fff}
.tb-icon{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}
.tb-icon:hover{background:var(--surface-hover)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--border-strong);background:#fff;color:var(--text-2);font-size:11px;font-weight:600;white-space:nowrap}
.btn svg{width:13px;height:13px}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:25px;padding:0 8px;font-size:10.5px}
.btn.danger{color:var(--danger-fg)}
.icon-btn{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-hover)}
.icon-btn svg{width:14px;height:14px}
.pagehead{padding:13px 18px 0}
.pagehead h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.pagehead p{margin:3px 0 0;font-size:11px;color:var(--text-3)}
.crumb{font-size:10.5px;color:var(--text-3);margin-bottom:2px}
.modes{display:flex;gap:2px;padding:10px 18px 0;border-bottom:1px solid var(--border);margin-bottom:11px;overflow:hidden}
.mode{position:relative;height:33px;padding:0 10px;font-size:11.5px;font-weight:600;color:var(--text-3);white-space:nowrap}
.mode.on{color:var(--primary-fg)}
.mode.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--primary)}
.mode .cnt{display:inline-grid;place-items:center;min-width:16px;height:15px;padding:0 4px;margin-left:4px;border-radius:999px;background:var(--surface-sunken);color:var(--text-3);font-size:9px;font-weight:700}
.content{padding:0 18px 18px;min-width:0}
.toolrow{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.scope{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border:1px solid var(--border-strong);border-radius:7px;background:#fff;font-size:10.5px;font-weight:600}
.chips{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:10px;color:var(--text-2);white-space:nowrap}
.chip.on{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary-fg);font-weight:650}
.toolrow .grow{flex:1}
.tbl-wrap{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.tbl th,.tbl td{text-align:left;padding:0 8px;height:34px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th{height:30px;background:var(--surface-sunken);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.on td{background:var(--primary-soft)}
.tbl .t{font-weight:600;color:var(--text);max-width:190px}
.tbl .no{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:999px;font-size:9.5px;font-weight:650;border:1px solid transparent;white-space:nowrap}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.pass{background:var(--success-soft);color:var(--success-fg);border-color:var(--success-border)}
.badge.fail{background:var(--danger-soft);color:var(--danger-fg);border-color:var(--danger-border)}
.badge.block{background:var(--warning-soft);color:var(--warning-fg);border-color:var(--warning-border)}
.badge.skip{background:var(--surface-sunken);color:var(--text-3);border-color:var(--border)}
.badge.none{background:#fff;color:var(--text-3);border-color:var(--border-strong)}
.badge.none:before{background:transparent;border:1px solid currentColor}
.pdot{display:inline-grid;place-items:center;min-width:22px;height:17px;padding:0 4px;border-radius:4px;font-size:9px;font-weight:800}
.pdot.p0{background:var(--danger-soft);color:var(--danger-fg)}
.pdot.p1{background:var(--warning-soft);color:var(--warning-fg)}
.pdot.p2{background:var(--info-soft);color:var(--info-fg)}
.pdot.p3{background:var(--surface-sunken);color:var(--text-3)}
.muted{color:var(--text-3)}

/* ============ 浮层：弹框 / 抽屉 / 侧板 ============ */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.34);z-index:20}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;background:#fff;border-radius:11px;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;overflow:hidden;max-height:calc(100% - 40px)}
.modal.md{width:500px}
.modal.lg{width:620px}
.modal.sm{width:330px}
.modal-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.modal-head h3{margin:0;font-size:13px;font-weight:700;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-head .sub{font-size:9.5px;color:var(--text-3)}
.modal-body{padding:12px 14px;overflow:auto;min-height:0;font-size:10.5px;line-height:1.6}
.modal-foot{display:flex;align-items:center;gap:7px;padding:9px 14px;border-top:1px solid var(--border);flex:0 0 auto}
.modal-foot .grow{flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:9.5px;font-weight:650;color:var(--text-2);margin-bottom:3px}
.field label .req{color:var(--danger)}
.input,.select,.textarea{display:flex;align-items:center;height:27px;border:1px solid var(--border-strong);border-radius:6px;background:#fff;padding:0 7px;font-size:10.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.input.focus{border-color:var(--primary);box-shadow:var(--ring)}
.textarea{height:46px;align-items:flex-start;padding-top:5px;line-height:1.5;white-space:normal}
.help{font-size:9px;color:var(--text-3);margin-top:2px;line-height:1.5}
.steps{border:1px solid var(--border);border-radius:7px;overflow:hidden}
.steps .row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--border)}
.steps .row:last-child{border-bottom:0}
.steps .row>span{padding:5px 7px;font-size:10px;line-height:1.5}
.steps .row>span+span{border-left:1px solid var(--border)}
.steps .idx{font-family:var(--font-mono);font-size:9px;color:var(--text-3);text-align:center;background:#FCFCFD}
.drawer-lg{position:absolute;top:0;right:0;bottom:0;width:570px;max-width:100%;background:#fff;z-index:24;box-shadow:-18px 0 42px rgba(16,24,40,.16);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer-lg.full{width:100%}
.dhead{display:flex;align-items:flex-start;gap:9px;padding:11px 14px 9px;border-bottom:1px solid var(--border);flex:0 0 auto}
.type-ico{width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary-fg);display:grid;place-items:center;flex:0 0 auto}
.type-ico svg{width:15px;height:15px}
.dhead-main{min-width:0;flex:1 1 auto}
.dtitle-row{display:flex;align-items:center;gap:6px;min-width:0}
.dtitle-row h2{margin:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dashed transparent}
.dtitle-row h2[data-edit-title]{cursor:text}
.dtitle-row h2[data-edit-title]:hover{border-bottom-color:var(--border-strong)}
.dmeta{font-size:9.5px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead-acts{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.drawer-tabs{display:flex;gap:1px;padding:0 10px;border-bottom:1px solid var(--border);flex:0 0 auto;overflow:hidden}
.drawer-tab{position:relative;height:33px;padding:0 8px;font-size:10.5px;font-weight:650;color:var(--text-3);white-space:nowrap}
.drawer-tab .num{font-family:var(--font-mono);font-size:8.5px;color:var(--text-3);margin-left:2px}
.drawer-tab.on{color:var(--text)}
.drawer-tab.on:after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--text);border-radius:2px}
.drawer-body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px 20px}
.sec{margin-bottom:14px}
.sec:last-child{margin-bottom:0}
.sec h4{margin:0 0 6px;font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:5px}
.sec p{margin:0 0 5px;font-size:10.5px;line-height:1.65;color:var(--text-2)}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fact{border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
.fact span{display:block;font-size:9px;color:var(--text-3);margin-bottom:2px}
.fact b{display:block;font-size:10.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact.edit b{border-bottom:1px dashed var(--border-strong);cursor:text}
.fact.edit b:hover{border-bottom-color:var(--primary)}
.exec{border:1px solid var(--border);border-radius:7px;padding:8px;display:grid;gap:4px;font-size:10px;color:var(--text-2)}
.exec b{color:var(--text)}
.exec .ok{color:var(--success-fg);font-weight:700}
.exec .bad{color:var(--danger-fg);font-weight:700}

  function fit(){
    document.querySelectorAll('.viewport').forEach(function(v){
      var avail = v.clientWidth, solo = v.closest('.compare.solo-before,.compare.solo-after');
      var s = Math.min(avail / 820, solo ? 1.6 : 1.55);
      v.style.setProperty('--s', s.toFixed(4));
      v.style.height = Math.round(640 * s) + 'px';
    });
  }

  function setSeg(container, attr, value){
    container.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('on', b.dataset[attr] === value);
    });
  }

  document.getElementById('sceneSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-scene]'); if (!b) return;
    state.scene = b.dataset.scene; state.solo = null;
    setSeg(this,'scene',state.scene);
    renderScene();
    try { history.replaceState(null,'', '?scene='+state.scene); } catch(err){}
  });
  document.getElementById('annChk').addEventListener('change', function(){
    document.body.classList.toggle('no-ann', !this.checked);
    try { history.replaceState(null,'', '?scene='+state.scene+(this.checked?'':'&ann=0')); } catch(err){}
  });
  document.getElementById('board').addEventListener('click', function(e){
    var solo = e.target.closest('[data-solo]');
    if (solo){
      var v = solo.dataset.solo;
      state.solo = (v === 'reset' || state.solo === v) ? null : v;
      renderScene();
      return;
    }
    var tab = e.target.closest('[data-tab]');
    if (tab){
      var host = tab.closest('.drawer-lg');
      if (!host) return;
      host.querySelectorAll('[data-tab]').forEach(function(t){ t.classList.toggle('on', t === tab); });
      host.querySelectorAll('[data-pane]').forEach(function(p){ p.hidden = p.dataset.pane !== tab.dataset.tab; });
      return;
    }
    var title = e.target.closest('[data-edit-title]');
    if (title){
      if (title.isContentEditable){
        title.contentEditable = 'false';
      } else {
        title.contentEditable = 'true';
        title.focus();
        var r = document.createRange(); r.selectNodeContents(title);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
    }
  });
  window.addEventListener('resize', fit);
  window.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (e.target.closest('input,textarea,[contenteditable="true"]')) return;
    var keys = Object.keys(scenes), i = keys.indexOf(state.scene);
    state.scene = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
    state.solo = null;
    setSeg(document.getElementById('sceneSeg'),'scene',state.scene);
    renderScene();
    try { history.replaceState(null,'', '?scene='+state.scene); } catch(err){}
  });

  setSeg(document.getElementById('sceneSeg'),'scene',state.scene);
  renderScene();
})();
</script>
</body>
</html>
