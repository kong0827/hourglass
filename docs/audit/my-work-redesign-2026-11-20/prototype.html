<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工作 · 多角色工作台原型 · 2026-11-20</title>
<style>
  :root{
    /* 兜底值，正式令牌由 tokens.css 覆盖 */
    --bg-app:#F7F8FA; --surface:#FFFFFF; --surface-sunken:#F2F4F7; --border:#E4E7EC;
    --text:#101828; --text-2:#475467; --text-3:#667085; --primary:#2563EB;
    --primary-soft:#EFF4FF; --primary-border:#BFD3FE; --primary-fg:#1D4ED8;
    --success:#12B76A; --success-soft:#ECFDF3; --success-fg:#067647;
    --warning:#F79009; --warning-soft:#FFFAEB; --warning-fg:#B54708;
    --danger:#F04438; --danger-soft:#FEF3F2; --danger-fg:#B42318;
    --plum:#7A5AF8; --plum-soft:#F4F3FF; --plum-fg:#5B3FD1;
    --p0:#F04438; --p0-fg:#B42318; --p1:#F79009; --p1-fg:#B54708;
    --p2:#2E90FA; --p2-fg:#175CD3; --p3:#667085; --p3-fg:#475467;
    --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:11px; --r-pill:999px;
    --shadow-xs:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 4px 10px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.05);
    --shadow-lg:0 12px 24px -6px rgba(16,24,40,.10),0 4px 8px -4px rgba(16,24,40,.05);
    --sidebar-w:216px; --topbar-h:46px; --fs-page-title:19px;
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
</style>
<link rel="stylesheet" href="../../../frontend/css/tokens.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg-app);color:var(--text);font-family:var(--font-sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:inherit}
  .ico{width:16px;height:16px;flex:0 0 auto;display:block}
  .ico-sm{width:13px;height:13px}
  .app{display:flex;min-height:100vh}

  /* ---------- 侧栏 / 顶栏（产品壳层） ---------- */
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:8px 10px 10px;overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px;font-weight:650;font-size:14px;letter-spacing:.02em}
  .brand-mark{width:22px;height:22px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .space-pick{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:var(--r-sm);margin:4px 0 10px;background:var(--surface)}
  .space-pick .savatar{width:24px;height:24px;border-radius:7px;background:var(--surface-sunken);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2)}
  .space-pick .sname{font-size:12.5px;font-weight:600;line-height:1.3}
  .space-pick .smeta{font-size:10.5px;color:var(--text-3);line-height:1.3}
  .space-pick .ico{width:12px;height:12px;color:var(--text-3);margin-left:auto}
  .nav{overflow:auto;flex:1;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-group{margin-top:12px}
  .nav-cap{font-size:10.5px;color:var(--text-3);padding:0 8px 4px;letter-spacing:.04em}
  .nav-item{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:var(--r-xs);color:var(--text-2);text-decoration:none;font-size:12.5px}
  .nav-item .ico{width:15px;height:15px;color:var(--text-3)}
  .nav-item:hover{background:var(--surface-hover)}
  .nav-item[aria-current=page]{background:var(--primary-soft);color:var(--primary-fg);font-weight:600}
  .nav-item[aria-current=page] .ico{color:var(--primary)}
  .nav-item .chev{margin-left:auto;width:11px;height:11px;color:var(--text-3)}
  .side-user{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:10px 6px 2px;margin-top:8px;font-size:12px;color:var(--text-2)}
  .side-user .pav{width:24px;height:24px}
  .side-user .ico{margin-left:auto;width:14px;height:14px;color:var(--text-3)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .tb-collapse{width:26px;height:26px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--surface);display:grid;place-items:center;color:var(--text-3);cursor:pointer}
  .crumb{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .crumb b{color:var(--text-2);font-weight:500}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .tb-btn{width:28px;height:28px;border:0;background:transparent;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--text-3);cursor:pointer}
  .tb-btn:hover{background:var(--surface-hover);color:var(--text-2)}
  .tb-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-xs);color:var(--text-3);font-size:11.5px}
  .tb-search kbd{font-family:var(--font-sans);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 3px;color:var(--text-3)}
  .pav{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary-fg);display:inline-grid;place-items:center;font-size:11px;font-weight:650;flex:0 0 auto}
  .bell{position:relative}
  .bell::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--danger);border:1px solid #fff}

  /* ---------- 页面骨架 ---------- */
  .m-only{display:none}
  .content{width:100%;max-width:1160px;margin:0 auto;padding:20px 28px 56px}
  .phead{display:flex;align-items:flex-start;gap:18px;margin-bottom:8px}
  .h1{font-size:var(--fs-page-title);font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.35}
  .sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--text-3);font-size:12px}
  .sub b{color:var(--text-2);font-weight:550}
  .rolepill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--surface-sunken);color:var(--text-2);font-size:10.5px;font-weight:500}
  .subdot{color:var(--border-strong,#D0D5DD)}
  .phead-act{margin-left:auto;display:flex;align-items:center;gap:8px;padding-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--surface);color:var(--text-2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--surface-hover);color:var(--text)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-3)}
  .btn.ghost:hover{background:var(--surface-hover);color:var(--text-2)}
  .btn.sm{height:26px;padding:0 8px;font-size:11.5px}
  .icon-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--surface);display:inline-grid;place-items:center;color:var(--text-3);cursor:pointer}
  .icon-btn:hover{background:var(--surface-hover);color:var(--text-2)}
  .link{background:none;border:0;padding:0;color:var(--primary-fg);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .link:hover{text-decoration:underline}
  .link .ico{width:12px;height:12px}

  /* 页签 */
  .tabs{display:flex;align-items:stretch;gap:4px;border-bottom:1px solid var(--border);margin-top:10px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;height:42px;margin-right:18px;padding:0 2px;
    display:inline-flex;align-items:center;gap:7px;color:var(--text-3);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--text-2)}
  .tab[aria-selected=true]{color:var(--text);border-color:var(--primary);font-weight:600}
  .tab .n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);
    background:var(--surface-sunken);color:var(--text-2);font-size:10.5px;font-weight:600}
  .tab[aria-selected=true] .n{background:var(--primary-soft);color:var(--primary-fg)}
  .tab .n.muted{color:var(--text-3);font-weight:500}

  /* 结论条 */
  .brief{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 13px;background:var(--primary-soft);
    border:1px solid var(--primary-border);border-radius:var(--r-md);color:var(--text-2);font-size:12.5px}
  .brief .ico{color:var(--primary-fg)}
  .brief .txt{min-width:0}
  .brief strong{color:var(--text);font-weight:600}
  .brief-meta{margin-left:auto;color:var(--text-3);font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .brief-meta .dot{width:5px;height:5px;border-radius:50%;background:var(--success)}
  .brief.warn{background:var(--warning-soft);border-color:var(--warning-border,#FEDF89)}
  .brief.warn .ico{color:var(--warning-fg)}
  .brief.err{background:var(--danger-soft);border-color:var(--danger-border,#FDA29B)}
  .brief.err .ico{color:var(--danger-fg)}

  /* 工具条 */
  .toolrow{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:34px}
  .chips{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:auto;scrollbar-width:none;padding:1px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);
    color:var(--text-2);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
  .chip:hover{background:var(--surface-hover)}
  .chip b{font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums}
  .chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
  .chip[aria-pressed=true] b{color:rgba(255,255,255,.82)}
  .tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .searchbox{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--surface);color:var(--text-3);width:190px}
  .searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--text);min-width:0}
  .searchbox input::placeholder{color:var(--text-3)}
  .searchbox .ico{width:14px;height:14px}
  .pop{position:relative}
  .pop>summary{list-style:none;height:30px;padding:0 9px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--surface);
    display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12px;cursor:pointer;white-space:nowrap}
  .pop>summary::-webkit-details-marker{display:none}
  .pop>summary:hover{background:var(--surface-hover)}
  .pop>summary .ico{width:13px;height:13px;color:var(--text-3)}
  .pop>summary .dotn{min-width:16px;height:16px;border-radius:99px;background:var(--primary);color:#fff;font-size:10px;display:inline-grid;place-items:center;padding:0 4px}
  .popmenu{position:absolute;right:0;top:calc(100% + 6px);width:226px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:10px;z-index:40}
  .popmenu h4{margin:0 0 6px;font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.03em}
  .popmenu hr{border:0;border-top:1px solid var(--border);margin:9px 0}
  .check{display:flex;align-items:center;gap:7px;padding:5px 2px;font-size:12px;color:var(--text-2);cursor:pointer}
  .check input{margin:0;accent-color:var(--primary)}
  .popnote{font-size:10.5px;color:var(--text-3);line-height:1.45;margin-top:6px}

  /* 分区卡片 */
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);margin-top:12px;overflow:hidden}
  .shead{display:flex;align-items:center;gap:9px;padding:11px 15px 9px;min-height:44px}
  .sicon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
  .sicon .ico{width:14px;height:14px}
  .tint-blue{background:var(--primary-soft);color:var(--primary-fg)}
  .tint-plum{background:var(--plum-soft);color:var(--plum-fg)}
  .tint-amber{background:var(--warning-soft);color:var(--warning-fg)}
  .tint-green{background:var(--success-soft);color:var(--success-fg)}
  .tint-gray{background:var(--surface-sunken);color:var(--text-2)}
  .stitle{font-size:13px;font-weight:600;white-space:nowrap}
  .scount{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .sdesc{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sdesc::before{content:"·";margin-right:7px;color:var(--border-strong,#D0D5DD)}
  .sact{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .thead{display:grid;align-items:center;gap:12px;padding:0 15px 6px;font-size:10.5px;color:var(--text-3);border-bottom:1px solid var(--border)}
  .row{display:grid;align-items:center;gap:12px;padding:10px 15px;border-top:1px solid var(--border);cursor:pointer;position:relative}
  .g-dev{grid-template-columns:minmax(0,1fr) 92px 76px 84px 72px}
  .g-test{grid-template-columns:minmax(0,1fr) 92px 80px 90px 76px}
  .g-review{grid-template-columns:minmax(0,1fr) 92px 80px 84px 88px}
  .g-demand{grid-template-columns:minmax(0,1fr) 92px 80px 84px 112px}
  .g-watch{grid-template-columns:minmax(0,1fr) 90px 120px 150px 72px}
  .row:first-of-type{border-top:0}
  .row:hover{background:#FAFBFC}
  .row:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
  .tcell{min-width:0}
  .ttl{font-size:12.5px;font-weight:550;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .sep{color:var(--border-strong,#D0D5DD)}
  .tm .vtag{display:inline-flex;align-items:center;height:15px;padding:0 4px;border-radius:3px;background:var(--surface-sunken);color:var(--text-3);font-size:10px}
  .badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .st-gray{background:var(--surface-sunken);color:var(--text-2)}
  .st-blue{background:var(--primary-soft);color:var(--primary-fg)}
  .st-plum{background:var(--plum-soft);color:var(--plum-fg)}
  .st-green{background:var(--success-soft);color:var(--success-fg)}
  .st-orange{background:var(--warning-soft);color:var(--warning-fg)}
  .st-red{background:var(--danger-soft);color:var(--danger-fg)}
  .pri{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);white-space:nowrap}
  .pri i{width:6px;height:6px;border-radius:2px;display:inline-block}
  .pri.p0 i{background:var(--p0)} .pri.p1 i{background:var(--p1)} .pri.p2 i{background:var(--p2)} .pri.p3 i{background:var(--p3)}
  .due{font-size:11.5px;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .due.overdue{color:var(--danger-fg);font-weight:600}
  .due.today{color:var(--warning-fg);font-weight:600}
  .prog{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .bar{width:50px;height:4px;border-radius:2px;background:#EAECF0;overflow:hidden;flex:0 0 auto}
  .bar span{display:block;height:100%;background:var(--primary);border-radius:2px}
  .bar.warn span{background:var(--danger)}
  .claimline{display:flex;align-items:center;gap:8px;padding:8px 15px;border-top:1px solid var(--border);background:#FAFBFC;font-size:11.5px;color:var(--text-3)}
  .claimline .ico{width:13px;height:13px}
  .claimline .link{margin-left:auto}
  .sempty{display:flex;align-items:center;gap:9px;padding:14px 15px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
  .sempty .ico{color:var(--text-3);width:14px;height:14px}
  .sempty .link{margin-left:auto}
  .tnote{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:10.5px;color:var(--text-3)}
  .tnote .ico{width:12px;height:12px}

  /* 整页空态 / 错误 / 骨架 */
  .bigstate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:46px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-top:12px;box-shadow:var(--shadow-xs)}
  .bigstate .bico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-sunken);color:var(--text-3);margin-bottom:12px}
  .bigstate .bico .ico{width:20px;height:20px}
  .bigstate h3{margin:0;font-size:14px;font-weight:600}
  .bigstate p{margin:6px 0 0;font-size:12px;color:var(--text-3);max-width:440px;line-height:1.6}
  .bigstate .bact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .bigstate.err .bico{background:var(--danger-soft);color:var(--danger-fg)}
  .sk{border-radius:5px;background:linear-gradient(90deg,#F2F4F7 25%,#E9ECF1 37%,#F2F4F7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
  .skbrief{height:38px;margin-top:12px;border-radius:10px}
  .skcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-top:12px;padding:14px 15px}
  .skcard .l{height:10px;margin:12px 0}

  /* 团队（移动端） */
  .rangebar{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
  .seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--r-xs);padding:2px;gap:2px}
  .seg button{height:28px;padding:0 11px;border:0;border-radius:5px;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-xs)}
  .range-dates{margin-left:auto;font-size:11px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .teamcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-xs)}
  .thead-t{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .thead-t h3{margin:0;font-size:12.5px;font-weight:600}
  .thead-t .meta{margin-left:auto;font-size:10.5px;color:var(--text-3)}
  .pct{display:flex;align-items:baseline;gap:8px}
  .pct b{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .pct .delta{font-size:11px;color:var(--success-fg);background:var(--success-soft);padding:1px 5px;border-radius:4px}
  .pbar{height:6px;border-radius:3px;background:#EAECF0;margin:10px 0 8px;overflow:hidden}
  .pbar span{display:block;height:100%;border-radius:3px;background:var(--primary)}
  .kpis{display:flex;gap:14px;font-size:11px;color:var(--text-3)}
  .kpis b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
  .kpis .bad b{color:var(--danger-fg)}
  .kpis .warn b{color:var(--warning-fg)}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

const qs = new URLSearchParams(location.search);
const S = {
  persona: PEOPLE[qs.get('persona')] ? qs.get('persona') : 'dev',
  tab: ['pending','created','watched','team'].includes(qs.get('tab')) ? qs.get('tab') : 'pending',
  state: ['default','empty','error','loading'].includes(qs.get('state')) ? qs.get('state') : 'default',
  filter: 'all',
  pri: 'all',
  blockedOnly: false,
  sort: 'due',
  q: '',
  expand: null,
  openFilter: false,
  teamRange: 'week',
  chrome: qs.get('chrome') !== '0'
};
const isMobile = () => window.matchMedia('(max-width: 900px)').matches;
const persona = () => PEOPLE[S.persona];

function counts(p){
  if (S.state === 'empty') return {pending:0, created:0, watched:0};
  const pending = p.order.filter(k => k !== 'review' || p.canReview)
    .reduce((n,k) => n + (p.pending[k]||[]).length, 0);
  return {pending, created:p.created.length, watched:p.watched.length};
}
function tabDefs(p){
  const c = counts(p);
  const tabs = [
    {key:'pending', label:'待我处理', n:c.pending},
    {key:'created', label:'我发起的', n:c.created},
    {key:'watched', label:'我关注的', n:c.watched}
  ];
  if (isMobile() && p.canTeam) tabs.push({key:'team', label:'团队', n:null});
  return tabs;
}
function currentTab(p){
  const tabs = tabDefs(p).map(t => t.key);
  return tabs.includes(S.tab) ? S.tab : 'pending';
}
function pendingSections(p){
  return p.order.filter(k => k === 'dev' || k === 'test' || (k === 'review' && p.canReview));
}
function allPendingItems(p){
  return pendingSections(p).flatMap(k => (p.pending[k]||[]).map(it => Object.assign({kind:k}, it)));
}
function allCreated(p){ return (p.created||[]).map(it => Object.assign({kind:'created'}, it)); }
function allWatched(p){ return (p.watched||[]).map(it => Object.assign({kind:'watched'}, it)); }

/* ============ 过滤 / 排序 ============ */
function passCommon(it){
  if (S.pri !== 'all' && it.pri !== S.pri) return false;
  if (S.blockedOnly && !it.blocked) return false;
  if (S.q){
    const q = S.q.trim().toLowerCase();
    const hay = (it.title + ' ' + (it.project||'') + ' ' + (it.submitter||'')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function passFilter(it, tab){
  if (S.filter === 'all') return true;
  if (tab === 'pending'){
    if (S.filter === 'overdue') return it.dueKind === 'overdue';
    if (S.filter === 'today') return it.dueKind === 'today';
    if (S.filter === 'week') return it.dueKind === 'week' || it.dueKind === 'soon';
  }
  if (tab === 'created') return it.sk === S.filter;
  if (tab === 'watched'){
    if (S.filter === 'task' || S.filter === 'demand') return it.type === S.filter;
    if (S.filter === 'today') return !!it.today;
  }
  return true;
}
function sortItems(items, tab){
  const arr = items.slice();
  if (S.sort === 'priority'){
    const rank = {P0:0,P1:1,P2:2,P3:3};
    arr.sort((a,b) => (rank[a.pri]??9) - (rank[b.pri]??9));
  } else if (S.sort === 'updated'){
    arr.sort((a,b) => (b.ts||0) - (a.ts||0));
  } else if (tab === 'pending'){
    arr.sort((a,b) => (a.ts||0) - (b.ts||0));
  } else {
    arr.sort((a,b) => (b.ts||0) - (a.ts||0));
  }
  return arr;
}
function filterChips(tab, p){
  const set = tab === 'pending' ? allPendingItems(p) : tab === 'created' ? allCreated(p) : allWatched(p);
  const base = set.filter(passCommon);
  if (tab === 'pending'){
    return [
      {key:'all', label:'全部', n:base.length},
      {key:'overdue', label:'逾期', n:base.filter(i => i.dueKind === 'overdue').length},
      {key:'today', label:'今天到期', n:base.filter(i => i.dueKind === 'today').length},
      {key:'week', label:'本周', n:base.filter(i => i.dueKind === 'week' || i.dueKind === 'soon').length}
    ];
  }
  if (tab === 'created'){
    return [
      {key:'all', label:'全部', n:base.length},
      {key:'review', label:'评审中', n:base.filter(i => i.sk === 'review').length},
      {key:'passed', label:'已通过', n:base.filter(i => i.sk === 'passed').length},
      {key:'planned', label:'已排期', n:base.filter(i => i.sk === 'planned').length},
      {key:'done', label:'已完成', n:base.filter(i => i.sk === 'done').length}
    ];
  }
  return [
    {key:'all', label:'全部', n:base.length},
    {key:'task', label:'工作项', n:base.filter(i => i.type === 'task').length},
    {key:'demand', label:'需求', n:base.filter(i => i.type === 'demand').length},
    {key:'today', label:'今天有变更', n:base.filter(i => i.today).length}
  ];
}
function filterCount(tab){
  let n = 0;
  if (tab !== 'watched' && S.pri !== 'all') n++;
  if (S.blockedOnly) n++;
  return n;
}

/* ============ 结论条 ============ */
function briefHTML(p, tab){
  if (S.state === 'empty'){
    return '<div class="brief"><span class="txt"><strong>这一页还没有内容</strong> · 当你被指派、发起或关注事项后，会自动汇总到这里。</span><span class="brief-meta">示例空态</span></div>';
  }
  let html = '';
  if (tab === 'pending'){
    const items = allPendingItems(p);
    if (!items.length){
      html = '<strong>今天没有需要你处理的事项</strong><span> · 可以去「我发起的」看看进展，或从关注列表挑一件推进。</span>';
      return '<div class="brief"><span class="txt">'+html+'</span><span class="brief-meta"><span class="dot"></span>09:41 更新</span></div>';
    }
    const overdue = items.filter(i => i.dueKind === 'overdue').length;
    const today = items.filter(i => i.dueKind === 'today').length;
    const blocked = items.filter(i => i.blocked).length;
    const first = items.find(i => i.dueKind === 'overdue') || items.find(i => i.blocked) || items[0];
    const parts = [];
    if (overdue) parts.push(overdue + ' 项已逾期');
    if (today) parts.push(today + ' 项今天到期');
    if (blocked) parts.push(blocked + ' 项阻塞');
    const cls = (overdue || blocked) ? ' warn' : '';
    html += '<div class="brief'+cls+'">'+ico(overdue || blocked ? 'alert' : 'info')+
      '<span class="txt"><strong>'+items.length+' 项待处理</strong> · '+(parts.join('，') || '都在本周内')+
      '；建议先处理「'+first.title+'」。</span><span class="brief-meta">按角色排序 · <span class="dot"></span>09:41 更新</span></div>';
    return html;
  }
  if (tab === 'created'){
    const items = p.created;
    if (!items.length){
      return '<div class="brief"><span class="txt"><strong>你还没有发起过需求</strong> · 提交后可在这里跟踪评审与排期。</span><span class="brief-meta">09:41 更新</span></div>';
    }
    const n = k => items.filter(i => i.sk === k).length;
    const parts = [];
    if (n('review')) parts.push(n('review') + ' 个评审中');
    if (n('passed')) parts.push(n('passed') + ' 个已通过');
    if (n('planned')) parts.push(n('planned') + ' 个已排期');
    if (n('done')) parts.push(n('done') + ' 个已完成');
    const waiting = items.find(i => i.sk === 'review');
    html = '<div class="brief">'+ico('demand')+'<span class="txt"><strong>'+items.length+' 个需求</strong> · '+
      parts.join('，')+(waiting ? '；「'+waiting.title+'」正在等待评审。' : '。')+'</span><span class="brief-meta">09:41 更新</span></div>';
    return html;
  }
  const items = p.watched;
  if (!items.length){
    return '<div class="brief"><span class="txt"><strong>你还没有关注任何事项</strong> · 在工作项或需求详情里点「关注」，变更会出现在这里。</span><span class="brief-meta">09:41 更新</span></div>';
  }
  const today = items.filter(i => i.today).length;
  const tasks = items.filter(i => i.type === 'task').length;
  const demands = items.filter(i => i.type === 'demand').length;
  html = '<div class="brief">'+ico('star')+'<span class="txt"><strong>'+items.length+' 条关注</strong> · '+
    tasks+' 个工作项、'+demands+' 个需求'+(today ? '；'+today+' 条今天有变更' : '；今天暂无变更')+'。</span><span class="brief-meta">09:41 更新</span></div>';
  return html;
}

    '<div class="popnote">筛选只改变当前分区显示；页签计数来自服务端，不随筛选变化。</div></div></details>';
  html += '<details class="pop"><summary>'+ico('sliders')+'显示</summary><div class="popmenu"><h4>排序</h4>'+
    [['due', tab === 'pending' ? '截止时间' : '最近更新'],['priority','优先级'],['updated','最近更新']].filter((o,i,a) => a.findIndex(x => x[1] === o[1]) === i).map(o => '<label class="check"><input type="radio" name="sort" value="'+o[0]+'"'+(S.sort === o[0] ? ' checked' : '')+'>'+o[1]+'</label>').join('')+

function sectionHTML(key, p){
  const cfg = SECTIONS[key];
  const raw = p.pending[key] || [];
  const filtered = sortItems(raw.filter(it => passCommon(it) && passFilter(it,'pending')), 'pending');
  if (S.filter !== 'all' && !filtered.length) return '';
  if (S.q || S.pri !== 'all' || S.blockedOnly){
    if (!filtered.length) return '';
  }
  if (!raw.length){
    const emptyText = {dev:'目前没有待你开发的工作项', test:'目前没有待你测试的工作项', review:'目前没有待你评审的需求'}[key];
    return '<section class="section"><div class="shead"><span class="sicon tint-'+cfg.tint+'">'+ico(cfg.icon)+'</span>'+
      '<span class="stitle">'+cfg.title+'</span><span class="scount">0 项</span>'+
      '<span class="sdesc">'+cfg.desc+'</span></div>'+
      '<div class="sempty">'+ico('inbox')+'<span>'+emptyText+'</span>'+
      '<button class="link" type="button" data-proto-toast="原型：前往对应列表">去看看 '+ico('arrow')+'</button></div>'+
      (key === 'test' && p.claimable ? claimHTML(p) : '')+'</section>';
  }
  const expanded = S.expand === key;
  const shown = expanded ? filtered : filtered.slice(0,4);
  const head = key === 'dev' ? ['工作项','状态','优先级','截止','进度']
    : key === 'test' ? ['工作项','测试进度','状态','提测','截止']
    : ['需求','提交人','优先级','期望上线','提交'];
  const rowFn = key === 'dev' ? devRow : key === 'test' ? testRow : reviewRow;
  const grid = 'grid-template-columns:'+cfg.cols;
  let html = '<section class="section"><div class="shead"><span class="sicon tint-'+cfg.tint+'">'+ico(cfg.icon)+'</span>'+
    '<span class="stitle">'+cfg.title+'</span><span class="scount">'+filtered.length+' 项'+(filtered.length !== raw.length ? ' / 共 '+raw.length : '')+'</span>'+
    '<span class="sdesc">'+cfg.desc+'</span><span class="sact">'+
    (filtered.length > 4 ? '<button class="link" type="button" data-expand="'+key+'">'+(expanded ? '收起' : '查看全部 '+filtered.length)+' '+ico('arrow')+'</button>' : '')+
    '</span></div>';
  html += '<div class="thead g-'+key+'" style="'+grid+'">'+head.map(h => '<span>'+h+'</span>').join('')+'</div>';
  html += shown.map(rowFn).join('');
  if (key === 'test' && p.claimable) html += claimHTML(p);
  html += '</section>';
  return html;
}

/* ============ 页签主体 ============ */
function boardHTML(p, tab){
  if (S.state === 'error') return errorHTML();
  if (S.state === 'loading') return skeletonHTML();
  let html = briefHTML(p, tab);
  if (S.state === 'empty') return emptyHTML(p, tab);
  html += toolbarHTML(p, tab);
  if (tab === 'pending'){
    const sections = pendingSections(p);
    const hasAny = sections.some(k => (p.pending[k]||[]).length);
    if (!hasAny) return html + emptyHTML(p, tab);
    let body = sections.map(k => sectionHTML(k, p)).join('');
    if (!body.trim()) body = filterEmptyHTML();
    html += body + noteHTML();
    return html;
  }
  if (tab === 'created'){
    if (!p.created.length) return html + emptyHTML(p, tab);
    const items = sortItems(p.created.filter(it => passCommon(it) && passFilter(it,'created')), 'created');
    if (!items.length) return html + filterEmptyHTML();
    html += '<section class="section"><div class="shead"><span class="sicon tint-green">'+ico('demand')+'</span>'+
      '<span class="stitle">我发起的需求</span><span class="scount">'+items.length+' 个</span>'+
      '<span class="sdesc">按最近更新排序；状态含评审、排期与完成</span><span class="sact">'+
      (items.length > 4 ? '<button class="link" type="button" data-expand="created">'+(S.expand === 'created' ? '收起' : '查看全部 '+items.length)+' '+ico('arrow')+'</button>' : '')+
      '</span></div><div class="thead g-demand"><span>需求</span><span>状态</span><span>优先级</span><span>期望上线</span><span>最近更新</span></div>';
    html += (S.expand === 'created' ? items : items.slice(0,4)).map(createdRow).join('');
    html += '</section>' + noteHTML();
    return html;
  }
  if (tab === 'watched'){
    if (!p.watched.length) return html + emptyHTML(p, tab);
    const items = sortItems(p.watched.filter(it => passCommon(it) && passFilter(it,'watched')), 'watched');
    if (!items.length) return html + filterEmptyHTML();
    html += '<section class="section"><div class="shead"><span class="sicon tint-gray">'+ico('star')+'</span>'+
      '<span class="stitle">我关注的工作项与需求</span><span class="scount">'+items.length+' 条</span>'+
      '<span class="sdesc">关注只接收变更提醒，不代表你负责；可随时取消关注</span><span class="sact">'+
      (items.length > 4 ? '<button class="link" type="button" data-expand="watched">'+(S.expand === 'watched' ? '收起' : '查看全部 '+items.length)+' '+ico('arrow')+'</button>' : '')+
      '</span></div><div class="thead g-watch"><span>事项</span><span>状态</span><span>项目</span><span>最近变更</span><span>更新时间</span></div>';
    html += (S.expand === 'watched' ? items : items.slice(0,4)).map(watchedRow).join('');
    html += '</section>' + noteHTML();
    return html;
  }
  return teamHTML();
}

  const c = counts(p);
  if (tab === 'pending'){
    const items = allPendingItems(p);
    const today = items.filter(i => i.dueKind === 'today').length;
    const overdue = items.filter(i => i.dueKind === 'overdue').length;
    const bits = [c.pending + ' 项待处理'];
    if (overdue) bits.push(overdue + ' 项逾期');
    if (today) bits.push(today + ' 项今天到期');
    if (!c.pending) bits[0] = '今天没有待处理';
    return bits.join(' · ');
  }
  if (tab === 'created') return c.created + ' 个我发起的需求';
  return c.watched + ' 条关注';
}
function pageHTML(){
  const p = persona();
  const tab = currentTab(p);
  const c = counts(p);
  const tabs = tabDefs(p);
  const countText = t => {
    if (t.n === null) return '';
    if (S.state === 'error') return '<span class="n muted">—</span>';
    return '<span class="n">'+t.n+'</span>';
  };
  let html = '<div class="phead"><div><h1 class="h1">我的工作</h1><div class="sub">'+
    '<b>'+p.name+'</b><span class="rolepill">'+p.role+'</span><span class="subdot">·</span>'+
    '<span>'+subtitle(p, tab)+'</span></div></div>'+
    (S.state === 'empty' || S.state === 'error' ? '' :
    '<div class="phead-act"><button class="btn primary" type="button" data-proto-toast="原型：新建菜单（工作项 / 需求）">'+ico('plus','ico-sm')+'新建 '+ico('chev','ico-sm')+'</button></div>')+'</div>';
  html += '<nav class="tabs" role="tablist" aria-label="我的工作页签">';
  tabs.forEach(t => {
    html += '<button class="tab" type="button" role="tab" data-tab="'+t.key+'" aria-selected="'+(tab === t.key)+'">'+t.label+countText(t)+'</button>';
  });
  html += '</nav><div id="pbody">'+boardHTML(p, tab)+'</div>';
  return html;
}
function render(){
  const p = persona();
  const tab = currentTab(p);
  document.getElementById('page').innerHTML = pageHTML();
  document.getElementById('sidePav').textContent = p.avatar;
  document.getElementById('sideName').textContent = p.name;
  document.getElementById('topPav').textContent = p.avatar;
  bind();
}
function renderBody(){
  const p = persona();
  const tab = currentTab(p);
  const el = document.getElementById('pbody');
  if (!el) return;
  el.innerHTML = boardHTML(p, tab);
  bindBoard();
}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    S.tab = b.dataset.tab; S.filter = 'all'; S.expand = null; S.q = ''; S.pri = 'all'; S.blockedOnly = false; S.openFilter = false;
    render(); syncCtl();
  }));
  bindBoard();
}
function bindBoard(){
  document.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', () => {
    S.filter = b.dataset.chip; S.expand = null; renderBody();
  }));
  document.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', () => {
    S.expand = S.expand === b.dataset.expand ? null : b.dataset.expand; renderBody();
  }));
  const inp = document.getElementById('qSearch');
  if (inp){
    inp.value = S.q;
    inp.addEventListener('input', () => {
      S.q = inp.value; S.expand = null;
      const pos = inp.selectionStart;
      renderBody();
      const n = document.getElementById('qSearch');
      if (n){ n.focus(); n.setSelectionRange(pos,pos); }
    });
  }
  const pop = document.getElementById('filterPop');
  if (pop) pop.addEventListener('toggle', () => { S.openFilter = pop.open; });
  document.querySelectorAll('input[name=pri]').forEach(r => r.addEventListener('change', () => {
    S.pri = r.value; S.expand = null; renderBody();
  }));
  const blk = document.getElementById('blockedOnly');
  if (blk) blk.addEventListener('change', () => { S.blockedOnly = blk.checked; S.expand = null; renderBody(); });
  document.querySelectorAll('input[name=sort]').forEach(r => r.addEventListener('change', () => {
    S.sort = r.value; renderBody();
  }));
  const rf = document.getElementById('btnRefresh');
  if (rf) rf.addEventListener('click', () => {
    S.state = 'loading'; render();
    setTimeout(() => { S.state = 'default'; render(); toast('已刷新'); }, 650);
  });
  const retry = document.getElementById('btnRetry');
  if (retry) retry.addEventListener('click', () => {
    S.state = 'loading'; render();
    setTimeout(() => { S.state = 'default'; render(); toast('已恢复'); }, 650);
  });
  document.querySelectorAll('[data-team-range]').forEach(b => b.addEventListener('click', () => {
    S.teamRange = b.dataset.teamRange; renderBody();
  }));
  document.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
    S.filter = 'all'; S.q = ''; S.pri = 'all'; S.blockedOnly = false; S.expand = null; renderBody();
  }));
  document.querySelectorAll('[data-open]').forEach(row => {
    const go = () => toast('原型：打开「'+row.dataset.open+'」详情抽屉');
    row.addEventListener('click', go);
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
  });
  document.querySelectorAll('[data-proto-toast]').forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', e => { e.preventDefault(); toast(el.dataset.protoToast); });
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ============ 控制条 / 参数 ============ */
function initCtl(){
  const ctl = document.getElementById('protoctl');
  if (!S.chrome || isMobile()) ctl.classList.add('hide');
  const pp = document.getElementById('ctlPersona');
  Object.keys(PEOPLE).forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = PEOPLE[k].name + ' · ' + PEOPLE[k].role; pp.appendChild(o);
  });
  pp.value = S.persona;
  const tt = document.getElementById('ctlTab');
  const fillTabs = () => {
    const p = persona();
    tt.innerHTML = '';
    tabDefs(p).forEach(t => {
      const o = document.createElement('option'); o.value = t.key; o.textContent = t.label; tt.appendChild(o);
    });
    tt.value = currentTab(p);
  };
  fillTabs();
  document.getElementById('ctlState').value = S.state;
  pp.addEventListener('change', () => { S.persona = pp.value; S.filter = 'all'; S.tab = 'pending'; S.expand = null; fillTabs(); render(); });
  tt.addEventListener('change', () => { S.tab = tt.value; S.filter = 'all'; S.expand = null; render(); });
  document.getElementById('ctlState').addEventListener('change', e => { S.state = e.target.value; S.filter = 'all'; render(); });
  syncCtl = function(){ pp.value = S.persona; fillTabs(); document.getElementById('ctlState').value = S.state; };
}
let syncCtl = function(){};

document.addEventListener('click', e => {
  document.querySelectorAll('details.pop[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});
window.addEventListener('resize', () => { render(); });

if (!S.chrome || !isMobile()){
  document.getElementById('protoctl').classList.toggle('hide', !S.chrome || isMobile());
}
initCtl();
render();
</script>
</body>
</html>
